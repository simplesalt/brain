apiVersion: batch/v1
kind: Job
metadata:
  name: agentdb-cache-test-t1
  namespace: ssint-main-agentdb
  labels:
    entity: ssint
    env: main
    capability: agentdb
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: agentdb
    spec:
      serviceAccountName: agentdb-probe-admin
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: test
          image: python:3.12-alpine
          command: [python3, /test/cache_test.py]
          env:
            - name: AGENTDB_ENDPOINT
              value: http://trial-mcp.ssint-main-agentdb.svc/mcp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: test
              mountPath: /test
            - name: probe
              mountPath: /probe
      volumes:
        - name: test
          configMap:
            name: agentdb-cache-test
        - name: probe
          configMap:
            name: agentdb-probe
