      - {file: manifests/ai.yaml, where: "Deployment hermes-agent, container hermes-agent: same image ref; must equal the others"}
    current: {version: v2026.9.24, pin: 'sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7', date: 2026-09-24, live_since: "simplesalt/projects#766"}
    target: {version: v0.22.5, pin: 'sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d', date: 2026-10-23}
    notes:
      - "Pins are multi-arch index digests of the dated tag. Never the floating :latest (sha256:d4da4a40... differs from the v2026.9.24 tag and was re-pushed ~10h later)."
      - "Curated release notes exist only for v2026.7.1, v2026.7.20, v2026.8.3 and v2026.8.31; v2026.9.11 has its own state.db patch-release write-up; v2026.9.7, v2026.9.14, v2026.9.21 and v2026.9.24 defer to v0.22.0 notes, which had not shipped as of 2026-09-30 (v2026.9.24 = v0.21.5). Hold full prod trust in the uncurated stops until they ship."
      - "Probes are TCP 9119 only: API (8642), webhook (8644) and gateway health are unprobed, so every stop relies on the explicit validate checks."
      - "/opt/data is a 5Gi emptyDir: all state and any lazy installs rebuild on every pod recreation."
      - "The Claude Code hindsight plugin config was removed with Claude Code in 0d196b2 (simplesalt/projects#742)."
      - "Hermes skills come from the git allow-list manifests/hermes-skills.yaml and its bundled-skill sync is skipped (.no-bundled-skills)."
      - "initContainer patch-tool-bridge rewrites tool_call's arguments schema to a JSON string (NousResearch/hermes-agent#96610): our OpenRouter key allows only Groq for minimax-m2.7, which fills a property-less object only as {}. It also patches other files copied from the image (tool_search.py, conversation_loop.py, vision_message_prep.py); at every stop its log must show no 'WARNING ... left unchanged'. Drop the patch once upstream fixes #96610."
      - 'Upstream moved from date tags to semver: v2026.9.24 = v0.21.5, and v0.21.6 (2026-10-08) is the first semver release. Pins stay multi-arch index digests of the vX.Y.Z tag; never :stable, :latest, -desktop, rc.N or +canary tags.'
      - Images from v0.21.6 carry no org.opencontainers.image.revision label; skill-diff.py then takes the image's single vX.Y.Z Docker Hub tag and its NousResearch/hermes-agent commit (simplesalt/projects#904), and says so on stderr.
    before_first_stop:
      - "Bump the digest in every pinned_in place in the same commit at every stop."
    skip:
      - {from: v2026.8.31, to: v2026.8.31, reason: "First tag with the state.db connection rewrite that upstream calls fragile (fixed in v2026.9.11 and v2026.9.14); its curated notes can be read without deploying it."}
      - {from: v2026.9.7, to: v2026.9.7, reason: "Uncurated modularisation rollup that lands after the state.db rewrite and before its fixes in v2026.9.11 and v2026.9.14; v2026.9.14 isolates it."}
