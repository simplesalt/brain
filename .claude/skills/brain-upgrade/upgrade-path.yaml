schema: 1
researched: 2026-11-11
about: "Stepwise upgrade path for gbrain, hermes-agent and hindsight, carried by the brain-upgrade coding-agent skill in simplesalt/oci (builder-sb policy), moved from simplesalt/brain 6a46ac6 under simplesalt/projects#745; walked by a coding agent, by hand or on a schedule (simplesalt/projects#528), one stop per run; researched under simplesalt/projects#527; the gbrain section was revised under simplesalt/projects#523. next stops past the live pins were researched under simplesalt/projects#896 (2026-11-11). Data only."
rules:
  - "Per service, land on the first stop after the live pin, one stop per run, in listed order."
  - "Never skip a stop, never jump to target, never use a floating tag."
  - "Never land on a skip range in prod; a bisect entry is a fallback when the hop to its stop fails, not a stop."
  - "Before a stop, satisfy before_first_stop (once) and the stop's before; after it, run every validate check."
  - "Every place in pinned_in moves in the same commit."
  - "order holds the cross-service constraints."
  - "pin is authoritative (full git SHA or multi-arch index digest); version is a label."
  - "Adoption rule (gbrain, decided 2026-10-06 under simplesalt/projects#523): hop to a stop no earlier than 14 days after its release, only after screening finds no reported data-loss, migration, never-Ready, auth or MCP-tool bug affecting our profile (Postgres, unmanaged, HTTP bearer MCP) present and unfixed in it, and only after it passed our checks on a restored copy where the stop says so; trail upstream by about 4 weeks at most, and when no screened release is inside that, stay put and flag it."
  - "File paths in this plan (manifests/..., kustomization.yaml) are in simplesalt/brain unless an entry names repo simplesalt/oci."
  - "gbrain is baked into ghcr.io/simplesalt/oci/gbrain: a gbrain stop first moves GBRAIN_SHA in oci gbrain/pins.env (and BUN_IMAGE in oci gbrain/Containerfile when the stop needs another Bun) on oci main, waits for the 'Build gbrain image' workflow, then repins the four ai.yaml image digests and GBRAIN_SHA in install-cli-tools in one brain commit; the oci and brain commits are one stop."
  - "The live pin (pinned_in) is where a service stands; current is the pin when this plan was last revised."
  - "Report each step's outcome for the upgrade Effort (its planner records it), not in this file."
  - "Every gbrain and hermes-agent stop runs its skill_review before the bump commit; Hermes's skill allow-list (manifests/hermes-skills.yaml) changes only with the user's approval, in the same commit as the bump."
order:
  - "Move gbrain skills sync (hermes-agent install-cli-tools) to the same SHA as the gbrain server in the same commit as every gbrain stop; never move it with a hermes stop. The sync moves with the allow-list approved in that stop's skill_review (manifests/hermes-skills.yaml, same commit)."
  - "hindsight server must reach 0.10.2 before hermes-agent moves to v2026.9.24 (its hindsight plugin needs hindsight-client >= 0.10.1)."
  - "hermes-agent stops 1-3 keep the baked-in hindsight client 0.6.1; it works against today's 0.8.2, and each hindsight stop's validate (hindsight_recall and a Hermes reflect) is what proves it against 0.8.6-0.10.2."
  - "put_page callers (calendar-collector, duxsoup-ingest, email-collector) must send expected_revision or force before any gbrain stop past v0.48.2.0 (simplesalt/projects#658; done in simplesalt/brain c895be7, ff07a3a)."
  - Hermes plugins through v0.23.0 pin hindsight-client >=0.10.1,<1, so hindsight 1.0.0 and 1.1.0 run against a 0.x client (API changes in 0.10.3-1.1.0 are additive for the endpoints we use); each hindsight stop's Hermes hindsight_recall and reflect validate proves it. Hindsight and hermes-agent stops never move in the same commit.
services:
  gbrain:
    upstream: https://github.com/garrytan/gbrain
    pin_kind: git-sha
    pinned_in:
      - {repo: simplesalt/oci, file: gbrain/pins.env, where: "GBRAIN_SHA=<sha>; a push to oci main builds ghcr.io/simplesalt/oci/gbrain with 'bun install -g github:garrytan/gbrain#<sha>' on the BUN_IMAGE pinned in oci gbrain/Containerfile"}
      - {file: manifests/ai.yaml, where: "Deployment gbrain, initContainer seed-admin-assets: image ghcr.io/simplesalt/oci/gbrain:main@sha256:<digest> of the image built from that pins.env"}
      - {file: manifests/ai.yaml, where: "Deployment gbrain, container gbrain: image ghcr.io/simplesalt/oci/gbrain:main@sha256:<digest>, same digest"}
      - {file: manifests/ai.yaml, where: "Deployment gbrain, container autopilot: image ghcr.io/simplesalt/oci/gbrain:main@sha256:<digest>, same digest"}
      - {file: manifests/ai.yaml, where: "Deployment gbrain, container addon-worker: image ghcr.io/simplesalt/oci/gbrain:main@sha256:<digest>, same digest"}
      - {file: manifests/ai.yaml, where: "Deployment hermes-agent, initContainer install-cli-tools: skills sync, pinned (simplesalt/brain 0d196b2) by the literal GBRAIN_SHA=<sha>, which feeds the gbrain archive tarball URL and the .gbrain-version marker; must equal the Deployment gbrain SHA"}
    current: {version: v0.60.214.0, pin: "23fdb464a944cb95ec9e55ddaec68f7abdd8b3dc", date: 2026-10-13, live_since: "2026-10-27 (simplesalt/brain e706223, simplesalt/projects#778)"}
    target: {version: v0.60.483.0, pin: "5b94dca630d3af7a8eb2e42eacfafd9db52672f1", date: 2026-10-28}
    notes:
      - "Upstream tags are sparse (some versions untagged): always pin by full SHA."
      - "Hermes skills sync used to track gbrain master (v0.60.x) against the v0.46.29.0 server; it is now pinned to the server SHA (simplesalt/brain 0d196b2) and moves with each stop."
      - "Treat each vX.0.0.0 as a checkpoint: re-review the CLI surfaces we use (init, serve, embed, autopilot, config keys, GBRAIN_* env, access_tokens/content_chunks schema)."
      - "No breaks found in our used CLI surfaces, env vars or schema between the current pin and v0.51.6.0; put_page is the one caller-visible contract change (v0.51.0.0)."
      - "Upstream fixes forward: broken releases stay published, no stable branch; latest-stable follows every gated release (docs/RELEASING.md)."
      - "Releases from 2026-10-26 (garrytan/gbrain da31e3e4) require Bun >= 1.4.4 (TLS postgres.js leak, Brotli CVE); the gbrain image runs Bun 1.4.2 (BUN_IMAGE oven/bun:1.4.2-alpine in oci gbrain/Containerfile), so BUN_IMAGE moves first (simplesalt/projects#783) before any stop past that date."
      - "Every stop records vector and timeline baselines first (gbrain MCP get_stats: page_count, chunk_count, embedded_count, timeline_entry_count; get_health: embed_coverage, missing_embeddings) and a set of canned bearer search/query probes that target pages written before the walk (never pages the smoke test wrote)."
      - Upstream publishes a stable channel (tags stable-v<version>, and stable/latest-stable); pins still follow the adoption rule, and a stable promotion is evidence, not a substitute for screening.
    before_first_stop:
      - "DONE (simplesalt/brain 0d196b2): the hermes-agent skills sync is pinned to the gbrain server SHA (see pinned_in) so it moves with each stop."
      - "DONE (simplesalt/brain 1228967 then 2414304): the gbrain Deployment uses strategy Recreate so no older gbrain process overlaps a newer schema; switching a live Deployment needs Flux to own rollingUpdate first (restate it explicitly, then drop it), 'rollingUpdate: null' is rejected."
      - "DONE (simplesalt/brain 8e4c61c, now oci gbrain/Containerfile BUN_IMAGE): every gbrain container and initContainer runs on oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f (Bun >= 1.3.11 is enforced from v0.50.5.0; 1.4.2 is in upstream's musl native-lock CI matrix)."
      - "DONE (simplesalt/brain 8e4c61c): the gbrain container has a startupProbe on /health:3131 (10s x 90) because /health waits for migrations."
      - "DONE (simplesalt/brain 8e4c61c): GBRAIN_EMBEDDING_DIMENSIONS=1536 on the gbrain and autopilot containers (simplesalt/projects#743); runtime never reads the DB row, so keep it on every gbrain process."
      - "DONE (simplesalt/brain ac056f3): the DB config row embedding_dimensions is 1536 and facts/query_cache embeddings are halfvec(1536) (gbrain migrate embeddings, guarded so content_chunks vectors stayed byte-identical); migrations read only the DB row (v142 would otherwise rebuild takes.embedding at 1280, and v0.56.2.0+ fact embedding refuses a mismatch). manifests/gbrain-align-embedding-width.yaml can rerun it; manifests/gbrain-preflight.yaml prints a read-only state snapshot (add either to kustomization.yaml to run, then remove)."
      - "gbrain-pg has no backup automation: tracked in simplesalt/projects#549; until it lands take a manual pg_dump where a stop asks for one."
      - "DONE (simplesalt/brain 77c2b7c): Job gbrain-migrate-embedding-dims-2 is removed (simplesalt/projects#681); the autopilot embeds new pages."
    skip:
      - {from: v0.46.35.0, to: v0.47.4.0, reason: "Wedge schema upgrades on Postgres brains created before v0.46.35.0 (ours); fixed in v0.47.5.0 (#4657)."}
      - {from: v0.48.3.0, to: v0.60.4.0, reason: "Bearer (remote) search/query withhold every page chunked before v0.48.3.0 (chunker_version < 4, all of ours) until 'gbrain reindex --markdown' (#5004, #5050); 'gbrain repair safe-chunks' arrives in v0.60.5.0."}
      - {from: v0.51.0.0, to: v0.59.20.0, reason: "Timeline rows that exist only in the database (no bullet in the page body) are deleted when a page is re-imported or rewritten (#5567); on v0.51+ add_timeline_entry also writes the bullet, so rows written before v0.51 (all of ours, e.g. Dux Soup's) are the exposed ones; fixed in v0.60.5.0. Also in this range: #5497, embedding invalidation nulls vectors on projection-pending pages (v0.51.0.0-v0.59.9.x)."}
      - {from: v0.57.0.0, to: v0.59.2.0, reason: "Likely never Ready under bun install -g: /health hits 'Postgres cancellation requires the pinned driver patch'; fixed by vendoring in v0.59.3.0."}
      - {from: v0.60.12.0, to: v0.60.160.x, reason: "Data loss on our path: a remote put_page whose content omits the timeline block deletes every timeline row on the page while reporting committed (#5969, fixed v0.60.105.0); #6383 (fixed v0.60.150.0); #6398 facts-fence body overwrite (fixed v0.60.161.0). v0.60.5.0 and v0.60.11.0 carry #5969 too and are restored-copy-only bisect entries."}
      - from: v0.60.215.0
        to: v0.60.248.0
        reason: 'remember and facts onto an unbound Postgres source refuse owner_unavailable unless persistence.unbound_write=database_only (#6608, #6610); fixed v0.60.249.0 (changelog 0.60.249.0).'
      - from: v0.60.215.0
        to: v0.60.283.0
        reason: '#6755 v0.11.0 app-migration phase F wedges on a Postgres brain with no sync.repo_path; fixed v0.60.284.0 (changelog 0.60.284.0). Reached only by apply-migrations or gbrain upgrade, which we do not run.'
      - from: v0.60.389.0
        to: v0.60.465.0
        reason: 'A brain at schema 265 (what 389.0 and 390.0 leave) cannot reach 266: the schema replay indexes derived_generation_items.pending before v266 adds it (''column "pending" does not exist'', #7645, closed 2026-10-26); fixed v0.60.466.0. Not rehearsed from 242 straight to a release in this range; never park the brain at 389.0 or 390.0.'
    stops:
      - version: v0.60.214.0
        pin: "23fdb464a944cb95ec9e55ddaec68f7abdd8b3dc"
        date: 2026-10-13
        expected_schema: 242
        why: "Retarget decided by Dylan 2026-10-27 (simplesalt/projects#778 G1): v0.60.5.0 and v0.60.11.0 silently delete timeline rows on a put_page that omits the timeline block (#5969, fixed v0.60.105.0), so they are no longer prod stops. One hop from v0.48.2.0 applies migrations 146-242 in order and carries v0.48.3-v0.60.4 (migration 149 and the minion_queue_protocol trigger, Bun >= 1.3.11 enforcement and the security wave, v0.51.0.0 write-path rewrite, put_page expected_revision/force contract), the safe-chunk withholding fix (#5004, #5050), the timeline-deletion fixes (#5567, #5969) and the #6383/#6398 fixes; engines.bun >= 1.4.0; no MCP tool removed or renamed vs v0.60.11.0 (simplesalt/projects#778 F13, F14)."
        skill_review:
          script: "python3 /etc/claude-code/.claude/skills/brain-upgrade/scripts/skill-diff.py gbrain <live pin> 23fdb464a944cb95ec9e55ddaec68f7abdd8b3dc"
          inputs:
            - "Live pin (old, <live pin>): GBRAIN_SHA in oci gbrain/pins.env (org.simplesalt.gbrain.commit label of the ai.yaml gbrain image digest), equal to GBRAIN_SHA in install-cli-tools; this stop's pin (new): 23fdb464a944cb95ec9e55ddaec68f7abdd8b3dc."
            - "Allow-list: the gbrain section of manifests/hermes-skills.yaml."
            - "tools/list for the hermes-mcp bearer token (scopes read,write,admin) on the gbrain-rehearsal copy, restored from a fresh prod dump for this hop and pointed at this pin (ConfigMap gbrain-rehearsal-version GBRAIN_REHEARSAL_SHA and restart-epoch in manifests/gbrain-rehearsal.yaml, a brain commit by the brain workstream), and the same call on prod (gbrain.ssint-main-ai:3131); compare tool names, not counts."
          outputs:
            - "The skill-diff JSON and exit code (0: no skill added, removed or changed; 3: something changed; 1: could not tell, stop; 2: usage error)."
            - "If exit 3: a works / partly works / cannot work verdict with a one-line reason per added or changed skill and per allow-listed removed skill; the proposal of additions and removals put to the user; the user's decision; the approved list written to manifests/hermes-skills.yaml in the bump commit (unchanged if nothing is approved)."
        before:
          - "DONE (simplesalt/brain c895be7, ff07a3a; simplesalt/projects#658): writers fixed first. Dux Soup sends expected_revision from the same get_page (force would delete entries added between get_page and put_page), re-reads on revision_conflict, skips unchanged pages, neutralises bullet-shaped detail lines, skips invalid_params timeline entries, and dead-letters an event after MAX_EVENT_ATTEMPTS (12); email and calendar send force; every page and timeline write carries a deterministic UUID request_id, because on v0.60.x a refused write still spends a permanent write ID (250,000 per principal shared by all bearer clients). The current pin ignores unknown params, so the writers changed first."
          - "Take a fresh pg_dump of gbrain-pg."
          - "Rehearse on a copy restored from that fresh prod dump: init with our exact flags, migrations, projection drain, both repairs, canned probes."
          - "Database config.embedding_model equals openai:text-embedding-3-small (init refuses a populated brain otherwise, from v0.56.2.0); settle on the restored copy first."
          - "gbrain sources list --json shows local_path null on every non-archived source and gbrain config get sync.repo_path is unset; if either is set, stop: on Postgres a source root without a claimed writer refuses writes with owner_unavailable."
          - "Do not run apply-migrations, sources writer claim or sources writer activate: init applies the schema, and the brain stays unmanaged with database-only writes (activation needs persistent canonical checkout and lock dirs we do not have, and refuses cycle.conversation_facts_backfill)."
          - "No active minion jobs (migration 149 aborts on them)."
          - "Env is injected via the pod spec, not a .env file in the working directory (.env quarantine)."
          - "Bun >= 1.4.0 (satisfied by the 1.4.2 pin)."
          - "Save the timeline baseline (total row count and get_timeline counts per page) to compare after the hop."
          - "Rebuild ghcr.io/simplesalt/oci/gbrain from oci gbrain/pins.env at this SHA, then repin its digest in the four ai.yaml places and GBRAIN_SHA in install-cli-tools in one brain commit; Recreate or scale to 0."
        validate:
          - "gbrain --version reports v0.60.214.0 and the Bun version check passes at startup."
          - "Config version row equals schema 242."
          - "Config key readback: mcp.publish_advisor, search.reranker.model, facts.extraction_model, cycle.conversation_facts_backfill.enabled."
          - "Startup log shows 'hermes-mcp bearer asserted'; bearer token still accepted."
          - "GET /health returns 200 with the version."
          - "Bearer MCP smoke: search, get_page, put_page, add_timeline_entry, put_raw_data."
          - "Repairs: run 'gbrain repair safe-chunks' and 'gbrain repair timeline' as dry runs and record them; apply them (cost: cents of re-embedding; timeline conversion of Dux Soup and other DB-only rows was agreed by the operator on 2026-10-06) only as rehearsed on the restored copy; any other repair the doctor proposes stops the walk for operator review."
          - "gbrain doctor --json and the gbrain repair previews are recorded; repairs follow the Repairs rule above."
          - "SELECT count(*) FROM pages WHERE deleted_at IS NULL AND chunker_version < 4 is 0 (or doctor contextual_retrieval_coverage details.unsealed_pages 0)."
          - "Timeline row counts match the saved baseline."
          - "DB-only timeline rows are materialized as marked bullets (<!-- gbrain:materialized v1 ... -->) and get_timeline counts per page match the baseline."
          - "Bearer search and get_page still return existing pages (not withheld as projection_pending or safe_index_pending); if withheld, the Repairs rule above applies."
          - "Vectors survive: get_stats embedded_count == chunk_count and get_health missing_embeddings 0, embed_coverage 1 (counts are scoped per source, compare ratios; allow one autopilot cycle or 'gbrain embed --stale --yes' to recover a transient dip)."
          - "Canned bearer search and query probes on pre-walk pages return the same slugs as the baseline, with no safe_index_pending or projection_pending in degraded."
          - "hermes-agent init log shows 'gbrain skills synced to <sha>' and 'skills: kept <n> gbrain, <m> bundled; removed N; missing 0' (<n> and <m> are the counts listed in manifests/hermes-skills.yaml after this stop's skill_review) with no 'ERROR: allow-listed gbrain skill missing'; a rename or drop updates manifests/hermes-skills.yaml in the same commit."
          - "Hermes' gbrain MCP tools answer a read-only call after the gbrain restart; if not, restart hermes-agent (simplesalt/projects#738)."
          - "put_page on an existing slug without revision is refused (revision_required); with expected_revision or force it succeeds."
          - "gbrain sources writer status --probe --json: native_lock.target linux-x64-musl with acquired true, enabled false, no worktrees or bindings, every onboarding source database_only (none claim_required), publication_concurrency >= 1; writer status shows a single writer version 0.60.214.0."
          - "gbrain container startup log still contains 'Resolve IPC:'; if it is missing, confirm the native lock through the writer status probe above before proceeding."
          - "Smoke put_page and add_timeline_entry receipts show persistence.mode database, never owner_unavailable or write_pending; afterwards writer status blockers are empty and no '[persistence] phase=' lines appear in either container log."
          - "gbrain doctor shows unbound_source ok."
          - "One email-collector and one calendar-collector CronJob run completes, or where they are suspended, gbrain's gmail and gcal sources keep syncing (autopilot sync jobs succeed)."
          - "Autopilot cycle completes and embed --stale succeeds."
          - "The autopilot embed phase succeeds."
        rollback: "Restore database and binary together, never binary only (migration 149's minion_queue_protocol trigger makes older producers and workers fail): repin the previous gbrain image digest in ai.yaml with the previous GBRAIN_SHA (and revert oci gbrain/pins.env) and restore the pg_dump taken before this stop."
        bisect:
          - {version: v0.50.5.0, pin: "668b9bac302705f3bca0ae4792a49fab0a79a74e", date: 2026-09-16, use: "Restored copy only, never prod (inside the safe-chunk skip range): isolates migrations 146-149 and the Bun/security wave if the v0.60.214.0 hop fails on the copy."}
          - {version: v0.51.0.0, pin: "d13aa742fd68b71bfd6c98be3dda5813791f1d6c", date: 2026-09-17, use: "Restored copy only, never prod (inside the skip range): isolates the v0.51.0.0 write-path rewrite if this hop fails."}
          - {version: v0.60.5.0, pin: "6e1e826286079c0ebc0a6a3b07ccd11475b3cf33", date: 2026-09-29, expected_schema: 173, use: "Restored copy only, never prod (#5969 timeline data loss, fixed v0.60.105.0): isolates migrations 146-173 if this hop fails."}
          - {version: v0.60.11.0, pin: "f8d1e3936d908935ce96e18c14249aecd85fb5b2", date: 2026-09-30, expected_schema: 178, use: "Restored copy only, never prod (#5969): isolates migrations 174-178 including the one-time fact expiry if this hop fails."}
      - version: v0.60.467.0
        pin: 53b482504cfc37d5011f7e2259eb99357f650564
        date: 2026-10-26
        released: 2026-10-26T17:10:35Z (GitHub release); merge commit 2026-10-26T17:06:26Z
        expected_schema: 276
        bun: engines.bun >=1.4.0 (verified in package.json at the pin); runs on the gbrain image's current Bun 1.4.2 (BUN_IMAGE oven/bun:1.4.2-alpine in oci gbrain/Containerfile; bun --version in ghcr.io/simplesalt/oci/gbrain@sha256:260fcc99 prints 1.4.2); da31e3e4 is not an ancestor (compare da31e3e4...53b48250 diverged)
        why: 'Newest release before the Bun 1.4.4 floor (v0.60.468.0), so it needs no image change and is not blocked by simplesalt/projects#783. Carries the three known fixes: .249 (persistence.unbound_write for remember/facts), .284 (#6755), .323 (v221 batches; already applied on our schema-242 brain). Adds the 466 fix for #7645 (brain at schema 265 cannot upgrade), the 462 fix for facts lost when two notes mention one entity, the 467 security fix for --flag=value being silently ignored (#7619, p0: ''auth create --scopes=read'' minted a full token; ''serve --access=read-only'' ran read-write, fixed in 464), v275 RLS backfill on every table, v276 index, #7183 pooler read-only fix (412), the 346 fix for add_timeline_entry statement timeouts, the 347 fix for one over-limit fact blocking embed --stale, and the 379 Bun doctor warning. Schema 242 to 276 is 34 migrations (243-276). No MCP tool removed or renamed vs v0.60.214.0 (docs/TOOL_CATALOG.md: 149 tools at 214, 162 at 467; 13 added: abort_page_upload, append_page, begin_page_upload, commit_page_upload, get_brain_health, get_page_upload, list_write_conflicts, rank_entities, search_exact, sources_resolve_path, upload_page_part, wait_job, whois; no scope or gate change on an existing tool). Isolates the 242-to-276 schema and write-path move from the Bun move and from the v277-279 function rewrites of the next stop.'
        caveats:
          - 'On Bun 1.4.2 gbrain doctor bun_runtime warns (since 379.0) and lowers the health score; expected, not a failure. The Bun 1.4.0-1.4.2 TLS read leak (#7596, #7644) stays until Bun moves.'
          - 'Not carried (fixed later, none reachable without the feature): #7778 extract-conversation-facts drops terminal rows after a purge tombstone (fixed 478; needs a forget --purge tombstone), #7814 v0.13.1 app migration stamps validate:false on every page (fixed 479; reached only by apply-migrations or gbrain upgrade), outside-text fact/timeline injection through imported mail (changelog 476.0).'
        skill_review:
          script: python3 /etc/claude-code/.claude/skills/brain-upgrade/scripts/skill-diff.py gbrain <live pin> 53b482504cfc37d5011f7e2259eb99357f650564
          expected: 'Dry-run on 2026-11-11 against live 23fdb464: exit 3; 75 skills at both; added 0, removed 0, changed 15; allow-listed (20 names): changed brain-ops, briefing, meeting-ingestion, query; none removed or missing.'
          inputs:
            - 'Live pin (old, <live pin>): GBRAIN_SHA in oci gbrain/pins.env (org.simplesalt.gbrain.commit label of the ai.yaml gbrain image digest), equal to GBRAIN_SHA in install-cli-tools; this stop''s pin (new): 53b482504cfc37d5011f7e2259eb99357f650564.'
            - 'Allow-list: the gbrain section of manifests/hermes-skills.yaml.'
            - tools/list for the hermes-mcp bearer on the gbrain-rehearsal copy at this pin (restored from a fresh prod dump) and on prod; compare tool names, expect the 13 additions above and no removal.
        before:
          - 'Rehearsal infrastructure: simplesalt/projects#783 (Deferred, ssint-build-brain) plans to remove the gbrain-rehearsal Deployment, its Postgres cluster and the pre-upgrade dumps after 7 clean days on v0.60.214.0. Hold that removal until the last gbrain stop has been rehearsed, or recreate the copy; each hop needs a rehearsal copy restored from a fresh prod dump (restore date, not the old copy).'
          - 'Take a fresh pg_dump of gbrain-pg (no backup automation, simplesalt/projects#549) and restore it into the rehearsal copy; rehearse the hop there with our exact flags: init migrations, projection drain, canned probes, writer smoke, embed --stale, one autopilot cycle.'
          - 'Writer contract changes to clear on the rehearsal copy (duxsoup-ingest, email-collector, calendar-collector, Hermes): (a) 366.0: put_page or capture of a NEW slug with a hyphen run or a segment-final hyphen is refused invalid_params detail slug_hyphen_run; (b) 231.0: a remote put_page of a page over 256 KB needs expected_revision (force no longer stands in) and content under half the stored page is refused page_shrink_refused unless allow_shrink true; (c) 253.0: a write less trusted than a confirmed take or timeline row no longer deletes it, put_page lists such rows under contested; (d) get_page on a large page returns an outline and window (231.0).'
