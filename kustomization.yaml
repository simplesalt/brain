apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests/ai.yaml
  - manifests/gbrain-rehearsal.yaml
  - manifests/gbrain-pg-dump.yaml
  - manifests/crawl.yaml
  - manifests/hindsight-chart.yaml
  - manifests/hindsight-pg-dump.yaml
  - manifests/hermes-upgrade-check.yaml
  - manifests/hermes-crm-link-check.yaml
  - manifests/notion-deletion-review-probe.yaml
  - manifests/notion-deletion-review-dryrun.yaml
  - manifests/big-agi.yaml
  - manifests/stt-proxy.yaml
  - manifests/hermes-proxy.yaml
  - manifests/hermes-connectors.yaml
  - manifests/gbrain-embedding-secret.yaml
  - manifests/gbrain-reranker-secret.yaml
  - manifests/email-collector.yaml
  - manifests/calendar-collector.yaml
  - manifests/lease-sweep.yaml
  - manifests/hermes-msg.yaml
  - manifests/duxsoup-ingest.yaml
  - manifests/coding.yaml
  - manifests/coding-rc.yaml
  - manifests/coding-fe.yaml
  - manifests/cloudflare-zero-trust-main.yaml
  - manifests/gcp-sso.yaml
configMapGenerator:
  - name: hermes-config
    namespace: ssint-main-ai
    files:
      - config.yaml=manifests/hermes-config.yaml
      - skills.yaml=manifests/hermes-skills.yaml
      - skill-outbound-email.md=manifests/hermes-skills/outbound-email.md
      - skill-hubspot-lookup.md=manifests/hermes-skills/hubspot-lookup.md
      - skill-notion-workspace.md=manifests/hermes-skills/notion-workspace.md
      - skill-github-projects.md=manifests/hermes-skills/github-projects.md
      - skill-github-projects--gh_projects.py=manifests/hermes-skills/github-projects--gh_projects.py
      - skill-note-capture.md=manifests/hermes-skills/note-capture.md
      - skill-catch-up.md=manifests/hermes-skills/catch-up.md
      - cron-people-scan.py=manifests/hermes-skills/cron-people-scan.py
      - cron-people-scan.md=manifests/hermes-skills/cron-people-scan.md
      - cron-deletion-review.py=manifests/hermes-skills/cron-deletion-review.py
      - cron-deletion-review.md=manifests/hermes-skills/cron-deletion-review.md
      - cron-daily-brief.py=manifests/hermes-skills/cron-daily-brief.py
      - cron-daily-brief.md=manifests/hermes-skills/cron-daily-brief.md
      - cron-linkedin-lookup.py=manifests/hermes-skills/cron-linkedin-lookup.py
      - SOUL.md=manifests/SOUL.md
      - AGENTS.md=manifests/AGENTS.md
  - name: lease-sweep-script
    namespace: ssint-main-ai
    files:
      - lease-sweep.mjs=scripts/lease-sweep.mjs
  - name: discovery-worker-script
    namespace: ssint-main-crawl
    options:
      labels:
        entity: ssint
        env: main
        capability: crawl
    files:
      - discovery-worker.mjs=scripts/discovery-worker.mjs
generatorOptions:
  labels:
    entity: ssint
    env: main
    capability: ai
