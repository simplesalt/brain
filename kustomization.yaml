apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests/ai.yaml
  - manifests/gbrain-rehearsal.yaml
  - manifests/gbrain-pg-dump.yaml
  - manifests/crawl.yaml
  - manifests/hindsight-chart.yaml
  - manifests/hindsight-pg-dump.yaml
  - manifests/hermes-upgrade-check.yaml
  - manifests/hermes-note-fix.yaml
  - manifests/hermes-crm-link-check.yaml
  - manifests/hermes-chats.yaml
  - manifests/big-agi.yaml
  - manifests/stt-proxy.yaml
  - manifests/grammar.yaml
  - manifests/hermes-proxy.yaml
  - manifests/hermes-connectors.yaml
  - manifests/gbrain-embedding-secret.yaml
  - manifests/gbrain-reranker-secret.yaml
  - manifests/email-collector.yaml
  - manifests/calendar-collector.yaml
  - manifests/fireflies-ingest.yaml
  - manifests/lease-sweep.yaml
  - manifests/discovery-to-notion.yaml
  - manifests/notion-tasks-access-check.yaml
  - manifests/gbrain-addon-test.yaml
  - manifests/gbrain-reply-check-report.yaml
  - manifests/hermes-msg.yaml
  - manifests/duxsoup-ingest.yaml
  - manifests/coding.yaml
  - manifests/coding-rc.yaml
  - manifests/coding-fe.yaml
  - manifests/cloudflare-zero-trust-main.yaml
  - manifests/gcp-sso.yaml
  - manifests/efforts.yaml
  - manifests/agentdb.yaml
  - manifests/fireflies-ingest-rehearsal-test.yaml
  - manifests/gbrain-pg-backup.yaml
  - manifests/gbrain-mark-review.yaml
  - manifests/gbrain-networkpolicy.yaml
  - manifests/gbrain-t15-check.yaml
configMapGenerator:
  - name: hermes-config
    namespace: ssint-main-ai
    files:
      - config.yaml=manifests/hermes-config.yaml
      - skills.yaml=manifests/hermes-skills.yaml
      - skill-outbound-email.md=manifests/hermes-skills/outbound-email.md
      - skill-hubspot-lookup.md=manifests/hermes-skills/hubspot-lookup.md
      - skill-notion-workspace.md=manifests/hermes-skills/notion-workspace.md
      - skill-github-projects.md=manifests/hermes-skills/github-projects.md
      - skill-note-capture.md=manifests/hermes-skills/note-capture.md
      - skill-catch-up.md=manifests/hermes-skills/catch-up.md
      - skill-miss-report.md=manifests/hermes-skills/miss-report.md
      - skill-qr-code.md=manifests/hermes-skills/qr-code.md
      - skill-find-person.md=manifests/hermes-skills/find-person.md
      - skill-qr-code--qr_decode.py=manifests/hermes-skills/qr-code--qr_decode.py
      - qr-code-selftest-skewed.jpg=manifests/hermes-skills/qr-code-selftest-skewed.img
      - qr-code-selftest-small.jpg=manifests/hermes-skills/qr-code-selftest-small.img
      - cron-people-scan.py=manifests/hermes-skills/cron-people-scan.py
      - cron-people-scan.md=manifests/hermes-skills/cron-people-scan.md
      - cron-meeting-ingest.py=manifests/hermes-skills/cron-meeting-ingest.py
      - cron-meeting-ingest.md=manifests/hermes-skills/cron-meeting-ingest.md
      - cron-deletion-review.py=manifests/hermes-skills/cron-deletion-review.py
      - cron-deletion-review.md=manifests/hermes-skills/cron-deletion-review.md
      - cron-daily-brief.py=manifests/hermes-skills/cron-daily-brief.py
      - cron-daily-brief.md=manifests/hermes-skills/cron-daily-brief.md
      - cron-linkedin-lookup.py=manifests/hermes-skills/cron-linkedin-lookup.py
      - cron-person-dedupe.py=manifests/hermes-skills/cron-person-dedupe.py
      - cron-job-status-sync.py=manifests/hermes-skills/cron-job-status-sync.py
      - cron-job-status-sync.md=manifests/hermes-skills/cron-job-status-sync.md
      - cron-loop-tasks-sync.py=manifests/hermes-skills/cron-loop-tasks-sync.py
      - cron-loop-tasks-sync.md=manifests/hermes-skills/cron-loop-tasks-sync.md
      - cron-timeline-sweep.py=manifests/hermes-skills/cron-timeline-sweep.py
      - SOUL.md=manifests/SOUL.md
      - AGENTS.md=manifests/AGENTS.md
  - name: gbrain-addon-src
    namespace: ssint-main-ai
    files:
      - package.json=gbrain-addon/package.json
      - src--gbrain-internal.ts=gbrain-addon/src/gbrain-internal.ts
      - src--http.ts=gbrain-addon/src/http.ts
      - src--jobs.ts=gbrain-addon/src/jobs.ts
      - src--validate.ts=gbrain-addon/src/validate.ts
      - src--reply-check.ts=gbrain-addon/src/reply-check.ts
      - src--reply-review.ts=gbrain-addon/src/reply-review.ts
      - src--worker.ts=gbrain-addon/src/worker.ts
      - test--http.test.ts=gbrain-addon/test/http.test.ts
      - test--loops.test.ts=gbrain-addon/test/loops.test.ts
      - test--replycheck.test.ts=gbrain-addon/test/replycheck.test.ts
      - test--thread.test.ts=gbrain-addon/test/thread.test.ts
      - src--guard.ts=gbrain-addon/src/guard.ts
      - test--guard.test.ts=gbrain-addon/test/guard.test.ts
  - name: lease-sweep-script
    namespace: ssint-main-ai
    files:
      - lease-sweep.mjs=scripts/lease-sweep.mjs
  - name: discovery-to-notion-script
    namespace: ssint-main-ai
    files:
      - discovery-to-notion.mjs=scripts/discovery-to-notion.mjs
  - name: discovery-worker-script
    namespace: ssint-main-crawl
    options:
      labels:
        entity: ssint
        env: main
        capability: crawl
    files:
      - discovery-worker.mjs=scripts/discovery-worker.mjs
  - name: effort-mcp-script
    namespace: ssint-main-efforts
    options:
      labels:
        entity: ssint
        env: main
        capability: efforts
    files:
      - effort-mcp.mjs=scripts/effort-mcp.mjs
  # One model list (manifests/llm-models.env), one stable-named copy per consuming
  # namespace: a pod can only read a ConfigMap in its own namespace.
  - name: llm-models
    namespace: ssint-main-ai
    envs:
      - manifests/llm-models.env
    options:
      disableNameSuffixHash: true
  - name: llm-models
    namespace: ssint-main-crawl
    envs:
      - manifests/llm-models.env
    options:
      disableNameSuffixHash: true
      labels:
        entity: ssint
        env: main
        capability: crawl
  - name: llm-models
    namespace: ssint-main-voice
    envs:
      - manifests/llm-models.env
    options:
      disableNameSuffixHash: true
      labels:
        entity: ssint
        env: main
        capability: voice
  - name: effort-scripts
    namespace: ssint-main-efforts
    options:
      labels:
        entity: ssint
        env: main
        capability: efforts
    files:
      - create-effort.sh=efforts/scripts/create-effort.sh
      - find-effort.sh=efforts/scripts/find-effort.sh
      - get-effort.sh=efforts/scripts/get-effort.sh
      - select-effort.sh=efforts/scripts/select-effort.sh
      - release-effort.sh=efforts/scripts/release-effort.sh
      - update-effort.sh=efforts/scripts/update-effort.sh
      - project-depend.sh=efforts/scripts/project-depend.sh
      - lib-effort.sh=efforts/scripts/lib-effort.sh
      - lib-project.sh=efforts/scripts/lib-project.sh
      - effort_schema.py=efforts/scripts/effort_schema.py
      - sync-deferred-parent.sh=efforts/scripts/sync-deferred-parent.sh
      - find-stalled-efforts.sh=efforts/scripts/find-stalled-efforts.sh
      - explain-blocked-effort.sh=efforts/scripts/explain-blocked-effort.sh
  - name: gbrain-mark-review-script
    namespace: ssint-main-ai
    files:
      - gbrain-mark-review.mjs=manifests/gbrain-mark-review.mjs
    options:
      labels:
        entity: ssint
        env: main
        capability: ai
  - name: gbrain-guard-rehearsal-test
    namespace: ssint-main-ai
    files:
      - gbrain-guard-rehearsal-test.mjs=manifests/gbrain-guard-rehearsal-test.mjs
generatorOptions:
  labels:
    entity: ssint
    env: main
    capability: ai
