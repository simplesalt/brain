---
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-host-arg-probe-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: hermes-host-arg-probe
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          command: ["/opt/hermes/.venv/bin/python", "/probe/probe.py"]
          workingDir: /opt/hermes
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
            - name: PROBE_HOSTS
              value: inferact-vllm/nvfp4,minimax,streamlake/fp8,wafer/nvfp4,fireworks,inference-net/fp4,inference-net/fp4/us,digitalocean,nebius/fp4,sambanova,parasail/fp8,together,gmicloud/fp8
            - name: PROBE_TRIALS
              value: "3"
            - name: GBRAIN_URL
              value: http://gbrain:3141/mcp
            - name: GBRAIN_REMOTE_TOKEN
              value: gbrain-mcp
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: script
              mountPath: /probe
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: hermes-host-arg-probe-script
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
