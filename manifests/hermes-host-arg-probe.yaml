apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-host-arg-probe-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  probe.py: |
    import concurrent.futures, json, os, sys, threading, urllib.request
    sys.path.insert(0, '/opt/hermes')
    from tools.mcp_tool_schema import _normalize_mcp_input_schema, mcp_prefixed_tool_name
    from tools.schema_sanitizer import sanitize_tool_schemas

    KEY = os.environ['OPENROUTER_API_KEY']
    MODEL = os.environ.get('PROBE_MODEL', '@preset/live-reasoning')
    TRIALS = int(os.environ.get('PROBE_TRIALS', '3'))
    HOSTS = os.environ['PROBE_HOSTS'].split(',')
    lock = threading.Lock()

    def emit(obj):
        with lock:
            print(json.dumps(obj, ensure_ascii=False), flush=True)

    def mcp_tools(url, token):
        hdr = {'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream'}
        if token:
            hdr['Authorization'] = 'Bearer ' + token
        def rpc(body, sid=None):
            h = dict(hdr)
            if sid:
                h['Mcp-Session-Id'] = sid
            req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=h, method='POST')
            with urllib.request.urlopen(req, timeout=30) as r:
                sid = r.headers.get('Mcp-Session-Id') or sid
                raw = r.read().decode()
            for line in raw.splitlines():
                if line.startswith('data:'):
                    raw = line[5:].strip()
            return (json.loads(raw) if raw.strip() else None), sid
        _, sid = rpc({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {
            'protocolVersion': '2025-06-18', 'capabilities': {}, 'clientInfo': {'name': 'host-arg-probe', 'version': '1'}}})
        rpc({'jsonrpc': '2.0', 'method': 'notifications/initialized'}, sid)
        res, _ = rpc({'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'}, sid)
        return {t['name']: t for t in res['result']['tools']}

    gb = mcp_tools(os.environ['GBRAIN_URL'], os.environ['GBRAIN_REMOTE_TOKEN'])
    fixed = json.load(open('/probe/fixed-tools.json'))
    raw = [('gbrain', n, gb[n]['description'], gb[n]['inputSchema']) for n in ('query', 'add_link', 'chronicle_day')]
    raw += [('notion', n, fixed['notion'][n]['description'], fixed['notion'][n]['inputSchema'])
            for n in ('API-query-data-source', 'API-post-search')]
    raw += [('efforts', 'effort_find', fixed['efforts']['effort_find']['description'], fixed['efforts']['effort_find']['inputSchema'])]
    TOOLS = sanitize_tool_schemas([{'type': 'function', 'function': {
        'name': mcp_prefixed_tool_name(srv, n), 'description': d, 'parameters': _normalize_mcp_input_schema(s)}}
        for srv, n, d, s in raw])
    for t in TOOLS:
        p = dict(t['function']['parameters']); p.pop('$defs', None)
        emit({'kind': 'schema', 'tool': t['function']['name'], 'parameters': p})

    CASES = {
        'notion_query': ('mcp__notion__API_query_data_source',
            'Call mcp__notion__API_query_data_source once with data_source_id "212e6a5b-9779-813d-9db3-000be6a116cc", '
            'filter {"property": "Status", "status": {"does_not_equal": "Done"}}, filter_properties ["title", "Status"] and page_size 25.',
            {'data_source_id': '212e6a5b-9779-813d-9db3-000be6a116cc',
             'filter': {'property': 'Status', 'status': {'does_not_equal': 'Done'}}, 'filter_properties': ['title', 'Status'], 'page_size': 25}),
        'notion_search': ('mcp__notion__API_post_search',
            'Call mcp__notion__API_post_search once with query "Tasks", filter {"property": "object", "value": "data_source"} and page_size 10.',
            {'query': 'Tasks', 'filter': {'property': 'object', 'value': 'data_source'}, 'page_size': 10}),
        'gbrain_query': ('mcp__gbrain__query',
            'Call mcp__gbrain__query once with query "loop-tasks sync Notion Tasks board" and limit 5.',
            {'query': 'loop-tasks sync Notion Tasks board', 'limit': 5}),
        'effort_find': ('mcp__efforts__effort_find',
            'Call mcp__efforts__effort_find once with why "Dux Soup queue is stuck and nothing drains" and limit 5.',
            {'why': 'Dux Soup queue is stuck and nothing drains', 'limit': 5}),
        'add_link': ('mcp__gbrain__add_link',
            'Call mcp__gbrain__add_link once with from "companies/simple-salt", to "companies/dux-soup" and link_type "mentions".',
            {'from': 'companies/simple-salt', 'to': 'companies/dux-soup', 'link_type': 'mentions'}),
        'chronicle_week': ('mcp__gbrain__chronicle_day',
            'Call mcp__gbrain__chronicle_day once with date "2026-11-02", week true and limit 80.',
            {'date': '2026-11-02', 'week': True, 'limit': 80}),
    }
    SYSTEM = ('You are Hermes, an assistant with tools. Do exactly what the user asks: make the one tool call with exactly '
              'the arguments given, then stop. Do not add other arguments.')

    def norm(v):
        if isinstance(v, str):
            try:
                p = json.loads(v)
                if isinstance(p, (dict, list)):
                    return p
            except Exception:
                pass
        return v

    def judge(expected, args):
        lost, changed = [], []
        for k, want in expected.items():
            if k not in args or args[k] in ({}, [], '', None):
                lost.append(k)
            elif norm(args[k]) != want:
                changed.append(k)
        extra = [k for k in args if k not in expected]
        return lost, changed, extra

    def stream(body):
        req = urllib.request.Request('https://openrouter.ai/api/v1/chat/completions', method='POST',
                                     data=json.dumps(body).encode())
        req.add_header('Authorization', 'Bearer ' + KEY)
        req.add_header('Content-Type', 'application/json')
        out = {'provider': None, 'model': None, 'finish_reason': None, 'reasoning': '', 'content': '', 'calls': {}, 'id': None}
        try:
            with urllib.request.urlopen(req, timeout=300) as r:
                for line in r:
                    line = line.decode().strip()
                    if not line.startswith('data:') or line == 'data: [DONE]':
                        continue
                    c = json.loads(line[5:])
                    if c.get('error'):
                        out['error'] = str(c['error'])[:400]
                        continue
                    out['provider'] = c.get('provider') or out['provider']
                    out['model'] = c.get('model') or out['model']
                    out['id'] = c.get('id') or out['id']
                    for ch in c.get('choices') or []:
                        d = ch.get('delta') or {}
                        out['reasoning'] += d.get('reasoning') or ''
                        out['content'] += d.get('content') or ''
                        for tc in d.get('tool_calls') or []:
                            e = out['calls'].setdefault(tc.get('index', 0), {'name': '', 'arguments': ''})
                            fn = tc.get('function') or {}
                            if fn.get('name'):
                                e['name'] = fn['name']
                            e['arguments'] += fn.get('arguments') or ''
                        out['finish_reason'] = ch.get('finish_reason') or out['finish_reason']
        except urllib.error.HTTPError as e:
            out['error'] = f'HTTP {e.code}: {e.read().decode()[:400]}'
        except Exception as e:
            out['error'] = repr(e)[:400]
        return out

    def run(host, case, trial):
        tool, prompt, expected = CASES[case]
        body = {'model': MODEL, 'stream': True, 'tools': TOOLS,
                'messages': [{'role': 'system', 'content': SYSTEM}, {'role': 'user', 'content': prompt}],
                'provider': {'only': [host], 'allow_fallbacks': False}}
        r = stream(body)
        rec = {'kind': 'call', 'host': host, 'case': case, 'trial': trial, 'provider': r['provider'], 'model': r['model'],
               'gen_id': r['id'], 'finish_reason': r['finish_reason'], 'error': r.get('error')}
        calls = [r['calls'][i] for i in sorted(r['calls'])]
        rec['raw_tool_calls'] = calls
        rec['reasoning_tail'] = r['reasoning'][-400:]
        rec['content_head'] = r['content'][:200]
        target = next((c for c in calls if c['name'] == tool), None)
        if r.get('error') and not calls:
            rec['verdict'] = 'ERROR'
        elif target is None:
            rec['verdict'] = 'NO_CALL' if not calls else 'WRONG_TOOL'
        else:
            try:
                args = json.loads(target['arguments'] or '{}')
            except Exception:
                rec['verdict'] = 'BAD_JSON'
                emit(rec)
                return rec
            lost, changed, extra = judge(expected, args)
            rec.update({'lost': lost, 'changed': changed, 'extra': extra})
            rec['verdict'] = 'LOST' if lost else 'CHANGED' if changed else 'OK'
        emit(rec)
        return rec

    jobs = [(h, c, t) for h in HOSTS for c in CASES for t in range(TRIALS)]
    with concurrent.futures.ThreadPoolExecutor(max_workers=int(os.environ.get('PROBE_WORKERS', '8'))) as ex:
        results = list(ex.map(lambda a: run(*a), jobs))
    summary = {}
    for r in results:
        s = summary.setdefault(r['host'], {})
        s.setdefault(r['verdict'], 0)
        s[r['verdict']] += 1
        if r['verdict'] in ('LOST', 'CHANGED'):
            s.setdefault('bad_cases', []).append(f"{r['case']}:{','.join(r.get('lost', []) + r.get('changed', []))}")
    emit({'kind': 'summary', 'per_host': summary})
    print('== probe done', flush=True)
  fixed-tools.json: |-
