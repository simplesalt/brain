---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: simplesalt-charts
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  type: oci
  url: oci://ghcr.io/simplesalt/charts
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-basis
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.59.0"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  values:
    repo:
      slug: basis
      ref: main
    oauthSecret:
      create: true
      seedFrom: claude-oauth-basis
    resources:
      builder:
        requests:
          memory: 512Mi
    hindsight:
      bankId: ssint-build-basis
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
