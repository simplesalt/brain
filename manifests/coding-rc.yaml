---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: builder
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 12h
  url: oci://ghcr.io/simplesalt/charts/builder
  ref:
    tag: "0.4.1"
    digest: "sha256:ee782932dc65209b0b2f61ae2a6686e6690aa85eaf0ae681706171d888ffa63a"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-basis
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: builder
    namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    repo:
      slug: basis
      ref: main
    oauthSecret:
      create: false
      name: claude-oauth-basis
    skelOverride:
      enabled: true
      create: false
      existingConfigMap: claude-rc-skel-override
