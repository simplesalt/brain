---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: builder
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 12h
  url: oci://ghcr.io/simplesalt/charts/builder
  ref:
    tag: "0.4.2"
    digest: "sha256:815a1c4fefb3f87e28e34f38d5ce49bcc449fbb10e9e399de8da46e8daf34b58"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-basis
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: builder
    namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    repo:
      slug: basis
      ref: main
    oauthSecret:
      create: false
      name: claude-oauth-basis
    hindsight:
      bankId: coding
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: true
      create: false
      existingConfigMap: claude-rc-skel-override
---
