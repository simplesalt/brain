---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: builder
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 12h
  url: oci://ghcr.io/simplesalt/charts/builder
  ref:
    tag: "0.4.29"
    digest: "sha256:53f061ab731edc897894ab9b0ba9a7ca51907090a481d9afdfb032eb69b32fa4"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: simplesalt-charts
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  type: oci
  url: oci://ghcr.io/simplesalt/charts
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-basis
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.4.30"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    repo:
      slug: basis
      ref: main
    oauthSecret:
      create: false
      name: claude-oauth-basis
    hindsight:
      bankId: coding
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: true
      create: false
      existingConfigMap: claude-rc-skel-override
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
