---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-projects
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.55.0"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  values:
    repo:
      slug: projects
      ref: main
    oauthSecret:
      create: true
    resources:
      builder:
        requests:
          memory: 512Mi
    hindsight:
      bankId: ssint-build-projects
    skelOverride:
      enabled: true
      create: true
      content: |
        {
          "mcpServers": {
            "flux": {
              "type": "http",
              "url": "http://mcp-flux.flux-system:9090/mcp"
            },
            "cloudflare": {
              "type": "http",
              "url": "https://mcp.cloudflare.com/mcp",
              "headers": {
                "Authorization": "Bearer ${CLOUDFLARE_API_TOKEN}"
              }
            },
            "efforts": {
              "type": "http",
              "url": "http://efforts.ssint-main-efforts.svc:8080/mcp/coordinator"
            },
            "logs": {
              "type": "http",
              "url": "http://logs-mcp.cluster-main-observability:8080/mcp"
            },
            "dispatch": {
              "type": "http",
              "url": "http://dispatch.ssint-main-coding:8080/mcp"
            }
          }
        }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-cloud-basis
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.58.0"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  values:
    repo:
      slug: cloud-basis
      ref: main
    oauthSecret:
      create: true
    resources:
      builder:
        requests:
          memory: 512Mi
    hindsight:
      bankId: ssint-build-cloud-basis
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: false
    harness:
      images:
        - name: claude-code
          repository: ghcr.io/simplesalt/brain/harness/builder
          digest: sha256:80c48a4ec30ae4a456cb2b7affefa0420d007cdac08143547930f39e74f31a03
    agent:
      mission: >-
        Keep simplesalt's cloud platform (Cloudflare, Google Workspace and GCP) declared in the repo through Crossplane and reconciled by Flux, so every cloud resource the cluster and its apps depend on exists, is secured, and can be rebuilt from the repo.
      scope: >-
        You own Crossplane and its Cloudflare and GCP providers; Cloudflare resources (DNS, tunnels, Access apps and policies, Workers, Zero Trust); Google Workspace and GCP resources; the cluster MCP connector's routes into the cluster; Kyverno policies that generate Crossplane resources. Cluster workloads, operators and shared platform services belong to basis; app code and builder releases belong to brain; images and the builder chart belong to oci. Reply "I can't do that because…" to work outside this scope and name the owner.
      mcpServers:
        cloudflare:
          type: http
          url: https://mcp.cloudflare.com/mcp
          headers:
            Authorization: Bearer ${CLOUDFLARE_API_TOKEN}
