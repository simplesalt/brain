apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-canary
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-canary
  template:
    metadata:
      labels:
        app: hermes-canary
        entity: ssint
        env: main
        capability: ai
      annotations:
        simplesalt.company/restart-epoch: "9"
    spec:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Hermes tries its MCP servers only three times at startup and then gives up for the pod's life;
        # after a node restart it came up before gbrain and ran without gbrain tools. Wait up to five
        # minutes for gbrain to listen, then start anyway so chat still works if gbrain is down.
        - name: wait-for-gbrain
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - -e
            - |
              const net = require("net");
              const until = Date.now() + 300000;
              (function attempt() {
                const s = net.connect(3131, "gbrain", () => { console.log("gbrain is listening"); process.exit(0); });
                s.on("error", () => {
                  s.destroy();
                  if (Date.now() > until) { console.log("WARN: gbrain not listening after 5 minutes; starting without waiting"); process.exit(0); }
                  setTimeout(attempt, 2000);
                });
              })();
        - name: install-cli-tools
          image: docker.io/nousresearch/hermes-agent:latest@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              GBRAIN_SHA=5cfb84f1d3a809c70064c292c23db3d538d5c551
              STORED_VER=$(cat /opt/data/skills/.gbrain-version 2>/dev/null || echo "")
              if [ "$GBRAIN_SHA" != "$STORED_VER" ]; then
                if (
                  rm -rf /opt/data/skills.stage /opt/data/skills.old /tmp/gbrain.tar.gz \
                  && mkdir -p /opt/data/skills.stage \
                  && curl -fsSL -o /tmp/gbrain.tar.gz "https://github.com/garrytan/gbrain/archive/${GBRAIN_SHA}.tar.gz" \
                  && gzip -t /tmp/gbrain.tar.gz \
                  && tar -xzf /tmp/gbrain.tar.gz -C /opt/data/skills.stage "gbrain-${GBRAIN_SHA}/skills" \
                  && test -n "$(ls -A /opt/data/skills.stage/gbrain-${GBRAIN_SHA}/skills 2>/dev/null)" \
                  && echo "$GBRAIN_SHA" > /opt/data/skills.stage/gbrain-${GBRAIN_SHA}/skills/.gbrain-version \
                  && chown -R 10000:10000 /opt/data/skills.stage \
                  && { [ ! -d /opt/data/skills ] || mv /opt/data/skills /opt/data/skills.old; } \
                  && mv /opt/data/skills.stage/gbrain-${GBRAIN_SHA}/skills /opt/data/skills
                ); then
                  rm -rf /opt/data/skills.stage /opt/data/skills.old /tmp/gbrain.tar.gz
                  echo "gbrain skills synced to $GBRAIN_SHA"
                else
                  if [ ! -d /opt/data/skills ] && [ -d /opt/data/skills.old ]; then
                    mv /opt/data/skills.old /opt/data/skills
                  fi
                  rm -rf /opt/data/skills.stage /opt/data/skills.old /tmp/gbrain.tar.gz
                  echo "ERROR: gbrain skills sync failed; kept skills at ${STORED_VER:-unknown}"
                fi
              fi

              python3 -c '
              import os, re, shutil, yaml

              seed_path = "/seed/skills.yaml"
              bundled_root = "/opt/hermes/skills"
              skills_root = "/opt/data/skills"
              marker_path = "/opt/data/.no-bundled-skills"
              owner = 10000

              def skill_name(skill_dir):
                  fallback = os.path.basename(skill_dir)
                  try:
                      with open(os.path.join(skill_dir, "SKILL.md"), encoding="utf-8") as f:
                          text = f.read()
                      match = re.search(r"\n---\s*\n", text[3:]) if text.startswith("---") else None
                      if match:
                          name = yaml.safe_load(text[3:match.start() + 3]).get("name")
                          if name:
                              return str(name).strip()
                  except Exception:
                      pass
                  return fallback

              def skill_dirs(root):
                  found = [d for d, _, files in os.walk(root) if "SKILL.md" in files]
                  return sorted(found, key=lambda d: d.count(os.sep))

              def chown_tree(root):
                  os.lchown(root, owner, owner)
                  for dirpath, dirnames, filenames in os.walk(root):
                      for name in dirnames + filenames:
                          os.lchown(os.path.join(dirpath, name), owner, owner)

              try:
                  with open(seed_path) as f:
                      allow = yaml.safe_load(f)
                  gbrain = allow["gbrain"]
                  bundled = allow["bundled"]
                  local = allow.get("local") or []
                  for names in (gbrain, bundled, local):
                      if not isinstance(names, list) or not all(isinstance(n, str) for n in names):
                          raise ValueError("gbrain, bundled and local must be lists of skill names")
              except Exception as e:
                  print("ERROR: cannot read allow-list %s (%s); removing all skills" % (seed_path, e))
                  gbrain, bundled, local = [], [], []
              allowed = set(gbrain) | set(bundled) | set(local)

              os.makedirs(skills_root, exist_ok=True)
              for name in local:
                  src = os.path.join("/seed", "skill-%s.md" % name)
                  dest = os.path.join(skills_root, "simplesalt", name)
                  if os.path.isfile(src):
                      shutil.rmtree(dest, ignore_errors=True)
                      os.makedirs(dest)
                      shutil.copyfile(src, os.path.join(dest, "SKILL.md"))
                      prefix = "skill-%s--" % name
                      for extra in sorted(os.listdir("/seed")):
                          if extra.startswith(prefix):
                              os.makedirs(os.path.join(dest, "scripts"), exist_ok=True)
                              target = os.path.join(dest, "scripts", extra[len(prefix):])
                              shutil.copyfile(os.path.join("/seed", extra), target)
                              os.chmod(target, 0o755)
              for src in skill_dirs(bundled_root):
                  if src != bundled_root and skill_name(src) in bundled:
                      dest = os.path.join(skills_root, os.path.relpath(src, bundled_root))
                      shutil.rmtree(dest, ignore_errors=True)
                      shutil.copytree(src, dest)

              removed = 0
              for d in skill_dirs(skills_root):
                  if os.path.isdir(d) and skill_name(d) not in allowed:
                      if d == skills_root:
                          os.remove(os.path.join(d, "SKILL.md"))
                      else:
                          shutil.rmtree(d)
                      removed += 1

              open(marker_path, "w").close()

              kept = {"gbrain": set(), "bundled": set(), "local": set()}
              for d in skill_dirs(skills_root):
                  name = skill_name(d)
                  kept["gbrain" if name in gbrain else "local" if name in local else "bundled"].add(name)
              missing = 0
              for kind, names in (("gbrain", gbrain), ("bundled", bundled), ("local", local)):
                  for name in names:
                      if name in kept[kind]:
                          print("kept %s skill: %s" % (kind, name))
                      else:
                          missing += 1
                          print("ERROR: allow-listed %s skill missing: %s" % (kind, name))
              print("skills: kept %d gbrain, %d bundled, %d local; removed %d; missing %d" % (len(kept["gbrain"]), len(kept["bundled"]), len(kept["local"]), removed, missing))

              chown_tree(skills_root)
              os.lchown(marker_path, owner, owner)
              ' || { echo "ERROR: skills step failed; removing all skills"; rm -rf /opt/data/skills; touch /opt/data/.no-bundled-skills; }

              exit 0
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: config-seed
              mountPath: /seed
              readOnly: true
        - name: seed-hermes-config
          image: docker.io/nousresearch/hermes-agent:latest@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 -c '
              import os, sys, yaml

              live_path = "/opt/data/config.yaml"
              seed_path = "/seed/config.yaml"

              def deep_merge(base, overlay):
                  """Recursively merge overlay into base. overlay values win on conflict."""
                  merged = dict(base)
                  for key, val in overlay.items():
                      if key in merged and isinstance(merged[key], dict) and isinstance(val, dict):
                          merged[key] = deep_merge(merged[key], val)
                      else:
                          merged[key] = val
                  return merged

              with open(seed_path) as f:
                  seed = yaml.safe_load(f) or {}

              if os.path.exists(live_path):
                  with open(live_path) as f:
                      live = yaml.safe_load(f) or {}
              else:
                  live = {}

              merged = deep_merge(live, seed)
              # Git owns the MCP server list: a server dropped from the seed leaves the live config too.
              merged["mcp_servers"] = seed.get("mcp_servers", {})

              with open(live_path, "w") as f:
                  yaml.dump(merged, f, default_flow_style=False, indent=2, allow_unicode=True)
              print("merged: seed config overlaid onto live config.yaml")
              ' || { echo "FATAL: python merge failed, falling back to cp"; cp /seed/config.yaml /opt/data/config.yaml; }
              chown 10000:10000 /opt/data/config.yaml
              chmod 600 /opt/data/config.yaml

              mkdir -p /opt/data/hindsight
              printf '{"mode":"local_external","apiKey":"%s","api_url":"%s","banks":{"%s":{"bankId":"%s","budget":"mid","enabled":true}},"recall_budget":"low","recall_prefetch_method":"recall","recall_max_tokens":250,"recall_max_input_chars":300,"recall_types":"observation"}\n' \
                "$HINDSIGHT_API_KEY" "$HINDSIGHT_API_URL" "$HINDSIGHT_BANK_ID" "$HINDSIGHT_BANK_ID" \
                > /opt/data/hindsight/config.json
              chown -R 10000:10000 /opt/data/hindsight
              chmod 700 /opt/data/hindsight
              chmod 600 /opt/data/hindsight/config.json

              cp /seed/SOUL.md /opt/data/SOUL.md

              python3 -c '
              import json, sys

              agents_path = "/seed/AGENTS.md"
              roster_path = "/secrets/team-roster/roster.json"
              out_path = "/opt/data/AGENTS.md"
              marker = "<!-- TEAM_ROSTER -->"
              fallback = "(team roster unavailable — see team-roster Secret in ssint-main-ai)"

              with open(agents_path) as f:
                  content = f.read()

              lines = []
              try:
                  with open(roster_path) as f:
                      roster = json.load(f)
                  if not isinstance(roster, list):
                      raise ValueError("roster.json is not a JSON array")
                  for entry in roster:
                      if not isinstance(entry, dict):
                          continue
                      desc = entry.get("description")
                      if not desc:
                          continue
                      display_name = entry.get("display_name") or ""
                      role = entry.get("role") or ""
                      desc = desc if desc.rstrip().endswith(".") else desc.rstrip() + "."
                      lines.append("- %s — %s: %s" % (display_name, role, desc))
              except FileNotFoundError:
                  print("WARN: team-roster Secret not mounted/populated (roster.json missing); using placeholder", file=sys.stderr)
              except (json.JSONDecodeError, ValueError) as e:
                  print("WARN: team-roster roster.json invalid (%s); using placeholder" % e, file=sys.stderr)

              rendered = "\n".join(lines) if lines else fallback
              content = content.replace(marker, rendered)

              with open(out_path, "w") as f:
                  f.write(content)
              print("rendered: team roster substituted into AGENTS.md")
              ' || { echo "FATAL: AGENTS.md roster render failed, falling back to raw seed copy" >&2; cp /seed/AGENTS.md /opt/data/AGENTS.md; }
              chown 10000:10000 /opt/data/SOUL.md /opt/data/AGENTS.md
              chmod 644 /opt/data/SOUL.md /opt/data/AGENTS.md

              mkdir -p /run/secret-env
              printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > /run/secret-env/.env
              chown 10000:10000 /run/secret-env/.env
              chmod 600 /run/secret-env/.env
              ln -sf /run/secret-env/.env /opt/data/.env
              chown -h 10000:10000 /opt/data/.env
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: HINDSIGHT_API_URL
              value: http://hindsight:8888
            - name: HINDSIGHT_API_KEY
              value: local
            - name: HINDSIGHT_BANK_ID
              value: hermes
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: config-seed
              mountPath: /seed
              readOnly: true
            - name: secret-env
              mountPath: /run/secret-env
            - name: team-roster
              mountPath: /secrets/team-roster
              readOnly: true
      containers:
        - name: hermes-agent
          image: docker.io/nousresearch/hermes-agent:latest@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          env:
            - name: HERMES_ORIG_CWD
              value: /opt/data
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: HINDSIGHT_MODE
              value: local_external
            - name: HINDSIGHT_API_URL
              value: http://hindsight:8888
            - name: HINDSIGHT_API_KEY
              value: local
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: FIRECRAWL_API_KEY
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_INSECURE
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: hermes
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              value: "NotARealSecret-1"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_BEARER_TOKEN
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: GBRAIN_REMOTE_TOKEN
              value: "gbrain-mcp"
          ports:
            - name: webui
              containerPort: 9119
            - name: api
              containerPort: 8642
            - name: webhook
              containerPort: 8644
          livenessProbe:
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
            tcpSocket:
              port: 9119
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
            tcpSocket:
              port: 9119
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: secret-env
              mountPath: /run/secret-env
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 5Gi
        - name: config-seed
          configMap:
            name: hermes-config
        - name: secret-env
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: team-roster
          secret:
            secretName: team-roster
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-canary-web
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: hermes-canary
  ports:
    - name: api
      port: 8642
      targetPort: 8642
