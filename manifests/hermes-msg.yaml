apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-msg-health
  namespace: ssint-main-msg
  labels:
    entity: ssint
    env: main
    capability: msg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-msg-health
  template:
    metadata:
      labels:
        app: hermes-msg-health
        entity: ssint
        env: main
        capability: msg
    spec:
      automountServiceAccountToken: false
      containers:
        - name: email
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "-T", "20", "http://hermes-msg:8080/healthz/email"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 25
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
        - name: linkedin
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "-T", "20", "http://hermes-msg:8080/healthz/linkedin"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 25
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
        - name: sms
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "-T", "20", "http://hermes-msg:8080/healthz/sms"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 25
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
