apiVersion: v1
kind: Namespace
metadata:
  name: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
---
apiVersion: v1
kind: Secret
metadata:
  name: crawl-api-keys
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crawl-pg
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: crawl
      owner: crawl
  storage:
    size: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl-dbcheck
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawl-dbcheck
  template:
    metadata:
      labels:
        app: crawl-dbcheck
        entity: ssint
        env: main
        capability: crawl
    spec:
      containers:
        - name: dbcheck
          image: ghcr.io/cloudnative-pg/postgresql:17
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              while true; do
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS healthcheck (id int primary key, checked_at timestamptz);
              INSERT INTO healthcheck (id, checked_at) VALUES (1, now())
                ON CONFLICT (id) DO UPDATE SET checked_at = EXCLUDED.checked_at;
              SELECT * FROM healthcheck WHERE id = 1;
              SQL
                sleep 300
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crawl-pg-app
                  key: uri
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
