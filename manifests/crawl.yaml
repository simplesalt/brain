apiVersion: v1
kind: Namespace
metadata:
  name: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
---
apiVersion: v1
kind: Secret
metadata:
  name: serper-api-key
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: exa-api-key
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: serpapi-api-key
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-api-key
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crawl-pg
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
  bootstrap:
    initdb:
      database: crawl
      owner: crawl
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: crawl-pg-lan
              labels:
                entity: ssint
                env: main
                capability: crawl
            spec:
              type: LoadBalancer
    roles:
      - name: crawl_read
        ensure: present
        login: true
        passwordSecret:
          name: crawl-read-login
  storage:
    size: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: crawl-read-login
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: crawl_read
  password: dummy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl-dbcheck
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawl-dbcheck
  template:
    metadata:
      labels:
        app: crawl-dbcheck
        entity: ssint
        env: main
        capability: crawl
    spec:
      containers:
        - name: dbcheck
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              while true; do
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS healthcheck (id int primary key, checked_at timestamptz);
              INSERT INTO healthcheck (id, checked_at) VALUES (1, now())
                ON CONFLICT (id) DO UPDATE SET checked_at = EXCLUDED.checked_at;
              SELECT * FROM healthcheck WHERE id = 1;
              SQL
                sleep 300
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crawl-pg-app
                  key: uri
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: discovery-worker
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  # Runs one full crawl cycle every other day (07:23 UTC) and exits.
  schedule: "23 7 */2 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app: discovery-worker
            entity: ssint
            env: main
            capability: crawl
        spec:
          restartPolicy: Never
          containers:
            - name: discovery-worker
              image: oven/bun:1-alpine
              imagePullPolicy: IfNotPresent
              command: ["bun", "/scripts/discovery-worker.mjs"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: crawl-pg-app
                      key: uri
                - name: SERPER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: serper-api-key
                      key: api_key
                - name: EXA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: exa-api-key
                      key: api_key
              resources:
                requests:
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: discovery-worker-script
                  mountPath: /scripts
                  readOnly: true
                - name: serpapi-api-key
                  mountPath: /secrets/serpapi
                  readOnly: true
                - name: openrouter-api-key
                  mountPath: /secrets/openrouter
                  readOnly: true
          volumes:
            - name: discovery-worker-script
              configMap:
                name: discovery-worker-script
            - name: serpapi-api-key
              secret:
                secretName: serpapi-api-key
                optional: true
            - name: openrouter-api-key
              secret:
                secretName: openrouter-api-key
                optional: true
---
# One-time: reruns a cycle now so postings the first cycle left untried get their details; remove once
# it has completed. No ttlSecondsAfterFinished, or Flux would re-create it (and re-run the cycle) after the TTL.
apiVersion: batch/v1
kind: Job
metadata:
  name: discovery-worker-catch-up
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: discovery-worker
        entity: ssint
        env: main
        capability: crawl
    spec:
      restartPolicy: Never
      containers:
        - name: discovery-worker
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["bun", "/scripts/discovery-worker.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crawl-pg-app
                  key: uri
            - name: SERPER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serper-api-key
                  key: api_key
            - name: EXA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: exa-api-key
                  key: api_key
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: discovery-worker-script
              mountPath: /scripts
              readOnly: true
            - name: serpapi-api-key
              mountPath: /secrets/serpapi
              readOnly: true
            - name: openrouter-api-key
              mountPath: /secrets/openrouter
              readOnly: true
      volumes:
        - name: discovery-worker-script
          configMap:
            name: discovery-worker-script
        - name: serpapi-api-key
          secret:
            secretName: serpapi-api-key
            optional: true
        - name: openrouter-api-key
          secret:
            secretName: openrouter-api-key
            optional: true
