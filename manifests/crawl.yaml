apiVersion: v1
kind: Namespace
metadata:
  name: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
---
apiVersion: v1
kind: Secret
metadata:
  name: serper-api-key
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: exa-api-key
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crawl-pg
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: crawl
      owner: crawl
  managed:
    roles:
      - name: crawl_read
        ensure: present
        login: true
        passwordSecret:
          name: crawl-read-login
  storage:
    size: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: crawl-read-login
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: crawl_read
  password: dummy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl-dbcheck
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawl-dbcheck
  template:
    metadata:
      labels:
        app: crawl-dbcheck
        entity: ssint
        env: main
        capability: crawl
    spec:
      containers:
        - name: dbcheck
          image: ghcr.io/cloudnative-pg/postgresql:17
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              while true; do
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS healthcheck (id int primary key, checked_at timestamptz);
              INSERT INTO healthcheck (id, checked_at) VALUES (1, now())
                ON CONFLICT (id) DO UPDATE SET checked_at = EXCLUDED.checked_at;
              SELECT * FROM healthcheck WHERE id = 1;
              SQL
                sleep 300
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crawl-pg-app
                  key: uri
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-worker
  namespace: ssint-main-crawl
  labels:
    entity: ssint
    env: main
    capability: crawl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discovery-worker
  template:
    metadata:
      labels:
        app: discovery-worker
        entity: ssint
        env: main
        capability: crawl
    spec:
      containers:
        - name: discovery-worker
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["bun", "/scripts/discovery-worker.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crawl-pg-app
                  key: uri
            - name: SERPER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serper-api-key
                  key: api_key
            - name: EXA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: exa-api-key
                  key: api_key
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: discovery-worker-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: discovery-worker-script
          configMap:
            name: discovery-worker-script
