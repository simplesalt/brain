apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-deletion-review-prune-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: GBRAIN_URL
              value: http://gbrain:3131/mcp
            - name: GBRAIN_REMOTE_TOKEN
              value: gbrain-mcp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HERMES_HOME
              value: /tmp/hermes
            - name: NOTION_DELETION_REVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: NOTION_DELETION_REVIEW_TOKEN
          command: ["python3", "-u", "-c"]
          args:
            - |
              import contextlib, datetime, importlib, io, json, sys
              sys.path.insert(0, "/seed")
              dr = importlib.import_module("cron-deletion-review")
              now = datetime.datetime.now(datetime.timezone.utc)
              def size():
                  p = dr.call("get_page", {"slug": dr.STATE})
                  return f"revision {p['revision'][:8]}, {len(p['compiled_truth'].encode())} bytes"
              print("deletion-review: before", size())
              st = dr.load_state()
              print(f"  loaded: seen {len(st['seen'])}, applied {len(st['applied'])}, pending {len(st['pending'])}, log {len(st['log'])}")
              trashed = [o for o in dr.search({"filter": {"in_trash": True}}) if o.get("in_trash")]
              in_trash = {o["id"] for o in trashed}
              print(f"  Notion trash now holds {len(in_trash)} items; {len(in_trash & set(st['seen']))} of them are in seen")
              err = io.StringIO()
              with contextlib.redirect_stderr(err):
                  dr.prune(st, now, in_trash)
              lines = err.getvalue().splitlines()
              for line in lines[:10]:
                  print("  log:", line)
              if len(lines) > 10:
                  print(f"  log: ... {len(lines) - 10} more lines like these")
              print(f"  pruned: seen {len(st['seen'])}, applied {len(st['applied'])}, pending {len(st['pending'])}, log {len(st['log'])}")
              try:
                  dr.save_state(st)
              except dr.StateError as e:
                  print(f"deletion-review: FAILED {e}")
                  sys.exit(1)
              print("deletion-review: after ", size())
              print("RESULT: PASS")
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: hermes-config
