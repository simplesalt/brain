apiVersion: apps/v1
kind: Deployment
metadata:
  name: fireflies-ingest-health
  namespace: ssint-main-msg
  labels:
    entity: ssint
    env: main
    capability: msg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fireflies-ingest-health
  template:
    metadata:
      labels:
        app: fireflies-ingest-health
        entity: ssint
        env: main
        capability: msg
    spec:
      serviceAccountName: fireflies-ingest-health
      containers:
        - name: health
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          readinessProbe:
            exec:
              command: ["bun", "/scripts/fireflies-ingest.mjs", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 15
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: fireflies-ingest-script
