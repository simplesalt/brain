---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fireflies-ingest-heartbeat-reader
  namespace: ssint-main-msg
  labels:
    entity: ssint
    env: main
    capability: msg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fireflies-ingest-heartbeat-reader
subjects:
