apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-t15-unmark
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-t15-unmark
        gbrain-access: guard-only
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scripts
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              cd /scripts
              for s in cron-timeline-sweep.py cron-job-status-sync.py; do
                echo "=== $s (dry run, GBRAIN_URL=$GBRAIN_URL)"
                python3 -B "$s" > /tmp/out.txt 2> /tmp/err.txt
                rc=$?
                echo "exit=$rc stdout_lines=$(wc -l < /tmp/out.txt) stderr_lines=$(wc -l < /tmp/err.txt)"
                head -c 1500 /tmp/out.txt | cut -c1-200
                echo "--- stderr"
                head -c 2000 /tmp/err.txt
              done
              echo "RESULT: done"
          env:
            - name: GBRAIN_URL
              value: http://gbrain:3141/mcp
            - name: TIMELINE_SWEEP_DRY_RUN
              value: "1"
            - name: JOB_STATUS_DRY_RUN
              value: "1"
            - name: HERMES_HOME
              value: /tmp/hermes
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: writes
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000'
              case "$DATABASE_URL" in *@gbrain-pg-rw[.:/]*) ;; *) echo "FATAL"; exit 1 ;; esac
              psql -X -c "SELECT id, kind, slug, created_at::timestamp(0), withdrawn_at::timestamp(0), applied_at::timestamp(0), outcome FROM addon_page_marks ORDER BY id" "$DATABASE_URL"
              psql -X -c "SELECT slug, updated_at::timestamp(0) FROM pages WHERE slug IN ('ops/people-scan', 'ops/job-status-sync', 'ops/meeting-ingest') ORDER BY slug" "$DATABASE_URL"
              echo "RESULT: done"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: hermes-config
      initContainers:
        - name: unmark
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - -e
          args:
            - |
              await Bun.sleep(20000);
              for (const slug of ["notes/zz-guard-check-926-1794675197506", "notes/zz-guard-check-926-1794675256444"]) {
                const r = await fetch("http://gbrain:3141/mcp", { method: "POST", signal: AbortSignal.timeout(20000),
                  headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", Authorization: "Bearer gbrain-mcp" },
                  body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: "withdraw_page_mark", arguments: { slug } } }) });
                console.log(`withdraw_page_mark ${slug} -> ${(await r.text()).slice(0, 300)}`);
              }
              const r = await fetch("http://gbrain:3141/mcp", { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", Authorization: "Bearer gbrain-mcp" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: "list_pages", arguments: { limit: 1 } } }) });
              console.log(`list_pages through the guard -> content-type ${r.headers.get("content-type")}`);
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
