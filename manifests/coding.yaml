apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-rc-skel-override
  namespace: ssint-main-coding
  labels:
    entity: ssint
    env: main
    capability: coding
data:
  claude.json.tmpl: |
    {
      "mcpServers": {
        "flux": {
          "type": "http",
          "url": "http://mcp-flux.flux-system:9090/mcp"
        },
        "cloudflare": {
          "type": "http",
          "url": "https://mcp.cloudflare.com/mcp",
          "headers": {
            "Authorization": "Bearer ${CLOUDFLARE_API_TOKEN}"
          }
        }
      }
    }
