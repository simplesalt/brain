---
# One-off check of the dictation grammar pass: runs stt-proxy's own tidy() on a
# real choppy dictation through AssemblyAI's LLM Gateway and logs the result.
apiVersion: batch/v1
kind: Job
metadata:
  name: stt-tidy-check-2
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: voice
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import importlib.util, time
              spec = importlib.util.spec_from_file_location('stt', '/scripts/stt.py')
              m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
              raw = ("It's a while later and it. Should have. Processed your request can you go check. Again to see if. "
                     "Duck Soup has done anything or whether your core people records that were missing. Like pawn and freed and. "
                     "Judy Johnstone. Now have Fuller. People records with LinkedIn. Profiles complete.")
              ctx = ("Dylan: Did the LinkedIn invites go out? Hermes: Dux-Soup ran and visited 14 profiles; "
                     "Judy Johnstone's gbrain people record still has no LinkedIn link.")
              import json, urllib.request, urllib.error
              def call(model, temp, system):
                  msgs = [{'role': 'user', 'content': (m.TIDY_SYSTEM + '\n\n' if not system else '') + f'Context:\n{ctx}\n\nTranscript:\n{raw}'}]
                  if system:
                      msgs.insert(0, {'role': 'system', 'content': m.TIDY_SYSTEM})
                  body = {'model': model, 'max_tokens': 4000, 'messages': msgs}
                  if temp:
                      body['temperature'] = 0
                  r = urllib.request.Request(m.TIDY_URL, data=json.dumps(body).encode(), method='POST',
                                             headers={'Authorization': m.assemblyai_key(), 'Content-Type': 'application/json'})
                  t0 = time.time()
                  try:
                      with urllib.request.urlopen(r, timeout=30) as resp:
                          out = json.load(resp)['choices'][0]['message']['content']
                      print(f'{model} temp={temp} system={system}: {time.time()-t0:.2f}s -> {out}', flush=True)
                  except urllib.error.HTTPError as e:
                      print(f'{model} temp={temp} system={system}: HTTP {e.code} {e.read()[:400]}', flush=True)
              print('raw:  ', raw, flush=True)
              for model in ('gemini-2.5-flash-lite', 'claude-haiku-5-5'):
                  for temp, system in ((True, True), (False, True), (False, False)):
                      call(model, temp, system)
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: aai-key
              mountPath: /secrets-aai
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: stt-proxy-script
        - name: aai-key
          secret:
            secretName: assemblyai-api-key
