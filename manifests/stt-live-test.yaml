---
# One-off check of live dictation: stt-proxy is ready and refuses callers who
# are not signed in, an AssemblyAI pass mints with the filled key, and spoken
# audio streamed over AssemblyAI's live socket comes back as words, once with
# conversation context and once without. Logs transcripts, never the key or pass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stt-live-test-script
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
data:
  test.py: |
    import asyncio, audioop, json, os, subprocess, time, urllib.error, urllib.parse, urllib.request, wave
    import websockets

    PROXY = 'http://stt-proxy:8000'
    KEY = open('/secrets-aai/ASSEMBLYAI_API_KEY').read().strip()
    SAY = 'Ask gbrain and Hindsight what Dylan said about Hermes and the Dux Soup sync.'
    CONTEXT = ('Dictating a chat message to an AI assistant. Recent conversation: Dylan asked Hermes to '
               'check gbrain and Hindsight for the Dux Soup sync status.')

    def get(url, headers=None):
        try:
            with urllib.request.urlopen(urllib.request.Request(url, headers=headers or {}), timeout=15) as r:
                return r.status, r.read()
        except urllib.error.HTTPError as e:
            return e.code, e.read()

    def check(name, ok, detail=''):
        print(f'{"PASS" if ok else "FAIL"} {name} {detail}', flush=True)
        return ok

    def speech_pcm16k():
        subprocess.run(['espeak-ng', '-v', 'en-us', '-s', '150', '-w', '/tmp/say.wav', SAY], check=True)
        with wave.open('/tmp/say.wav') as w:
            pcm, rate, width, ch = w.readframes(w.getnframes()), w.getframerate(), w.getsampwidth(), w.getnchannels()
        if ch == 2:
            pcm = audioop.tomono(pcm, width, .5, .5)
        if width != 2:
            pcm = audioop.lin2lin(pcm, width, 2)
        pcm, _ = audioop.ratecv(pcm, 2, 1, rate, 16000, None)
        return pcm + b'\0' * 32000 * 2

    def mint():
        status, body = get('https://streaming.assemblyai.com/v3/token?expires_in_seconds=600&max_session_duration_seconds=3600',
                           {'Authorization': KEY})
        return status, (json.loads(body).get('token') if status == 200 else body[:300])

    async def stream(token, pcm, prompt):
        q = {'token': token, 'speech_model': 'universal-3-5-pro', 'encoding': 'pcm_s16le', 'sample_rate': '16000'}
        if prompt:
            q['prompt'] = prompt
        url = 'wss://streaming.assemblyai.com/v3/ws?' + urllib.parse.urlencode(q)
        finals, partials, first = [], 0, None
        async with websockets.connect(url, max_size=None) as ws:
            t0 = time.time()
            async def send():
                for i in range(0, len(pcm), 3200):
                    await ws.send(pcm[i:i + 3200])
                    await asyncio.sleep(0.1)
                await ws.send(json.dumps({'type': 'Terminate'}))
            sender = asyncio.create_task(send())
            async for raw in ws:
                m = json.loads(raw)
                if m.get('type') == 'Begin':
                    print('  Begin:', json.dumps({k: v for k, v in m.items() if k not in ('id',)}), flush=True)
                elif m.get('type') not in ('Turn', 'Termination'):
                    print('  other:', json.dumps(m)[:400], flush=True)
                elif m.get('type') == 'Turn':
                    if first is None and m.get('transcript'):
                        first = time.time() - t0
                    if m.get('end_of_turn'):
                        finals.append(m['transcript'])
                    else:
                        partials += 1
                elif m.get('type') == 'Termination':
                    break
            await sender
        return ' '.join(finals), partials, first

    ok = True
    s, b = get(PROXY + '/healthz')
    ok &= check('stt-proxy ready', s == 200, b.decode())
    s, b = get(PROXY + '/token')
    ok &= check('pass refused without sign-in', s == 401, b.decode())
    s, tok = mint()
    ok &= check('pass minted with the filled key', s == 200 and isinstance(tok, str), '' if s == 200 else f'{s} {tok}')
    if s == 200:
        pcm = speech_pcm16k()
        print('said:', SAY, flush=True)
        for label, prompt in (('with context', CONTEXT), ('no context', None)):
            if label == 'no context':
                _, tok = mint()
            text, partials, first = asyncio.run(stream(tok, pcm, prompt))
            ok &= check(f'live words {label}', bool(text) and partials > 0,
                        f'partials={partials} first_words_after={first and round(first, 2)}s')
            print(f'  heard ({label}):', text, flush=True)
            print(f'  "auth" kept ({label}):', 'auth' in text.lower(), flush=True)
    print('RESULT', 'PASS' if ok else 'FAIL', flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stt-live-test-2
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: stt-live-test
        entity: ssint
        env: main
        capability: voice
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: python:3.12-alpine
          command: ["sh", "-c", "apk add --no-cache -q espeak-ng && pip install -q websockets && python /scripts/test.py"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: aai-key
              mountPath: /secrets-aai
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: stt-live-test-script
        - name: aai-key
          secret:
            secretName: assemblyai-api-key
