apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-rehearsal-shrink-diagnosis-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-rehearsal-shrink-diagnosis
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: history
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000'
              case "$DATABASE_URL" in
                *@gbrain-pg-rehearsal-rw[.:/]*) ;;
                *) echo "FATAL: DATABASE_URL does not target gbrain-pg-rehearsal-rw"; exit 1 ;;
              esac
              SLUG='sources/meetings/2026-11-12-rehearsal-908-large-transcript-test-rehearsa-transcript'
              cat > /tmp/q.sql <<EOF
              \echo == tables with page_id or slug
              SELECT table_name, string_agg(column_name, ',' ORDER BY ordinal_position) AS columns FROM information_schema.columns WHERE table_schema = 'public' AND table_name IN (SELECT table_name FROM information_schema.columns WHERE table_schema = 'public' AND column_name IN ('page_id', 'slug')) GROUP BY 1 ORDER BY 1;
              \echo == rows for the page since 17:30Z, long strings shown as sizes
              SELECT format(
                'SELECT %L AS tbl, (SELECT jsonb_object_agg(k, CASE WHEN jsonb_typeof(val) = ''string'' AND length(val #>> ''{}'') > 400 THEN to_jsonb(''<'' || octet_length(val #>> ''{}'') || '' bytes>'') ELSE val END) FROM jsonb_each(to_jsonb(t)) AS e(k, val)) AS row FROM %I t WHERE %s LIMIT 60',
                c.table_name, c.table_name,
                CASE WHEN bool_or(c.column_name = 'page_id') THEN 'page_id IN (SELECT id FROM pages WHERE slug = ''$SLUG'')' ELSE 'slug = ''$SLUG''' END)
              FROM information_schema.columns c
              WHERE c.table_schema = 'public' AND c.column_name IN ('page_id', 'slug') AND c.table_name <> 'content_chunks'
              GROUP BY c.table_name ORDER BY c.table_name
              \gexec
              \echo == tables named like write, request, audit, change, version, mcp
              SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name ~ '(write|request|audit|change|version|mcp|op_log|ledger)' ORDER BY 1;
              EOF
              psql -X -v ON_ERROR_STOP=0 -f /tmp/q.sql "$DATABASE_URL"
              echo "RESULT: history done"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: uri
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: tools
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["bun", "-e"]
          args:
            - |
              const res = await fetch("http://gbrain-rehearsal:3131/mcp", {
                method: "POST",
                headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", Authorization: "Bearer gbrain-mcp" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }),
              });
              const text = await res.text();
              let msg = null;
              for (const block of text.split("\n\n")) {
                const data = block.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("\n");
                if (!data) continue;
                try { const o = JSON.parse(data); if (o.result) msg = o; } catch {}
              }
              if (!msg) { try { msg = JSON.parse(text); } catch { console.log("unparseable: " + text.slice(0, 500)); process.exit(1); } }
              const tools = msg.result.tools;
              console.log("tools: " + tools.map((t) => t.name).sort().join(","));
              for (const t of tools.filter((t) => ["put_page", "edit_page", "append_page", "get_page"].includes(t.name))) {
                console.log("== " + t.name);
                console.log(t.description);
                console.log(JSON.stringify(t.inputSchema, null, 1));
              }
              console.log("RESULT: tools done");
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
