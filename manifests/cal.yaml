# Cal.diy (https://github.com/calcom/cal.diy) — self-hosted scheduling platform.
#
# Migrated from base-stack/4.ss/cal.yaml (ssint-named-cal) to brain repo
# (ssint-main-cal). Structure and configuration are identical to the base-stack
# version; only the namespace and env label differ.
#
# Design decisions for this deployment:
#   * Compute is stateless: cal-deploy holds no durable local state.
#   * The ONLY durable store is PostgreSQL, hosted on CloudNativePG (CNPG).
#   * Redis runs with emptyDir (ephemeral) on purpose: this is a local-testing
#     deploy. Swap emptyDir for a PVC if durable Redis is later required.
#   * SMTP is not configured.
#   * Not exposed via Ingress. Internal-only (http://cal.ssint-main-cal.svc.cluster.local);
#     will be surfaced at https://schedule.simplesalt.company via Cloudflare Access
#     later (tracked in simplesalt/cloud-basis#1). App URLs already point there.
#   * Secrets (NEXTAUTH_SECRET, CALENDSO_ENCRYPTION_KEY) are SSA-merge
#     placeholders populated by the cal-secret-bootstrap Job on first deploy.
#
# Cal.diy images track :latest (no per-release pin upstream).
---
apiVersion: v1
kind: Namespace
metadata:
  name: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
---
# PostgreSQL for Cal.diy, hosted as a CloudNativePG (CNPG) instance.
# CNPG auto-generates the "cal-pg-app" secret (keys: uri, username,
# password, dbname, host, port, ...). The cluster's read-write service is
# "cal-pg-rw". uuid-ossp is required by Prisma migrations.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cal-pg
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: calendso
      owner: cal
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
  managed:
    roles:
      - name: cal
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: cal-pg-app
  storage:
    size: 10Gi
---
# Cal.diy secrets managed by the bootstrap Job below. Flux ensures the
# Secret resource exists (ssa: merge prevents data wipeout); the bootstrap
# Job populates NEXTAUTH_SECRET and CALENDSO_ENCRYPTION_KEY on first run
# and is a no-op once both keys are present.
apiVersion: v1
kind: Secret
metadata:
  name: cal-secret
  namespace: ssint-main-cal
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
# calcom-api-key: auto-managed by the cal-seed-users Job. Flux ensures the
# resource exists (ssa: merge); the Job populates it on first deploy.
# Hermes-msg reads this cross-namespace via its hermes-msg ServiceAccount.
apiVersion: v1
kind: Secret
metadata:
  name: calcom-api-key
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
# Bootstrap Job: generates NEXTAUTH_SECRET and CALENDSO_ENCRYPTION_KEY in cal-secret
# if they are not already set. Re-runs on each Flux reconcile but exits immediately
# when the keys are already present (idempotent). Cleans up 10 minutes after success.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cal-secret-bootstrapper
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cal-secret-writer
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["cal-secret", "calcom-api-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cal-secret-bootstrapper
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cal-secret-writer
subjects:
  - kind: ServiceAccount
    name: cal-secret-bootstrapper
    namespace: ssint-main-cal
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cal-secret-bootstrap
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: cal-secret-bootstrap
        entity: ssint
        env: main
        capability: cal
    spec:
      serviceAccountName: cal-secret-bootstrapper
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine/k8s:1.33.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              NS=ssint-main-cal
              SECRET=cal-secret

              # Collect values for any keys not yet present
              NEXTAUTH_B64=""
              CALENDSO_B64=""

              VAL=$(kubectl get secret "$SECRET" -n "$NS" -o jsonpath='{.data.NEXTAUTH_SECRET}' 2>/dev/null || true)
              if [ -z "$VAL" ]; then
                NEXTAUTH_B64=$(cat /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 44 | base64 | tr -d '\n')
                echo "Will set NEXTAUTH_SECRET"
              fi

              VAL=$(kubectl get secret "$SECRET" -n "$NS" -o jsonpath='{.data.CALENDSO_ENCRYPTION_KEY}' 2>/dev/null || true)
              if [ -z "$VAL" ]; then
                CALENDSO_B64=$(cat /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 32 | base64 | tr -d '\n')
                echo "Will set CALENDSO_ENCRYPTION_KEY"
              fi

              if [ -z "$NEXTAUTH_B64" ] && [ -z "$CALENDSO_B64" ]; then
                echo "cal-secret fully populated — nothing to do."
                exit 0
              fi

              # Build patch JSON with only the missing keys
              DATA="{"
              SEP=""
              [ -n "$NEXTAUTH_B64" ] && DATA="${DATA}${SEP}\"NEXTAUTH_SECRET\":\"${NEXTAUTH_B64}\"" && SEP=","
              [ -n "$CALENDSO_B64" ] && DATA="${DATA}${SEP}\"CALENDSO_ENCRYPTION_KEY\":\"${CALENDSO_B64}\""
              DATA="${DATA}}"

              kubectl patch secret "$SECRET" -n "$NS" --type=merge -p "{\"data\":${DATA}}"
              echo "cal-secret patched successfully."
---
# Read-only access for hermes-msg pods to fetch calcom-api-key at startup.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: calcom-api-key-reader
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["calcom-api-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-msg-cal-reader-main
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: calcom-api-key-reader
subjects:
  - kind: ServiceAccount
    name: hermes-msg
    namespace: ssint-main-msg
---
# team-roster: populated out-of-band (never committed) with the roster of
# accounts to seed as Cal.diy admins. Consumed by the render-roster-sql init
# container in the cal-seed-users Job below, mounted read-only as
# /secrets/roster.json. The consuming Secret volume is optional: true, so a
# missing/absent Secret does not block the Job — it just seeds no users.
#
# roster.json schema: a JSON array of objects, one per teammate to seed:
#   [
#     {
#       "username": "<slug>",
#       "name": "<Full Name>",
#       "display_name": "<First Name>",
#       "email": "<email>",
#       "role": "<role-title, e.g. principal>",
#       "description": "<short description, or null>",
#       "admin": true,
#       "apiKeyOwner": false
#     }
#   ]
#
# - Entries with "admin": true are seeded into Cal.diy as UserPermissionRole.ADMIN.
# - Exactly one entry in the array must have "apiKeyOwner": true — that entry's
#   email owns the hermes-msg cal.com API key seeded by this Job. A non-empty
#   roster with zero or more than one apiKeyOwner renders no seed at all (see
#   render-roster-sql below).
# - This exact schema is shared with a separate "team-roster" Secret declared
#   independently in manifests/ai.yaml (different namespace, populated
#   separately, same shape). Keep the two in sync if the schema ever changes.
apiVersion: v1
kind: Secret
metadata:
  name: team-roster
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
# User seed Job: seeds ADMIN accounts from the team-roster Secret above and
# creates the hermes-msg cal.com API key on first deploy. Idempotent — user
# inserts use ON CONFLICT (email) DO NOTHING; API key generation checks
# calcom-api-key before running.
apiVersion: batch/v1
kind: Job
metadata:
  name: cal-seed-users
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        app: cal-seed-users
        entity: ssint
        env: main
        capability: cal
    spec:
      serviceAccountName: cal-secret-bootstrapper
      restartPolicy: OnFailure
      volumes:
        - name: keyshare
          emptyDir:
            medium: Memory
        - name: team-roster
          secret:
            secretName: team-roster
            optional: true
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h cal-pg-rw -p 5432; do echo "waiting for cal-pg-rw:5432"; sleep 2; done
        - name: check-and-generate
          image: alpine/k8s:1.33.1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: keyshare
              mountPath: /keyshare
          command:
            - sh
            - -c
            - |
              set -e
              VAL=$(kubectl get secret calcom-api-key -n ssint-main-cal \
                -o jsonpath='{.data.api_key}' 2>/dev/null || true)
              if [ -n "$VAL" ]; then
                echo "calcom-api-key already populated — skipping key seed."
                touch /keyshare/skip
                exit 0
              fi
              KEY=$(cat /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 32)
              printf '%s' "$KEY" > /keyshare/key
              printf '%s' "$KEY" | base64 | tr -d '\n' > /keyshare/key_b64
              echo "Generated new cal.com API key."
        - name: render-roster-sql
          image: alpine/k8s:1.33.1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: keyshare
              mountPath: /keyshare
            - name: team-roster
              mountPath: /secrets
              readOnly: true
          command:
            - sh
            - -c
            - |
              # Renders /keyshare/seed-users.sql from the team-roster Secret
              # (mounted at /secrets/roster.json). Never crash-loops the Job on
              # malformed/missing input — any failure mode below degrades to an
              # empty (no-op) seed file plus a stderr note, not a non-zero exit.
              ROSTER=/secrets/roster.json
              OUT=/keyshare/seed-users.sql
              APIKEY_OUT=/keyshare/apikey-owner-email
              : > "$OUT"
              : > "$APIKEY_OUT"

              if [ ! -s "$ROSTER" ]; then
                echo "team-roster Secret missing or roster.json empty — rendering no-op seed (no users)." >&2
                exit 0
              fi

              if ! jq -e 'type == "array"' "$ROSTER" >/dev/null 2>&1; then
                echo "roster.json is not valid JSON / not an array — rendering no-op seed (no users)." >&2
                exit 0
              fi

              COUNT=$(jq 'length' "$ROSTER")
              if [ "$COUNT" -eq 0 ]; then
                echo "roster.json is an empty array — nothing to seed." >&2
                exit 0
              fi

              APIKEY_COUNT=$(jq '[.[] | select(.apiKeyOwner == true)] | length' "$ROSTER")
              if [ "$APIKEY_COUNT" -ne 1 ]; then
                echo "roster.json must have exactly one entry with apiKeyOwner: true (found ${APIKEY_COUNT}) — rendering no-op seed." >&2
                exit 0
              fi

              # bcrypt(cost=12) of the standard dummy password "NotARealSecret-1" —
              # see the comment above HASH= in the seed container for rationale.
              HASH='$2b$12$.XgGly58H5r5xg3YTMO/v.kIGuZbfvQx/UpsGWGrgpb5TCDhf3cZa'

              # '"'"' below is the POSIX-sh trick for embedding a literal single
              # quote inside a single-quoted string (close quote, double-quoted
              # quote char, reopen quote) — needed because the jq program itself
              # (below) must build single-quoted SQL string literals while living
              # inside this script's own single-quoted jq argument. esc doubles
              # any embedded quote for SQL-safe string literals (defense in depth
              # — roster.json is operator-populated, not attacker-controlled, but
              # escape anyway).
              jq -r --arg hash "$HASH" '
                def esc: gsub("'"'"'"; "'"'"''"'"'");
                .[] | select(.admin == true) |
                (.username | esc) as $u |
                (.name | esc) as $n |
                (.email | esc) as $e |
                "INSERT INTO users (uuid,username,name,email,role,\"emailVerified\",\"completedOnboarding\") VALUES (gen_random_uuid(),'"'"'" + $u + "'"'"','"'"'" + $n + "'"'"','"'"'" + $e + "'"'"','"'"'ADMIN'"'"'::\"UserPermissionRole\",NOW(),true) ON CONFLICT (email) DO NOTHING;\n" +
                "INSERT INTO \"UserPassword\" (\"userId\",hash) SELECT id,'"'"'" + $hash + "'"'"' FROM users WHERE email='"'"'" + $e + "'"'"' ON CONFLICT (\"userId\") DO NOTHING;"
              ' "$ROSTER" > "$OUT"

              jq -r '[.[] | select(.apiKeyOwner == true)][0].email | gsub("'"'"'"; "'"'"''"'"'")' "$ROSTER" > "$APIKEY_OUT"

              echo "Rendered seed SQL for $(jq '[.[] | select(.admin == true)] | length' "$ROSTER") admin user(s)."
      containers:
        - name: seed
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: keyshare
              mountPath: /keyshare
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cal-pg-app
                  key: uri
          command:
            - sh
            - -c
            - |
              # Dummy password for every account seeded by this Job: the repo-wide
              # standard placeholder "NotARealSecret-1" (real access control for this
              # app is Cloudflare Zero Trust / CASB, not Cal.com local-login — this
              # password only exists to satisfy Cal.com's local-login requirement when
              # SSO licensing isn't in use).
              #
              # HASH is bcrypt(cost=12) of "NotARealSecret-1", pre-generated and
              # verified (bcrypt.checkpw(b'NotARealSecret-1', HASH) == True) — never
              # hand-invent a hash, always generate and verify one properly.
              #
              # ON CONFLICT ("userId") DO NOTHING (in /keyshare/seed-users.sql, from
              # the render-roster-sql init container) means this HASH only takes effect
              # for newly-seeded rows: accounts already seeded under the OLD dummy hash
              # keep it. Resetting already-seeded accounts to the new dummy password is
              # accepted future work, out of scope for this Job.
              HASH='$2b$12$.XgGly58H5r5xg3YTMO/v.kIGuZbfvQx/UpsGWGrgpb5TCDhf3cZa'
              TL=/dev/termination-log
              ERR=0
              psql "$DATABASE_URL" -f /keyshare/seed-users.sql 2>>"$TL" || ERR=1
              if [ -f /keyshare/skip ]; then
                echo "calcom-api-key already populated — skipping key seed." >> "$TL"
                touch /keyshare/seed-done
                exit $ERR
              fi
              if [ $ERR -ne 0 ]; then
                echo "User inserts failed — skipping API key seed." >> "$TL"
                exit $ERR
              fi
              KEY=$(cat /keyshare/key)
              APIKEY_OWNER_EMAIL=$(cat /keyshare/apikey-owner-email 2>/dev/null || true)
              if [ -z "$APIKEY_OWNER_EMAIL" ]; then
                echo "No apiKeyOwner in team-roster (empty/malformed roster) — skipping API key seed." >> "$TL"
                touch /keyshare/seed-done
                exit $ERR
              fi
              USER_ID=$(psql "$DATABASE_URL" -t -A \
                -c "SELECT id FROM users WHERE email='${APIKEY_OWNER_EMAIL}' LIMIT 1" \
                2>>"$TL")
              if [ -z "$USER_ID" ]; then
                echo "apiKeyOwner user not found after inserts — unexpected, retrying." >> "$TL"
                exit 1
              fi
              HASH_KEY=$(psql "$DATABASE_URL" -t -A \
                -c "SELECT encode(sha256('${KEY}'::bytea), 'hex')" 2>>"$TL") || ERR=1
              psql "$DATABASE_URL" \
                -c "DELETE FROM \"ApiKey\" WHERE note='hermes-msg'" 2>>"$TL" || ERR=1
              psql "$DATABASE_URL" \
                -c "INSERT INTO \"ApiKey\" (id, \"userId\", \"hashedKey\", note, \"createdAt\") \
                    VALUES (gen_random_uuid()::text, ${USER_ID}, '${HASH_KEY}', 'hermes-msg', NOW())" \
                2>>"$TL" || ERR=1
              if [ $ERR -eq 0 ]; then
                touch /keyshare/seed-done
                echo "ApiKey inserted for userId=${USER_ID}."
              fi
              exit $ERR
        - name: patch-secret
          image: alpine/k8s:1.33.1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: keyshare
              mountPath: /keyshare
          command:
            - sh
            - -c
            - |
              set -e
              until [ -f /keyshare/seed-done ] || [ -f /keyshare/skip ]; do
                echo "Waiting for seed container..."; sleep 2
              done
              [ -f /keyshare/skip ] && echo "Skipping secret patch." && exit 0
              KEY_B64=$(cat /keyshare/key_b64)
              kubectl patch secret calcom-api-key -n ssint-main-cal \
                --type=merge -p "{\"data\":{\"api_key\":\"${KEY_B64}\"}}"
              echo "calcom-api-key patched in ssint-main-cal."
---
# Redis — ephemeral cache/queue for Cal.diy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal-redis
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cal-redis
  template:
    metadata:
      labels:
        app: cal-redis
        entity: ssint
        env: main
        capability: cal
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cal-redis
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
spec:
  selector:
    app: cal-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Cal.diy — the scheduling application (Next.js + tRPC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cal
  template:
    metadata:
      labels:
        app: cal
        entity: ssint
        env: main
        capability: cal
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h cal-pg-rw -p 5432; do echo "waiting for cal-pg-rw:5432"; sleep 2; done
      containers:
        - name: cal
          image: calcom/cal.com:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_HOST
              value: cal-pg-rw
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cal-pg-app
                  key: uri
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: cal-pg-app
                  key: uri
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cal-secret
                  key: NEXTAUTH_SECRET
            - name: CALENDSO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cal-secret
                  key: CALENDSO_ENCRYPTION_KEY
            - name: NEXT_PUBLIC_WEBAPP_URL
              value: https://schedule.simplesalt.company
            - name: NEXTAUTH_URL
              value: https://schedule.simplesalt.company/api/auth
            - name: CALCOM_TELEMETRY_DISABLED
              value: "1"
            - name: NODE_ENV
              value: production
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: cal
  namespace: ssint-main-cal
  labels:
    entity: ssint
    env: main
    capability: cal
spec:
  selector:
    app: cal
  ports:
    - name: http
      port: 80
      targetPort: 3000
