---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: hindsight-main
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  interval: 12h
  url: oci://ghcr.io/simplesalt/charts/hindsight
  ref:
    tag: "0.2.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight-main
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: hindsight-main
    namespace: flux-system
  targetNamespace: ssint-main-ai
  install:
    createNamespace: false
    timeout: 10m
  upgrade:
    timeout: 20m
  values:
    image:
      digest: "sha256:84ab276b8f501546deb6ea9c64a57291718b4e16a59dd9e02a02fdd5adfe9028"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hindsight
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  tcpSocket:
                    port: 8888
                  periodSeconds: 10
                  failureThreshold: 90
              - op: add
                path: /spec/strategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
