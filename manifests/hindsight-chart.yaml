---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: hindsight-main
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  interval: 12h
  url: oci://ghcr.io/simplesalt/charts/hindsight
  ref:
    tag: "0.2.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight-main
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: hindsight-main
    namespace: flux-system
  targetNamespace: ssint-main-ai
  install:
    createNamespace: false
    timeout: 10m
  upgrade:
    timeout: 20m
  values:
    image:
      digest: "sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hindsight
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  tcpSocket:
                    port: 8888
                  periodSeconds: 10
                  failureThreshold: 90
              - op: add
                path: /spec/strategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
              # Models come from the llm-models ConfigMap. Chart 0.2.0 lists env as
              # PROVIDER, BASE_URL, MODEL (index 2), ...; the test fails the render
              # if a chart bump moves it. Retain and consolidation use the global
              # (SLOW_DUMB) model; reflect (and mental-model refresh) use LIVE_REASONING.
              # Provider choice and privacy settings live in the OpenRouter presets, so no
              # provider settings are sent here (request settings would override a preset).
              - op: test
                path: /spec/template/spec/containers/0/env/2/name
                value: HINDSIGHT_API_LLM_MODEL
              - op: replace
                path: /spec/template/spec/containers/0/env/2
                value:
                  name: HINDSIGHT_API_LLM_MODEL
                  valueFrom:
                    configMapKeyRef:
                      name: llm-models
                      key: SLOW_DUMB_MODEL
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: HINDSIGHT_API_REFLECT_LLM_MODEL
                  valueFrom:
                    configMapKeyRef:
                      name: llm-models
                      key: LIVE_REASONING_MODEL
