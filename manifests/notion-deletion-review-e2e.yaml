apiVersion: v1
kind: ConfigMap
metadata:
  name: notion-deletion-review-e2e-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  e2e.py: |
    # Runs the nightly deletion review now, for the planted test deletions only: builds
    # the same batch the cron script would, asks Hermes the cron prompt, and prints the
    # four scores and the risk. Writes nothing to Notion or to the job's gbrain state.
    import importlib.util, json, os, re, time, urllib.request, urllib.error

    spec = importlib.util.spec_from_file_location('review', '/script/cron-deletion-review.py')
    review = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(review)
    HERMES = os.environ.get('HERMES_URL', 'http://hermes-agent-web:8642')
    KEY = os.environ['API_SERVER_KEY']
    PREFIX = os.environ.get('TEST_TITLE_PREFIX', 'TEST: deletion review')

    def http(url, body=None, timeout=60):
        req = urllib.request.Request(url, method='POST' if body is not None else 'GET')
        req.add_header('Authorization', 'Bearer ' + KEY)
        if body is not None:
            req.add_header('Content-Type', 'application/json')
            req.data = json.dumps(body).encode()
        try:
            with urllib.request.urlopen(req, timeout=timeout) as r:
                return r.status, r.read().decode(errors='replace')
        except urllib.error.HTTPError as e:
            return e.code, e.read().decode(errors='replace')
        except Exception as e:
            return 0, repr(e)

    trashed = [o for o in review.search({'filter': {'in_trash': True}}) if o.get('in_trash')]
    roots = [e for e in review.group(trashed) if review.title_of(e['obj']).startswith(PREFIX)]
    print(f'== planted test deletions found in trash: {len(roots)}')
    if not roots:
        print('RESULT: FAIL no trashed page titled ' + repr(PREFIX))
        raise SystemExit(0)
    users = review.load_users()
    batch = []
    for entry in roots:
        editor = users.get((entry['obj'].get('last_edited_by') or {}).get('id'), {})
        print(f'   "{review.title_of(entry["obj"])}" deleted by {editor.get("type", "not in user list")}:{editor.get("name", "")}')
        item = review.review_item(entry, users)
        item.pop('_all_ids')
        batch.append(item)
    print('== batch (abridged): ' + json.dumps([{k: i[k] for k in ('id', 'title', 'deleter', 'S')} for i in batch]))

    prompt = (json.dumps(batch, indent=1) + '\n\n' + open('/script/cron-deletion-review.md').read())
    s, b = http(HERMES + '/v1/models')
    try:
        model = json.loads(b)['data'][0]['id']
    except Exception:
        model = 'hermes-agent'
    t0 = time.time()
    s, b = http(HERMES + '/v1/chat/completions', {'model': model, 'messages': [{'role': 'user', 'content': prompt}]},
                timeout=900)
    print(f'== Hermes -> HTTP {s} in {time.time() - t0:.0f}s')
    try:
        answer = json.loads(b)['choices'][0]['message']['content']
    except Exception:
        print(b[:2000])
        print('RESULT: FAIL no answer from Hermes')
        raise SystemExit(0)
    m = re.search(r'DELETION-REVIEW-RESULT\s*(?:```json)?\s*(\[.*\])', answer, re.S)
    if not m:
        print(answer[-2000:])
        print('RESULT: FAIL answer had no DELETION-REVIEW-RESULT list')
        raise SystemExit(0)
    flagged = 0
    for r in json.loads(m.group(1)):
        item = next((i for i in batch if i['id'] == r.get('id')), None)
        if not item:
            continue
        L, R, E = review.unit(r.get('L')), review.unit(r.get('R')), review.unit(r.get('E'))
        score = review.risk(item['S'], L, R, E)
        flagged += score >= review.THRESHOLD
        print(f'== "{item["title"]}": S={item["S"]:.2f} L={L:.2f} R={R:.2f} E={E:.2f} risk={score:.2f} '
              f'would_flag={score >= review.THRESHOLD} reason={r.get("reason")}')
    print(f'RESULT: PASS scored {len(batch)} test deletion(s), {flagged} over the threshold')
---
apiVersion: batch/v1
kind: Job
metadata:
  name: notion-deletion-review-e2e
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: notion-deletion-review-e2e
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: e2e
          image: python:3.12-alpine
          command: ["python3", "/e2e/e2e.py"]
          env:
            - name: E2E_RUN
              value: "restore-read-2026-10-28"
            - name: DELETION_REVIEW_DRY_RUN
              value: "1"
            - name: HERMES_HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NOTION_DELETION_REVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: NOTION_DELETION_REVIEW_TOKEN
                  optional: true
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_BEARER_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: e2e
              mountPath: /e2e
            - name: script
              mountPath: /script
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: e2e
          configMap:
            name: notion-deletion-review-e2e-script
        - name: script
          configMap:
            name: hermes-config
            items:
              - key: cron-deletion-review.py
                path: cron-deletion-review.py
              - key: cron-deletion-review.md
                path: cron-deletion-review.md
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
