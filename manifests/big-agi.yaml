---
apiVersion: v1
kind: ConfigMap
metadata:
  name: big-agi-gate-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  gate.py: |
    #!/usr/bin/env python3
    # Sits between the Cloudflare tunnel and big-AGI. big-AGI never forwards
    # browser headers upstream, so the Access JWT is copied into the OpenAI
    # access config's oaiOrg field, which big-AGI sends to hermes-proxy as
    # OpenAI-Organization. hermes-proxy verifies it; this gate trusts nothing.
    #
    # It also adds live dictation: every big-AGI page loads /_stt/mic.js, a mic
    # button that gets a single-use AssemblyAI pass from /_stt/token and streams
    # audio to AssemblyAI directly. /_stt/token is passed with the Access JWT to
    # stt-proxy, which verifies it and holds the AssemblyAI key; this pod holds none.
    import json, os, http.client, http.server
    from urllib.parse import urlsplit, parse_qsl, urlencode, urlunsplit

    UPSTREAM_HOST = os.environ.get('UPSTREAM_HOST', '127.0.0.1')
    UPSTREAM_PORT = int(os.environ.get('UPSTREAM_PORT', '3000'))
    PORT = int(os.environ.get('PORT', '3080'))
    JWT_HEADER = 'Cf-Access-Jwt-Assertion'
    STT_HOST = os.environ.get('STT_HOST', 'stt-proxy.ssint-main-voice')
    STT_PORT = int(os.environ.get('STT_PORT', '8000'))
    MIC_JS_PATH = os.environ.get('MIC_JS_PATH', '/scripts/mic.js')
    MIC_TAG = b'<script src="/_stt/mic.js" defer></script>'

    _SKIP_REQ = {'transfer-encoding', 'connection', 'content-length'}
    _SKIP_RESP = {'transfer-encoding', 'connection'}


    def stamp(node, jwt):
        n = 0
        if isinstance(node, dict):
            if node.get('dialect') == 'openai' and 'oaiKey' in node:
                node['oaiOrg'] = jwt
                n += 1
            for v in node.values():
                n += stamp(v, jwt)
        elif isinstance(node, list):
            for v in node:
                n += stamp(v, jwt)
        return n

    def stamp_json(raw, jwt):
        try:
            doc = json.loads(raw)
        except Exception:
            return None
        return json.dumps(doc, separators=(',', ':')) if stamp(doc, jwt) else None

    def inject_mic(html):
        for marker in (b'</head>', b'</body>'):
            i = html.find(marker)
            if i >= 0:
                return html[:i] + MIC_TAG + html[i:]
        return html

    class Gate(http.server.BaseHTTPRequestHandler):
        timeout = 600
        def do_GET(self): self._route()
        def do_HEAD(self): self._route()
        def do_POST(self): self._route()
        def do_PUT(self): self._route()
        def do_PATCH(self): self._route()
        def do_DELETE(self): self._route()
        def do_OPTIONS(self): self._route()
        def log_message(self, *a): pass

        def _route(self):
            p = self.path.split('?', 1)[0]
            if p == '/_stt/mic.js' and self.command in ('GET', 'HEAD'):
                self._mic_js()
            elif p == '/_stt/token' and self.command == 'GET':
                self._token()
            elif p.startswith('/_stt/'):
                self._reply(404, {'error': 'not found'})
            else:
                self._proxy()

        def _reply(self, status, doc):
            out = json.dumps(doc).encode()
            self.send_response(status)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Cache-Control', 'no-store')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def _mic_js(self):
            try:
                with open(MIC_JS_PATH, 'rb') as f:
                    js = f.read()
            except OSError:
                self._reply(404, {'error': 'mic.js missing'})
                return
            self.send_response(200)
            self.send_header('Content-Type', 'text/javascript; charset=utf-8')
            self.send_header('Cache-Control', 'no-cache')
            self.send_header('Content-Length', str(len(js)))
            self.end_headers()
            if self.command != 'HEAD':
                self.wfile.write(js)

        def _token(self):
            conn = None
            try:
                conn = http.client.HTTPConnection(STT_HOST, STT_PORT, timeout=20)
                conn.request('GET', '/token', headers={JWT_HEADER: self.headers.get(JWT_HEADER, '')})
                r = conn.getresponse()
                out = r.read()
                self.send_response(r.status)
                self.send_header('Content-Type', r.getheader('Content-Type') or 'application/json')
                self.send_header('Cache-Control', 'no-store')
                self.send_header('Content-Length', str(len(out)))
                self.end_headers()
                self.wfile.write(out)
            except Exception as e:
                print(f'big-agi-gate: stt-proxy unreachable: {e}', flush=True)
                self._reply(502, {'error': 'live dictation service unreachable'})
            finally:
                if conn is not None:
                    try: conn.close()
                    except Exception: pass

        def _proxy(self):
            n = int(self.headers.get('Content-Length', 0) or 0)
            body = self.rfile.read(n) if n else b''
            jwt = self.headers.get(JWT_HEADER, '')
            path = self.path
            if path.startswith('/api/'):
                ctype = self.headers.get('Content-Type', '')
                if body and 'json' in ctype:
                    out = stamp_json(body, jwt)
                    if out is not None:
                        body = out.encode()
                parts = urlsplit(path)
                if parts.query and 'input=' in parts.query:
                    q = parse_qsl(parts.query, keep_blank_values=True)
                    q2 = [(k, (stamp_json(v, jwt) or v) if k == 'input' else v) for k, v in q]
                    if q2 != q:
                        path = urlunsplit(('', '', parts.path, urlencode(q2), parts.fragment))
            fwd = {k: v for k, v in self.headers.items() if k.lower() not in _SKIP_REQ}
            # Page loads come back uncompressed so the mic script can be added.
            page = (self.command == 'GET' and 'text/html' in self.headers.get('Accept', '')
                    and not path.startswith(('/api/', '/_next/')))
            if page:
                fwd = {k: v for k, v in fwd.items() if k.lower() not in ('accept-encoding', 'if-none-match', 'if-modified-since')}
            if body or self.command in ('POST', 'PUT', 'PATCH'):
                fwd['Content-Length'] = str(len(body))
            conn = None
            try:
                conn = http.client.HTTPConnection(UPSTREAM_HOST, UPSTREAM_PORT, timeout=600)
                conn.request(self.command, path, body=body or None, headers=fwd)
                r = conn.getresponse()
                html = (page and r.status == 200 and 'text/html' in (r.getheader('Content-Type') or '')
                        and not r.getheader('Content-Encoding'))
                if html:
                    doc = inject_mic(r.read())
                    self.send_response_only(r.status, r.reason)
                    for k, v in r.getheaders():
                        if k.lower() not in _SKIP_RESP | {'content-length', 'etag', 'last-modified', 'cache-control'}:
                            self.send_header(k, v)
                    self.send_header('Cache-Control', 'no-cache')
                    self.send_header('Content-Length', str(len(doc)))
                    self.end_headers()
                    self.wfile.write(doc)
                    return
                self.send_response_only(r.status, r.reason)
                for k, v in r.getheaders():
                    if k.lower() not in _SKIP_RESP:
                        self.send_header(k, v)
                self.end_headers()
                if self.command != 'HEAD':
                    while True:
                        chunk = r.read1(65536)
                        if not chunk:
                            break
                        self.wfile.write(chunk)
                        self.wfile.flush()
            except Exception as e:
                try: self.send_error(502, str(e))
                except Exception: pass
            finally:
                if conn is not None:
                    try: conn.close()
                    except Exception: pass

    if __name__ == '__main__':
        srv = http.server.ThreadingHTTPServer(('0.0.0.0', PORT), Gate)
        print(f'big-agi-gate :{PORT} → {UPSTREAM_HOST}:{UPSTREAM_PORT}', flush=True)
        srv.serve_forever()
  mic.js: |
    // Live dictation for big-AGI: tap the mic, speak, tap again. Audio streams
    // straight from the browser to AssemblyAI with a single-use pass from
    // /_stt/token, and words appear in the chat box at the cursor as you speak,
    // for review before sending. The open conversation is sent as context so the
    // recognizer picks the right word. Drag the button to move it.
    (() => {
      if (window.__sttMic) return;
      window.__sttMic = true;
      const LIVE_MAX_MS = 60 * 60 * 1000;
      const PASS_REFRESH_MS = 8 * 60 * 1000;
      const LIVE_URL = 'wss://streaming.assemblyai.com/v3/ws';
      const POS_KEY = 'stt-mic-pos';

      const style = document.createElement('style');
      style.textContent = `
        #stt-mic{position:fixed;z-index:2147483000;width:52px;height:52px;border-radius:50%;border:none;
          display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;
          background:#2b6cb0;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);opacity:.9;
          -webkit-tap-highlight-color:transparent;user-select:none;font:600 11px system-ui,sans-serif}
        #stt-mic svg{width:24px;height:24px;fill:currentColor;pointer-events:none}
        #stt-mic[data-state=rec]{background:#c53030;animation:stt-pulse 1.2s ease-in-out infinite}
        #stt-mic[data-state=busy]{background:#4a5568}
        #stt-mic[data-state=busy] svg{animation:stt-spin 1s linear infinite}
        @keyframes stt-pulse{50%{box-shadow:0 0 0 10px rgba(197,48,48,.25)}}
        @keyframes stt-spin{to{transform:rotate(360deg)}}
        #stt-toast{position:fixed;z-index:2147483001;left:50%;bottom:24px;transform:translateX(-50%);
          max-width:calc(100vw - 32px);padding:10px 14px;border-radius:8px;background:#1a202c;color:#fff;
          font:14px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35)}`;
      document.head.appendChild(style);

      const ICON_MIC = '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
      const ICON_BUSY = '<svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>';

      const btn = document.createElement('button');
      btn.id = 'stt-mic';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Dictate');

      let state = 'idle', stream = null, timer = null, startedAt = 0;
      let lastField = null, toastTimer = null;

      function setState(s) {
        state = s;
        btn.dataset.state = s;
        btn.innerHTML = s === 'busy' ? ICON_BUSY : s === 'rec' ? '' : ICON_MIC;
        btn.setAttribute('aria-label', s === 'rec' ? 'Stop dictating' : 'Dictate');
        if (s !== 'rec') clearInterval(timer);
      }

      function toast(msg, ms = 4000) {
        document.getElementById('stt-toast')?.remove();
        clearTimeout(toastTimer);
        const t = document.createElement('div');
        t.id = 'stt-toast';
        t.textContent = msg;
        document.body.appendChild(t);
        if (ms) toastTimer = setTimeout(() => t.remove(), ms);
      }

      // The chat box: the last text field focused, else the last visible one.
      document.addEventListener('focusin', (e) => {
        if (e.target instanceof HTMLTextAreaElement) lastField = e.target;
      });
      function field() {
        if (lastField && lastField.isConnected && lastField.offsetParent) return lastField;
        const all = [...document.querySelectorAll('textarea')].filter((t) => t.offsetParent && !t.readOnly && !t.disabled);
        return all[all.length - 1] || null;
      }

      // Passes: single-use, unusable after 10 minutes, so one is kept fresh in the
      // background and a tap never waits on the handshake.
      let pass = null, passAt = 0, passError = '', live = null;
      async function fetchPass() {
        try {
          const r = await fetch('/_stt/token', { credentials: 'same-origin', cache: 'no-store' });
          const doc = await r.json().catch(() => ({}));
          if (r.ok && doc.token) { pass = doc.token; passAt = Date.now(); passError = ''; return pass; }
          passError = doc.error || `HTTP ${r.status}`;
        } catch (e) {
          passError = e.message;
        }
        pass = null;
        return null;
      }
      async function takePass() {
        const p = pass && Date.now() - passAt < PASS_REFRESH_MS + 60 * 1000 ? pass : await fetchPass();
        pass = null;
        setTimeout(fetchPass, 0);
        return p;
      }
      fetchPass();
      setInterval(fetchPass, PASS_REFRESH_MS);

      // Context for the recognizer: the end of the open conversation.
      function conversationContext() {
        let tail = '';
        try { tail = (document.querySelector('main') || document.body).innerText.replace(/\s+/g, ' ').slice(-1500); } catch (_) {}
        return ('Dictating a chat message to an AI assistant. Recent conversation: ' + tail).slice(0, 1750);
      }

      // Writes the live text into the chat box, replacing what this session wrote so far.
      // If the box changed under us, the next words go at the new cursor instead.
      function liveWriter(onMoved) {
        let ta = null, before = '', after = '', written = null;
        const anchor = () => {
          ta = field();
          if (!ta) return;
          const v = ta.value, s = ta.selectionStart ?? v.length, e = ta.selectionEnd ?? s;
          before = v.slice(0, s); after = v.slice(e);
        };
        anchor();
        return (textFn) => {
          if (!ta || !ta.isConnected || (written !== null && ta.value !== written)) { anchor(); written = null; onMoved(); }
          const text = textFn();
          if (!ta || !text) return;
          const lead = before && !/\s$/.test(before) ? ' ' : '';
          const trail = after && !/^\s/.test(after) ? ' ' : '';
          const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
          setter.call(ta, before + lead + text + trail + after);
          ta.dispatchEvent(new Event('input', { bubbles: true }));
          written = ta.value;
          const pos = (before + lead + text).length;
          try { ta.setSelectionRange(pos, pos); } catch (_) {}
        };
      }

      const WORKLET = `registerProcessor('stt-pcm', class extends AudioWorkletProcessor {
        constructor() { super(); this.buf = []; }
        process(inputs) {
          const ch = inputs[0] && inputs[0][0];
          if (ch) for (let i = 0; i < ch.length; i++) this.buf.push(Math.max(-1, Math.min(1, ch[i])) * 0x7fff);
          if (this.buf.length >= sampleRate / 10) { this.port.postMessage(Int16Array.from(this.buf).buffer); this.buf = []; }
          return true;
        }
      });`;

      async function startLive(token) {
        const ctx = new AudioContext({ sampleRate: 16000 });
        const url = URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' }));
        try {
          await ctx.audioWorklet.addModule(url);
          await ctx.resume();
        } catch (e) {
          ctx.close().catch(() => {});
          throw e;
        } finally { URL.revokeObjectURL(url); }
        const params = new URLSearchParams({
          token, speech_model: 'universal-3-5-pro', encoding: 'pcm_s16le',
          sample_rate: String(ctx.sampleRate), prompt: conversationContext(),
        });
        const ws = new WebSocket(`${LIVE_URL}?${params}`);
        ws.binaryType = 'arraybuffer';
        const node = new AudioWorkletNode(ctx, 'stt-pcm');
        const src = ctx.createMediaStreamSource(stream);
        let committed = [], partial = '';
        const write = liveWriter(() => { committed = []; });
        const show = () => write(() => [...committed, partial].filter(Boolean).join(' '));
        node.port.onmessage = (e) => { if (ws.readyState === 1) ws.send(e.data); };
        ws.onmessage = (e) => {
          let m;
          try { m = JSON.parse(e.data); } catch (_) { return; }
          if (m.type === 'Turn') {
            const text = (m.transcript || '').trim();
            if (m.end_of_turn) { if (text) committed.push(text); partial = ''; } else partial = text;
            show();
          }
        };
        live = { ws, ctx, src, node, ending: false };
        await new Promise((ok, fail) => {
          ws.onopen = ok;
          ws.onerror = () => fail(new Error('could not reach the live dictation service'));
        });
        src.connect(node);
        ws.onclose = (e) => {
          const was = live;
          endLive();
          if (was && !was.ending) toast(`Dictation stopped${e.reason ? ` (${e.reason})` : ''}.`);
        };
        live.ctxTimer = setInterval(() => {
          if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'UpdateConfiguration', prompt: conversationContext() }));
        }, 60 * 1000);
      }

      function endLive() {
        const l = live;
        live = null;
        if (l) {
          clearInterval(l.ctxTimer);
          try { l.src.disconnect(); l.node.disconnect(); } catch (_) {}
          l.ctx.close().catch(() => {});
          if (l.ws.readyState <= 1) try { l.ws.close(); } catch (_) {}
        }
        stream?.getTracks().forEach((t) => t.stop());
        stream = null;
        setState('idle');
      }

      function stop() {
        const l = live;
        if (!l || l.ending) return;
        l.ending = true;
        try { l.src.disconnect(); } catch (_) {}
        setState('busy');
        // Terminate flushes the last words; the server then closes the socket.
        try { l.ws.send(JSON.stringify({ type: 'Terminate' })); } catch (_) {}
        setTimeout(() => { if (live === l) endLive(); }, 4000);
      }

      async function start() {
        setState('busy');
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        } catch (e) {
          setState('idle');
          toast('Microphone blocked. Allow it for this site in the browser settings.');
          return;
        }
        const token = await takePass();
        if (!token) {
          endLive();
          toast(`Dictation unavailable (${passError || 'no pass'}).`);
          return;
        }
        try {
          await startLive(token);
        } catch (e) {
          if (live) live.ending = true;
          endLive();
          toast(`Dictation unavailable (${e.message}).`);
          return;
        }
        startedAt = Date.now();
        setState('rec');
        const tick = () => {
          const s = Math.floor((Date.now() - startedAt) / 1000);
          btn.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
          if (Date.now() - startedAt > LIVE_MAX_MS) stop();
        };
        tick();
        timer = setInterval(tick, 500);
      }

      function tap() {
        if (state === 'idle') start();
        else if (state === 'rec') stop();
      }

      // Position, dragging, and tapping. pointerdown's preventDefault keeps the
      // chat box focused, so the phone keyboard and cursor stay where they were.
      function place(x, y) {
        const m = 8;
        x = Math.min(Math.max(m, x), window.innerWidth - 52 - m);
        y = Math.min(Math.max(m, y), window.innerHeight - 52 - m);
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
        return { x, y };
      }
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch (_) {}
      const home = () => place(window.innerWidth - 64, window.innerHeight - 190);
      if (saved && typeof saved.x === 'number') place(saved.x, saved.y); else home();
      window.addEventListener('resize', () => place(parseFloat(btn.style.left), parseFloat(btn.style.top)));

      let drag = null;
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        drag = { x: e.clientX, y: e.clientY, ox: parseFloat(btn.style.left), oy: parseFloat(btn.style.top), moved: false };
      });
      btn.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!drag.moved && Math.hypot(dx, dy) < 10) return;
        drag.moved = true;
        place(drag.ox + dx, drag.oy + dy);
      });
      btn.addEventListener('pointerup', () => {
        if (!drag) return;
        const moved = drag.moved;
        drag = null;
        if (moved) {
          try { localStorage.setItem(POS_KEY, JSON.stringify({ x: parseFloat(btn.style.left), y: parseFloat(btn.style.top) })); } catch (_) {}
        } else tap();
      });
      btn.addEventListener('pointercancel', () => { drag = null; });
      btn.addEventListener('click', (e) => e.preventDefault());
      btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });

      setState('idle');
      const mount = () => document.body.appendChild(btn);
      if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
    })();
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: big-agi
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: big-agi
  template:
    metadata:
      labels:
        app: big-agi
        entity: ssint
        env: main
        capability: ai
      annotations:
        gate-script-sha: 4d720bb9edf42a68
    spec:
      containers:
        - name: big-agi
          image: ghcr.io/enricoros/big-agi:latest
          imagePullPolicy: Always
          ports:
            - name: app
              containerPort: 3000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_BEARER_TOKEN
            - name: OPENAI_API_HOST
              value: "http://hermes-proxy:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
        - name: gate
          image: python:3.12-alpine
          command: ["python", "/scripts/gate.py"]
          ports:
            - name: http
              containerPort: 3080
          env:
            - name: UPSTREAM_PORT
              value: "3000"
            - name: PORT
              value: "3080"
          volumeMounts:
            - name: gate-script
              mountPath: /scripts
          readinessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: gate-script
          configMap:
            name: big-agi-gate-script
---
apiVersion: v1
kind: Service
metadata:
  name: big-agi
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: big-agi
  ports:
    - name: http
      port: 3000
      targetPort: 3080
