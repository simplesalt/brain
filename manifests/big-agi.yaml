---
apiVersion: v1
kind: ConfigMap
metadata:
  name: big-agi-gate-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  gate.py: |
    #!/usr/bin/env python3
    # Sits between the Cloudflare tunnel and big-AGI. big-AGI never forwards
    # browser headers upstream, so the Access JWT is copied into the OpenAI
    # access config's oaiOrg field, which big-AGI sends to hermes-proxy as
    # OpenAI-Organization. hermes-proxy verifies it; this gate trusts nothing.
    #
    # It also adds live dictation: every big-AGI page loads /_stt/mic.js, a mic
    # button that gets a single-use AssemblyAI pass from /_stt/token and streams
    # audio to AssemblyAI directly. /_stt/token is passed with the Access JWT to
    # stt-proxy, which verifies it and holds the AssemblyAI key; this pod holds none.
    #
    # Every page also loads /_ui/nav.js, which trims big-AGI's navigation and
    # adds a link to the Hermes console.
    import hashlib, json, os, http.client, http.server
    from urllib.parse import urlsplit, parse_qsl, urlencode, urlunsplit

    UPSTREAM_HOST = os.environ.get('UPSTREAM_HOST', '127.0.0.1')
    UPSTREAM_PORT = int(os.environ.get('UPSTREAM_PORT', '3000'))
    PORT = int(os.environ.get('PORT', '3080'))
    JWT_HEADER = 'Cf-Access-Jwt-Assertion'
    STT_HOST = os.environ.get('STT_HOST', 'stt-proxy.ssint-main-voice')
    STT_PORT = int(os.environ.get('STT_PORT', '8000'))
    HERMES_HOST = os.environ.get('HERMES_HOST', 'hermes-agent-web')
    HERMES_PORT = int(os.environ.get('HERMES_PORT', '80'))
    HERMES_PREFIX = '/admin'
    BRAIN_HOST = os.environ.get('BRAIN_HOST', 'gbrain')
    BRAIN_PORT = int(os.environ.get('BRAIN_PORT', '3132'))
    BRAIN_PREFIX = '/brain'
    MIC_JS_PATH = os.environ.get('MIC_JS_PATH', '/scripts/mic.js')
    NAV_JS_PATH = os.environ.get('NAV_JS_PATH', '/scripts/nav.js')

    _SKIP_REQ = {'transfer-encoding', 'connection', 'content-length'}
    _SKIP_RESP = {'transfer-encoding', 'connection'}


    def stamp(node, jwt):
        n = 0
        if isinstance(node, dict):
            if node.get('dialect') == 'openai' and 'oaiKey' in node:
                node['oaiOrg'] = jwt
                n += 1
            for v in node.values():
                n += stamp(v, jwt)
        elif isinstance(node, list):
            for v in node:
                n += stamp(v, jwt)
        return n

    def stamp_json(raw, jwt):
        try:
            doc = json.loads(raw)
        except Exception:
            return None
        return json.dumps(doc, separators=(',', ':')) if stamp(doc, jwt) else None

    # Cloudflare stretches no-cache to a 4-hour browser cache, so each script URL
    # carries a hash of its content: a changed script is a new URL.
    def _version(path):
        try:
            with open(path, 'rb') as f:
                return hashlib.sha256(f.read()).hexdigest()[:12]
        except OSError:
            return '0'

    # The installed phone app: its own name and the Simple Salt mark, in place of
    # big-AGI's. Served under /icons, which Access leaves open because browsers
    # fetch the manifest and icons without cookies; new names dodge cached copies.
    APP_NAME = 'SS chat'
    BRAND_BLUE = (0x5c, 0x99, 0xad)

    # The mark as in nav.js's favicon, a hollow blue square, on white and inside
    # the middle 60% so Android's maskable crop keeps it whole.
    def _icon_png(n):
        import struct, zlib
        lo, hi, w = round(n * .2), round(n * .8), max(1, round(n * .11))
        rows = []
        for y in range(n):
            row = bytearray(b'\0')
            for x in range(n):
                inside = lo <= x < hi and lo <= y < hi
                ring = inside and not (lo + w <= x < hi - w and lo + w <= y < hi - w)
                row += bytes(BRAND_BLUE) if ring else b'\xff\xff\xff'
            rows.append(bytes(row))
        def chunk(kind, data):
            return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))
        return (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', n, n, 8, 2, 0, 0, 0))
                + chunk(b'IDAT', zlib.compress(b''.join(rows), 9)) + chunk(b'IEND', b''))

    ICONS = {f'/icons/ss-{n}.png': _icon_png(n) for n in (180, 192, 512)}
    MANIFEST_PATH = '/icons/ss.webmanifest'
    MANIFEST = json.dumps({
        'name': APP_NAME, 'short_name': APP_NAME, 'id': '/',
        'display': 'standalone', 'start_url': '/?source=pwa', 'scope': '/',
        'theme_color': '#32383E', 'background_color': '#ffffff',
        'icons': [{'src': p, 'sizes': f'{n}x{n}', 'type': 'image/png', 'purpose': 'any maskable'}
                  for p, n in (('/icons/ss-192.png', 192), ('/icons/ss-512.png', 512))],
    }).encode()

    def brand(html):
        html = html.replace(b'href="/manifest.json"', f'href="{MANIFEST_PATH}"'.encode())
        html = html.replace(b'href="/apple-touch-icon.png"', b'href="/icons/ss-180.png"')
        return html

    def inject_mic(html):
        html = brand(html)
        tags = (f'<meta name="apple-mobile-web-app-title" content="{APP_NAME}">'
                f'<script src="/_stt/mic.js?v={_version(MIC_JS_PATH)}" defer></script>'
                # Not deferred: it must set big-AGI's stored defaults before the app reads them.
                f'<script src="/_ui/nav.js?v={_version(NAV_JS_PATH)}"></script>').encode()
        for marker in (b'</head>', b'</body>'):
            i = html.find(marker)
            if i >= 0:
                return html[:i] + tags + html[i:]
        return html

    class Gate(http.server.BaseHTTPRequestHandler):
        timeout = 600
        def do_GET(self): self._route()
        def do_HEAD(self): self._route()
        def do_POST(self): self._route()
        def do_PUT(self): self._route()
        def do_PATCH(self): self._route()
        def do_DELETE(self): self._route()
        def do_OPTIONS(self): self._route()
        def log_message(self, *a): pass

        def _route(self):
            p = self.path.split('?', 1)[0]
            if p == '/_stt/mic.js' and self.command in ('GET', 'HEAD'):
                self._script(MIC_JS_PATH)
            elif p == '/_ui/nav.js' and self.command in ('GET', 'HEAD'):
                self._script(NAV_JS_PATH)
            elif p == MANIFEST_PATH and self.command in ('GET', 'HEAD'):
                self._static(MANIFEST, 'application/manifest+json')
            elif p in ICONS and self.command in ('GET', 'HEAD'):
                self._static(ICONS[p], 'image/png')
            elif p == '/_stt/token' and self.command == 'GET':
                self._token()
            elif p.startswith('/_stt/'):
                self._reply(404, {'error': 'not found'})
            elif p == HERMES_PREFIX or p.startswith(HERMES_PREFIX + '/'):
                self._hermes()
            elif p == BRAIN_PREFIX or p.startswith(BRAIN_PREFIX + '/'):
                self._brain()
            else:
                self._proxy()

        # The Hermes console at /admin, also shown in an admin pane inside big-AGI.
        # Served under this origin so it needs no sign-in of its own; Hermes builds its
        # links from X-Forwarded-Prefix. No WebSockets: the console pages left
        # in its menu don't use them.
        def _hermes(self):
            n = int(self.headers.get('Content-Length', 0) or 0)
            body = self.rfile.read(n) if n else b''
            path = self.path[len(HERMES_PREFIX):]
            if not path.startswith('/'):
                path = '/' + path
            fwd = {k: v for k, v in self.headers.items() if k.lower() not in _SKIP_REQ | {'host', 'x-forwarded-prefix'}}
            fwd['X-Forwarded-Prefix'] = HERMES_PREFIX
            if body or self.command in ('POST', 'PUT', 'PATCH'):
                fwd['Content-Length'] = str(len(body))
            conn = None
            try:
                conn = http.client.HTTPConnection(HERMES_HOST, HERMES_PORT, timeout=600)
                conn.request(self.command, path, body=body or None, headers=fwd)
                r = conn.getresponse()
                self.send_response_only(r.status, r.reason)
                for k, v in r.getheaders():
                    if k.lower() in _SKIP_RESP:
                        continue
                    if k.lower() == 'location' and v.startswith('/') and not v.startswith(HERMES_PREFIX + '/'):
                        v = HERMES_PREFIX + v
                    self.send_header(k, v)
                self.end_headers()
                if self.command != 'HEAD':
                    while True:
                        chunk = r.read1(65536)
                        if not chunk:
                            break
                        self.wfile.write(chunk)
                        self.wfile.flush()
            except Exception as e:
                print(f'big-agi-gate: hermes console unreachable: {e}', flush=True)
                try: self._reply(502, {'error': 'Hermes console unreachable'})
                except Exception: pass
            finally:
                if conn is not None:
                    try: conn.close()
                    except Exception: pass

        # gbrain's owner dashboard at /brain, already signed in by the admin gate
        # in the gbrain pod; this site's Access sign-in is what lets people in.
        def _brain(self):
            n = int(self.headers.get('Content-Length', 0) or 0)
            body = self.rfile.read(n) if n else b''
            fwd = {k: v for k, v in self.headers.items() if k.lower() not in _SKIP_REQ | {'host'}}
            if body or self.command in ('POST', 'PUT', 'PATCH'):
                fwd['Content-Length'] = str(len(body))
            conn = None
            try:
                conn = http.client.HTTPConnection(BRAIN_HOST, BRAIN_PORT, timeout=600)
                conn.request(self.command, self.path, body=body or None, headers=fwd)
                r = conn.getresponse()
                self.send_response_only(r.status, r.reason)
                for k, v in r.getheaders():
                    if k.lower() not in _SKIP_RESP:
                        self.send_header(k, v)
                self.end_headers()
                if self.command != 'HEAD':
                    while True:
                        chunk = r.read1(65536)
                        if not chunk:
                            break
                        self.wfile.write(chunk)
                        self.wfile.flush()
            except Exception as e:
                print(f'big-agi-gate: gbrain admin unreachable: {e}', flush=True)
                try: self._reply(502, {'error': 'gbrain admin unreachable'})
                except Exception: pass
            finally:
                if conn is not None:
                    try: conn.close()
                    except Exception: pass

        def _reply(self, status, doc):
            out = json.dumps(doc).encode()
            self.send_response(status)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Cache-Control', 'no-store')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def _script(self, path):
            try:
                with open(path, 'rb') as f:
                    js = f.read()
            except OSError:
                self._reply(404, {'error': f'{os.path.basename(path)} missing'})
                return
            self.send_response(200)
            self.send_header('Content-Type', 'text/javascript; charset=utf-8')
            self.send_header('Cache-Control', 'no-store')
            self.send_header('Content-Length', str(len(js)))
            self.end_headers()
            if self.command != 'HEAD':
                self.wfile.write(js)

        def _static(self, out, ctype):
            self.send_response(200)
            self.send_header('Content-Type', ctype)
            self.send_header('Cache-Control', 'public, max-age=3600')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            if self.command != 'HEAD':
                self.wfile.write(out)

        def _token(self):
            self._to_stt('GET', '/token', None)

        def _to_stt(self, method, path, body):
            host, port = STT_HOST, STT_PORT
            conn = None
            try:
                conn = http.client.HTTPConnection(host, port, timeout=40)
                headers = {JWT_HEADER: self.headers.get(JWT_HEADER, '')}
                if body is not None:
                    headers.update({'Content-Type': 'application/json', 'Content-Length': str(len(body))})
                conn.request(method, path, body=body, headers=headers)
                r = conn.getresponse()
                out = r.read()
                self.send_response(r.status)
                self.send_header('Content-Type', r.getheader('Content-Type') or 'application/json')
                self.send_header('Cache-Control', 'no-store')
                self.send_header('Content-Length', str(len(out)))
                self.end_headers()
                self.wfile.write(out)
            except Exception as e:
                print(f'big-agi-gate: {host} unreachable: {e}', flush=True)
                self._reply(502, {'error': 'dictation service unreachable'})
            finally:
                if conn is not None:
                    try: conn.close()
                    except Exception: pass

        def _proxy(self):
            n = int(self.headers.get('Content-Length', 0) or 0)
            body = self.rfile.read(n) if n else b''
            jwt = self.headers.get(JWT_HEADER, '')
            path = self.path
            if path.startswith('/api/'):
                ctype = self.headers.get('Content-Type', '')
                if body and 'json' in ctype:
                    out = stamp_json(body, jwt)
                    if out is not None:
                        body = out.encode()
                parts = urlsplit(path)
                if parts.query and 'input=' in parts.query:
                    q = parse_qsl(parts.query, keep_blank_values=True)
                    q2 = [(k, (stamp_json(v, jwt) or v) if k == 'input' else v) for k, v in q]
                    if q2 != q:
                        path = urlunsplit(('', '', parts.path, urlencode(q2), parts.fragment))
            fwd = {k: v for k, v in self.headers.items() if k.lower() not in _SKIP_REQ}
            # Page loads come back uncompressed so the mic script can be added.
            page = (self.command == 'GET' and 'text/html' in self.headers.get('Accept', '')
                    and not path.startswith(('/api/', '/_next/')))
            if page:
                fwd = {k: v for k, v in fwd.items() if k.lower() not in ('accept-encoding', 'if-none-match', 'if-modified-since')}
            if body or self.command in ('POST', 'PUT', 'PATCH'):
                fwd['Content-Length'] = str(len(body))
            conn = None
            try:
                conn = http.client.HTTPConnection(UPSTREAM_HOST, UPSTREAM_PORT, timeout=600)
                conn.request(self.command, path, body=body or None, headers=fwd)
                r = conn.getresponse()
                html = (page and r.status == 200 and 'text/html' in (r.getheader('Content-Type') or '')
                        and not r.getheader('Content-Encoding'))
                if html:
                    doc = inject_mic(r.read())
                    self.send_response_only(r.status, r.reason)
                    for k, v in r.getheaders():
                        if k.lower() not in _SKIP_RESP | {'content-length', 'etag', 'last-modified', 'cache-control'}:
                            self.send_header(k, v)
                    self.send_header('Cache-Control', 'no-store')
                    self.send_header('Content-Length', str(len(doc)))
                    self.end_headers()
                    self.wfile.write(doc)
                    return
                self.send_response_only(r.status, r.reason)
                for k, v in r.getheaders():
                    if k.lower() not in _SKIP_RESP:
                        self.send_header(k, v)
                self.end_headers()
                if self.command != 'HEAD':
                    while True:
                        chunk = r.read1(65536)
                        if not chunk:
                            break
                        self.wfile.write(chunk)
                        self.wfile.flush()
            except Exception as e:
                try: self.send_error(502, str(e))
                except Exception: pass
            finally:
                if conn is not None:
                    try: conn.close()
                    except Exception: pass

    if __name__ == '__main__':
        srv = http.server.ThreadingHTTPServer(('0.0.0.0', PORT), Gate)
        print(f'big-agi-gate :{PORT} → {UPSTREAM_HOST}:{UPSTREAM_PORT}', flush=True)
        srv.serve_forever()
  mic.js: |
    // Live dictation for big-AGI. Takes over the composer's own mic button (and
    // Ctrl+M): tap, speak, tap again. Audio streams straight from the browser to
    // AssemblyAI with a single-use pass from /_stt/token, and words appear in the
    // chat box at the cursor as you speak, for review before sending. The open
    // conversation is sent as context so the recognizer picks the right word.
    // An Aa button beside the mic sends the chat box to the grammar service.
    (() => {
      if (window.__sttMic) return;
      window.__sttMic = true;
      const LIVE_MAX_MS = 60 * 60 * 1000;
      const PASS_REFRESH_MS = 8 * 60 * 1000;
      const LIVE_URL = 'wss://streaming.assemblyai.com/v3/ws';
      const GRAMMAR_URL = 'https://api.simplesalt.company/45e6451afc312886/grammar';

      const style = document.createElement('style');
      style.textContent = `
        @keyframes stt-pulse{50%{box-shadow:0 0 0 10px rgba(197,48,48,.25)}}
        @keyframes stt-spin{to{transform:rotate(360deg)}}
        .stt-mic-rec{background:#c53030 !important;color:#fff !important;animation:stt-pulse 1.2s ease-in-out infinite}
        .stt-mic-busy{background:#4a5568 !important;color:#fff !important}
        #stt-fix{font:700 14px system-ui,sans-serif}
        #stt-fix[data-busy]{opacity:.5;animation:stt-spin 1s linear infinite}
        #stt-toast{position:fixed;z-index:2147483001;left:50%;bottom:24px;transform:translateX(-50%);
          max-width:calc(100vw - 32px);padding:10px 14px;border-radius:8px;background:#1a202c;color:#fff;
          font:14px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35)}`;
      document.head.appendChild(style);

      let state = 'idle', stream = null, timer = null, startedAt = 0;
      let lastField = null, toastTimer = null;

      // The composer's mic buttons (big-AGI renders MUI's MicIcon inside them).
      const isMic = (b) => !!b && b.id !== 'stt-fix' && !!b.querySelector('svg[data-testid="MicIcon"]');
      const micButtons = () => [...document.querySelectorAll('button')].filter(isMic);

      // Shows the dictation state on the mic buttons with classes only, never
      // touching their content, which React owns.
      function paint() {
        for (const b of micButtons()) {
          b.classList.toggle('stt-mic-rec', state === 'rec');
          b.classList.toggle('stt-mic-busy', state === 'busy');
          b.title = state === 'rec' ? 'Stop dictating' : 'Dictate';
        }
      }

      function setState(s) {
        state = s;
        paint();
        if (s !== 'rec') clearInterval(timer);
      }

      function toast(msg, ms = 4000) {
        document.getElementById('stt-toast')?.remove();
        clearTimeout(toastTimer);
        const t = document.createElement('div');
        t.id = 'stt-toast';
        t.textContent = msg;
        document.body.appendChild(t);
        if (ms) toastTimer = setTimeout(() => t.remove(), ms);
      }

      // The chat box: the last text field focused, else the last visible one.
      document.addEventListener('focusin', (e) => {
        if (e.target instanceof HTMLTextAreaElement) lastField = e.target;
      });
      function field() {
        if (lastField && lastField.isConnected && lastField.offsetParent) return lastField;
        const all = [...document.querySelectorAll('textarea')].filter((t) => t.offsetParent && !t.readOnly && !t.disabled);
        return all[all.length - 1] || null;
      }

      // Passes: single-use, unusable after 10 minutes, so one is kept fresh in the
      // background and a tap never waits on the handshake.
      let pass = null, passAt = 0, passError = '', live = null;
      async function fetchPass() {
        try {
          const r = await fetch('/_stt/token', { credentials: 'same-origin', cache: 'no-store' });
          const doc = await r.json().catch(() => ({}));
          if (r.ok && doc.token) { pass = doc.token; passAt = Date.now(); passError = ''; return pass; }
          passError = doc.error || `HTTP ${r.status}`;
        } catch (e) {
          passError = e.message;
        }
        pass = null;
        return null;
      }
      async function takePass() {
        const p = pass && Date.now() - passAt < PASS_REFRESH_MS + 60 * 1000 ? pass : await fetchPass();
        pass = null;
        setTimeout(fetchPass, 0);
        return p;
      }
      fetchPass();
      setInterval(fetchPass, PASS_REFRESH_MS);

      // Context for the recognizer: the whole open conversation, from big-AGI's
      // message elements (buttons and the composer are left out), with the 2,000
      // most common English words cut out. Each cut becomes ' | ', so uncommon words
      // that stood together stay together as a phrase ("Judy Johnstone"); this fits
      // far more of the chat into the 1,750-character prompt, and in a side-by-side
      // test it spelled more names right than the raw end of the chat.
      // The last prompt sent is kept on window.__sttContext to check what went.
      const COMMON = new Set(`
        the of and to a in for is on that by this with i you it not or be are from at as your all have new more an was
        we will home can us about if page my has search free but our one other do no information time they site he up
        may what which their news out use any there see only so his when contact here business who web also now help
        get pm view online c e first am been would how were me s services some these click its like service x than
        find price date back top people had list name just over state year day into email two health n world re next
        used go b work last most products music buy data make them should product system post her city t add policy
        number such please available copyright support message after best software then jan good video well d where
        info rights public books high school through m each links she review years order very privacy book items
        company r read group sex need many user said de does set under general research university january mail full
        map reviews program life know games way days management p part could great united hotel real f item
        international center ebay must store travel comments made development report off member details line terms
        before hotels did send right type because local those using results office education national car design take
        posted internet address community within states area want phone dvd shipping reserved subject between forum
        family l long based w code show o even black check special prices website index being women much sign file
        link open today technology south case project same pages uk version section own found sports house related
