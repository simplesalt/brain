      function conversationContext() {
        let phrases = [];
        try {
          const msgs = [...document.querySelectorAll('[role="chat-message"]')];
          const text = msgs.length ? msgs.map((m) => m.innerText).join(' . ') : (document.querySelector('main') || document.body).innerText;
          const runs = [];
          let cur = [];
          for (const tok of text.match(/[A-Za-z][A-Za-z0-9'+#-]*[A-Za-z0-9+#]|[A-Za-z]|[.!?:;,()\n]/g) || []) {
            const k = tok.toLowerCase().replace(/^'+|'+$/g, '');
            if (/^[.!?:;,()\n]$/.test(tok) || k.length < 2 || COMMON.has(k)) {
              if (cur.length) { runs.push(cur.join(' ')); cur = []; }
            } else cur.push(tok);
          }
          if (cur.length) runs.push(cur.join(' '));
          // Newest mention wins, so the most recent phrases survive the length cap.
          const seen = new Set();
          for (let i = runs.length - 1; i >= 0; i--) {
            const k = runs[i].toLowerCase();
            if (!seen.has(k)) { seen.add(k); phrases.unshift(runs[i]); }
          }
        } catch (_) {}
        const head = 'Chat with an AI assistant. Uncommon terms and phrases from the chat: ';
        let body = phrases.join(' | ');
        if (body.length > 1750 - head.length) body = body.slice(-(1750 - head.length)).replace(/^[^|]*\|\s*/, '');
        const prompt = head + body;
        window.__sttContext = prompt;
        return prompt;
      }

      // Writes the live text into the chat box, replacing what this session wrote so far.
      // If the box changed under us, the next words go at the new cursor instead.
      function liveWriter(onMoved) {
        let ta = null, before = '', after = '', written = null;
        const anchor = () => {
          ta = field();
          if (!ta) return;
          const v = ta.value, s = ta.selectionStart ?? v.length, e = ta.selectionEnd ?? s;
          before = v.slice(0, s); after = v.slice(e);
        };
        anchor();
        // strict: write only if the box still holds what was last written here.
        return (textFn, strict) => {
          const moved = !ta || !ta.isConnected || (written !== null && ta.value !== written);
          if (strict && moved) return false;
          if (moved) { anchor(); written = null; onMoved(); }
          const text = textFn();
          if (!ta || !text) return false;
          const lead = before && !/\s$/.test(before) ? ' ' : '';
          const trail = after && !/^\s/.test(after) ? ' ' : '';
          const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
          setter.call(ta, before + lead + text + trail + after);
          ta.dispatchEvent(new Event('input', { bubbles: true }));
          written = ta.value;
          const pos = (before + lead + text).length;
          try { ta.setSelectionRange(pos, pos); } catch (_) {}
          return true;
        };
      }

      const WORKLET = `registerProcessor('stt-pcm', class extends AudioWorkletProcessor {
        constructor() { super(); this.buf = []; }
        process(inputs) {
          const ch = inputs[0] && inputs[0][0];
          if (ch) for (let i = 0; i < ch.length; i++) this.buf.push(Math.max(-1, Math.min(1, ch[i])) * 0x7fff);
          if (this.buf.length >= sampleRate / 10) { this.port.postMessage(Int16Array.from(this.buf).buffer); this.buf = []; }
          return true;
        }
      });`;

      async function startLive(token) {
        const ctx = new AudioContext({ sampleRate: 16000 });
        const url = URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' }));
        try {
          await ctx.audioWorklet.addModule(url);
          await ctx.resume();
        } catch (e) {
          ctx.close().catch(() => {});
          throw e;
        } finally { URL.revokeObjectURL(url); }
        const params = new URLSearchParams({
          token, speech_model: 'universal-3-5-pro', encoding: 'pcm_s16le',
          sample_rate: String(ctx.sampleRate), prompt: conversationContext(),
          // Dictation pauses mid-sentence to think; wait longer before ending a
          // phrase so fewer pauses become full stops. The grammar button fixes
          // the ones that remain.
          min_turn_silence: '1500', max_turn_silence: '4000',
        });
        const ws = new WebSocket(`${LIVE_URL}?${params}`);
        ws.binaryType = 'arraybuffer';
        const node = new AudioWorkletNode(ctx, 'stt-pcm');
        const src = ctx.createMediaStreamSource(stream);
        let committed = [], partial = '';
        const write = liveWriter(() => { committed = []; });
        const show = () => write(() => [...committed, partial].filter(Boolean).join(' '));
        node.port.onmessage = (e) => { if (ws.readyState === 1) ws.send(e.data); };
        ws.onmessage = (e) => {
          let m;
          try { m = JSON.parse(e.data); } catch (_) { return; }
          if (m.type === 'Turn') {
            const text = (m.transcript || '').trim();
            if (m.end_of_turn) { if (text) committed.push(text); partial = ''; } else partial = text;
            show();
          }
        };
        live = { ws, ctx, src, node, write, ending: false, text: () => [...committed, partial].filter(Boolean).join(' ') };
        await new Promise((ok, fail) => {
          ws.onopen = ok;
          ws.onerror = () => fail(new Error('could not reach the live dictation service'));
        });
        src.connect(node);
        ws.onclose = (e) => {
          const was = live;
          if (was && was.ending) { finishLive(was); return; }
          endLive();
          if (was) toast(`Dictation stopped${e.reason ? ` (${e.reason})` : ''}.`);
        };
        live.ctxTimer = setInterval(() => {
          if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'UpdateConfiguration', prompt: conversationContext() }));
        }, 60 * 1000);
      }

      function endLive() {
        const l = live;
        live = null;
        if (l) {
          clearInterval(l.ctxTimer);
          try { l.src.disconnect(); l.node.disconnect(); } catch (_) {}
          l.ctx.close().catch(() => {});
          if (l.ws.readyState <= 1) try { l.ws.close(); } catch (_) {}
        }
        stream?.getTracks().forEach((t) => t.stop());
        stream = null;
        setState('idle');
      }

      function finishLive(l) {
        if (live === l) endLive();
      }

      // The grammar button: the whole chat box goes to the grammar service (pauses
      // transcribed as full stops, missing punctuation, mis-heard names from the
      // chat) and comes back in place. Nothing changes if the box was edited meanwhile.
      // The service sits behind Cloudflare Access on its own host; without its
      // sign-in cookie the call fails, so a small sign-in window opens once.
      const fix = document.createElement('button');
      fix.id = 'stt-fix';
      fix.type = 'button';
      fix.textContent = 'Aa';
      fix.title = 'Fix grammar in the chat box';
      fix.setAttribute('aria-label', 'Fix grammar in the chat box');
      fix.addEventListener('mousedown', (e) => e.preventDefault());
      fix.addEventListener('click', async (e) => {
        e.preventDefault();
        if (fix.dataset.busy) return;
        const ta = field();
        const text = ta?.value.trim();
        if (!text) { toast('Nothing in the chat box to fix.'); return; }
        fix.dataset.busy = '1';
        try {
          // The grammar API shares this site's Access app, so sign-in sets its
          // cookie too and the call needs no sign-in of its own. A session from
          // before that sharing lacks the cookie until the next sign-in.
          let r;
          try {
            r = await fetch(GRAMMAR_URL, {
              method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text, context: conversationContext() }),
            });
          } catch (_) {
            toast('Grammar fix needs a fresh sign-in: sign out of SS chat and back in once.', 6000);
            return;
          }
          const doc = await r.json().catch(() => ({}));
          if (!r.ok || !doc.text) throw new Error(doc.error || `HTTP ${r.status}`);
          if (ta.value.trim() !== text) { toast('Chat box changed, so the fix was not applied.'); return; }
          const setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
          setter.call(ta, doc.text);
          ta.dispatchEvent(new Event('input', { bubbles: true }));
          ta.focus();
          try { ta.setSelectionRange(doc.text.length, doc.text.length); } catch (_) {}
        } catch (err) {
          toast(`Grammar fix failed (${err.message}).`);
        } finally {
          delete fix.dataset.busy;
        }
      });

      function stop() {
        const l = live;
        if (!l || l.ending) return;
        l.ending = true;
        try { l.src.disconnect(); } catch (_) {}
        setState('busy');
        // Terminate flushes the last words; the server then closes the socket.
        try { l.ws.send(JSON.stringify({ type: 'Terminate' })); } catch (_) {}
        setTimeout(() => finishLive(l), 4000);
      }

      async function start() {
        setState('busy');
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        } catch (e) {
          setState('idle');
          toast('Microphone blocked. Allow it for this site in the browser settings.');
          return;
        }
        const token = await takePass();
        if (!token) {
          endLive();
          toast(`Dictation unavailable (${passError || 'no pass'}).`);
          return;
        }
        try {
          await startLive(token);
        } catch (e) {
          if (live) live.ending = true;
          endLive();
          toast(`Dictation unavailable (${e.message}).`);
          return;
        }
        startedAt = Date.now();
        setState('rec');
        const tick = () => {
          const s = Math.floor((Date.now() - startedAt) / 1000);
          for (const b of micButtons()) b.title = `Stop dictating (${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')})`;
          if (Date.now() - startedAt > LIVE_MAX_MS) stop();
        };
        tick();
        timer = setInterval(tick, 500);
      }

      function tap() {
        if (state === 'idle') start();
        else if (state === 'rec') stop();
      }

      // Take over big-AGI's mic: its own speech engine never starts. Capture-phase
      // listeners on document run before React's handlers on the app root.
      document.addEventListener('click', (e) => {
        const b = e.target instanceof Element ? e.target.closest('button') : null;
        if (!isMic(b)) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        tap();
      }, true);
      document.addEventListener('keydown', (e) => {
        if (!(e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'm')) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        tap();
      }, true);

      // Keep the Aa button right after the composer's mic button, styled like it,
      // and the mic's state shown, as React re-renders the composer.
      let queued = false;
      function sync() {
        queued = false;
        const mic = micButtons().find((b) => b.offsetParent);
        if (mic && mic.nextElementSibling !== fix) {
          fix.className = mic.className.replace(/\bstt-mic-\w+/g, '');
          mic.after(fix);
        }
        paint();
      }
      new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(sync); } })
        .observe(document.documentElement, { childList: true, subtree: true });

      setState('idle');
      sync();
    })();
  nav.js: |
    // Trims big-AGI down to chat, adds an admin button that shows the Hermes
    // console beside it, and brands the tab as SS chat with the Simple Salt mark.
    // Hidden: the Call app, the Apps & Tools menu, the Discord and GitHub
    // links, and the Beam and Call buttons by the chat box. On phones an Admin
    // link in the drawer opens the console at /admin in a new tab. big-AGI
    // re-renders its nav freely, so hiding is CSS and our buttons are re-added
    // whenever they go missing.
    (() => {
      if (window.__ssNav) return;
      window.__ssNav = true;
      const HERMES_URL = '/admin/';
      const ICON = '<path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/>';
      const TITLE = 'SS chat';
      // The Simple Salt mark: a hollow square in the brand blue, as on simple-salt.com.
      const FAVICON = 'data:image/svg+xml,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="9" y="9" width="82" height="82" fill="none" stroke="#5c99ad" stroke-width="18"/></svg>');

      // The shortcuts bar above the chat box starts off, once per browser, so
      // turning it back on in Settings > Labs sticks. This runs before big-AGI
      // reads its stored settings.
      try {
        if (!localStorage.getItem('ss-defaults-v1')) {
          const doc = JSON.parse(localStorage.getItem('app-ux-labs') || 'null') || { state: {}, version: 2 };
          doc.state = { ...(doc.state || {}), labsShowShortcutBar: false };
          localStorage.setItem('app-ux-labs', JSON.stringify(doc));
          localStorage.setItem('ss-defaults-v1', '1');
        }
      } catch (_) {}

      const style = document.createElement('style');
      style.textContent = `
        a[href*="discord.gg"],a[href*="github.com/enricoros"],
        #desktop-nav .NavButton-typeApp:has([data-testid^="Call"]),
        #desktop-nav .NavButton-typeApp[aria-haspopup],
        #desktop-nav .MuiDivider-root,
        #mobile-nav button:not([aria-label^="Chat"]),
        button:has([data-testid="CallIcon"]),button:has(path[d="M 4,12 14,9"]),
        .ss-nav-hidden{display:none!important}
        #ss-admin-pane{position:fixed;top:0;right:0;bottom:0;left:var(--ss-nav-w,64px);z-index:1100;background:#fff}
        #ss-admin-pane[hidden]{display:none}
        #ss-admin-pane iframe{width:100%;height:100%;border:0;display:block}
        .ss-admin-open #desktop-nav .NavButton-active:not(.ss-admin){background:transparent!important;color:inherit!important}`;
      (document.head || document.documentElement).appendChild(style);

      // Admin: a button beside Chat that opens the Hermes console in a pane over
      // the chat area. The pane stays loaded while hidden; any other nav button
      // closes it.
      let pane = null;
      function setAdmin(open) {
        if (open && !pane) {
          pane = document.createElement('div');
          pane.id = 'ss-admin-pane';
          pane.innerHTML = '<iframe src="/admin/" title="Admin"></iframe>';
          document.body.appendChild(pane);
        }
        if (pane) pane.hidden = !open;
        document.documentElement.classList.toggle('ss-admin-open', open);
      }
      document.addEventListener('pointerdown', (e) => {
        const b = e.target.closest && e.target.closest('#desktop-nav button, #desktop-nav a');
        if (b && !b.classList.contains('ss-admin')) setAdmin(false);
      }, true);

      function desktopAdmin() {
        const nav = document.getElementById('desktop-nav');
        if (!nav) return;
        document.documentElement.style.setProperty('--ss-nav-w', nav.getBoundingClientRect().right + 'px');
        const chat = nav.querySelector('.NavButton-typeApp:not(.ss-admin)');
        const gear = nav.lastElementChild && nav.lastElementChild.querySelector('button.NavButton-typeLink:not(.NavButton-active)');
        if (!chat || !gear) return;
        let btn = nav.querySelector('.ss-admin');
        if (!btn) {
          btn = document.createElement('button');
          btn.type = 'button';
          btn.title = 'admin';
          btn.setAttribute('aria-label', 'admin');
          const svg = chat.querySelector('svg');
          btn.innerHTML = `<svg class="${svg ? svg.getAttribute('class') : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICON}</svg>`;
          btn.addEventListener('click', () => setAdmin(!document.documentElement.classList.contains('ss-admin-open')));
        }
        if (btn.previousElementSibling !== chat) chat.after(btn);
        // Open: looks like the active Chat button. Closed: like an idle nav button.
        const open = document.documentElement.classList.contains('ss-admin-open');
        const look = open && /NavButton-active/.test(chat.className)
          ? chat.className
          : gear.className.replace('NavButton-typeLink', 'NavButton-typeApp');
        const want = look.replace(/\s*ss-\S+/g, '') + ' ss-admin';
        if (btn.className !== want) btn.className = want;
      }

      // Mobile drawer: keep only the Chat app, drop the News and Models buttons
      // (text only, no other mark), and put Hermes where Discord was.
      function mobileItems() {
        document.querySelectorAll('nav.MuiButtonGroup-root > button').forEach((b) => {
          if (!b.closest('#desktop-nav') && !/^\s*Chat/.test(b.innerText)) b.classList.add('ss-nav-hidden');
        });
        document.querySelectorAll('#mobile-drawer button').forEach((b) => {
          if (/^\s*(News|Models)\s*$/.test(b.textContent)) b.classList.add('ss-nav-hidden');
        });
        const discord = [...document.querySelectorAll('a[href*="discord.gg"]')].find((d) => !d.closest('#desktop-nav'));
        if (!discord || discord.parentElement.querySelector('.ss-hermes-m')) return;
        const a = document.createElement('a');
        a.className = discord.className + ' ss-hermes-m';
        a.href = HERMES_URL;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Admin';
        discord.parentElement.insertBefore(a, discord);
      }

      // Tab title and icon. big-AGI sets both itself, so they are put back each time.
      function tab() {
        if (document.title !== TITLE) document.title = TITLE;
        const icons = document.querySelectorAll('link[rel~="icon"]');
        if (icons.length === 1 && icons[0].getAttribute('href') === FAVICON) return;
        icons.forEach((l) => l.remove());
        const l = document.createElement('link');
        l.rel = 'icon';
        l.type = 'image/svg+xml';
        l.href = FAVICON;
        document.head.appendChild(l);
      }

      let queued = false;
      const run = () => {
        queued = false;
        try { tab(); desktopAdmin(); mobileItems(); } catch (_) {}
      };
      const start = () => {
        run();
        const mo = new MutationObserver(() => {
          if (!queued) { queued = true; requestAnimationFrame(run); }
        });
        mo.observe(document.body, { childList: true, subtree: true });
        mo.observe(document.head, { childList: true, subtree: true, characterData: true });
      };
      if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
    })();
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: big-agi
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: big-agi
  template:
    metadata:
      labels:
        app: big-agi
        entity: ssint
        env: main
        capability: ai
      annotations:
        gate-script-sha: 60cec192b6634ac6
    spec:
      containers:
        - name: big-agi
          image: ghcr.io/enricoros/big-agi:latest
          imagePullPolicy: Always
          ports:
            - name: app
              containerPort: 3000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_BEARER_TOKEN
            - name: OPENAI_API_HOST
              value: "http://hermes-proxy:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
        - name: gate
          image: python:3.12-alpine
          command: ["python", "/scripts/gate.py"]
          ports:
            - name: http
              containerPort: 3080
          env:
            - name: UPSTREAM_PORT
              value: "3000"
            - name: PORT
              value: "3080"
          volumeMounts:
            - name: gate-script
              mountPath: /scripts
          readinessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: gate-script
          configMap:
            name: big-agi-gate-script
---
