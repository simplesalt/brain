---
apiVersion: v1
kind: Namespace
metadata:
  name: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
---
# Filled by a person out of band, key ASSEMBLYAI_API_KEY; Flux merges so
# reconciliation never wipes the value. stt-proxy stays unready until it is.
apiVersion: v1
kind: Secret
metadata:
  name: assemblyai-api-key
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stt-proxy-script
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
data:
  stt.py: |
    #!/usr/bin/env python3
    # Live dictation passes for the big-AGI mic. /token hands a browser signed in
    # through Cloudflare Access (its JWT is verified below) a single-use AssemblyAI
    # streaming pass, so the mic streams audio straight to AssemblyAI; the key
    # never leaves the cluster and no audio passes through here.
    # /tidy fixes the finished dictation's punctuation and grammar (pauses get
    # transcribed as full stops) with an LLM on AssemblyAI's LLM Gateway, same key.
    # /healthz is unready until the key is filled; the key is re-read from the
    # mounted Secret, so the pod turns ready on its own once a person fills it.
    import base64, hashlib, hmac, json, os, threading, time, http.server, urllib.error, urllib.request

    PORT = int(os.environ.get('PORT', '8000'))
    JWT_HEADER = 'Cf-Access-Jwt-Assertion'
    ACCESS_TEAM = os.environ.get('ACCESS_TEAM_DOMAIN', '').rstrip('/')
    ACCESS_AUD = os.environ.get('ACCESS_AUD', '')
    AAI_KEY_PATH = os.environ.get('AAI_KEY_PATH', '/secrets-aai/ASSEMBLYAI_API_KEY')
    AAI_TOKEN_URL = os.environ.get('AAI_TOKEN_URL', 'https://streaming.assemblyai.com/v3/token')
    # AssemblyAI caps the unused-pass window at 600 s; the browser refreshes it before then.
    AAI_PASS_SECONDS = int(os.environ.get('AAI_PASS_SECONDS', '600'))
    AAI_SESSION_SECONDS = int(os.environ.get('AAI_SESSION_SECONDS', '3600'))
    TIDY_URL = os.environ.get('TIDY_URL', 'https://llm-gateway.assemblyai.com/v1/chat/completions')
    TIDY_MODEL = os.environ.get('TIDY_MODEL', 'gemini-2.5-flash-lite')
    MAX_TIDY_BYTES = 64 * 1024
    TIDY_SYSTEM = (
        'You fix dictated text. The user message gives recent chat context, then a speech-to-text '
        'transcript of one chat message the speaker dictated. The speaker pauses to think, and pauses '
        'were often transcribed as full stops. Fix punctuation, capitalization, sentence boundaries and '
        'grammar so it reads as the speaker meant it. Keep the speaker\'s words, wording and meaning: do '
        'not add, drop, rephrase, answer or summarize anything. Change a word only when it is clearly a '
        'mis-hearing of a name or term from the context. Reply with the corrected transcript only.'
    )

    def assemblyai_key():
        """The key, read from the mounted Secret on each use so a fill or rotation applies without a restart."""
        try:
            with open(AAI_KEY_PATH) as f:
                return f.read().strip()
        except OSError:
            return ''

    def streaming_pass():
        """Mint a single-use AssemblyAI streaming token, or raise."""
        url = f'{AAI_TOKEN_URL}?expires_in_seconds={AAI_PASS_SECONDS}&max_session_duration_seconds={AAI_SESSION_SECONDS}'
        r = urllib.request.Request(url, headers={'Authorization': assemblyai_key()})
        with urllib.request.urlopen(r, timeout=15) as resp:
            doc = json.load(resp)
        token = doc.get('token')
        if not isinstance(token, str) or not token:
            raise RuntimeError('no token in AssemblyAI response')
        return {'token': token, 'pass_seconds': AAI_PASS_SECONDS, 'session_seconds': AAI_SESSION_SECONDS}

    def tidy(text, context):
        """Return text with punctuation and grammar fixed, or raise."""
        body = {
            'model': TIDY_MODEL,
            'temperature': 0,
            'max_tokens': 4000,
            'messages': [
                {'role': 'system', 'content': TIDY_SYSTEM},
                {'role': 'user', 'content': f'Context:\n{context[-4000:]}\n\nTranscript:\n{text}'},
            ],
        }
        r = urllib.request.Request(TIDY_URL, data=json.dumps(body).encode(), method='POST',
                                   headers={'Authorization': assemblyai_key(), 'Content-Type': 'application/json'})
        with urllib.request.urlopen(r, timeout=30) as resp:
            doc = json.load(resp)
        out = ((doc.get('choices') or [{}])[0].get('message') or {}).get('content')
        if not isinstance(out, str) or not out.strip():
            raise RuntimeError('no text in LLM Gateway response')
        return out.strip()

    _SHA256_PREFIX = bytes.fromhex('3031300d060960864801650304020105000420')
    _keys, _keys_at, _keys_lock = {}, 0.0, threading.Lock()

    def _b64(s):
        return base64.urlsafe_b64decode(s + '=' * (-len(s) % 4))

    def _jwks(force=False):
        global _keys, _keys_at
        with _keys_lock:
            age = time.time() - _keys_at
            if age < 60 or (_keys and age < 3600 and not force):
                return _keys
            try:
                with urllib.request.urlopen(ACCESS_TEAM + '/cdn-cgi/access/certs', timeout=10) as r:
                    doc = json.load(r)
                _keys = {k['kid']: (int.from_bytes(_b64(k['n']), 'big'), int.from_bytes(_b64(k['e']), 'big'))
                         for k in doc.get('keys', []) if k.get('kty') == 'RSA'}
                _keys_at = time.time()
            except Exception as e:
                _keys_at = time.time()
                print(f'stt-proxy: Access certs fetch failed: {e}', flush=True)
            return _keys

    def _rs256_ok(key, signed, sig):
        n, e = key
        k = (n.bit_length() + 7) // 8
        if len(sig) != k:
            return False
        em = pow(int.from_bytes(sig, 'big'), e, n).to_bytes(k, 'big')
        t = _SHA256_PREFIX + hashlib.sha256(signed).digest()
        want = b'\x00\x01' + b'\xff' * (k - len(t) - 3) + b'\x00' + t
        return hmac.compare_digest(em, want)

    def verify_access_jwt(token):
        """Return the claims of a verified Cloudflare Access JWT that names an email, else None."""
        if not (token and ACCESS_TEAM and ACCESS_AUD) or token.count('.') != 2:
            return None
        try:
            h64, p64, s64 = token.split('.')
            head, claims = json.loads(_b64(h64)), json.loads(_b64(p64))
            if head.get('alg') != 'RS256':
                return None
            key = _jwks().get(head.get('kid')) or _jwks(force=True).get(head.get('kid'))
            if not key or not _rs256_ok(key, (h64 + '.' + p64).encode(), _b64(s64)):
                return None
            now = time.time()
            aud = claims.get('aud')
            aud = aud if isinstance(aud, list) else [aud]
            if claims.get('iss') != ACCESS_TEAM or ACCESS_AUD not in aud:
                return None
            if claims.get('exp', 0) < now - 30 or claims.get('nbf', 0) > now + 30:
                return None
            email = claims.get('email')
            return claims if isinstance(email, str) and '@' in email else None
        except Exception:
            return None

    class Handler(http.server.BaseHTTPRequestHandler):
        timeout = 180
        def log_message(self, *a): pass

        def _reply(self, status, doc):
            out = json.dumps(doc).encode()
            self.send_response(status)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Cache-Control', 'no-store')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def do_GET(self):
            if self.path.split('?', 1)[0] == '/token':
                self._token()
            elif self.path != '/healthz':
                self._reply(404, {'error': 'not found'})
            elif not assemblyai_key():
                self._reply(503, {'ok': False, 'error': 'AssemblyAI key not filled'})
            else:
                self._reply(200, {'ok': True})

        def _token(self):
            if not verify_access_jwt(self.headers.get(JWT_HEADER, '')):
                self._reply(401, {'error': 'not signed in'})
                return
            if not assemblyai_key():
                self._reply(503, {'error': 'live dictation key not filled'})
                return
            try:
                self._reply(200, streaming_pass())
            except urllib.error.HTTPError as e:
                detail = e.read()[:500].decode('utf-8', 'replace')
                print(f'stt-proxy: AssemblyAI token HTTP {e.code}: {detail}', flush=True)
                self._reply(502, {'error': f'live dictation service answered {e.code}'})
            except Exception as e:
                print(f'stt-proxy: AssemblyAI token failed: {e}', flush=True)
                self._reply(502, {'error': 'live dictation pass failed'})

        def do_POST(self):
            if self.path.split('?', 1)[0] != '/tidy':
                self._reply(404, {'error': 'not found'})
                return
            n = int(self.headers.get('Content-Length', 0) or 0)
            if n > MAX_TIDY_BYTES:
                self._reply(413, {'error': 'dictation too long to tidy'})
                return
            raw = self.rfile.read(n) if n else b''
            if not verify_access_jwt(self.headers.get(JWT_HEADER, '')):
                self._reply(401, {'error': 'not signed in'})
                return
            if not assemblyai_key():
                self._reply(503, {'error': 'live dictation key not filled'})
                return
            try:
                doc = json.loads(raw or b'{}')
                text, context = str(doc.get('text') or '').strip(), str(doc.get('context') or '')
            except Exception:
                self._reply(400, {'error': 'bad request'})
                return
            if not text:
                self._reply(400, {'error': 'no text'})
                return
            try:
                self._reply(200, {'text': tidy(text, context)})
            except urllib.error.HTTPError as e:
                detail = e.read()[:500].decode('utf-8', 'replace')
                print(f'stt-proxy: LLM Gateway HTTP {e.code}: {detail}', flush=True)
                self._reply(502, {'error': f'grammar pass answered {e.code}'})
            except Exception as e:
                print(f'stt-proxy: grammar pass failed: {e}', flush=True)
                self._reply(502, {'error': 'grammar pass failed'})

    if __name__ == '__main__':
        srv = http.server.ThreadingHTTPServer(('0.0.0.0', PORT), Handler)
        print(f'stt-proxy :{PORT}' + ('' if assemblyai_key() else
              ' (unready: secret assemblyai-api-key is not filled)'), flush=True)
        srv.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-proxy
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt-proxy
  template:
    metadata:
      labels:
        app: stt-proxy
        entity: ssint
        env: main
        capability: voice
      # The script is read only at start; its hash here restarts the pod when it changes.
      annotations:
        stt-script-sha: 087b85681276fd82
    spec:
      containers:
        - name: stt-proxy
          image: python:3.12-alpine
          command: ["python", "/scripts/stt.py"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: ACCESS_TEAM_DOMAIN
              value: "https://fqurzlaaagt.cloudflareaccess.com"
            - name: ACCESS_AUD
              value: "afcfa282e581c698462ed0073e0d497979eb6e5d737548dcea72e2e2a643102c"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: aai-key
              mountPath: /secrets-aai
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: stt-proxy-script
        - name: aai-key
          secret:
            secretName: assemblyai-api-key
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: stt-proxy
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
spec:
  selector:
    app: stt-proxy
  ports:
    - name: http
      port: 8000
      targetPort: 8000
