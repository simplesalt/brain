---
apiVersion: v1
kind: ConfigMap
metadata:
  name: winshell-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  start.sh: |
    set -eu
    apk add --no-cache ttyd bash python3 py3-pip netcat-openbsd bind-tools ca-certificates su-exec
    python3 -m venv /opt/venv
    /opt/venv/bin/pip install --no-cache-dir --disable-pip-version-check impacket==0.13.1
    adduser -D -u 1000 operator
    install -m 644 /scripts/profile.sh /etc/profile.d/winshell.sh
    exec su-exec operator ttyd --port 7681 --writable --max-clients 2 bash -l

  profile.sh: |
    export PATH=/opt/venv/bin:$PATH
    printf '\n  winshell -- impacket over SMB/RPC to the LAN\n\n'
    printf '  target   %s\n' "${WINSHELL_TARGET:-<unset>}"
    printf '  shell    wmiexec.py '"'"'DESKTOP/<user>@%s'"'"'\n' "${WINSHELL_TARGET:-<host>}"
    printf '  verify   smbclient.py '"'"'DESKTOP/<user>@%s'"'"'  then: shares / use ADMIN$\n' "${WINSHELL_TARGET:-<host>}"
    printf '  fallback smbexec.py | psexec.py | atexec.py\n'
    printf '  reach    nc -z -w2 %s 445\n\n' "${WINSHELL_TARGET:-<host>}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: winshell
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: winshell
  template:
    metadata:
      labels:
        app: winshell
        entity: ssint
        env: main
        capability: ai
    spec:
      containers:
        - name: winshell
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/start.sh"]
          ports:
            - name: http
              containerPort: 7681
          env:
            - name: WINSHELL_TARGET
              value: "192.168.1.196"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 7681
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 7681
            initialDelaySeconds: 360
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: script
          configMap:
            name: winshell-script
---
apiVersion: v1
kind: Service
metadata:
  name: winshell
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: winshell
  ports:
    - name: http
      port: 7681
      targetPort: 7681
