apiVersion: v1
kind: ConfigMap
metadata:
  name: gbrain-rehearsal-version
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  GBRAIN_REHEARSAL_SHA: "23fdb464a944cb95ec9e55ddaec68f7abdd8b3dc"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gbrain-pg-rehearsal
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
    resiliency.simplesalt.company/ha: exempt
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
  bootstrap:
    initdb:
      database: gbrain
      owner: gbrain
      encoding: UTF8
      localeCollate: C
      localeCType: C
      import:
        type: microservice
        databases:
          - gbrain
        source:
          externalCluster: gbrain-pg-source
        postImportApplicationSQL:
          - CREATE EXTENSION IF NOT EXISTS vector;
          - CREATE EXTENSION IF NOT EXISTS pg_trgm;
          - CREATE EXTENSION IF NOT EXISTS pgcrypto;
  externalClusters:
    - name: gbrain-pg-source
      connectionParameters:
        host: gbrain-pg-rw
        user: gbrain
        dbname: gbrain
      password:
        name: gbrain-pg-app
        key: password
  managed:
    roles:
      - name: gbrain
        ensure: present
        login: true
        superuser: true
        bypassrls: true
        passwordSecret:
          name: gbrain-pg-rehearsal-app
  storage:
    size: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gbrain-rehearsal
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gbrain-rehearsal
  template:
    metadata:
      annotations:
        simplesalt.company/restart-epoch: "4"
      labels:
        app: gbrain-rehearsal
        entity: ssint
        env: main
        capability: ai
    spec:
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              until pg_isready -h gbrain-pg-rehearsal-rw -p 5432; do
                i=$((i + 1))
                if [ "$i" -ge 450 ]; then echo "FATAL: gbrain-pg-rehearsal-rw:5432 not ready after 900s"; exit 1; fi
                echo "waiting for gbrain-pg-rehearsal-rw:5432"
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: install-gbrain
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              GBRAIN_SHA="${GBRAIN_REHEARSAL_SHA:?GBRAIN_REHEARSAL_SHA is unset}"
              echo "installing gbrain at ${GBRAIN_SHA}"
              if [ ! -x /install/bin/gbrain ]; then
                BUN_INSTALL=/install bun install -g "github:garrytan/gbrain#${GBRAIN_SHA}" \
                  || { echo "FATAL: gbrain install failed"; exit 1; }
              fi
          env:
            - name: GBRAIN_REHEARSAL_SHA
              valueFrom:
                configMapKeyRef:
                  name: gbrain-rehearsal-version
                  key: GBRAIN_REHEARSAL_SHA
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
      containers:
        - name: gbrain
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PATH="/install/bin:$PATH"
              if [ -x /install/bin/gbrain ] && /install/bin/gbrain --version >/dev/null 2>&1; then
                GBRAIN="/install/bin/gbrain"
              else
                CLI="$(find /install -maxdepth 8 -path '*/gbrain/src/cli.ts' 2>/dev/null | head -1)"
                if [ -z "$CLI" ]; then
                  echo "FATAL: gbrain CLI not found. /install layout:"
                  ls -la /install /install/bin 2>&1
                  find /install -maxdepth 8 -name cli.ts 2>/dev/null | head
                  sleep 120; exit 1
                fi
                GBRAIN="bun $CLI"
              fi
              echo "Using gbrain command: $GBRAIN"
              $GBRAIN init --non-interactive \
                || $GBRAIN init --migrate-only \
                || echo "WARN: gbrain init failed; serve may not work correctly"
              $GBRAIN config set mcp.publish_advisor true \
                || echo "WARN: config set mcp.publish_advisor failed (non-fatal)"
              $GBRAIN config set memory.auto_writeback salient \
                || echo "WARN: config set memory.auto_writeback failed (non-fatal)"
              $GBRAIN config set search.reranker.model voyage:rerank-2.5 \
                || echo "WARN: config set search.reranker.model failed (non-fatal)"
              $GBRAIN config set facts.extraction_model openrouter:openai/gpt-oss-120b \
                || echo "WARN: config set facts.extraction_model failed (non-fatal)"
              $GBRAIN config set cycle.conversation_facts_backfill.enabled true \
                || echo "WARN: config set cycle.conversation_facts_backfill.enabled failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.enabled false \
                || echo "WARN: config set cycle.enrich_thin.enabled failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.max_cost_usd 1000000 \
                || echo "WARN: config set cycle.enrich_thin.max_cost_usd failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.max_total_cost_usd 1000000 \
                || echo "WARN: config set cycle.enrich_thin.max_total_cost_usd failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.max_pages_per_tick 25 \
                || echo "WARN: config set cycle.enrich_thin.max_pages_per_tick failed (non-fatal)"
              $GBRAIN config set autopilot.incremental_extract_include_frontmatter true \
                || echo "WARN: config set autopilot.incremental_extract_include_frontmatter failed (non-fatal)"
              bun -e '
                import { SQL } from "bun";
                const t = process.env.GBRAIN_REMOTE_TOKEN;
                if (!t) { console.error("FATAL: GBRAIN_REMOTE_TOKEN unset"); process.exit(1); }
                const h = new Bun.CryptoHasher("sha256").update(t).digest("hex");
                const db = new SQL(process.env.DATABASE_URL);
                await db`INSERT INTO access_tokens (name, token_hash) VALUES (${"hermes-mcp"}, ${h}) ON CONFLICT (token_hash) DO NOTHING`;
                await db.end();
                console.log("gbrain: hermes-mcp bearer asserted");
              ' || echo "WARN: token seed failed; hermes /mcp calls will 401"
              exec $GBRAIN serve --http --bind 0.0.0.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: uri
            - name: GBRAIN_CHAT_MODEL
              value: openrouter:minimax/minimax-m2.7
            - name: GBRAIN_CHAT_FALLBACK_CHAIN
              value: openrouter:openai/gpt-oss-120b
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: GBRAIN_EMBEDDING_MODEL
              value: openai:text-embedding-3-small
            - name: GBRAIN_EMBEDDING_DIMENSIONS
              value: "1536"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-embedding-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: VOYAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-reranker-secret
                  key: VOYAGE_API_KEY
                  optional: true
            - name: GBRAIN_REMOTE_TOKEN
              value: "gbrain-mcp"
            - name: GBRAIN_HTTP_CORS_ORIGIN
              value: "http://localhost:3131"
          ports:
            - name: mcp
              containerPort: 3131
          startupProbe:
            periodSeconds: 10
            failureThreshold: 200
            httpGet:
              path: /health
              port: 3131
          livenessProbe:
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
            httpGet:
              path: /health
              port: 3131
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
            httpGet:
              path: /health
              port: 3131
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
        - name: autopilot
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PATH="/install/bin:$PATH"
              for i in $(seq 1 60); do
                if [ -x /install/bin/gbrain ] && /install/bin/gbrain --version >/dev/null 2>&1; then
                  GBRAIN="/install/bin/gbrain"; break
                fi
                CLI="$(find /install -maxdepth 8 -path '*/gbrain/src/cli.ts' 2>/dev/null | head -1)"
                if [ -n "$CLI" ]; then GBRAIN="bun $CLI"; break; fi
                echo "autopilot: waiting for gbrain install ($i)"; sleep 5
              done
              if [ -z "$GBRAIN" ]; then echo "FATAL: gbrain CLI not found for autopilot"; sleep 120; exit 1; fi
              echo "autopilot using: $GBRAIN"
              CLI="$(find /install -maxdepth 8 -path '*/gbrain/src/cli.ts' 2>/dev/null | head -1)"
              if [ -n "$CLI" ]; then
                printf '#!/bin/sh\nexec bun %s "$@"\n' "$CLI" > /usr/local/bin/gbrain
                chmod +x /usr/local/bin/gbrain
                GBRAIN=/usr/local/bin/gbrain
              fi
              exec $GBRAIN autopilot --repo /tmp --interval 60
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: uri
            - name: GBRAIN_CHAT_MODEL
              value: openrouter:minimax/minimax-m2.7
            - name: GBRAIN_CHAT_FALLBACK_CHAIN
              value: openrouter:openai/gpt-oss-120b
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: GBRAIN_EMBEDDING_MODEL
              value: openai:text-embedding-3-small
            - name: GBRAIN_EMBEDDING_DIMENSIONS
              value: "1536"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-embedding-secret
                  key: OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
      volumes:
        - name: gbrain-install
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gbrain-rehearsal
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: gbrain-rehearsal
  ports:
    - name: mcp
      port: 3131
      targetPort: 3131
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-rehearsal-runner-20261027b
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-rehearsal-runner
        entity: ssint
        env: main
        capability: ai
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              until pg_isready -h gbrain-pg-rehearsal-rw -p 5432; do
                i=$((i + 1))
                if [ "$i" -ge 450 ]; then echo "FATAL: gbrain-pg-rehearsal-rw:5432 not ready after 900s"; exit 1; fi
                echo "waiting for gbrain-pg-rehearsal-rw:5432"
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: install-gbrain
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              GBRAIN_SHA="${GBRAIN_REHEARSAL_SHA:?GBRAIN_REHEARSAL_SHA is unset}"
              echo "installing gbrain at ${GBRAIN_SHA}"
              if [ ! -x /install/bin/gbrain ]; then
                BUN_INSTALL=/install bun install -g "github:garrytan/gbrain#${GBRAIN_SHA}" \
                  || { echo "FATAL: gbrain install failed"; exit 1; }
              fi
          env:
            - name: GBRAIN_REHEARSAL_SHA
              valueFrom:
                configMapKeyRef:
                  name: gbrain-rehearsal-version
                  key: GBRAIN_REHEARSAL_SHA
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
      containers:
        - name: runner
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PATH="/install/bin:$PATH"
              MODE="${RUNNER_MODE:-inspect}"
              case "$MODE" in
                inspect|apply-repairs|upgrade) ;;
                *) echo "FATAL: RUNNER_MODE must be inspect, apply-repairs or upgrade (got: $MODE)"; exit 1 ;;
              esac
              case "${DATABASE_URL#*@}" in
                gbrain-pg-rehearsal-rw*) ;;
                *) echo "FATAL: DATABASE_URL does not target gbrain-pg-rehearsal-rw; refusing to run"; exit 1 ;;
              esac

              if [ -x /install/bin/gbrain ] && /install/bin/gbrain --version >/dev/null 2>&1; then
                GBRAIN="/install/bin/gbrain"
              else
                CLI="$(find /install -maxdepth 8 -path '*/gbrain/src/cli.ts' 2>/dev/null | head -1)"
                if [ -z "$CLI" ]; then
                  echo "FATAL: gbrain CLI not found. /install layout:"
                  ls -la /install /install/bin 2>&1
                  exit 1
                fi
                GBRAIN="bun $CLI"
              fi

              mkdir -p /work
              cat > /work/q.ts <<'EOF'
              import { SQL } from "bun";

              const text = process.argv[2] ?? "";
              if (!/^\s*(select|show|with)\b/i.test(text) || /;\s*\S/.test(text)) {
                console.log("REFUSED (read-only inspection runs a single SELECT, SHOW or WITH only): " + text);
                process.exit(1);
              }

              const show = (v: unknown): string => {
                if (v === null || v === undefined) return "(null)";
                if (v instanceof Date) return v.toISOString();
                if (typeof v === "object") return JSON.stringify(v, (_k, x) => (typeof x === "bigint" ? x.toString() : x));
                return String(v);
              };

              const db = new SQL(process.env.DATABASE_URL as string);
              try {
                const rows = await db.begin(async (tx) => {
                  await tx.unsafe("SET TRANSACTION READ ONLY");
                  await tx.unsafe("SET LOCAL statement_timeout = 60000");
                  await tx.unsafe("SET LOCAL lock_timeout = 5000");
                  return await tx.unsafe(text);
                });
                if (rows.length === 0) {
                  console.log("(0 rows)");
                } else {
                  const cols = Object.keys(rows[0]);
                  console.log(cols.join(" | "));
                  for (const row of rows) console.log(cols.map((c) => show(row[c])).join(" | "));
                }
              } catch (e) {
                console.log("ERROR: " + (e instanceof Error ? e.message : String(e)));
                process.exitCode = 1;
              } finally {
                await db.end();
              }
              EOF

              FAILED=""

              section() {
                echo
                echo "=============================================================="
                echo "== $1"
                echo "=============================================================="
              }

              run() {
                echo "+ $*"
                "$@" 2>&1
                rc=$?
                echo "[exit $rc]"
                if [ "$rc" -ne 0 ]; then
                  FAILED="$FAILED
                - $*"
                fi
                echo
              }

              q() {
                bun /work/q.ts "$1"
                echo
              }

              echo "gbrain-rehearsal-runner: mode=$MODE run-id=${RUNNER_RUN_ID:-none} gbrain-sha=${GBRAIN_REHEARSAL_SHA:-unknown} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "target database: ${DATABASE_URL#*@}"
              echo "gbrain command: $GBRAIN"

              if [ "${RUNNER_WAIT_FOR_SERVE:-true}" = "true" ]; then
                section "waiting for gbrain-rehearsal to finish startup (init and migrations)"
                i=0
                until wget -q -T 3 -O /dev/null http://gbrain-rehearsal:3131/health; do
                  i=$((i + 1))
                  if [ "$i" -ge "${RUNNER_WAIT_ITERATIONS:-180}" ]; then
                    if [ "$MODE" = "upgrade" ]; then echo "FATAL: gbrain-rehearsal not healthy after $((i * 5))s; the upgrade rehearsal cannot continue"; exit 1; fi
                    echo "WARN: gbrain-rehearsal not healthy after $((i * 5))s; continuing anyway"; break
                  fi
                  echo "waiting for gbrain-rehearsal /health ($i)"
                  sleep 5
                done
              fi

              if [ "$MODE" = "upgrade" ]; then
                case "${GBRAIN_MCP_URL:-}" in
                  http://gbrain-rehearsal:3131/*) ;;
                  *) echo "FATAL: GBRAIN_MCP_URL must target gbrain-rehearsal (got: ${GBRAIN_MCP_URL:-unset}); refusing to run"; exit 1 ;;
                esac

                cat > /work/mcp.ts <<'EOF'
              const [name, argsJson = "{}", label = "", expr = ""] = process.argv.slice(2);
              const url = process.env.GBRAIN_MCP_URL as string;
              const token = process.env.GBRAIN_REMOTE_TOKEN as string;

              const parseMcp = (text: string): any => {
                let msg: any = null;
                for (const block of text.split("\n\n")) {
                  const data = block.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("\n");
                  if (!data) continue;
                  try { const o = JSON.parse(data); if (o.result || o.error) msg = o; } catch { /* keep scanning */ }
                }
                if (msg) return msg;
                try { return JSON.parse(text); } catch { return null; }
              };
              const pick = (o: any, k: string): any => {
                if (o === null || typeof o !== "object") return undefined;
                if (k in o) return o[k];
                for (const v of Object.values(o)) { const f = pick(v, k); if (f !== undefined) return f; }
                return undefined;
              };

              const isList = name === "tools/list";
              let r: any = null;
              let isError = false;
              try {
                const res = await fetch(url, {
                  method: "POST",
                  headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", Authorization: `Bearer ${token}` },
                  body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: isList ? "tools/list" : "tools/call", params: isList ? {} : { name, arguments: JSON.parse(argsJson) } }),
                });
                const text = await res.text();
                if (!res.ok) { console.log(`HTTP ${res.status}: ${text.slice(0, 300)}`); r = { http_status: res.status }; isError = true; }
                else {
                  const msg = parseMcp(text);
                  if (!msg) { console.log("unparseable MCP response: " + text.slice(0, 300)); isError = true; }
                  else if (msg.error) { console.log("rpc error: " + JSON.stringify(msg.error).slice(0, 500)); r = msg.error; isError = true; }
                  else if (isList) {
                    r = (msg.result?.tools ?? []).map((t: any) => t.name).sort();
                    console.log(`tools/list: ${r.length} tools`);
                    console.log(r.join("\n"));
                  } else {
                    isError = !!msg.result?.isError;
                    const out = (msg.result?.content ?? []).map((c: any) => c.text ?? "").join("\n");
                    try { r = JSON.parse(out); } catch { r = out; }
                    console.log(`${name}: isError=${isError}`);
                    console.log(out.slice(0, 2000));
                  }
                }
              } catch (e) {
                console.log("ERROR: " + (e instanceof Error ? e.message : String(e)));
                isError = true;
              }
              await Bun.write("/work/last.json", JSON.stringify(r));
              if (expr) {
                let ok = false;
                try { ok = !!new Function("r", "isError", "pick", "env", `return (${expr});`)(r, isError, (k: string) => pick(r, k), process.env); }
                catch (e) { console.log("expression error: " + String(e)); }
                console.log(`CHECK ${label}: ${ok ? "PASS" : "FAIL"}`);
              }
              EOF

                CHECK_FAILED=""
                scan() {
                  label="$1"; shift
                  OUT="$("$@" 2>&1)"
                  echo "$OUT"
                  case "$OUT" in
                    *": FAIL"*) CHECK_FAILED="$CHECK_FAILED
              - $label" ;;
                  esac
                  echo
                }
                chk() {
                  echo "CHECK $1: $2"
                  if [ "$2" != PASS ]; then CHECK_FAILED="$CHECK_FAILED
              - $1"; fi
                }
                qv() { bun /work/q.ts "$1" | tail -n +2 | head -n 1; }
                mc() { scan "$3" bun /work/mcp.ts "$@"; }
                cfg() {
                  V="$($GBRAIN config get "$1" 2>&1)"
                  echo "config $1 = $V"
                  if [ -n "${2:-}" ]; then
                    case "$V" in *"$2"*) chk "config $1 contains $2" PASS ;; *) chk "config $1 contains $2" FAIL ;; esac
                  fi
                }

                section "U0. wait for the bearer MCP to answer (serve is up, hermes-mcp token seeded)"
                i=0
                until bun /work/mcp.ts tools/list >/work/ready.txt 2>&1 && grep -q "tools/list: " /work/ready.txt; do
                  i=$((i + 1))
                  if [ "$i" -ge 120 ]; then echo "FATAL: bearer tools/list never answered; the rehearsal gbrain is not serving"; cat /work/ready.txt; exit 1; fi
                  echo "waiting for bearer tools/list ($i)"
                  sleep 5
                done
                echo "bearer MCP answering"

                section "U1. gbrain --version (expect 0.60.214)"
                V="$($GBRAIN --version 2>&1)"; echo "$V"
                case "$V" in *0.60.214*) chk "version is 0.60.214" PASS ;; *) chk "version is 0.60.214" FAIL ;; esac

                section "U2. config version row (expect 242)"
                V="$(qv "SELECT value FROM config WHERE key = 'version'")"; echo "config version = $V"
                if [ "$V" = "242" ]; then chk "schema version 242" PASS; else chk "schema version 242" FAIL; fi

                section "U3. config readback"
                cfg mcp.publish_advisor true
                cfg mcp.publish_skills
                cfg search.reranker.model voyage:rerank-2.5
                cfg facts.extraction_model openrouter:openai/gpt-oss-120b
                cfg memory.auto_writeback salient
                cfg persistence.unbound_write
                cfg cycle.conversation_facts_backfill.enabled true

                section "U4. sources list --json (local_path null) and sync.repo_path unset"
                $GBRAIN sources list --json >/work/sources.json 2>/work/sources.err
                echo "[exit $?]"
                scan "sources local_path null" bun -e '
                  const j = JSON.parse(require("fs").readFileSync("/work/sources.json", "utf8"));
                  const rows = Array.isArray(j) ? j : (j.sources ?? []);
                  const bad = rows.filter((s) => s.local_path !== null && s.local_path !== undefined);
                  console.log("sources: " + rows.length + ", with local_path set: " + bad.length);
                  console.log("CHECK sources local_path null: " + (rows.length > 0 && bad.length === 0 ? "PASS" : "FAIL"));
                '
                V="$(qv "SELECT count(*) FROM config WHERE key = 'sync.repo_path' AND coalesce(value, '') <> ''")"; echo "sync.repo_path rows with a value = $V"
                if [ "$V" = "0" ]; then chk "sync.repo_path unset" PASS; else chk "sync.repo_path unset" FAIL; fi

                section "U5. repair dry runs, apply, counts"
                echo "before: chunks=$(qv "SELECT count(*) FROM content_chunks") embedded=$(qv "SELECT count(embedding) FROM content_chunks") timeline=$(qv "SELECT count(*) FROM timeline_entries")"
                run $GBRAIN repair safe-chunks
                run $GBRAIN repair timeline
                run $GBRAIN repair safe-chunks --apply $RUNNER_REPAIR_ARGS
                run $GBRAIN repair timeline --apply $RUNNER_REPAIR_ARGS
                C="$(qv "SELECT count(*) FROM content_chunks")"; E="$(qv "SELECT count(embedding) FROM content_chunks")"; T="$(qv "SELECT count(*) FROM timeline_entries")"
                echo "after: chunks=$C embedded=$E timeline=$T (restore baseline: 1490 chunks, 358 timeline entries)"
                if [ "$C" = "$E" ]; then chk "every chunk embedded after repairs" PASS; else chk "every chunk embedded after repairs" FAIL; fi
                if [ "$T" = "358" ]; then chk "timeline_entries == 358" PASS; else chk "timeline_entries == 358 (got $T)" FAIL; fi

                section "U6. live pages below chunker_version 4 (expect 0)"
                V="$(qv "SELECT count(*) FROM pages WHERE deleted_at IS NULL AND chunker_version < 4")"; echo "pages below chunker 4 = $V"
                if [ "$V" = "0" ]; then chk "no pages below chunker_version 4" PASS; else chk "no pages below chunker_version 4" FAIL; fi

                section "U7. get_stats and get_health over the bearer MCP"
                mc get_stats '{}' "get_stats embedded_count == chunk_count" 'pick("embedded_count") === pick("chunk_count") && pick("chunk_count") > 0'
                mc get_health '{}' "get_health missing_embeddings == 0" '(pick("missing_embeddings") ?? 0) === 0'

                section "U8. canned bearer search on 3 existing person pages"
                for n in 0 1 2; do
                  SLUG="$(qv "SELECT slug FROM pages WHERE type = 'person' AND deleted_at IS NULL ORDER BY slug OFFSET $n LIMIT 1")"
                  TITLE="$(qv "SELECT coalesce(nullif(title, ''), slug) FROM pages WHERE type = 'person' AND deleted_at IS NULL ORDER BY slug OFFSET $n LIMIT 1")"
                  echo "person page $n: slug=$SLUG title=$TITLE"
                  export EXPECT_SLUG="$SLUG" TITLE
                  scan "search finds $SLUG" bun /work/mcp.ts search "$(bun -e 'console.log(JSON.stringify({ query: process.env.TITLE, limit: 5 }))')" "search finds person page $n" 'env.EXPECT_SLUG !== "" && JSON.stringify(r).includes(env.EXPECT_SLUG)'
                done

                section "U9. put_page revision guard (scratch page, rehearsal copy only)"
                TS="notes/upgrade-rehearsal-${RUNNER_RUN_ID:-none}"
                BODY='{"slug":"'"$TS"'","content":"---\ntype: note\ntitle: Upgrade rehearsal check\n---\n\nScratch page written by the rehearsal runner."}'
                mc put_page "$BODY" "put_page create ok" '!isError'
                mc put_page "$BODY" "put_page without revision -> revision_conflict" 'isError && (r?.error === "revision_conflict" || r?.write_error === "revision_conflict")'
                mc get_page '{"slug":"'"$TS"'"}' "get_page returns a revision" '!isError && !!pick("revision")'
                REV="$(bun -e 'const r = JSON.parse(require("fs").readFileSync("/work/last.json", "utf8")); const f = (o, k) => o && typeof o === "object" ? (k in o ? o[k] : Object.values(o).map((v) => f(v, k)).find((x) => x !== undefined)) : undefined; console.log(f(r, "revision") ?? "")')"
                echo "revision read: $REV"
                BODY2='{"slug":"'"$TS"'","expected_revision":"'"$REV"'","content":"---\ntype: note\ntitle: Upgrade rehearsal check\n---\n\nScratch page, second write with the expected revision."}'
                mc put_page "$BODY2" "put_page with expected_revision ok" '!isError'

                section "U10. add_timeline_entry round trip incl. a Dux Soup shaped entry"
                mc add_timeline_entry '{"slug":"'"$TS"'","date":"2026-10-27","summary":"Rehearsal plain entry","detail":"plain detail","source":"rehearsal:plain"}' "add_timeline_entry plain ok" '!isError'
                mc add_timeline_entry '{"slug":"'"$TS"'","date":"2026-10-27","summary":"LinkedIn message: success","detail":"line one\nline two\n\nline four","source":"duxsoup:message:rehearsal-'"${RUNNER_RUN_ID:-none}"'"}' "add_timeline_entry dux soup shaped ok" '!isError'
                V="$(qv "SELECT count(*) FROM timeline_entries t JOIN pages p ON p.id = t.page_id WHERE p.slug = '$TS' AND t.summary = 'LinkedIn message: success' AND position(chr(10) in t.detail) > 0")"
                echo "dux soup shaped rows read back with newlines intact = $V"
                if [ "$V" = "1" ]; then chk "dux soup timeline entry read back" PASS; else chk "dux soup timeline entry read back" FAIL; fi

                section "U11. put_raw_data"
                mc put_raw_data '{"slug":"'"$TS"'","source":"rehearsal","data":{"run":"'"${RUNNER_RUN_ID:-none}"'","ok":true}}' "put_raw_data ok" '!isError'

                section "U12. tools/list with the hermes-mcp token (sorted names)"
                mc tools/list '{}' "tools/list answers with tools" 'Array.isArray(r) && r.length > 0 && r.includes("put_page") && r.includes("search")'

                section "U13. doctor summary, hermes-mcp token row, writer probe"
                $GBRAIN doctor --json >/work/doctor.json 2>/work/doctor.err
                echo "[doctor exit $?]"
                scan "doctor summary" bun -e '
                  const raw = require("fs").readFileSync("/work/doctor.json", "utf8");
                  let j; try { j = JSON.parse(raw); } catch { console.log("doctor output is not JSON: " + raw.slice(0, 500)); console.log("CHECK doctor json parses: FAIL"); process.exit(0); }
                  const checks = Array.isArray(j.checks) ? j.checks : [];
                  const by = {};
                  for (const c of checks) by[c.status ?? "unknown"] = (by[c.status ?? "unknown"] ?? 0) + 1;
                  console.log("doctor status=" + (j.status ?? "n/a") + " health_score=" + (j.health_score ?? "n/a") + " checks=" + JSON.stringify(by));
                  for (const c of checks) if (c.status && c.status !== "ok" && c.status !== "pass") console.log("  " + c.status + ": " + c.name + " - " + String(c.message ?? "").slice(0, 200));
                  console.log("CHECK doctor json parses: PASS");
                '
                V="$(qv "SELECT count(*) FROM access_tokens WHERE name = 'hermes-mcp' AND revoked_at IS NULL")"; echo "active hermes-mcp token rows = $V"
                if [ "$V" -ge 1 ] 2>/dev/null; then chk "hermes-mcp bearer present (startup log line 'hermes-mcp bearer asserted' is in the gbrain-rehearsal pod log)" PASS; else chk "hermes-mcp bearer present" FAIL; fi
                run $GBRAIN sources writer status --probe --json

                section "U-summary"
                if [ -n "$CHECK_FAILED" ]; then echo "UPGRADE CHECKS FAILED:$CHECK_FAILED"; else echo "UPGRADE CHECKS: all PASS"; fi
                echo "gbrain-rehearsal-runner: complete (mode $MODE) at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                exit 0
              fi

              if [ "$MODE" = "apply-repairs" ]; then
                section "A1. gbrain repair safe-chunks --apply"
                run $GBRAIN repair safe-chunks --apply $RUNNER_REPAIR_ARGS
                section "A2. gbrain repair timeline --apply"
                run $GBRAIN repair timeline --apply $RUNNER_REPAIR_ARGS
              fi

              section "1. gbrain --version"
              run $GBRAIN --version

              section "2. gbrain doctor --json"
              run $GBRAIN doctor --json

              section "3. gbrain sources list --json"
              run $GBRAIN sources list --json

              section "4. gbrain config get sync.repo_path"
              run $GBRAIN config get sync.repo_path

              section "5. gbrain sources writer status --probe --json (exists from the 6e1e826 build)"
              run $GBRAIN sources writer status --probe --json

              section "6. gbrain repair safe-chunks (dry run; exists from the 6e1e826 build)"
              run $GBRAIN repair safe-chunks

              section "7. gbrain repair timeline (dry run; exists from the 6e1e826 build)"
              run $GBRAIN repair timeline

              section "8. gbrain migrate embeddings --status"
              run $GBRAIN migrate embeddings --status

              section "S0. connection and read-only guard"
              q "SELECT current_database() AS db, current_user AS role, current_setting('transaction_read_only') AS transaction_read_only, pg_size_pretty(pg_database_size(current_database())) AS database_size, now() AS at"

              section "S0b. optional columns present at this schema version"
              q "SELECT table_name, column_name, data_type FROM information_schema.columns WHERE table_schema = 'public' AND ((table_name = 'pages' AND column_name IN ('chunker_version','contextual_retrieval_mode','embedding_signature','deleted_at')) OR (table_name = 'sources' AND column_name IN ('archived','chunker_version','contextual_retrieval_mode')) OR (table_name = 'timeline_entries' AND column_name = 'source')) ORDER BY 1, 2"

              section "S1. config rows (secret-like keys redacted, credentials in URLs redacted)"
              q "SELECT key, CASE WHEN key ~* 'secret|key|token|password' THEN '<redacted>' ELSE regexp_replace(value, '://[^/@ ]*@', '://<redacted>@') END AS value FROM config WHERE key IN ('sync.repo_path','sync.write_through','embedding_model','embedding_dimensions','search.mode','search.reranker.model','version') OR key LIKE 'persistence%' OR key LIKE 'sync.%' OR key LIKE 'search.%' OR key LIKE 'embedding%' OR key LIKE 'chunker%' OR key LIKE 'contextual%' ORDER BY key"

              section "S2. sources"
              q "SELECT id, name, regexp_replace(local_path, '://[^/@ ]*@', '://<redacted>@') AS local_path, regexp_replace(config->>'github_repo', '://[^/@ ]*@', '://<redacted>@') AS github_repo, config->>'federated' AS federated, archived, last_sync_at, left(last_commit, 12) AS last_commit, chunker_version, contextual_retrieval_mode, (SELECT string_agg(k, ',' ORDER BY k) FROM jsonb_object_keys(config) AS k) AS config_keys FROM sources ORDER BY id"

              section "S3a. pages per source (live vs soft-deleted)"
              q "SELECT CASE WHEN GROUPING(source_id) = 1 THEN '(all)' ELSE source_id END AS source_id, count(*) AS pages, count(*) FILTER (WHERE deleted_at IS NULL) AS live, count(*) FILTER (WHERE deleted_at IS NOT NULL) AS deleted FROM pages GROUP BY ROLLUP (source_id) ORDER BY pages DESC"

              section "S3b. pages per type (live vs soft-deleted)"
              q "SELECT CASE WHEN GROUPING(type) = 1 THEN '(all)' ELSE type END AS type, count(*) AS pages, count(*) FILTER (WHERE deleted_at IS NULL) AS live, count(*) FILTER (WHERE deleted_at IS NOT NULL) AS deleted FROM pages GROUP BY ROLLUP (type) ORDER BY pages DESC"

              section "S4a. column widths: embedding column types (every public table with a vector or halfvec column)"
              q "SELECT c.relname AS tbl, a.attname AS col, format_type(a.atttypid, a.atttypmod) AS type FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND format_type(a.atttypid, a.atttypmod) ~ '^(vector|halfvec)' AND a.attnum > 0 AND NOT a.attisdropped ORDER BY 1, 2"

              section "S4a2. column widths: bounded character columns"
              q "SELECT table_name, column_name, data_type, character_maximum_length FROM information_schema.columns WHERE table_schema = 'public' AND character_maximum_length IS NOT NULL ORDER BY 1, 2 LIMIT 200"

              section "S4a3. row counts of tables with vector columns"
              q "SELECT 'facts' AS tbl, count(*) AS rows FROM facts"
              q "SELECT 'query_cache' AS tbl, count(*) AS rows FROM query_cache"

              section "S4b. content_chunks embedding coverage by model"
              q "SELECT model, count(*) AS chunks, count(embedding) AS embedded, count(*) - count(embedding) AS unembedded FROM content_chunks GROUP BY model ORDER BY chunks DESC"

              section "S4b2. content_chunks embedding_input_hash coverage (column exists from migration 171)"
              q "SELECT count(*) AS chunks, count(*) FILTER (WHERE embedding_input_hash IS NULL) AS null_input_hash, count(*) FILTER (WHERE embedding IS NOT NULL AND embedding_input_hash IS NULL) AS embedded_without_hash FROM content_chunks"

              section "S4c. takes embedding coverage"
              q "SELECT count(*) AS takes, count(embedding) AS embedded FROM takes"

              section "S5a. timeline_entries total"
              q "SELECT count(*) AS timeline_entries, count(DISTINCT page_id) AS pages_with_entries FROM timeline_entries"

              section "S5b. timeline_entries per source prefix"
              q "SELECT split_part(source, ':', 1) AS source_prefix, count(*) AS entries FROM timeline_entries GROUP BY 1 ORDER BY 2 DESC LIMIT 100"

              section "S5c. timeline_entries per page (top 25 pages)"
              q "SELECT t.page_id, p.slug, count(*) AS entries FROM timeline_entries t LEFT JOIN pages p ON p.id = t.page_id GROUP BY t.page_id, p.slug ORDER BY 3 DESC, 1 LIMIT 25"

              section "S5d. timeline_entries per page (distribution: entries per page vs number of pages)"
              q "SELECT entries, count(*) AS pages FROM (SELECT page_id, count(*) AS entries FROM timeline_entries GROUP BY page_id) per_page GROUP BY entries ORDER BY entries DESC LIMIT 50"

              section "S6a. pages.chunker_version distribution"
              q "SELECT chunker_version, count(*) AS pages FROM pages GROUP BY 1 ORDER BY 1"

              section "S6b. pages.contextual_retrieval_mode distribution"
              q "SELECT contextual_retrieval_mode, count(*) AS pages FROM pages GROUP BY 1 ORDER BY 2 DESC"

              section "S6c. pages.embedding_signature distribution"
              q "SELECT embedding_signature, count(*) AS pages FROM pages GROUP BY 1 ORDER BY 2 DESC"

              section "S7a. minion_jobs by status"
              q "SELECT status, count(*) AS jobs, min(created_at) AS oldest_created, max(updated_at) AS last_updated FROM minion_jobs GROUP BY status ORDER BY jobs DESC"

              section "S7b. minion_jobs by queue, name, status"
              q "SELECT queue, name, status, count(*) AS jobs FROM minion_jobs GROUP BY 1, 2, 3 ORDER BY 1, 2, 3 LIMIT 200"

              section "S8. access_tokens (names only, no hashes)"
              q "SELECT count(*) AS total, count(*) FILTER (WHERE revoked_at IS NULL) AS active, count(*) FILTER (WHERE revoked_at IS NOT NULL) AS revoked FROM access_tokens"
              q "SELECT name, created_at, last_used_at, revoked_at IS NOT NULL AS revoked FROM access_tokens ORDER BY created_at"

              section "S9. schema and server version"
              q "SELECT key, value AS gbrain_schema_version FROM config WHERE key = 'version'"
              q "SELECT version() AS postgres"
              q "SELECT extname, extversion FROM pg_extension ORDER BY 1"

              echo
              echo "gbrain-rehearsal-runner: complete (mode $MODE) at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if [ -n "$FAILED" ]; then
                echo "commands that exited non-zero (expected for commands newer than the installed gbrain):$FAILED"
              fi
              exit 0
          env:
            - name: RUNNER_MODE
              value: upgrade
            - name: RUNNER_RUN_ID
              value: "20261027"
            - name: RUNNER_WAIT_ITERATIONS
              value: "480"
            - name: GBRAIN_MCP_URL
              value: http://gbrain-rehearsal:3131/mcp
            - name: GBRAIN_REMOTE_TOKEN
              value: "gbrain-mcp"
            - name: RUNNER_REPAIR_ARGS
              value: ""
            - name: RUNNER_WAIT_FOR_SERVE
              value: "true"
            - name: GBRAIN_REHEARSAL_SHA
              valueFrom:
                configMapKeyRef:
                  name: gbrain-rehearsal-version
                  key: GBRAIN_REHEARSAL_SHA
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: uri
            - name: GBRAIN_CHAT_MODEL
              value: openrouter:minimax/minimax-m2.7
            - name: GBRAIN_CHAT_FALLBACK_CHAIN
              value: openrouter:openai/gpt-oss-120b
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: GBRAIN_EMBEDDING_MODEL
              value: openai:text-embedding-3-small
            - name: GBRAIN_EMBEDDING_DIMENSIONS
              value: "1536"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-embedding-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: VOYAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-reranker-secret
                  key: VOYAGE_API_KEY
                  optional: true
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
            - name: work
              mountPath: /work
      volumes:
        - name: gbrain-install
          emptyDir: {}
        - name: work
          emptyDir: {}
