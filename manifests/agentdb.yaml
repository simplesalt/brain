apiVersion: v1
kind: Namespace
metadata:
  name: ssint-main-agentdb
  labels:
    name: ssint-main-agentdb
    entity: ssint
    env: main
    capability: agentdb
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: agentdb-openrouter
  namespace: ssint-main-agentdb
  labels:
    entity: ssint
    env: main
    capability: agentdb
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentdb-main
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: agentdb
spec:
  interval: 12h
  url: oci://ghcr.io/simplesalt/charts/agentdb
  ref:
    tag: "0.2.0-25"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentdb-main
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: agentdb
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: agentdb-main
    namespace: flux-system
  targetNamespace: ssint-main-agentdb
  install:
    createNamespace: false
  values:
    instanceName: trial
    image:
      digest: sha256:bd87d1cde3b8da0436a251cab1f63fd6e40ecb40cda963ef6f2cf967597dd321
    postgres:
      instances: 2
      imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
      storage:
        size: 5Gi
    history:
      retention: 30d
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentdb-trial
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: agentdb
    kyverno-relabel: "2026-11-12"
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: brain
  path: ./agentdb-trial
  prune: true
  wait: false
