apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-guard-list-check-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-guard-list-check
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["bun", "-e"]
          args:
            - |
              const h = await fetch("http://gbrain:3141/health");
              console.log("guard /health", h.status, await h.text());
              const r = await fetch("http://gbrain:3141/mcp", { method: "POST",
                headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", Authorization: "Bearer gbrain-mcp" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }) });
              const msg = await r.json();
              const tools = msg.result.tools;
              const names = tools.map(t => t.name);
              console.log(`tools/list through the guard (read-only): HTTP ${r.status}, ${names.length} tools`);
              for (const n of ["delete_page", "put_pages", "begin_page_upload", "mark_page_for_deletion", "propose_page_replacement", "withdraw_page_mark", "get_page_archives", "put_page", "edit_page", "get_versions", "revert_version"]) console.log(`  ${n}: ${names.includes(n) ? "listed" : "not listed"}`);
              for (const n of ["get_page", "search", "query", "list_pages"]) console.log(`  ${n} include_deleted: ${JSON.stringify(tools.find(t => t.name === n)?.inputSchema?.properties?.include_deleted ?? null)}`);
              console.log("RESULT: done");
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
