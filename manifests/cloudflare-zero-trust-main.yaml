---
apiVersion: zero.upjet-cloudflare.upbound.io/v1alpha1
kind: TrustAccessApplication
metadata:
  name: cloudflare-app-info-simplesalt-company
  annotations:
    crossplane.io/external-name: "1b7031b2-52ba-4c31-8913-53ccea37a6de"
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  deletionPolicy: Orphan
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    name: simplesalt-internal
    type: self_hosted
    # The one Access app for everything internal staff use: every internal web
    # address is a destination here, behind the same Google sign-in and staff
    # policy, never an Access app of its own. One sign-in sets the Access cookie
    # on every address (eager redirects), so a page on one calls another directly
    # with it, also from an installed phone app. Its tunnel route checks this
    # app's audience (afcfa282...), as do origins that verify the JWT. Eager
    # redirects can loop past about five hostnames; prefer paths on existing
    # hostnames. Public paths go in a bypass app (as info-static below), and
    # clients that can't sign in (such as MCP's SaaS sign-in) keep their own.
    destinations:
      - type: public
        uri: info.simplesalt.company
      - type: public
        uri: hermes.simplesalt.company
      # Only the grammar path: the rest of api.simplesalt.company is Workers
      # (webhooks, MCP server) that must stay reachable without Access.
      - type: public
        uri: api.simplesalt.company/45e6451afc312886/grammar
    corsHeaders:
      allowedOrigins:
        - https://info.simplesalt.company
      allowedMethods:
        - GET
        - POST
      allowedHeaders:
        - content-type
      allowCredentials: true
      maxAge: 600
    # Long enough that Big AGI installed on a phone home screen rarely asks to sign in again.
    sessionDuration: 720h
    autoRedirectToIdentity: true
    allowedIdps:
      - 42cbdc64-699e-4e17-b470-fb7cda3c0791
    policies:
      - id: 79bac8d3-6c82-4ac5-bbdb-f98a3388236c
        precedence: 1
  providerConfigRef:
    name: ssint-main

---
apiVersion: zero.upjet-cloudflare.upbound.io/v1alpha1
kind: TrustAccessApplication
metadata:
  name: cloudflare-app-info-static-simplesalt-company
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    name: info-static-simplesalt-company
    type: self_hosted
    # Big AGI's built front end, open so phones can install it as a home-screen
    # app (browsers fetch the manifest and icons without cookies) and Cloudflare
    # can cache it. Pages and /api stay behind the info app above.
    destinations:
      - type: public
        uri: info.simplesalt.company/_next/static
      - type: public
        uri: info.simplesalt.company/icons
      - type: public
        uri: info.simplesalt.company/manifest.json
      - type: public
        uri: info.simplesalt.company/apple-touch-icon.png
      - type: public
        uri: info.simplesalt.company/favicon.ico
    policies:
      - name: Everyone (static front end)
        decision: bypass
        include:
          - everyone: {}
        precedence: 1
  providerConfigRef:
    name: ssint-main

---
apiVersion: dns.upjet-cloudflare.upbound.io/v1alpha1
kind: Record
metadata:
  name: cf-main-dns-hermes-simplesalt-company
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  forProvider:
    zoneId: 260b251cdb53f8376875a8eb8d03ca0b
    name: hermes.simplesalt.company
    type: CNAME
    content: 83c27a64-4074-474c-9a8f-19448d1c2081.cfargotunnel.com
    proxied: true
    ttl: 1
  providerConfigRef:
    name: ssint-main

---
apiVersion: zero.upjet-cloudflare.upbound.io/v1alpha1
kind: TrustTunnelCloudflaredConfig
metadata:
  annotations:
    crossplane.io/external-name: "83c27a64-4074-474c-9a8f-19448d1c2081"
  name: ssint-main-tunnel-config
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  forProvider:
    accountId: ba92fe12c6c1275f965c7c86e3b392ac
    tunnelId: "83c27a64-4074-474c-9a8f-19448d1c2081"
    config:
      ingress:
        - hostname: info.simplesalt.company
          service: http://big-agi.ssint-main-ai.svc.k.famevans.win:3000
        - hostname: hermes.simplesalt.company
          service: http://hermes-agent-web.ssint-main-ai.svc.k.famevans.win:80
          originRequest:
            access:
              required: true
              teamName: fqurzlaaagt
              # The simplesalt-internal app's.
              audTag:
                - afcfa282e581c698462ed0073e0d497979eb6e5d737548dcea72e2e2a643102c
        - hostname: api.simplesalt.company
          path: ^/45e6451afc312886/grammar$
          service: http://grammar.ssint-main-voice.svc.k.famevans.win:8000
          originRequest:
            access:
              required: true
              teamName: fqurzlaaagt
              # The simplesalt-internal app's.
              audTag:
                - afcfa282e581c698462ed0073e0d497979eb6e5d737548dcea72e2e2a643102c
        - hostname: hooks.simplesalt.company
          path: ^/duxsoup/events$
          service: http://duxsoup-ingest.ssint-main-msg.svc.k.famevans.win:8080
        - service: http_status:404
  providerConfigRef:
    name: ssint-main
