---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-proxy-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  proxy.py: |
    #!/usr/bin/env python3
    import base64, hashlib, hmac, json, os, threading, time, http.client, http.server, urllib.request
    from urllib.parse import urlparse

    HERMES_URL = os.environ.get('HERMES_URL', 'http://hermes-agent-web:8642')
    PORT = int(os.environ.get('PORT', '8000'))
    _u = urlparse(HERMES_URL)
    _HOST = _u.hostname
    _PORT = _u.port or (443 if _u.scheme == 'https' else 80)

    ACCESS_TEAM = os.environ.get('ACCESS_TEAM_DOMAIN', '').rstrip('/')
    ACCESS_AUD = os.environ.get('ACCESS_AUD', '')
    ROSTER_PATH = os.environ.get('ROSTER_PATH', '/secrets/team-roster/roster.json')
    ID_HEADER = 'openai-organization'

    _SKIP_REQ = {'host', 'transfer-encoding', 'connection', 'content-length', ID_HEADER}
    _SKIP_RESP_BASE = {'transfer-encoding', 'connection'}

    _SHA256_PREFIX = bytes.fromhex('3031300d060960864801650304020105000420')
    _keys, _keys_at, _keys_lock = {}, 0.0, threading.Lock()

    def _b64(s):
        return base64.urlsafe_b64decode(s + '=' * (-len(s) % 4))

    def _jwks(force=False):
        global _keys, _keys_at
        with _keys_lock:
            age = time.time() - _keys_at
            if age < 60 or (_keys and age < 3600 and not force):
                return _keys
            try:
                with urllib.request.urlopen(ACCESS_TEAM + '/cdn-cgi/access/certs', timeout=10) as r:
                    doc = json.load(r)
                _keys = {k['kid']: (int.from_bytes(_b64(k['n']), 'big'), int.from_bytes(_b64(k['e']), 'big'))
                         for k in doc.get('keys', []) if k.get('kty') == 'RSA'}
                _keys_at = time.time()
            except Exception as e:
                _keys_at = time.time()
                print(f'hermes-proxy: Access certs fetch failed: {e}', flush=True)
            return _keys

    def _rs256_ok(key, signed, sig):
        n, e = key
        k = (n.bit_length() + 7) // 8
        if len(sig) != k:
            return False
        em = pow(int.from_bytes(sig, 'big'), e, n).to_bytes(k, 'big')
        t = _SHA256_PREFIX + hashlib.sha256(signed).digest()
        want = b'\x00\x01' + b'\xff' * (k - len(t) - 3) + b'\x00' + t
        return hmac.compare_digest(em, want)

    def verify_access_jwt(token):
        """Return the verified email from a Cloudflare Access JWT, else None."""
        if not (token and ACCESS_TEAM and ACCESS_AUD) or token.count('.') != 2:
            return None
        try:
            h64, p64, s64 = token.split('.')
            head, claims = json.loads(_b64(h64)), json.loads(_b64(p64))
            if head.get('alg') != 'RS256':
                return None
            key = _jwks().get(head.get('kid')) or _jwks(force=True).get(head.get('kid'))
            if not key or not _rs256_ok(key, (h64 + '.' + p64).encode(), _b64(s64)):
                return None
            now = time.time()
            aud = claims.get('aud')
            aud = aud if isinstance(aud, list) else [aud]
            if claims.get('iss') != ACCESS_TEAM or ACCESS_AUD not in aud:
                return None
            if claims.get('exp', 0) < now - 30 or claims.get('nbf', 0) > now + 30:
                return None
            email = claims.get('email')
            return email if isinstance(email, str) and '@' in email else None
        except Exception:
            return None

    def display_name(email):
        try:
            with open(ROSTER_PATH) as f:
                roster = json.load(f)
            for entry in roster if isinstance(roster, list) else []:
                if isinstance(entry, dict) and any(
                        isinstance(v, str) and v.strip().lower() == email.lower() for v in entry.values()):
                    return entry.get('display_name') or None
        except Exception:
            pass
        return None

    def identity_note(email):
        name = display_name(email)
        who = f'{name} <{email}>' if name else email
        return (f'The person sending this request is {who}, as verified by Simple Salt single sign-on. '
                'Treat this as the identity of who you are talking to.')

    def with_identity(path, body, email):
        """Add the verified requester to a chat request body; unchanged if it is not one."""
        try:
            doc = json.loads(body)
        except Exception:
            return body
        note = identity_note(email)
        p = path.split('?', 1)[0]
        if p.endswith('/chat/completions') and isinstance(doc.get('messages'), list):
            doc['messages'].insert(0, {'role': 'system', 'content': note})
        elif p.endswith('/responses') and isinstance(doc, dict):
            prev = doc.get('instructions')
            doc['instructions'] = note + ('\n\n' + prev if isinstance(prev, str) and prev else '')
        else:
            return body
        return json.dumps(doc).encode()

    class ProxyHandler(http.server.BaseHTTPRequestHandler):
        timeout = 300
        def do_GET(self): self._proxy()
        def do_POST(self): self._proxy()
        def do_PUT(self): self._proxy()
        def do_DELETE(self): self._proxy()
        def log_message(self, *a): pass

        def _proxy(self):
            n = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(n) if n else b''
            is_stream = False
            try:
                if body:
                    is_stream = bool(json.loads(body).get('stream'))
            except Exception:
                pass
            email = verify_access_jwt(self.headers.get(ID_HEADER, ''))
            if email and body:
                body = with_identity(self.path, body, email)
            fwd = {k: v for k, v in self.headers.items() if k.lower() not in _SKIP_REQ}
            if body or self.command in ('POST', 'PUT'):
                fwd['Content-Length'] = str(len(body))
            try:
                conn = http.client.HTTPConnection(_HOST, _PORT, timeout=300)
                conn.request(self.command, self.path, body=body, headers=fwd)
                r = conn.getresponse()
                self.send_response(r.status)
                skip = _SKIP_RESP_BASE | ({'content-length'} if is_stream else set())
                for k, v in r.getheaders():
                    if k.lower() not in skip:
                        self.send_header(k, v)
                self.end_headers()
                if is_stream:
                    self._stream(r)
                else:
                    self.wfile.write(r.read())
            except Exception as e:
                try: self.send_error(502, str(e))
                except Exception: pass
            finally:
                try: conn.close()
                except Exception: pass

        def _stream(self, r):
            buf = b''
            prev_dropped = False
            while True:
                chunk = r.read(4096)
                if not chunk:
                    break
                buf += chunk
                while True:
                    i = buf.find(b'\n')
                    if i == -1:
                        break
                    line, buf = buf[:i+1], buf[i+1:]
                    prev_dropped = self._sse_line(line, prev_dropped)
            if buf:
                self._sse_line(buf, prev_dropped)

        def _sse_line(self, line, prev_dropped):
            """Return True if this line was dropped (suppresses following blank line)."""
            s = line.decode('utf-8', errors='replace')
            if s.startswith('data: '):
                payload = s[6:].strip()
                if payload != '[DONE]':
                    try:
                        d = json.loads(payload)
                        if 'choices' not in d:
                            return True
                    except json.JSONDecodeError:
                        pass
            elif s.strip() == '' and prev_dropped:
                return False
            self.wfile.write(line)
            self.wfile.flush()
            return False

    if __name__ == '__main__':
        srv = http.server.ThreadingHTTPServer(('0.0.0.0', PORT), ProxyHandler)
        print(f'hermes-proxy :{PORT} → {HERMES_URL}', flush=True)
        srv.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-proxy
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-proxy
  template:
    metadata:
      labels:
        app: hermes-proxy
        entity: ssint
        env: main
        capability: ai
    spec:
      containers:
        - name: hermes-proxy
          image: python:3.12-alpine
          command: ["python", "/scripts/proxy.py"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HERMES_URL
              value: "http://hermes-agent-web:8642"
            - name: PORT
              value: "8000"
            - name: ACCESS_TEAM_DOMAIN
              value: "https://fqurzlaaagt.cloudflareaccess.com"
            - name: ACCESS_AUD
              value: "afcfa282e581c698462ed0073e0d497979eb6e5d737548dcea72e2e2a643102c"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: team-roster
              mountPath: /secrets/team-roster
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: hermes-proxy-script
        - name: team-roster
          secret:
            secretName: team-roster
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-proxy
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: hermes-proxy
  ports:
    - name: http
      port: 8000
      targetPort: 8000
