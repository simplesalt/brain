---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-proxy-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  proxy.py: |
    #!/usr/bin/env python3
    import base64, hashlib, hmac, json, os, threading, time, http.client, http.server, urllib.request
    from urllib.parse import urlparse

    HERMES_URL = os.environ.get('HERMES_URL', 'http://hermes-agent-web:8642')
    PORT = int(os.environ.get('PORT', '8000'))
    _u = urlparse(HERMES_URL)
    _HOST = _u.hostname
    _PORT = _u.port or (443 if _u.scheme == 'https' else 80)

    ACCESS_TEAM = os.environ.get('ACCESS_TEAM_DOMAIN', '').rstrip('/')
    ACCESS_AUD = os.environ.get('ACCESS_AUD', '')
    ROSTER_PATH = os.environ.get('ROSTER_PATH', '/secrets/team-roster/roster.json')
    ID_HEADER = 'openai-organization'
    SESSION_KEY_HEADER = 'X-Hermes-Session-Key'

    _SKIP_REQ = {'host', 'transfer-encoding', 'connection', 'content-length', ID_HEADER,
                 SESSION_KEY_HEADER.lower()}
    _SKIP_RESP_BASE = {'transfer-encoding', 'connection'}

    _SHA256_PREFIX = bytes.fromhex('3031300d060960864801650304020105000420')
    _keys, _keys_at, _keys_lock = {}, 0.0, threading.Lock()

    def _b64(s):
        return base64.urlsafe_b64decode(s + '=' * (-len(s) % 4))

    def _jwks(force=False):
        global _keys, _keys_at
        with _keys_lock:
            age = time.time() - _keys_at
            if age < 60 or (_keys and age < 3600 and not force):
                return _keys
            try:
                with urllib.request.urlopen(ACCESS_TEAM + '/cdn-cgi/access/certs', timeout=10) as r:
                    doc = json.load(r)
                _keys = {k['kid']: (int.from_bytes(_b64(k['n']), 'big'), int.from_bytes(_b64(k['e']), 'big'))
                         for k in doc.get('keys', []) if k.get('kty') == 'RSA'}
                _keys_at = time.time()
            except Exception as e:
                _keys_at = time.time()
                print(f'hermes-proxy: Access certs fetch failed: {e}', flush=True)
            return _keys

    def _rs256_ok(key, signed, sig):
        n, e = key
        k = (n.bit_length() + 7) // 8
        if len(sig) != k:
            return False
        em = pow(int.from_bytes(sig, 'big'), e, n).to_bytes(k, 'big')
        t = _SHA256_PREFIX + hashlib.sha256(signed).digest()
        want = b'\x00\x01' + b'\xff' * (k - len(t) - 3) + b'\x00' + t
        return hmac.compare_digest(em, want)

    def verify_access_jwt(token):
        """Return the claims of a verified Cloudflare Access JWT that names an email, else None."""
        if not (token and ACCESS_TEAM and ACCESS_AUD) or token.count('.') != 2:
            return None
        try:
            h64, p64, s64 = token.split('.')
            head, claims = json.loads(_b64(h64)), json.loads(_b64(p64))
            if head.get('alg') != 'RS256':
                return None
            key = _jwks().get(head.get('kid')) or _jwks(force=True).get(head.get('kid'))
            if not key or not _rs256_ok(key, (h64 + '.' + p64).encode(), _b64(s64)):
                return None
            now = time.time()
            aud = claims.get('aud')
            aud = aud if isinstance(aud, list) else [aud]
            if claims.get('iss') != ACCESS_TEAM or ACCESS_AUD not in aud:
                return None
            if claims.get('exp', 0) < now - 30 or claims.get('nbf', 0) > now + 30:
                return None
            email = claims.get('email')
            return claims if isinstance(email, str) and '@' in email else None
        except Exception:
            return None

    def display_name(email):
        try:
            with open(ROSTER_PATH) as f:
                roster = json.load(f)
            for entry in roster if isinstance(roster, list) else []:
                if isinstance(entry, dict) and any(
                        isinstance(v, str) and v.strip().lower() == email.lower() for v in entry.values()):
                    return entry.get('display_name') or None
        except Exception:
            pass
        return None

    def oidc_profile(claims):
        """OpenID Connect standard claims for the verified requester."""
        email = claims['email'].strip().lower()
        profile = {'sub': claims.get('sub') or email, 'email': email, 'email_verified': True}
        name = display_name(email)
        if name:
            profile['name'] = name
        return profile

    def session_key(profile):
        return 'agent:main:webui:dm:' + profile['email']

    def identity_note(profile):
        return ('The requester of this conversation, verified by Simple Salt single sign-on, '
                'is described by these OpenID Connect claims. Treat them as who you are talking to.\n'
                '```json\n' + json.dumps(profile, indent=2) + '\n```')

    def with_identity(path, body, profile):
        """Add the verified requester to a chat request body; unchanged if it is not one."""
        try:
            doc = json.loads(body)
        except Exception:
            return body
        note = identity_note(profile)
        p = path.split('?', 1)[0]
        if p.endswith('/chat/completions') and isinstance(doc.get('messages'), list):
            doc['messages'].insert(0, {'role': 'system', 'content': note})
        elif p.endswith('/responses') and isinstance(doc, dict):
            prev = doc.get('instructions')
            doc['instructions'] = note + ('\n\n' + prev if isinstance(prev, str) and prev else '')
        else:
            return body
        return json.dumps(doc).encode()

    FAILED_DIR = os.environ.get('FAILED_DIR', '/data/failed')
    HERMES_KEY = os.environ.get('HERMES_KEY', '')
    RETRY_LIMIT = 3
    RETRY_INTERVAL = int(os.environ.get('RETRY_INTERVAL', '60'))
    _retry_lock = threading.Lock()

    def save_failure(raw, profile, reason):
        """Keep a chat Hermes did not finish in its own folder, for the retry loop."""
        try:
            doc = json.loads(raw)
        except Exception:
            return
        if not any(isinstance(m, dict) and m.get('role') == 'user' for m in doc.get('messages') or []):
            return
        rid = time.strftime('%Y%m%d-%H%M%S', time.gmtime()) + '-' + hashlib.sha256(raw).hexdigest()[:6]
        d = os.path.join(FAILED_DIR, rid)
        os.makedirs(d, exist_ok=True)
        with open(os.path.join(d, 'request.json'), 'wb') as f:
            f.write(raw)
        _write_state(d, {'reason': reason, 'failed_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                         'profile': profile, 'state': 'pending', 'attempts': 0})
        print(f'hermes-proxy: saved failed chat {rid}: {reason}', flush=True)

    def _write_state(d, state):
        with open(os.path.join(d, 'state.json.tmp'), 'w') as f:
            json.dump(state, f, indent=1)
        os.replace(os.path.join(d, 'state.json.tmp'), os.path.join(d, 'state.json'))

    def _retry_one(rid, d, state):
        """Re-send the saved chat with a note that the last attempt failed; True when Hermes finished."""
        with open(os.path.join(d, 'request.json'), 'rb') as f:
            doc = json.loads(f.read())
        doc['messages'].append({'role': 'user', 'content': (
            f"[Note from the chat relay, not from Dylan] Your previous attempt to answer the message above "
            f"failed ({state['reason']}) at {state['failed_at']}; the conversation is saved as failed chat {rid}. "
            f"Look at it and try again: finish what was asked, then say briefly what you did.")})
        doc['stream'] = True
        profile = state.get('profile')
        body = json.dumps(doc).encode()
        if profile:
            body = with_identity('/v1/chat/completions', body, profile)
        headers = {'Content-Type': 'application/json', 'Content-Length': str(len(body)),
                   'Authorization': 'Bearer ' + HERMES_KEY}
        if profile:
            headers[SESSION_KEY_HEADER] = session_key(profile)
        conn = http.client.HTTPConnection(_HOST, _PORT, timeout=900)
        try:
            conn.request('POST', '/v1/chat/completions', body=body, headers=headers)
            r = conn.getresponse()
            if r.status >= 400:
                state['last_error'] = f'HTTP {r.status}'
                return False
            text, finish = [], None
            for line in r:
                s = line.decode('utf-8', errors='replace').strip()
                if not s.startswith('data: ') or s == 'data: [DONE]':
                    continue
                try:
                    for c in json.loads(s[6:]).get('choices') or []:
                        text.append((c.get('delta') or {}).get('content') or '')
                        finish = c.get('finish_reason') or finish
                except Exception:
                    pass
            with open(os.path.join(d, 'reply.md'), 'w') as f:
                f.write(''.join(text))
            state['last_error'] = None if finish not in (None, 'error') else f'finish_reason {finish}'
            return state['last_error'] is None
        finally:
            conn.close()

    def retry_loop():
        """Every RETRY_INTERVAL seconds, re-ask Hermes each saved chat that is still pending, up to RETRY_LIMIT times."""
        while True:
            time.sleep(RETRY_INTERVAL)
            try:
                names = sorted(os.listdir(FAILED_DIR))
            except FileNotFoundError:
                continue
            for rid in names:
                d = os.path.join(FAILED_DIR, rid)
                try:
                    with open(os.path.join(d, 'state.json')) as f:
                        state = json.load(f)
                    if state.get('state') != 'pending':
                        continue
                    state['attempts'] += 1
                    try:
                        ok = _retry_one(rid, d, state)
                    except Exception as e:
                        ok, state['last_error'] = False, repr(e)
                    if ok:
                        state['state'] = 'retried'
                    elif state['attempts'] >= RETRY_LIMIT:
                        state['state'] = 'gave-up'
                    state['last_attempt_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
                    _write_state(d, state)
                    print(f"hermes-proxy: retried failed chat {rid} (attempt {state['attempts']}): {state['state']}"
                          f"{'' if ok else ' ' + str(state.get('last_error'))}", flush=True)
                except Exception as e:
                    print(f'hermes-proxy: retry of {rid} skipped: {e!r}', flush=True)

    SIDE_KEY = os.environ.get('SIDE_LLM_API_KEY', '')
    SIDE_MODEL = os.environ.get('SIDE_LLM_MODEL', 'openai/gpt-oss-120b')
    SIDE_MARKERS = ('extract a concise chat title',)

    def is_side_request(doc):
        """A chat-app housekeeping call (such as naming the chat) that is not a message from a person."""
        msgs = doc.get('messages') if isinstance(doc, dict) else None
        if not isinstance(msgs, list) or not msgs or not isinstance(msgs[-1], dict):
            return False
        last = msgs[-1].get('content')
        if isinstance(last, list):
            last = ' '.join(p.get('text', '') for p in last if isinstance(p, dict))
        return isinstance(last, str) and any(m in last for m in SIDE_MARKERS)

    def answer_side_request(doc):
        """Answer a housekeeping call with a plain model, so it never reaches Hermes or its memory."""
        req = {'model': SIDE_MODEL, 'messages': doc['messages'], 'stream': False}
        for k in ('max_tokens', 'temperature'):
            if k in doc:
                req[k] = doc[k]
        r = urllib.request.Request('https://openrouter.ai/api/v1/chat/completions', data=json.dumps(req).encode(),
                                   headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SIDE_KEY})
        with urllib.request.urlopen(r, timeout=60) as resp:
            out = json.load(resp)
        return (out.get('choices') or [{}])[0].get('message', {}).get('content') or ''

    class ProxyHandler(http.server.BaseHTTPRequestHandler):
        timeout = 300

        def _side(self, doc, is_stream):
            text = answer_side_request(doc)
            created, rid = int(time.time()), 'side-' + hashlib.sha256(text.encode()).hexdigest()[:12]
            if is_stream:
                chunks = [{'choices': [{'index': 0, 'delta': {'role': 'assistant', 'content': text}, 'finish_reason': None}]},
                          {'choices': [{'index': 0, 'delta': {}, 'finish_reason': 'stop'}]}]
                payload = b''.join(b'data: ' + json.dumps(dict(c, id=rid, object='chat.completion.chunk',
                                                               created=created, model=SIDE_MODEL)).encode() + b'\n\n'
                                   for c in chunks) + b'data: [DONE]\n\n'
                ctype = 'text/event-stream'
            else:
                payload = json.dumps({'id': rid, 'object': 'chat.completion', 'created': created, 'model': SIDE_MODEL,
                                      'choices': [{'index': 0, 'message': {'role': 'assistant', 'content': text},
                                                   'finish_reason': 'stop'}]}).encode()
                ctype = 'application/json'
            self.send_response(200)
            self.send_header('Content-Type', ctype)
            self.send_header('Content-Length', str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)
        def do_GET(self): self._proxy()
        def do_POST(self): self._proxy()
        def do_PUT(self): self._proxy()
        def do_DELETE(self): self._proxy()
        def log_message(self, *a): pass

        def _proxy(self):
            n = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(n) if n else b''
            raw = body
            is_stream, doc = False, None
            try:
                if body:
                    doc = json.loads(body)
                    is_stream = bool(doc.get('stream'))
            except Exception:
                pass
            if (SIDE_KEY and self.command == 'POST' and self.path.split('?', 1)[0].endswith('/chat/completions')
                    and is_side_request(doc)):
                try:
                    return self._side(doc, is_stream)
                except Exception as e:
                    print(f'hermes-proxy: side request answered by Hermes instead: {e!r}', flush=True)
            claims = verify_access_jwt(self.headers.get(ID_HEADER, ''))
            profile = oidc_profile(claims) if claims else None
            if profile and body:
                body = with_identity(self.path, body, profile)
            fwd = {k: v for k, v in self.headers.items() if k.lower() not in _SKIP_REQ}
            # Chat Completions only: on Responses/Runs a session key also merges conversations.
            is_chat = self.command == 'POST' and self.path.split('?', 1)[0].endswith('/chat/completions')
            if profile and is_chat:
                fwd[SESSION_KEY_HEADER] = session_key(profile)
            if body or self.command in ('POST', 'PUT'):
                fwd['Content-Length'] = str(len(body))
            self._finish, failure, conn = None, None, None
            try:
                conn = http.client.HTTPConnection(_HOST, _PORT, timeout=300)
                conn.request(self.command, self.path, body=body, headers=fwd)
                r = conn.getresponse()
                if r.status >= 400:
                    failure = f'Hermes answered HTTP {r.status}'
                self.send_response(r.status)
                skip = _SKIP_RESP_BASE | ({'content-length'} if is_stream else set())
                for k, v in r.getheaders():
                    if k.lower() not in skip:
                        self.send_header(k, v)
                self.end_headers()
                if is_stream:
                    self._stream(r)
                    if failure is None and self._finish in (None, 'error'):
                        failure = 'Hermes hit an error mid-reply' if self._finish else 'the reply stopped before it finished'
                else:
                    self.wfile.write(r.read())
            except Exception as e:
                failure = failure or f'the connection broke mid-reply ({type(e).__name__})'
                try: self.send_error(502, str(e))
                except Exception: pass
            finally:
                if conn is not None:
                    try: conn.close()
                    except Exception: pass
                if is_chat and failure:
                    try:
                        save_failure(raw, profile, failure)
                    except Exception as e:
                        print(f'hermes-proxy: could not save failed chat: {e!r}', flush=True)

        def _stream(self, r):
            buf = b''
            prev_dropped = False
            while True:
                chunk = r.read(4096)
                if not chunk:
                    break
                buf += chunk
                while True:
                    i = buf.find(b'\n')
                    if i == -1:
                        break
                    line, buf = buf[:i+1], buf[i+1:]
                    prev_dropped = self._sse_line(line, prev_dropped)
            if buf:
                self._sse_line(buf, prev_dropped)

        def _sse_line(self, line, prev_dropped):
            """Return True if this line was dropped (suppresses following blank line)."""
            s = line.decode('utf-8', errors='replace')
            if s.startswith('data: '):
                payload = s[6:].strip()
                if payload != '[DONE]':
                    try:
                        d = json.loads(payload)
                        if 'choices' not in d:
                            return True
                        for c in d['choices'] or []:
                            if isinstance(c, dict) and c.get('finish_reason'):
                                self._finish = c['finish_reason']
                    except json.JSONDecodeError:
                        pass
            elif s.strip() == '' and prev_dropped:
                return False
            self.wfile.write(line)
            self.wfile.flush()
            return False

    if __name__ == '__main__':
        threading.Thread(target=retry_loop, daemon=True).start()
        srv = http.server.ThreadingHTTPServer(('0.0.0.0', PORT), ProxyHandler)
        print(f'hermes-proxy :{PORT} → {HERMES_URL}', flush=True)
        srv.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-proxy
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-proxy
  template:
    metadata:
      labels:
        app: hermes-proxy
        entity: ssint
        env: main
        capability: ai
    spec:
      containers:
        - name: hermes-proxy
          image: python:3.12-alpine
          command: ["python", "/scripts/proxy.py"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HERMES_URL
              value: "http://hermes-agent-web:8642"
            - name: PORT
              value: "8000"
            - name: FAILED_DIR
              value: /data/failed
            - name: HERMES_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_BEARER_TOKEN
            - name: SIDE_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: ACCESS_TEAM_DOMAIN
              value: "https://fqurzlaaagt.cloudflareaccess.com"
            - name: ACCESS_AUD
              value: "afcfa282e581c698462ed0073e0d497979eb6e5d737548dcea72e2e2a643102c"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: team-roster
              mountPath: /secrets/team-roster
              readOnly: true
            - name: failed
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: failed
          persistentVolumeClaim:
            claimName: hermes-proxy-failed
        - name: script
          configMap:
            name: hermes-proxy-script
        - name: team-roster
          secret:
            secretName: team-roster
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-proxy
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: hermes-proxy
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-proxy-failed
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
