apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-oci-t961
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.48.0"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  values:
    instanceId: t961
    repo:
      slug: oci
      ref: main
    oauthSecret:
      create: true
    resources:
      builder:
        requests:
          memory: 512Mi
    hindsight:
      bankId: ssint-build-oci
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: false
    podAnnotations:
      simplesalt.company/restart-epoch: "1"
    dispatch:
      enabled: true
      port: 8080
      hopLimit: 3
      sessionCap: 2
