
---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-credentials
  namespace: crossplane-system
  labels:
    entity: ssint
    env: main
    capability: access
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque

---
apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: gcp-default
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  projectID: internalapps-481018
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-credentials
      key: credentials

---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectService
metadata:
  name: admin-googleapis-com
  labels:
    entity: ssint
    env: main
    capability: access
  annotations:
    crossplane.io/external-name: admin.googleapis.com
spec:
  forProvider:
    project: internalapps-481018
    service: admin.googleapis.com
    disableOnDestroy: false
    disableDependentServices: false
  providerConfigRef:
    name: gcp-default

---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: cloudflare-sso-agent
  labels:
    entity: ssint
    env: main
    capability: access
  annotations:
    crossplane.io/external-name: cloudflare-sso-agent
spec:
  forProvider:
    project: internalapps-481018
    displayName: Cloudflare SSO SCIM Agent
    description: Used by Cloudflare Zero Trust for Google Workspace SCIM provisioning
  providerConfigRef:
    name: gcp-default

---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccountKey
metadata:
  name: cloudflare-sso-agent-key
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  forProvider:
    serviceAccountIdRef:
      name: cloudflare-sso-agent
  writeConnectionSecretToRef:
    namespace: crossplane-system
    name: cloudflare-sso-agent-key
  providerConfigRef:
    name: gcp-default
