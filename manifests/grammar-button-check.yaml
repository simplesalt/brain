---
# One-off check of SS chat's grammar button in a browser with no cookies, at a
# phone and a desktop screen size, plus a look at the page's menus. Cloudflare
# is not in this path, so the API host is stood in for: the first call fails as
# it does without the API host's cookie, the sign-in pass-through returns as a
# signed-in one would, and the retry answers.
apiVersion: batch/v1
kind: Job
metadata:
  name: grammar-button-check-4
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: ai
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: mcr.microsoft.com/playwright/python:v1.48.0-jammy
          # The image carries the browsers but not the Python package.
          command: ["sh", "-c", "pip install -q --root-user-action=ignore playwright==1.48.0 && python -c \"$CHECK\""]
          env:
            - name: CHECK
              value: |
                import json, urllib.parse
                from playwright.sync_api import sync_playwright
                BASE = 'http://big-agi:3000'
                API = 'https://api.simplesalt.company/45e6451afc312886/grammar'
                TEXT = 'hello. this is a test. of the grammar button'
                FIXED = 'Hello, this is a test of the grammar button.'
                VISIBLE = '''sel => [...document.querySelectorAll(sel)].filter(e => e.offsetParent || e.getClientRects().length)
                  .map(e => (e.getAttribute('aria-label') || e.getAttribute('title') || e.innerText || '').trim().slice(0, 30))'''
                ok = True
                with sync_playwright() as p:
                    b = p.chromium.launch()
                    for name, opts in (('phone', dict(viewport={'width': 390, 'height': 844}, is_mobile=True, has_touch=True)),
                                       ('desktop', dict(viewport={'width': 1280, 'height': 800}))):
                        ctx = b.new_context(**opts)
                        print(name, 'cookies at start:', ctx.cookies(), flush=True)
                        seen = {'post': 0, 'hop': None}
                        cors = {'Access-Control-Allow-Origin': BASE, 'Access-Control-Allow-Credentials': 'true'}
                        def api(route, req):
                            if req.method == 'OPTIONS':
                                return route.fulfill(status=204, headers={**cors, 'Access-Control-Allow-Methods': 'POST', 'Access-Control-Allow-Headers': 'content-type'})
                            if req.method == 'POST':
                                seen['post'] += 1
                                if seen['post'] == 1:
                                    return route.abort('failed')
                                return route.fulfill(status=200, content_type='application/json', body=json.dumps({'text': FIXED}), headers=cors)
                            back = urllib.parse.parse_qs(urllib.parse.urlsplit(req.url).query).get('return', [''])[0]
                            seen['hop'] = back
                            return route.fulfill(status=302, headers={'Location': back})
                        ctx.route(API + '*', api)
                        page = ctx.new_page()
                        page.on('console', lambda m: print(name, 'console:', m.type, m.text[:200], flush=True) if m.type in ('error', 'warning') else None)
                        page.goto(BASE + '/', wait_until='networkidle', timeout=90000)
                        mic = page.evaluate('fetch([...document.scripts].find(s => s.src.includes("mic.js")).src).then(r => r.text())')
                        print(name, 'button has sign-in pass-through:', 'signInAndRetry' in mic, flush=True)
                        page.wait_for_selector('#stt-fix', state='visible', timeout=60000)
                        page.locator('textarea:visible').last.fill(TEXT)
                        btn = page.locator('#stt-fix')
                        btn.tap() if name == 'phone' else btn.click()
                        try:
                            page.wait_for_function('t => [...document.querySelectorAll("textarea")].some(x => x.value === t)', arg=FIXED, timeout=45000)
                        except Exception as e:
                            print(name, 'no fix landed:', str(e)[:100], flush=True)
                        toast = page.evaluate('document.getElementById("stt-toast")?.innerText || ""')
                        box = page.evaluate('[...document.querySelectorAll("textarea")].map(t => t.value)')
                        print(name, 'calls:', seen['post'], 'returned to:', seen['hop'], 'url:', page.url, 'toast:', toast, 'boxes:', box, flush=True)
                        passed = seen['post'] == 2 and (seen['hop'] or '').startswith(BASE) and FIXED in box
                        # Menus on this layout, to pick where Refresh sign-in goes.
                        print(name, 'visible buttons:', page.evaluate(VISIBLE, 'button'), flush=True)
                        for label in page.evaluate(VISIBLE, 'button[aria-haspopup], button[aria-label*="enu" i], button[aria-label*="ption" i]'):
                            try:
                                page.locator(f'button[aria-label="{label}"]').first.click(timeout=5000)
                                page.wait_for_timeout(800)
                                print(name, 'menu', repr(label), '->', page.evaluate(VISIBLE, '[role="menu"] [role="menuitem"], [role="menu"] li, .MuiDrawer-root a, .MuiDrawer-root button'), flush=True)
                                page.keyboard.press('Escape')
                                page.wait_for_timeout(400)
                            except Exception as e:
                                print(name, 'menu', repr(label), 'not opened:', str(e)[:80], flush=True)
                        print(name, 'PASS' if passed else 'FAIL', flush=True)
                        ok = ok and passed
                        ctx.close()
                    b.close()
                print('RESULT', 'PASS' if ok else 'FAIL')
                raise SystemExit(0 if ok else 1)
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
