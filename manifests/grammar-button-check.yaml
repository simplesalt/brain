---
# One-off check of SS chat's grammar button in a browser with no sign-in
# cookies, at a phone and a desktop screen size: the tap must call this site's
# /_grammar (never the API host) and reach the grammar service, and a reply
# must land in the chat box.
apiVersion: batch/v1
kind: Job
metadata:
  name: grammar-button-check-2
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: ai
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: mcr.microsoft.com/playwright/python:v1.48.0-jammy
          # The image carries the browsers but not the Python package.
          command: ["sh", "-c", "pip install -q playwright==1.48.0 && python -c \"$CHECK\""]
          env:
            - name: CHECK
              value: |
                import json
                from playwright.sync_api import sync_playwright
                BASE = 'http://big-agi:3000'
                TEXT = 'hello. this is a test. of the grammar button'
                FIXED = 'Hello, this is a test of the grammar button.'
                ok = True
                with sync_playwright() as p:
                    b = p.chromium.launch(args=['--use-fake-ui-for-media-stream'])
                    for name, opts in (('phone', dict(viewport={'width': 390, 'height': 844}, is_mobile=True, has_touch=True)),
                                       ('desktop', dict(viewport={'width': 1280, 'height': 800}))):
                        ctx = b.new_context(**opts)
                        print(name, 'cookies at start:', ctx.cookies())
                        page = ctx.new_page()
                        urls = []
                        page.on('request', lambda r: urls.append(r.url) if 'grammar' in r.url else None)
                        page.goto(BASE + '/', wait_until='networkidle', timeout=90000)
                        page.wait_for_selector('#stt-fix', state='visible', timeout=60000)
                        ta = page.locator('textarea:visible').last
                        ta.fill(TEXT)
                        tap = (lambda: page.locator('#stt-fix').tap()) if name == 'phone' else (lambda: page.locator('#stt-fix').click())
                        with page.expect_response(lambda r: 'grammar' in r.url, timeout=30000) as ri:
                            tap()
                        r = ri.value
                        print(name, 'real call:', r.url, r.status, r.text()[:200])
                        page.wait_for_selector('#stt-toast', timeout=10000)
                        print(name, 'toast:', page.locator('#stt-toast').inner_text())
                        real = r.url == BASE + '/_grammar' and r.status == 401 and 'not signed in' in r.text()
                        # In the cluster there is no Cloudflare sign-in, so the service rightly refuses;
                        # now stand in for a signed-in reply to check it lands in the chat box.
                        page.route('**/_grammar', lambda route: route.fulfill(status=200, content_type='application/json', body=json.dumps({'text': FIXED})))
                        page.wait_for_timeout(500)
                        tap()
                        page.wait_for_function('t => [...document.querySelectorAll("textarea")].some(x => x.value === t)', arg=FIXED, timeout=10000)
                        print(name, 'chat box after reply:', ta.input_value())
                        print(name, 'grammar requests:', urls)
                        api = [u for u in urls if 'api.simplesalt.company' in u]
                        passed = real and not api and ta.input_value() == FIXED
                        print(name, 'PASS' if passed else 'FAIL')
                        ok = ok and passed
                        ctx.close()
                    b.close()
                print('RESULT', 'PASS' if ok else 'FAIL')
                raise SystemExit(0 if ok else 1)
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
