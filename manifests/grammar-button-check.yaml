---
# One-off check of SS chat's grammar button and Refresh sign-in in a browser with
# no cookies, at a phone and a desktop screen size. Cloudflare is not in this
# path, so the API host is stood in for: the first call fails as it does without
# the API host's cookie, the sign-in pass-through returns as a signed-in one
# would, and the retry answers.
apiVersion: batch/v1
kind: Job
metadata:
  name: grammar-button-check-7
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: ai
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: mcr.microsoft.com/playwright/python:v1.48.0-jammy
          # The image carries the browsers but not the Python package; the wait lets
          # the new scripts reach big-AGI's pod first.
          command: ["sh", "-c", "pip install -q --root-user-action=ignore playwright==1.48.0 && sleep 120 && python -c \"$CHECK\""]
          env:
            - name: CHECK
              value: |
                import json, urllib.parse
                from playwright.sync_api import sync_playwright
                BASE = 'http://big-agi:3000'
                API = 'https://api.simplesalt.company/45e6451afc312886/grammar'
                TEXT = 'hello. this is a test. of the grammar button'
                FIXED = 'Hello, this is a test of the grammar button.'
                ok = True
                with sync_playwright() as p:
                    b = p.chromium.launch()
                    for name, opts in (('phone', dict(viewport={'width': 390, 'height': 844}, is_mobile=True, has_touch=True)),
                                       ('desktop', dict(viewport={'width': 1280, 'height': 800}))):
                        ctx = b.new_context(**opts)
                        print(name, 'cookies at start:', ctx.cookies(), flush=True)
                        seen = {'post': 0, 'hop': None, 'logout': 0}
                        cors = {'Access-Control-Allow-Origin': BASE, 'Access-Control-Allow-Credentials': 'true'}
                        def api(route, req):
                            if req.method == 'OPTIONS':
                                return route.fulfill(status=204, headers={**cors, 'Access-Control-Allow-Methods': 'POST', 'Access-Control-Allow-Headers': 'content-type'})
                            if req.method == 'POST':
                                seen['post'] += 1
                                if seen['post'] == 1:
                                    return route.abort('failed')
                                return route.fulfill(status=200, content_type='application/json', body=json.dumps({'text': FIXED}), headers=cors)
                            back = urllib.parse.parse_qs(urllib.parse.urlsplit(req.url).query).get('return', [''])[0]
                            seen['hop'] = back
                            return route.fulfill(status=302, headers={'Location': back})
                        ctx.route(API + '*', api)
                        def logout(route, req):
                            seen['logout'] += 1
                            route.fulfill(status=200, body='')
                        ctx.route('**/cdn-cgi/access/logout*', logout)
                        page = ctx.new_page()
                        page.goto(BASE + '/', wait_until='networkidle', timeout=90000)
                        page.wait_for_selector('#stt-fix', state='visible', timeout=60000)
                        page.locator('textarea:visible').last.fill(TEXT)
                        btn = page.locator('#stt-fix')
                        btn.tap() if name == 'phone' else btn.click()
                        try:
                            page.wait_for_function('t => [...document.querySelectorAll("textarea")].some(x => x.value === t)', arg=FIXED, timeout=45000)
                        except Exception as e:
                            print(name, 'no fix landed:', str(e)[:100], flush=True)
                        toast = page.evaluate('document.getElementById("stt-toast")?.innerText || ""')
                        box = page.evaluate('[...document.querySelectorAll("textarea")].map(t => t.value)')
                        print(name, 'grammar calls:', seen['post'], 'sign-in pass-through returned to:', seen['hop'], 'toast:', repr(toast), 'chat box:', box, flush=True)
                        fixed = seen['post'] == 2 and (seen['hop'] or '').startswith(BASE) and FIXED in box
                        # Refresh sign-in: in the chat list's View options menu, not on screen.
                        on_screen = page.evaluate('[...document.querySelectorAll("button,a")].filter(e => e.offsetParent).some(e => /Refresh sign-in|Sign out/.test(e.innerText + (e.getAttribute("aria-label") || "")))')
                        view = page.locator('button[aria-label="View options"]:visible')
                        if name == 'phone' and not view.count():
                            # The phone's chat list is in the drawer, opened by the top bar's first button.
                            page.locator('button:visible').first.click()
                            page.wait_for_timeout(1000)
                        print(name, 'View options visible:', view.count(), flush=True)
                        try:
                            view.first.click(timeout=10000)
                        except Exception as e:
                            print(name, 'View options click failed:', str(e)[:100], flush=True)
                        page.wait_for_timeout(1000)
                        print(name, 'menus:', page.evaluate('[...document.querySelectorAll(\'[role="menu"]\')].map(m => m.textContent.slice(0, 80))'), flush=True)
                        item = page.locator('[role="menu"] .ss-refresh')
                        found = True
                        try:
                            item.wait_for(state='attached', timeout=10000)
                            print(name, 'menu items:', page.evaluate('[...document.querySelectorAll(\'[role="menu"] [role="menuitem"]\')].map(e => e.innerText.trim()).slice(-4)'), flush=True)
                            with page.expect_event('load', timeout=30000):
                                page.evaluate('document.querySelector(\'[role="menu"] .ss-refresh\').click()')
                        except Exception as e:
                            found = False
                            print(name, 'Refresh sign-in not found or did not reload:', str(e)[:100], flush=True)
                        print(name, 'Refresh sign-in button on screen:', on_screen, 'in menu:', found, 'cleared sign-in:', seen['logout'], flush=True)
                        passed = fixed and found and not on_screen and seen['logout'] == 1
                        print(name, 'PASS' if passed else 'FAIL', flush=True)
                        ok = ok and passed
                        ctx.close()
                    b.close()
                print('RESULT', 'PASS' if ok else 'FAIL')
                raise SystemExit(0 if ok else 1)
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
