apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-replay-arg-probe-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  probe.py: |
    import concurrent.futures, json, os, sys, threading, urllib.request
    sys.path.insert(0, '/opt/hermes')
    from tools.mcp_tool_schema import _normalize_mcp_input_schema, mcp_prefixed_tool_name
    from tools.schema_sanitizer import sanitize_tool_schemas

    KEY = os.environ['OPENROUTER_API_KEY']
    MODEL = os.environ.get('PROBE_MODEL', '@preset/live-reasoning')
    TRIALS = int(os.environ.get('PROBE_TRIALS', '3'))
    HOSTS = os.environ['PROBE_HOSTS'].split(',')
    POINTS = [int(x) for x in os.environ['PROBE_POINTS'].split(',')]
    SID = os.environ['PROBE_SESSION']
    CHATS = os.environ.get('CHATS_URL', 'http://hermes-chats:8080')
    lock = threading.Lock()

    def emit(obj):
        with lock:
            print(json.dumps(obj, ensure_ascii=False), flush=True)

    def get(url):
        with urllib.request.urlopen(url, timeout=60) as r:
            return json.loads(r.read())

    def mcp_tools(url, token=None):
        hdr = {'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream'}
        if token:
            hdr['Authorization'] = 'Bearer ' + token
        def rpc(body, sid=None):
            h = dict(hdr)
            if sid:
                h['Mcp-Session-Id'] = sid
            req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=h, method='POST')
            with urllib.request.urlopen(req, timeout=30) as r:
                sid = r.headers.get('Mcp-Session-Id') or sid
                raw = r.read().decode()
            for line in raw.splitlines():
                if line.startswith('data:'):
                    raw = line[5:].strip()
            return (json.loads(raw) if raw.strip() else None), sid
        _, sid = rpc({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {
            'protocolVersion': '2025-06-18', 'capabilities': {}, 'clientInfo': {'name': 'replay-arg-probe', 'version': '1'}}})
        rpc({'jsonrpc': '2.0', 'method': 'notifications/initialized'}, sid)
        res, _ = rpc({'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'}, sid)
        return {t['name']: t for t in res['result']['tools']}

    GB_INCLUDE = ['search', 'query', 'get_page', 'put_page', 'edit_page', 'append_page', 'list_pages', 'get_timeline',
                  'chronicle_day', 'add_timeline_entry', 'get_raw_data', 'sources_list', 'add_tag', 'remove_tag', 'get_tags',
                  'add_link', 'get_backlinks', 'open_loops', 'find_experts', 'resolve_slugs', 'capture',
                  'mark_page_for_deletion', 'propose_page_replacement', 'withdraw_page_mark', 'get_versions', 'revert_version']
    raw = []
    gb = mcp_tools(os.environ['GBRAIN_URL'], os.environ['GBRAIN_REMOTE_TOKEN'])
    raw += [('gbrain', n, gb[n]['description'], gb[n]['inputSchema']) for n in GB_INCLUDE if n in gb]
    fixed = json.load(open('/probe/fixed-tools.json'))
    raw += [('notion', n, t['description'], t['inputSchema']) for n, t in fixed['notion'].items()]
    raw += [('efforts', n, t['description'], t['inputSchema']) for n, t in fixed['efforts'].items()]
    try:
        hm = mcp_tools(os.environ['HERMES_MSG_URL'])
        raw += [('hermes-msg', n, t.get('description') or '', t['inputSchema']) for n, t in hm.items()]
    except Exception as e:
        emit({'kind': 'note', 'hermes_msg_tools': 'unavailable: ' + repr(e)[:200]})
    TOOLS = sanitize_tool_schemas([{'type': 'function', 'function': {
        'name': mcp_prefixed_tool_name(srv, n), 'description': d, 'parameters': _normalize_mcp_input_schema(s)}}
        for srv, n, d, s in raw])
    emit({'kind': 'tools', 'count': len(TOOLS), 'names': [t['function']['name'] for t in TOOLS]})
    SYSTEM = open('/probe/SOUL.md').read() + '\n\n' + open('/probe/AGENTS.md').read()

    sess = get(f'{CHATS}/sessions/{SID}')
    ids = sorted(int(m['msg_id']) for m in sess['messages'])
    def fetch(i):
        return i, json.loads(get(f'{CHATS}/messages/{SID}/{i}?part=all&limit=1000000')['text'])
    with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
        MSGS = dict(ex.map(fetch, [i for i in ids if i < max(POINTS)]))

    def history(n):
        out, pending = [], set()
        for i in sorted(MSGS):
            if i >= n:
                break
            m = MSGS[i]
            role = m.get('role')
            if role == 'user':
                out.append({'role': 'user', 'content': m.get('content') or ''})
            elif role == 'assistant':
                a = {'role': 'assistant', 'content': m.get('content') or ''}
                tcs = m.get('tool_calls')
                tcs = json.loads(tcs) if isinstance(tcs, str) else (tcs or [])
                if tcs:
                    a['tool_calls'] = [{'id': t['id'], 'type': 'function', 'function': {
                        'name': t['function']['name'], 'arguments': t['function'].get('arguments') or '{}'}} for t in tcs]
                    pending = {t['id'] for t in tcs}
                r = m.get('reasoning') or m.get('reasoning_content')
                if r:
                    a['reasoning'] = r
                out.append(a)
            elif role == 'tool':
                if m.get('tool_call_id') in pending:
                    out.append({'role': 'tool', 'tool_call_id': m['tool_call_id'], 'content': m.get('content') or ''})
                    pending.discard(m['tool_call_id'])
        fixed_out, i = [], 0
        while i < len(out):
            m = out[i]
            if m['role'] == 'assistant' and m.get('tool_calls'):
                j = i + 1
                got = set()
                while j < len(out) and out[j]['role'] == 'tool':
                    got.add(out[j]['tool_call_id'])
                    j += 1
                m = dict(m)
                m['tool_calls'] = [t for t in m['tool_calls'] if t['id'] in got]
                if not m['tool_calls']:
                    m.pop('tool_calls')
                fixed_out.append(m)
                fixed_out.extend(out[i + 1:j])
                i = j
                continue
            fixed_out.append(m)
            i += 1
        return [{'role': 'system', 'content': SYSTEM}] + fixed_out

    def original(n):
        m = MSGS.get(n) or json.loads(get(f'{CHATS}/messages/{SID}/{n}?part=all&limit=1000000')['text'])
        tcs = m.get('tool_calls')
        tcs = json.loads(tcs) if isinstance(tcs, str) else (tcs or [])
        return [{'name': t['function']['name'], 'arguments': t['function'].get('arguments')} for t in tcs]

    def flags(n, name, args):
        f = []
        if name == 'mcp__gbrain__query' and not (args.get('query') or args.get('image')):
            f.append('LOST:query')
        if name == 'mcp__efforts__effort_find' and not (args.get('why') or args.get('what') or args.get('where')):
            f.append('LOST:why/what/where')
        if name == 'mcp__gbrain__add_link' and not args.get('link_type'):
            f.append('LOST:link_type')
        if name == 'mcp__gbrain__chronicle_day' and n == 150 and 'week' not in args:
            f.append('LOST:week' + ('(narrative instead)' if 'narrative' in args else ''))
        if name == 'mcp__notion__API_query_data_source' and args.get('filter') == {}:
            f.append('LOST:filter')
        if name == 'mcp__notion__API_post_search' and not args.get('query') and n == 65:
            f.append('LOST:query')
        if name.startswith('mcp__notion__') and args.get('archived') is False:
            f.append('EXTRA:archived=false')
        return f

    def stream(body):
        req = urllib.request.Request('https://openrouter.ai/api/v1/chat/completions', method='POST',
                                     data=json.dumps(body).encode())
        req.add_header('Authorization', 'Bearer ' + KEY)
        req.add_header('Content-Type', 'application/json')
        out = {'provider': None, 'finish_reason': None, 'reasoning': '', 'content': '', 'calls': {}, 'id': None, 'usage': None}
        try:
            with urllib.request.urlopen(req, timeout=900) as r:
                for line in r:
                    line = line.decode().strip()
                    if not line.startswith('data:') or line == 'data: [DONE]':
                        continue
                    c = json.loads(line[5:])
                    if c.get('error'):
                        out['error'] = str(c['error'])[:400]
                        continue
                    out['provider'] = c.get('provider') or out['provider']
                    out['id'] = c.get('id') or out['id']
                    out['usage'] = c.get('usage') or out['usage']
                    for ch in c.get('choices') or []:
                        d = ch.get('delta') or {}
                        out['reasoning'] += d.get('reasoning') or ''
                        out['content'] += d.get('content') or ''
                        for tc in d.get('tool_calls') or []:
                            e = out['calls'].setdefault(tc.get('index', 0), {'name': '', 'arguments': ''})
                            fn = tc.get('function') or {}
                            if fn.get('name'):
                                e['name'] = fn['name']
                            e['arguments'] += fn.get('arguments') or ''
                        out['finish_reason'] = ch.get('finish_reason') or out['finish_reason']
        except urllib.error.HTTPError as e:
            out['error'] = f'HTTP {e.code}: {e.read().decode()[:400]}'
        except Exception as e:
            out['error'] = repr(e)[:400]
        return out

    HIST = {n: history(n) for n in POINTS}
    for n in POINTS:
        emit({'kind': 'point', 'msg': n, 'history_messages': len(HIST[n]), 'history_chars': len(json.dumps(HIST[n])),
              'original_calls': original(n)})

    NOTION = {
        'notion_query': [{'role': 'system', 'content': 'You are Hermes, an assistant with tools. Do exactly what the user asks: make the one tool call with exactly the arguments given, then stop. Do not add other arguments.'},
                         {'role': 'user', 'content': 'Call mcp__notion__API_query_data_source once with data_source_id "212e6a5b-9779-813d-9db3-000be6a116cc", filter {"property": "Status", "status": {"does_not_equal": "Done"}}, filter_properties ["title", "Status"] and page_size 25.'}],
        'notion_search': [{'role': 'system', 'content': 'You are Hermes, an assistant with tools. Do exactly what the user asks: make the one tool call with exactly the arguments given, then stop. Do not add other arguments.'},
                          {'role': 'user', 'content': 'Call mcp__notion__API_post_search once with query "Tasks", filter {"property": "object", "value": "data_source"} and page_size 10.'}],
    }

    def nflags(case, name, a):
        f = []
        if case == 'notion_query' and name == 'mcp__notion__API_query_data_source':
            if a.get('filter') in ({}, None, ''):
                f.append('LOST:filter')
            if not a.get('filter_properties'):
                f.append('LOST:filter_properties')
        if case == 'notion_search' and name == 'mcp__notion__API_post_search':
            flt = a.get('filter')
            flt = json.loads(flt) if isinstance(flt, str) and flt.strip().startswith('{') else flt
            if not isinstance(flt, dict) or flt.get('value') != 'data_source':
                f.append('CHANGED:filter')
        if name.startswith('mcp__notion__') and a.get('archived') is False:
            f.append('EXTRA:archived=false')
        return f

    def route(spec):
        kind, _, val = spec.partition(':')
        return {'only': [val], 'allow_fallbacks': False} if kind == 'only' else {'ignore': [val]}

    def run(host, n, trial):
        msgs = NOTION[n] if isinstance(n, str) else HIST[n]
        body = {'model': MODEL, 'stream': True, 'tools': TOOLS, 'messages': msgs, 'provider': route(host)}
        r = stream(body)
        calls = [r['calls'][i] for i in sorted(r['calls'])]
        judged = []
        for c in calls:
            try:
                a = json.loads(c['arguments'] or '{}')
                fl = nflags(n, c['name'], a) if isinstance(n, str) else flags(n, c['name'], a)
                judged.append({'name': c['name'], 'arguments': c['arguments'], 'flags': fl})
            except Exception:
                judged.append({'name': c['name'], 'arguments': c['arguments'], 'flags': ['BAD_JSON']})
        rec = {'kind': 'call', 'host': host, 'msg': n, 'trial': trial, 'provider': r['provider'], 'gen_id': r['id'],
               'finish_reason': r['finish_reason'], 'error': r.get('error'), 'usage': r['usage'], 'calls': judged,
               'flagged': sorted({f for j in judged for f in j['flags']}),
               'reasoning_tail': r['reasoning'][-1500:], 'content_head': r['content'][:300]}
        emit(rec)
        return rec

    jobs = [(h, n, t) for h in HOSTS for n in POINTS + list(NOTION) for t in range(TRIALS)]
    with concurrent.futures.ThreadPoolExecutor(max_workers=int(os.environ.get('PROBE_WORKERS', '6'))) as ex:
        results = list(ex.map(lambda a: run(*a), jobs))
    summary = {}
    for r in results:
        s = summary.setdefault(r['host'], {'requests': 0, 'errors': 0, 'calls': 0, 'flagged_calls': 0, 'flags': {}})
        s['requests'] += 1
        s.setdefault('served_by', {})
        s['served_by'][str(r['provider'])] = s['served_by'].get(str(r['provider']), 0) + 1
        s['errors'] += 1 if r['error'] and not r['calls'] else 0
        for c in r['calls']:
            s['calls'] += 1
            s['flagged_calls'] += 1 if c['flags'] else 0
            for f in c['flags']:
                s['flags'][f'{r["msg"]}:{f}'] = s['flags'].get(f'{r["msg"]}:{f}', 0) + 1
    emit({'kind': 'summary', 'per_host': summary})
    print('== probe done', flush=True)
