apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-pg-backup-restore-check-2
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-pg-backup-verify
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - {"name": "restore-page", "image": "oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f", "imagePullPolicy": "IfNotPresent", "command": ["bun", "-e"], "args": ["const URL_ = 'http://gbrain-rehearsal:3131/mcp';\nconst page = JSON.parse(await Bun.file('/work/page.json').text());\nconst call = async (name, args) => {\n  const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', Authorization: 'Bearer gbrain-mcp' },\n    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call', params: { name, arguments: args } }) });\n  const t = await r.text();\n  let msg = null;\n  for (const b of t.split('\\n\\n')) { const d = b.split('\\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\\n'); if (!d) continue; try { const o = JSON.parse(d); if (o.result || o.error) msg = o; } catch {} }\n  if (!msg) msg = JSON.parse(t);\n  const text = (msg.result?.content ?? []).map(c => c.text ?? '').join('\\n');\n  try { return { isError: !!msg.result?.isError, r: JSON.parse(text) }; } catch { return { isError: !!msg.result?.isError, r: text }; }\n};\nconst target = 'restore-check/' + page.slug;\nconst fm = { ...(page.frontmatter ?? {}), type: page.type, title: page.title };\nconst head = '---\\n' + Object.entries(fm).map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join('\\n') + '\\n---\\n\\n';\nconst content = head + (page.compiled_truth ?? '') + (page.timeline ? '\\n\\n## Timeline\\n\\n' + page.timeline : '');\nconsole.log(`backup copy of ${page.slug}: ${page.bytes} body bytes`);\nconst before = await call('get_page', { slug: target, body: 'none' });\nconsole.log('rehearsal before:', JSON.stringify(before.r).slice(0, 400));\nconst rev = before.isError ? undefined : before.r?.revision;\nconst put = await call('put_page', { slug: target, content, ...(rev ? { expected_revision: rev } : {}), request_id: crypto.randomUUID() });\nconsole.log('put_page:', put.isError ? 'ERROR' : 'ok', JSON.stringify(put.r).slice(0, 400));\nconst after = await call('get_page', { slug: target, body: 'none' });\nconsole.log('rehearsal after:', JSON.stringify(after.r).slice(0, 400));\nconst got = after.r?.size?.total_bytes;\nconsole.log(`restored ${target}: ${got} bytes vs backup ${page.bytes}`);\nconsole.log(`RESULT: ${put.isError ? 'FAIL' : 'PASS'}`);\nprocess.exit(put.isError ? 1 : 0);\n\n"], "securityContext": {"runAsNonRoot": true, "runAsUser": 26, "runAsGroup": 26, "allowPrivilegeEscalation": false, "capabilities": {"drop": ["ALL"]}}, "resources": {"requests": {"cpu": "25m", "memory": "64Mi"}, "limits": {"memory": "256Mi"}}, "volumeMounts": [{"name": "work", "mountPath": "/work", "readOnly": true}]}
      volumes:
        - name: dumps
          persistentVolumeClaim:
            claimName: gbrain-pg-backup-a
            readOnly: true
        - name: scripts
          configMap:
            name: gbrain-pg-backup-scripts
        - name: work
          emptyDir:
            sizeLimit: 64Mi
      initContainers:
        - name: verify
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/verify.sh"]
          env:
            - name: PGHOST
              value: gbrain-pg-rehearsal-rw
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: password
            - name: EXTRACT_SLUG
              value: ops/deletion-review
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: dumps
              mountPath: /dumps
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
