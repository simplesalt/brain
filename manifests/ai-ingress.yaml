---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-webhook
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  stripPrefix:
    prefixes:
      - /webhook
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gbrain-ingestion-rewrite
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replacePathRegex:
    regex: ^/gbrain-ingestion
    replacement: /ingest
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-agent-web
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ai.famevans.win
      secretName: ai-tls
  rules:
    - host: ai.famevans.win
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: big-agi
                port:
                  number: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent-web
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ai.famevans.win`) && PathPrefix(`/v1`)
      kind: Rule
      services:
        - name: hermes-agent-web
          port: 8642
    - match: Host(`ai.famevans.win`) && PathPrefix(`/webhook`)
      kind: Rule
      middlewares:
        - name: strip-webhook
      services:
        - name: hermes-agent-web
          port: 8644
    - match: Host(`ai.famevans.win`) && PathPrefix(`/gbrain-ingestion`)
      kind: Rule
      middlewares:
        - name: gbrain-ingestion-rewrite
      services:
        - name: gbrain
          port: 3131
    - match: Host(`ai.famevans.win`)
      kind: Rule
      services:
        - name: big-agi
          port: 3000
  tls:
    secretName: ai-tls
