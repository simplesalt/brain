apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-bridge-probe-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  probe.py: |
    import copy, json, os, urllib.request

    KEY = os.environ['OPENROUTER_API_KEY']
    MODEL = os.environ.get('PROBE_MODEL', 'minimax/minimax-m2.7')
    TRIALS = int(os.environ.get('PROBE_TRIALS', '3'))

    def bridge(args_schema):
        return {'type': 'function', 'function': {
            'name': 'tool_call',
            'description': 'Invoke deferred tools. Takes `calls`, an array of {name, arguments}.',
            'parameters': {'type': 'object', 'properties': {'calls': {'type': 'array', 'items': {
                'type': 'object',
                'properties': {'name': {'type': 'string', 'description': 'Deferred tool name.'},
                               'arguments': args_schema},
                'required': ['name', 'arguments']}}},
                'required': ['calls']}}}

    VARIANTS = {
        'A_object_no_props': {'type': 'object', 'description': 'Arguments matching the tool schema.'},
        'B_additionalProperties_true': {'type': 'object', 'additionalProperties': True, 'description': 'Arguments matching the tool schema.'},
        'C_json_string': {'type': 'string', 'description': 'Arguments matching the tool schema, as a JSON object encoded in a string.'},
    }
    PROMPT = ('Use tool_call to invoke the deferred tool mcp__gbrain__search with arguments {"query": "Dux Soup", "limit": 3}. '
              'Its schema is {"type":"object","properties":{"query":{"type":"string"},"limit":{"type":"integer"}},"required":["query"]}.')

    def post(body):
        req = urllib.request.Request('https://openrouter.ai/api/v1/chat/completions', method='POST',
                                     data=json.dumps(body).encode())
        req.add_header('Authorization', 'Bearer ' + KEY)
        req.add_header('Content-Type', 'application/json')
        try:
            with urllib.request.urlopen(req, timeout=120) as r:
                return json.loads(r.read())
        except urllib.error.HTTPError as e:
            return {'error': e.code, 'body': e.read().decode()[:300]}
        except Exception as e:
            return {'error': repr(e)}

    ROUTES = {
        'ignore_groq': {'ignore': ['groq']},
        'only_minimax': {'only': ['minimax']},
        'only_novita': {'only': ['novita']},
        'only_gmicloud': {'only': ['gmicloud']},
        'only_atlas': {'only': ['atlas-cloud']},
    }
    for rname, route in ROUTES.items():
        for i in range(TRIALS):
            body = {'model': MODEL, 'messages': [{'role': 'user', 'content': PROMPT}],
                    'tools': [bridge(VARIANTS['A_object_no_props'])], 'tool_choice': 'required',
                    'max_tokens': 800, 'provider': route}
            r = post(body)
            if 'error' in r:
                print(f'{rname} #{i}: ERROR {str(r)[:300]}')
                continue
            calls = ((r.get('choices') or [{}])[0].get('message') or {}).get('tool_calls') or []
            raw = calls[0]['function']['arguments'] if calls else None
            print(f"{rname} #{i}: provider={r.get('provider')} raw_arguments={raw}")
    print('== probe done')
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-bridge-probe
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: hermes-bridge-probe
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: python:3.12-alpine
          command: ["python3", "/probe/probe.py"]
          env:
            - name: PROBE_RUN
              value: "2"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /probe
      volumes:
        - name: script
          configMap:
            name: hermes-bridge-probe-script
