apiVersion: v1
kind: ConfigMap
metadata:
  name: email-collector-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  email-collector.mjs: |
    #!/usr/bin/env bun

    import { createSign } from 'crypto';
    import { mkdirSync, readFileSync, writeFileSync, renameSync, existsSync, readdirSync } from 'fs';
    import { join } from 'path';

    const DATA_DIR    = process.env.DATA_DIR ?? '/data';
    const MESSAGES    = join(DATA_DIR, 'messages');
    const DIGESTS     = join(DATA_DIR, 'digests');
    const WORK_EMAIL  = process.env.WORK_EMAIL ?? '';
    const CLIENT_EMAIL = process.env.GOOGLE_CLIENT_EMAIL ?? '';
    const POD_NAME    = process.env.POD_NAME ?? 'unknown';

    const CURSOR_LOST_FLAG = join(DATA_DIR, '.cursor-lost');
    const GBRAIN_MCP_URL = process.env.GBRAIN_MCP_URL ?? 'http://gbrain:3131/mcp';
    const GBRAIN_TOKEN   = process.env.GBRAIN_REMOTE_TOKEN ?? '';
    const SOURCE_VERSION = '0.9.0';
    const HEARTBEAT_MAX_AGE_SEC = Number(process.env.HEARTBEAT_MAX_AGE_SEC ?? 900);


    const GMAIL_SCOPES = [
      'https://www.googleapis.com/auth/gmail.modify',
      'https://www.googleapis.com/auth/drive',
      'https://www.googleapis.com/auth/documents',
      'https://www.googleapis.com/auth/spreadsheets',
      'https://www.googleapis.com/auth/calendar.events',
      'https://www.googleapis.com/auth/calendar.calendars',
    ];


    function b64url(s) { return Buffer.from(s).toString('base64url'); }

    function makeJWT(privKey, kid, subject) {
      const now = Math.floor(Date.now() / 1000);
      const hdr = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid }));
      const pay = b64url(JSON.stringify({
        iss: CLIENT_EMAIL, sub: subject,
        scope: GMAIL_SCOPES.join(' '),
        aud: 'https://oauth2.googleapis.com/token',
        iat: now, exp: now + 3600,
      }));
      const unsigned = `${hdr}.${pay}`;
      const sig = createSign('RSA-SHA256').update(unsigned).sign(privKey, 'base64url');
      return `${unsigned}.${sig}`;
    }

    async function getToken(privKey, kid, subject) {
      const jwt = makeJWT(privKey, kid, subject);
      const r = await fetch('https://oauth2.googleapis.com/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
          assertion: jwt,
        }),
      });
      if (!r.ok) {
        const body = await r.text();
        throw new Error(`Token exchange failed ${r.status}: ${body}`);
      }
      return (await r.json()).access_token;
    }


    const SA_DIR = '/var/run/secrets/kubernetes.io/serviceaccount';
    const NAMESPACE = (() => {
      try { return readFileSync(join(SA_DIR, 'namespace'), 'utf8').trim(); }
      catch { return 'ssint-main-ai'; }
    })();
    const K8S_HOST = 'https://kubernetes.default.svc';
    const LEASE_PATH  = `/apis/coordination.k8s.io/v1/namespaces/${NAMESPACE}/leases/email-collector-heartbeat`;
    const CURSOR_PATH = `/api/v1/namespaces/${NAMESPACE}/configmaps/email-collector-cursor`;
    const CURSOR_KEY  = 'cursor.json';
    const ANN = 'ingestion.simplesalt.company';

    let _k8sToken, _k8sCa;
    function k8sAuth() {
      if (!_k8sToken) _k8sToken = readFileSync(join(SA_DIR, 'token'), 'utf8').trim();
      if (!_k8sCa)    _k8sCa    = readFileSync(join(SA_DIR, 'ca.crt'), 'utf8');
      return { token: _k8sToken, ca: _k8sCa };
    }

    async function k8sRequest(path, init = {}) {
      const { token, ca } = k8sAuth();
      return fetch(`${K8S_HOST}${path}`, {
        ...init,
        tls: { ca },
        headers: { Authorization: `Bearer ${token}`, ...(init.headers ?? {}) },
      });
    }

    async function k8sGet(path) {
      const r = await k8sRequest(path);
      if (!r.ok) throw new Error(`k8s GET ${path} ${r.status}: ${(await r.text()).slice(0, 200)}`);
      return r.json();
    }

    async function k8sPatch(path, body) {
      const r = await k8sRequest(path, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/merge-patch+json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error(`k8s PATCH ${path} ${r.status}: ${(await r.text()).slice(0, 200)}`);
      return r.json();
    }


    async function loadCursor() {
      let cm;
      try {
        cm = await k8sGet(CURSOR_PATH);
      } catch (e) {
        console.error(`WARN: cursor ConfigMap GET failed, treating as lost: ${e.message}`);
        return { lastCollect: null, initialized: true };
      }
      let parsed = {};
      try { parsed = JSON.parse(cm.data?.[CURSOR_KEY] ?? '{}'); } catch { parsed = {}; }
      return { lastCollect: parsed.lastCollect || null, initialized: !!parsed.initialized };
    }

    async function saveCursor(lastCollect) {
      await k8sPatch(CURSOR_PATH, { data: { [CURSOR_KEY]: JSON.stringify({ lastCollect, initialized: true }) } });
    }


    const NOISE_SENDERS = [
      'noreply', 'no-reply', 'notifications@', 'calendar-notification',
      'mailer-daemon', 'postmaster', 'donotreply',
    ];
    const SIG_PATTERNS = [
      /docusign/i, /dropbox sign/i, /hellosign/i, /pandadoc/i,
      /please sign/i, /signature needed/i, /ready for your signature/i,
      /everyone has signed/i, /you just signed/i,
    ];

    const isNoise = from => NOISE_SENDERS.some(p => (from ?? '').toLowerCase().includes(p));
    const isSig   = (from, subj) => SIG_PATTERNS.some(r => r.test(`${from ?? ''} ${subj ?? ''}`));

    const gmailLink = (id, email) =>
      `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(email)}#inbox/${id}`;


    async function gmailList(token, query, max = 100) {
      const msgs = [];
      let pageToken = null;
      do {
        const p = new URLSearchParams({ q: query, maxResults: String(Math.min(max - msgs.length, 100)) });
        if (pageToken) p.set('pageToken', pageToken);
        const r = await fetch(
          `https://gmail.googleapis.com/gmail/v1/users/me/messages?${p}`,
          { headers: { Authorization: `Bearer ${token}` } },
        );
        if (!r.ok) throw new Error(`gmail.list ${r.status}: ${await r.text()}`);
        const d = await r.json();
        msgs.push(...(d.messages ?? []));
        pageToken = d.nextPageToken ?? null;
      } while (pageToken && msgs.length < max);
      return msgs;
    }

    async function gmailGet(token, id) {
      const r = await fetch(
        `https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}` +
        `?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`,
        { headers: { Authorization: `Bearer ${token}` } },
      );
      if (!r.ok) throw new Error(`gmail.get ${id} ${r.status}: ${await r.text()}`);
      return r.json();
    }

    const hdr = (msg, name) =>
      msg.payload?.headers?.find(h => h.name.toLowerCase() === name.toLowerCase())?.value ?? '';


    async function collect() {
      const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
      const privKey = keyB64
        ? Buffer.from(keyB64, 'base64').toString('utf8')
        : process.env.GOOGLE_PRIVATE_KEY;
      const kid = process.env.GOOGLE_PRIVATE_KEY_ID ?? '';

      if (!privKey) {
        console.error('FATAL: GOOGLE_PRIVATE_KEY_B64 (or GOOGLE_PRIVATE_KEY) must be set');
        process.exit(1);
      }
      if (!WORK_EMAIL) {
        console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)');
        process.exit(1);
      }
      if (!CLIENT_EMAIL) {
        console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)');
        process.exit(1);
      }

      const token = await getToken(privKey, kid, WORK_EMAIL);
      const cursor = await loadCursor();

      const cursorLost = cursor.initialized && !cursor.lastCollect;
      if (cursorLost) {
        const msg = 'cursor lost: email-collector-cursor ConfigMap is initialized but ' +
          'lastCollect is empty; falling back to a 25h window but reporting UNHEALTHY ' +
          'so this gets fixed with a manual backfill instead of silently trusted';
        console.error(`ALERT: ${msg}`);
        try { writeFileSync(CURSOR_LOST_FLAG, msg); } catch { /* best-effort advisory only */ }
      }
      const sinceH = cursor.lastCollect
        ? Math.ceil((Date.now() - new Date(cursor.lastCollect).getTime()) / 3_600_000) + 1
        : 25;
      const q = `newer_than:${sinceH}h`;

      const [inbox, sent] = await Promise.all([
        gmailList(token, `in:inbox ${q}`),
        gmailList(token, `in:sent ${q}`),
      ]);

      const knownIds = {};
      const sentThreads = new Set(sent.map(m => m.threadId));
      for (const m of sent) knownIds[m.id] = { sent: true };

      const today = new Date().toISOString().slice(0, 10);
      mkdirSync(MESSAGES, { recursive: true });
      mkdirSync(DIGESTS,  { recursive: true });

      const dayFile = join(MESSAGES, `${today}.json`);
      const existing = existsSync(dayFile) ? JSON.parse(readFileSync(dayFile, 'utf8')) : [];
      const seenIds  = new Set(existing.map(m => m.id));

      let added = 0;
      for (const ref of inbox) {
        if (knownIds[ref.id]) continue;
        const msg = await gmailGet(token, ref.id);
        const from = hdr(msg, 'From'), subj = hdr(msg, 'Subject'), date = hdr(msg, 'Date');
        const rec = {
          id: ref.id, threadId: ref.threadId,
          from, subject: subj, date,
          snippet: (msg.snippet ?? '').slice(0, 200),
          is_noise: isNoise(from),
          is_signature: isSig(from, subj),
          is_replied: sentThreads.has(ref.threadId),
          gmail_link: gmailLink(ref.id, WORK_EMAIL),
          account: WORK_EMAIL,
        };
        knownIds[ref.id] = { collected: today };
        if (!seenIds.has(ref.id)) { existing.push(rec); seenIds.add(ref.id); added++; }
        await new Promise(r => setTimeout(r, 50));
      }

      const tmp = `${dayFile}.tmp`;
      writeFileSync(tmp, JSON.stringify(existing, null, 2));
      renameSync(tmp, dayFile);

      try {
        await saveCursor(new Date().toISOString());
      } catch (e) {
        console.error(`WARN: cursor ConfigMap patch failed, will retry next run: ${e.message}`);
      }
      console.log(`collect [${WORK_EMAIL}]: +${added} new (${inbox.length} inbox, ${sent.length} sent checked)${cursorLost ? ' [CURSOR LOST]' : ''}`);
    }


    function dayOf(msg, fallbackDate) {
      const ms = Number(msg.internalDate);
      if (Number.isFinite(ms) && ms > 0) return new Date(ms).toISOString().slice(0, 10);
      const parsed = Date.parse(fallbackDate ?? '');
      if (Number.isFinite(parsed)) return new Date(parsed).toISOString().slice(0, 10);
      return null;
    }

    async function backfill() {
      const from = process.env.BACKFILL_FROM ?? process.argv[3] ?? '';
      const to   = process.env.BACKFILL_TO   ?? process.argv[4] ?? '';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(from) || !/^\d{4}-\d{2}-\d{2}$/.test(to)) {
        console.error('FATAL: BACKFILL_FROM and BACKFILL_TO must be YYYY-MM-DD (inclusive window)');
        process.exit(1);
      }

      const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
      const privKey = keyB64
        ? Buffer.from(keyB64, 'base64').toString('utf8')
        : process.env.GOOGLE_PRIVATE_KEY;
      const kid = process.env.GOOGLE_PRIVATE_KEY_ID ?? '';

      if (!privKey)     { console.error('FATAL: GOOGLE_PRIVATE_KEY_B64 (or GOOGLE_PRIVATE_KEY) must be set'); process.exit(1); }
      if (!WORK_EMAIL)  { console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)'); process.exit(1); }
      if (!CLIENT_EMAIL){ console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)'); process.exit(1); }

      const afterSec  = Math.floor(Date.parse(`${from}T00:00:00Z`) / 1000);
      const beforeSec = Math.floor(Date.parse(`${to}T00:00:00Z`) / 1000) + 86_400;
      if (!Number.isFinite(afterSec) || !Number.isFinite(beforeSec) || beforeSec <= afterSec) {
        console.error(`FATAL: invalid window ${from}..${to}`);
        process.exit(1);
      }

      const token = await getToken(privKey, kid, WORK_EMAIL);
      const q = `after:${afterSec} before:${beforeSec}`;
      console.log(`backfill [${WORK_EMAIL}]: window ${from}..${to} inclusive (${q})`);

      const MAX = Number(process.env.BACKFILL_MAX ?? 5000);
      const [inbox, sent] = await Promise.all([
        gmailList(token, `in:inbox ${q}`, MAX),
        gmailList(token, `in:sent ${q}`, MAX),
      ]);
      if (inbox.length >= MAX) {
        console.error(`WARN: inbox hit the ${MAX}-message ceiling — window may be truncated, raise BACKFILL_MAX`);
      }
      const sentThreads = new Set(sent.map(m => m.threadId));
      console.log(`backfill: ${inbox.length} inbox, ${sent.length} sent in window`);

      mkdirSync(MESSAGES, { recursive: true });
      const byDay = new Map();
      let undated = 0;

      for (const ref of inbox) {
        const msg = await gmailGet(token, ref.id);
        const from_ = hdr(msg, 'From'), subj = hdr(msg, 'Subject'), date = hdr(msg, 'Date');
        const day = dayOf(msg, date);
        if (!day) { undated++; continue; }
        const rec = {
          id: ref.id, threadId: ref.threadId,
          from: from_, subject: subj, date,
          snippet: (msg.snippet ?? '').slice(0, 200),
          is_noise: isNoise(from_),
          is_signature: isSig(from_, subj),
          is_replied: sentThreads.has(ref.threadId),
          gmail_link: gmailLink(ref.id, WORK_EMAIL),
          account: WORK_EMAIL,
        };
        if (!byDay.has(day)) byDay.set(day, []);
        byDay.get(day).push(rec);
        await new Promise(r => setTimeout(r, 50));
      }

      let added = 0;
      for (const day of [...byDay.keys()].sort()) {
        const dayFile = join(MESSAGES, `${day}.json`);
        const existing = existsSync(dayFile) ? JSON.parse(readFileSync(dayFile, 'utf8')) : [];
        const seenIds = new Set(existing.map(m => m.id));
        let dayAdded = 0;
        for (const rec of byDay.get(day)) {
          if (seenIds.has(rec.id)) continue;
          existing.push(rec); seenIds.add(rec.id); dayAdded++; added++;
        }
        const tmp = `${dayFile}.tmp`;
        writeFileSync(tmp, JSON.stringify(existing, null, 2));
        renameSync(tmp, dayFile);
        console.log(`backfill: ${day} +${dayAdded} new (${existing.length} total in day-file)`);
      }

      if (undated) console.error(`WARN: ${undated} message(s) had no usable date and were skipped`);
      console.log(`backfill: +${added} new across ${byDay.size} day-file(s); running enrich now (same pod) to push into gbrain`);
      await enrich();
    }


    async function digest() {
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86_400_000).toISOString().slice(0, 10);
      mkdirSync(DIGESTS, { recursive: true });

      const all = [];
      for (const d of [today, yesterday]) {
        const f = join(MESSAGES, `${d}.json`);
        if (existsSync(f)) all.push(...JSON.parse(readFileSync(f, 'utf8')));
      }

      const msgs = [...new Map(all.map(m => [m.id, m])).values()];

      const signatures = msgs.filter(m =>  m.is_signature && !m.is_noise);
      const triage     = msgs.filter(m => !m.is_noise && !m.is_signature);
      const noise      = msgs.filter(m =>  m.is_noise);

      const fmt = m => [
        `- **${m.from}** — ${m.subject || '(no subject)'}${m.is_replied ? ' ✓replied' : ''}`,
        `  *${m.date || ''}*`,
        `  ${m.snippet ? m.snippet.slice(0, 140) + (m.snippet.length > 140 ? '…' : '') : ''}`,
        `  [Open in Gmail](${m.gmail_link})`,
      ].join('\n');

      const lines = [
        `# Email Digest: ${today}`,
        ``,
        `> Account: ${WORK_EMAIL} (work) | Personal: disabled (see email-collector.yaml)`,
        `> Generated: ${new Date().toISOString()}`,
        ``,
        `## Signatures Pending (${signatures.length})`,
        signatures.length ? signatures.map(fmt).join('\n\n') : '_None_',
        ``,
        `## Messages to Triage (${triage.length})`,
        triage.length ? triage.map(fmt).join('\n\n') : '_None_',
        ``,
        `## Noise (${noise.length})`,
        noise.length ? noise.map(m => `- ${m.from} — ${m.subject}`).join('\n') : '_None_',
      ];

      const out = join(DIGESTS, `${today}.md`);
      const tmp = `${out}.tmp`;
      writeFileSync(tmp, lines.join('\n') + '\n');
      renameSync(tmp, out);
      console.log(`digest: ${triage.length} triage, ${signatures.length} sig, ${noise.length} noise → ${out}`);
    }


    const INGESTED_KEY    = 'ingested.json';
    const INGESTED_TTL_MS = 48 * 3_600_000;

    async function loadIngested() {
      let cm;
      try {
        cm = await k8sGet(CURSOR_PATH);
      } catch (e) {
        console.error(`WARN: ingested cache GET failed, treating as empty: ${e.message}`);
        return {};
      }
      try { return JSON.parse(cm.data?.[INGESTED_KEY] ?? '{}'); } catch { return {}; }
    }

    async function saveIngested(obj) {
      const cutoff = Date.now() - INGESTED_TTL_MS;
      const pruned = {};
      for (const [id, v] of Object.entries(obj)) {
        const at = Date.parse(v?.at ?? '');
        if (Number.isFinite(at) && at >= cutoff) pruned[id] = v;
      }
      await k8sPatch(CURSOR_PATH, { data: { [INGESTED_KEY]: JSON.stringify(pruned) } });
      return pruned;
    }

    function microNow() { return new Date().toISOString().replace('Z', '000Z'); }

    async function writeHeartbeat(status, { error, ingestedTotal, pushedThisRun } = {}) {
      const now = microNow();
      const body = {
        spec: {
          holderIdentity: POD_NAME,
          leaseDurationSeconds: HEARTBEAT_MAX_AGE_SEC,
          renewTime: now,
        },
        metadata: {
          annotations: {
            [`${ANN}/status`]: status,
            [`${ANN}/error`]: error ? String(error).slice(0, 800) : '',
            [`${ANN}/ingested-total`]: String(ingestedTotal ?? ''),
            [`${ANN}/pushed-this-run`]: String(pushedThisRun ?? ''),
          },
        },
      };
      try {
        await k8sPatch(LEASE_PATH, body);
      } catch (e) {
        console.error(`WARN: heartbeat Lease patch failed: ${e.message}`);
      }
    }

    function parseMcpResponse(text) {
      let msg = null;
      for (const block of text.split('\n\n')) {
        const data = block.split('\n')
          .filter(l => l.startsWith('data:'))
          .map(l => l.slice(5).trim())
          .join('\n');
        if (!data) continue;
        try { const o = JSON.parse(data); if (o.result || o.error) msg = o; } catch { /* keep scanning */ }
      }
      if (msg) return msg;
      try { return JSON.parse(text); } catch { return null; }
    }

    async function gbrainPutPage(slug, content) {
      const r = await fetch(GBRAIN_MCP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json, text/event-stream',
          'Authorization': `Bearer ${GBRAIN_TOKEN}`,
        },
        body: JSON.stringify({
          jsonrpc: '2.0', id: 1, method: 'tools/call',
          params: { name: 'put_page', arguments: { slug, content } },
        }),
      });
      const text = await r.text();
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0, 160)}`);
      const msg = parseMcpResponse(text);
      if (!msg) throw new Error(`unparseable MCP response: ${text.slice(0, 160)}`);
      if (msg.error) throw new Error(`rpc: ${JSON.stringify(msg.error).slice(0, 160)}`);
      if (msg.result?.isError) {
        const t = (msg.result.content ?? []).map(c => c.text ?? '').join(' ');
        throw new Error(`tool: ${t.slice(0, 160)}`);
      }
      return msg.result;
    }

    function emailToMarkdown(m) {
      const subj = m.subject || '(no subject)';
      const q = s => String(s ?? '').replace(/"/g, "'");
      return [
        '---',
        `title: "${q(subj).slice(0, 120)}"`,
        'type: email',
        'source: gmail',
        `account: "${q(m.account)}"`,
        `from: "${q(m.from)}"`,
        `date: "${q(m.date)}"`,
        `message_id: "${m.id}"`,
        `thread_id: "${m.threadId ?? ''}"`,
        `url: "${m.gmail_link}"`,
        `is_signature: ${!!m.is_signature}`,
        `replied: ${!!m.is_replied}`,
        'tags: [email, inbox]',
        '---',
        '',
        `# ${subj}`,
        '',
        `**From:** ${m.from}`,
        `**Date:** ${m.date}`,
        `**Account:** ${m.account}`,
        '',
        m.snippet || '',
        '',
        `[Open in Gmail](${m.gmail_link})`,
        '',
      ].join('\n');
    }

    async function enrich() {
      try {
        if (!GBRAIN_TOKEN) {
          await writeHeartbeat('error', { error: 'GBRAIN_REMOTE_TOKEN not set', pushedThisRun: 0 });
          console.error('enrich: GBRAIN_REMOTE_TOKEN not set — recorded in heartbeat, health will report NotReady');
          return;
        }
        mkdirSync(MESSAGES, { recursive: true });
        const files = existsSync(MESSAGES) ? readdirSync(MESSAGES).filter(f => f.endsWith('.json')) : [];
        const all = [];
        for (const f of files) {
          try { all.push(...JSON.parse(readFileSync(join(MESSAGES, f), 'utf8'))); } catch { /* skip bad file */ }
        }
        const byId = new Map(all.filter(m => m && m.id).map(m => [m.id, m]));
        const ingested = await loadIngested();
        const pending = [...byId.values()].filter(m => !m.is_noise && !ingested[m.id]);

        let pushed = 0; const errors = [];
        for (const m of pending) {
          try {
            await gbrainPutPage(`email/${m.id}`, emailToMarkdown(m));
            ingested[m.id] = { at: new Date().toISOString() };
            pushed++;
          } catch (e) {
            errors.push(`${m.id}: ${e.message}`);
            if (pushed === 0 && errors.length >= 3) break;
          }
          await new Promise(r => setTimeout(r, 1100));
        }

        let total = Object.keys(ingested).length;
        try {
          total = Object.keys(await saveIngested(ingested)).length;
        } catch (e) {
          console.error(`enrich: saveIngested failed: ${e.message}`);
          errors.push(`saveIngested: ${e.message}`);
        }

        const cursorLostNote = existsSync(CURSOR_LOST_FLAG) ? readFileSync(CURSOR_LOST_FLAG, 'utf8').trim() : '';
        const errParts = errors.slice(0, 5);
        if (cursorLostNote) errParts.unshift(cursorLostNote);
        const status = errParts.length ? 'error' : 'ok';
        await writeHeartbeat(status, {
          pushedThisRun: pushed,
          ingestedTotal: total,
          error: errParts.join(' | '),
        });
        console.log(`enrich: pushed ${pushed}/${pending.length} new → gbrain (total ${total})${errors.length ? `, ${errors.length} error(s)` : ''}${cursorLostNote ? ', CURSOR LOST' : ''}`);
      } catch (e) {
        await writeHeartbeat('error', { error: e.message, pushedThisRun: 0 });
        console.error(`enrich: unexpected failure recorded in heartbeat: ${e.message}`);
      }
    }

    async function healthcheck() {
      let lease;
      try {
        lease = await k8sGet(LEASE_PATH);
      } catch (e) {
        console.error(`UNHEALTHY: cannot read heartbeat Lease: ${e.message}`);
        process.exit(1);
      }
      const renewTime = lease.spec?.renewTime;
      const leaseDurationSeconds = lease.spec?.leaseDurationSeconds ?? HEARTBEAT_MAX_AGE_SEC;
      if (!renewTime) {
        console.error('UNHEALTHY: no heartbeat yet (pipeline has not completed a run)');
        process.exit(1);
      }
      const ageSec = (Date.now() - new Date(renewTime).getTime()) / 1000;
      if (!Number.isFinite(ageSec) || ageSec > leaseDurationSeconds) {
        console.error(`UNHEALTHY: heartbeat stale (${Math.round(ageSec)}s > ${leaseDurationSeconds}s max)`);
        process.exit(1);
      }
      const ann = lease.metadata?.annotations ?? {};
      const status = ann[`${ANN}/status`];
      if (status !== 'ok') {
        console.error(`UNHEALTHY: last run status=${status || '(none)'} — ${ann[`${ANN}/error`] || 'see Lease annotations'}`);
        process.exit(1);
      }
      console.log(`OK: status=ok ingested_total=${ann[`${ANN}/ingested-total`] ?? '?'} age=${Math.round(ageSec)}s`);
    }


    async function diagnose() {
      const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
      const privKey = keyB64
        ? Buffer.from(keyB64, 'base64').toString('utf8')
        : process.env.GOOGLE_PRIVATE_KEY;
      const kid = process.env.GOOGLE_PRIVATE_KEY_ID ?? '';

      if (!privKey) {
        console.error('FATAL: GOOGLE_PRIVATE_KEY_B64 not set'); process.exit(1);
      }
      if (!CLIENT_EMAIL) {
        console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)'); process.exit(1);
      }
      if (!WORK_EMAIL) {
        console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)'); process.exit(1);
      }
      console.log(`SA client email: ${CLIENT_EMAIL}`);
      console.log(`Private key ID:  ${kid}`);
      console.log(`Impersonate:     ${WORK_EMAIL}`);
      console.log('');

      console.log('Test 1: SA-only token (no DWD impersonation, scope=cloud-platform)...');
      try {
        const now = Math.floor(Date.now() / 1000);
        const hdr = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid }));
        const pay = b64url(JSON.stringify({
          iss: CLIENT_EMAIL,
          scope: 'https://www.googleapis.com/auth/cloud-platform',
          aud: 'https://oauth2.googleapis.com/token',
          iat: now, exp: now + 3600,
        }));
        const unsigned = `${hdr}.${pay}`;
        const sig = createSign('RSA-SHA256').update(unsigned).sign(privKey, 'base64url');
        const jwt = `${unsigned}.${sig}`;
        const r = await fetch('https://oauth2.googleapis.com/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }),
        });
        const body = await r.json();
        if (r.ok) console.log('  PASS: SA credentials valid, got access token');
        else      console.log(`  FAIL ${r.status}: ${JSON.stringify(body)}`);
      } catch(e) { console.log(`  ERROR: ${e.message}`); }

      console.log('Test 2: DWD token (sub=work email, scope=gmail.modify)...');
      try {
        const token = await getToken(privKey, kid, WORK_EMAIL);
        console.log('  PASS: DWD token exchange succeeded');
      } catch(e) { console.log(`  FAIL: ${e.message}`); }
    }


    const cmd = process.argv[2];
    if      (cmd === 'collect')     await collect();
    else if (cmd === 'backfill')    await backfill();
    else if (cmd === 'digest')      await digest();
    else if (cmd === 'enrich')      await enrich();
    else if (cmd === 'healthcheck') await healthcheck();
    else if (cmd === 'diagnose')    await diagnose();
    else { console.error('Usage: email-collector.mjs collect|backfill <from> <to>|digest|enrich|healthcheck|diagnose'); process.exit(1); }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: email-collector
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: email-collector
        spec:
          serviceAccountName: email-collector
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: oven/bun:1-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  bun /scripts/email-collector.mjs collect \
                    && bun /scripts/email-collector.mjs digest \
                    && bun /scripts/email-collector.mjs enrich
              env:
                - name: DATA_DIR
                  value: /data
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: WORK_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: google-dwd-key
                      key: impersonate_email
                      optional: true
                - name: GBRAIN_MCP_URL
                  value: http://gbrain:3131/mcp
                - name: GBRAIN_REMOTE_TOKEN
                  value: "gbrain-mcp"
                - name: GOOGLE_CLIENT_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: google-dwd-key
                      key: client_email
                      optional: true
                - name: GOOGLE_PRIVATE_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: GOOGLE_PRIVATE_KEY_ID
                      optional: true
                - name: GOOGLE_PRIVATE_KEY_B64
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: GOOGLE_PRIVATE_KEY_B64
                      optional: true
              volumeMounts:
                - name: email-data
                  mountPath: /data
                - name: collector-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: email-data
              emptyDir: {}
            - name: collector-script
              configMap:
                name: email-collector-script
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-ingestion-health
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: email-ingestion-health
  template:
    metadata:
      labels:
        app: email-ingestion-health
    spec:
      serviceAccountName: email-ingestion-health
      containers:
        - name: health
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            - name: HEARTBEAT_MAX_AGE_SEC
              value: "900"
          readinessProbe:
            exec:
              command: ["bun", "/scripts/email-collector.mjs", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 15
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: collector-script
          configMap:
            name: email-collector-script
