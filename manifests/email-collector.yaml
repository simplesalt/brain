# Email-to-brain: deterministic Gmail collector for the ssint-main-ai namespace.
# Architecture: a CronJob (every minute) pulls Gmail for the work account via the
# existing service-account DWD credential, writes structured per-day JSON + a markdown
# digest to a pod-scoped emptyDir, then deterministically pushes each (non-noise)
# message into gbrain via the MCP server (put_page). gbrain self-wires
# entities/links/timeline server-side, so ingestion no longer depends on the Hermes
# agent loop.
#
# State that must survive across pods/invocations is NOT on a PVC (a PVC pins pods to a
# single node and blocks kubectl drain / kured node-reboot compatibility — see
# simplesalt/projects#346). Instead:
#   - Heartbeat  → Lease "email-collector-heartbeat" (coordination.k8s.io/v1), declared
#                  below. holderIdentity/renewTime/leaseDurationSeconds carry liveness;
#                  status/error/ingested-total/pushed-this-run ride in annotations under
#                  the ingestion.simplesalt.company/ prefix — same contract as
#                  calendar-collector.yaml's heartbeat Lease.
#   - Cursor (lastCollect) → ConfigMap "email-collector-cursor", key "cursor.json",
#                  patched at the end of each collect() run.
#   - gbrain idempotency cache → the SAME ConfigMap, key "ingested.json", patched once
#                  at the end of each enrich() run and pruned to a 48h window. Merge-patch
#                  is per-key, so the two writers never clobber each other.
#   - Everything else (per-day message JSON, digests) → emptyDir at /data in the CronJob
#     pod only; none of it needs to survive past that pod (see
#     collect()/backfill()/enrich() comments below for why).
# knownIds (dedup-within-collect-window) is intentionally NOT persisted anywhere — it's
# a redundant-fetch optimisation only, never load-bearing for correctness.
# A companion Deployment (email-ingestion-health) exposes a k8s readiness probe over the
# heartbeat Lease so ingestion health shows up in `kubectl get pods` like every other
# workload's probe. It mounts no data volume (the PVC is gone); it still mounts the
# collector-script ConfigMap read-only, since its readinessProbe execs that same script
# in `healthcheck` mode.
#
# PREREQUISITE (one-time, manual): In Google Admin Console → Security → API Controls
# → Domain-wide Delegation, ensure the service account client-ID (the service
# account configured via GOOGLE_CLIENT_EMAIL below, sourced from the google-dwd-key
# Secret) is authorized with these scopes:
#   https://mail.google.com/,
#   https://www.googleapis.com/auth/drive,
#   https://www.googleapis.com/auth/documents,
#   https://www.googleapis.com/auth/spreadsheets,
#   https://www.googleapis.com/auth/calendar,
#   https://www.googleapis.com/auth/contacts
# Without DWD authorization the collector fails 403 on first run; all other k8s
# resources below are inert until that step is done.
#
# Personal Gmail: stubbed (disabled). Full RW on a personal @gmail.com account
# requires an External OAuth app with restricted scopes (https://mail.google.com/,
# drive, etc.), which triggers Google's OAuth verification + CASA security audit
# before production tokens are issued. Add a second account entry here once that
# OAuth client + refresh token is obtained and stored in hermes-secrets.
---
# Holds the Google service-account identity used for Domain-wide Delegation:
#   client_email       — the service-account's client email (iss claim of the DWD JWT)
#   impersonate_email  — the work Google account being impersonated (sub claim)
# Populated out-of-band (kept out of git). The ssa: merge annotation lets Flux own
# the resource without clobbering the out-of-band value. Consumed via secretKeyRef
# by email-collector.yaml (this file) and calendar-collector.yaml, both in this
# namespace, as GOOGLE_CLIENT_EMAIL / WORK_EMAIL.
apiVersion: v1
kind: Secret
metadata:
  name: google-dwd-key
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
# Dedicated ServiceAccounts (never `default`) for the two workloads below, each bound to
# a Role scoped by resourceNames to only the one Lease/ConfigMap it needs — see the
# Role/RoleBinding pairs following the Lease and ConfigMap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: email-collector
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: email-ingestion-health
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
---
# Pipeline heartbeat, replacing the old PVC-backed heartbeat.json/.jsonl. Declared here
# (not created by the writer) so the collector's Role needs only get/update/patch, never
# create — RBAC-minimal GitOps.
#
# Only spec.leaseDurationSeconds is declared in git — holderIdentity, renewTime, and the
# ingestion.simplesalt.company/* payload annotations are entirely collector-owned,
# written by writeHeartbeat() via merge-patch. Same reasoning as the cursor ConfigMap
# below: this repo's Flux Kustomization reconciles every 5m with prune: true, and if
# those fields were declared here Flux would stomp the live heartbeat every reconcile.
# The `kustomize.toolkit.fluxcd.io/ssa: merge` annotation (same idiom as the
# google-dwd-key Secret above) keeps Flux from owning/pruning fields it didn't declare.
# Payload keys (status/error/ingested-total/pushed-this-run) use the
# ingestion.simplesalt.company/ prefix — the SAME prefix and keys calendar-collector.yaml
# uses for its own heartbeat Lease, so both pipelines are legible the same way.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: email-collector-heartbeat
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
spec:
  # 15m — ~15 missed runs at the 1-per-minute cadence, enough to ride out a node reboot
  # or a slow backlog run without flapping, tight enough that a genuinely stopped
  # CronJob shows up as NotReady within the quarter hour. Carried over from the old
  # 30-minute schedule, 4200s would have tolerated 70 missed runs.
  # Must match HEARTBEAT_MAX_AGE_SEC on the health Deployment below.
  leaseDurationSeconds: 900
---
# Cross-pod collector state, replacing the old PVC-backed state.json and ingested.json.
# Two keys, two independent writers, both JSON merge-patch (which merges into `data`
# per-key, so neither clobbers the other):
#   cursor.json   — collect()'s lastCollect, written at the end of every collect run.
#   ingested.json — enrich()'s gbrain put_page idempotency cache, written once at the end
#                   of every enrich run and pruned to a 48h window.
# Declared here (metadata only, no `data:` block — see below) so the collector's Role
# needs only get/update/patch, never create.
#
# Deliberately NO `data:` block in git: this repo is reconciled by the Flux
# Kustomization `brain` (interval: 5m, prune: true). If the cursor value were declared
# here, Flux would re-apply that committed value over the live one every reconcile —
# and since the CronJob runs every minute, the cursor would be reset to its committed
# (empty) value roughly every 5th run, re-triggering the exact newer_than:25h silent-
# loss path #346 exists to fix. The `kustomize.toolkit.fluxcd.io/ssa: merge` annotation
# (same idiom as the google-dwd-key Secret above) tells Flux to merge instead of
# force-apply, so it never owns/prunes the keys the collector writes.
#
# knownIds does NOT live here: it's a dedup-within-window optimisation, never
# load-bearing (see collect()'s comment in the script below), and this ConfigMap is
# patched every minute (schedule: * * * * *), so anything unbounded here would be the
# wrong shape for that cadence. ingested.json is bounded by its 48h prune.
#
# cursor.json holds {"lastCollect": "<ISO8601>", "initialized": true}. A missing key
# (first-ever apply,
# before the collector has run) reads as "genuinely never run". If the key is present
# but lastCollect is empty, the cursor was lost (wiped/corrupted) — collect() treats
# that as a loud failure (Lease status=error, readiness NotReady) instead of silently
# trusting a 25h fallback window the way a genuine first-run does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: email-collector-cursor
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: email-collector
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["email-collector-heartbeat"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["email-collector-cursor"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: email-collector
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: email-collector
subjects:
  - kind: ServiceAccount
    name: email-collector
    namespace: ssint-main-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: email-ingestion-health
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["email-collector-heartbeat"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: email-ingestion-health
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: email-ingestion-health
subjects:
  - kind: ServiceAccount
    name: email-ingestion-health
    namespace: ssint-main-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: email-collector-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  email-collector.mjs: |
    #!/usr/bin/env bun
    // Deterministic Gmail collector — gbrain email-to-brain recipe v0.7.0 (+enrich v0.8.0,
    //   +Lease/ConfigMap state v0.9.0, no PVC).
    // Code handles: auth, dedup, links, noise/sig detection, atomic writes, AND
    //   deterministic ingestion into gbrain (put_page over MCP). gbrain does the
    //   server-side self-wiring (entities, links, timeline). Hermes may still add
    //   higher-order judgment (urgency, replies) on top, but ingestion no longer
    //   depends on the agent loop. State that must survive across pods (heartbeat,
    //   collect cursor) lives in a k8s Lease + ConfigMap, not a PVC — see the Lease/
    //   ConfigMap manifests earlier in this file and collect()/writeHeartbeat()/
    //   healthcheck() below for the client.
    // Usage: bun email-collector.mjs collect | backfill | digest | enrich | healthcheck | diagnose

    import { createSign } from 'crypto';
    import { mkdirSync, readFileSync, writeFileSync, renameSync, existsSync, readdirSync } from 'fs';
    import { join } from 'path';

    const DATA_DIR    = process.env.DATA_DIR ?? '/data';
    const MESSAGES    = join(DATA_DIR, 'messages');
    const DIGESTS     = join(DATA_DIR, 'digests');
    const WORK_EMAIL  = process.env.WORK_EMAIL ?? '';
    const CLIENT_EMAIL = process.env.GOOGLE_CLIENT_EMAIL ?? '';
    const POD_NAME    = process.env.POD_NAME ?? 'unknown';

    // ---------- gbrain ingestion config ----------
    // Same-pod advisory only (never read across pod invocations): collect() sets this
    // when it detects a lost cursor (see collect()'s comment) so enrich() — a separate
    // `bun` process later in the same pod's `collect && digest && enrich` chain — can
    // fold it into the heartbeat it writes. Lives on the emptyDir, so it never survives
    // past this pod, which is fine: it exists purely to hop between two processes in one
    // pod, not to persist anything.
    const CURSOR_LOST_FLAG = join(DATA_DIR, '.cursor-lost');
    const GBRAIN_MCP_URL = process.env.GBRAIN_MCP_URL ?? 'http://gbrain:3131/mcp';
    const GBRAIN_TOKEN   = process.env.GBRAIN_REMOTE_TOKEN ?? '';
    const SOURCE_VERSION = '0.9.0';
    const HEARTBEAT_MAX_AGE_SEC = Number(process.env.HEARTBEAT_MAX_AGE_SEC ?? 900);

    // Personal account stub — disabled until OAuth client + refresh token added.
    // const PERSONAL_EMAIL = process.env.PERSONAL_EMAIL ?? '';

    const GMAIL_SCOPES = [
      'https://www.googleapis.com/auth/gmail.modify',
      'https://www.googleapis.com/auth/drive',
      'https://www.googleapis.com/auth/documents',
      'https://www.googleapis.com/auth/spreadsheets',
      'https://www.googleapis.com/auth/calendar.events',
      'https://www.googleapis.com/auth/calendar.calendars',
    ];

    // ---------- Google service-account JWT (DWD) ----------

    function b64url(s) { return Buffer.from(s).toString('base64url'); }

    function makeJWT(privKey, kid, subject) {
      const now = Math.floor(Date.now() / 1000);
      const hdr = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid }));
      const pay = b64url(JSON.stringify({
        iss: CLIENT_EMAIL, sub: subject,
        scope: GMAIL_SCOPES.join(' '),
        aud: 'https://oauth2.googleapis.com/token',
        iat: now, exp: now + 3600,
      }));
      const unsigned = `${hdr}.${pay}`;
      const sig = createSign('RSA-SHA256').update(unsigned).sign(privKey, 'base64url');
      return `${unsigned}.${sig}`;
    }

    async function getToken(privKey, kid, subject) {
      const jwt = makeJWT(privKey, kid, subject);
      const r = await fetch('https://oauth2.googleapis.com/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
          assertion: jwt,
        }),
      });
      if (!r.ok) {
        const body = await r.text();
        throw new Error(`Token exchange failed ${r.status}: ${body}`);
      }
      return (await r.json()).access_token;
    }

    // ---------- Kubernetes API client (Lease heartbeat + ConfigMap cursor) ----------
    // No kubectl in this image; talk to the API server directly with the projected
    // ServiceAccount token/CA, the same way every in-cluster client does. Both the Lease
    // and the ConfigMap are pre-created in git (see this file's manifests above) so the
    // collector's Role only ever needs get/update/patch, never create.

    const SA_DIR = '/var/run/secrets/kubernetes.io/serviceaccount';
    const NAMESPACE = (() => {
      try { return readFileSync(join(SA_DIR, 'namespace'), 'utf8').trim(); }
      catch { return 'ssint-main-ai'; }
    })();
    const K8S_HOST = 'https://kubernetes.default.svc';
    const LEASE_PATH  = `/apis/coordination.k8s.io/v1/namespaces/${NAMESPACE}/leases/email-collector-heartbeat`;
    const CURSOR_PATH = `/api/v1/namespaces/${NAMESPACE}/configmaps/email-collector-cursor`;
    const CURSOR_KEY  = 'cursor.json';
    const ANN = 'ingestion.simplesalt.company';

    let _k8sToken, _k8sCa;
    function k8sAuth() {
      if (!_k8sToken) _k8sToken = readFileSync(join(SA_DIR, 'token'), 'utf8').trim();
      if (!_k8sCa)    _k8sCa    = readFileSync(join(SA_DIR, 'ca.crt'), 'utf8');
      return { token: _k8sToken, ca: _k8sCa };
    }

    async function k8sRequest(path, init = {}) {
      const { token, ca } = k8sAuth();
      return fetch(`${K8S_HOST}${path}`, {
        ...init,
        tls: { ca },
        headers: { Authorization: `Bearer ${token}`, ...(init.headers ?? {}) },
      });
    }

    async function k8sGet(path) {
      const r = await k8sRequest(path);
      if (!r.ok) throw new Error(`k8s GET ${path} ${r.status}: ${(await r.text()).slice(0, 200)}`);
      return r.json();
    }

    async function k8sPatch(path, body) {
      const r = await k8sRequest(path, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/merge-patch+json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error(`k8s PATCH ${path} ${r.status}: ${(await r.text()).slice(0, 200)}`);
      return r.json();
    }

    // ---------- Cursor (ConfigMap-backed; replaces the old state.json on the PVC) ----------
    // Only lastCollect lives here. knownIds deliberately does NOT: it is a dedup-within-
    // window optimisation, never load-bearing for correctness (the day-file's own
    // seenIds set, built fresh each run from the day-file's existing content, is the
    // real duplicate guard — see collect() below), so persisting it would mean rewriting
    // an ever-growing ConfigMap every minute for zero correctness benefit. Kept purely
    // local/in-memory instead; losing it across pod restarts costs redundant Gmail GETs
    // on the overlapping part of the query window, never a missed or duplicated message.
    //
    // The email-collector-cursor ConfigMap declares NO data in git (see its manifest
    // above) — Flux reconciles this repo every 5m with prune: true, and the CronJob
    // runs every minute, so a git-declared value would stomp the live cursor roughly
    // every 5th run. The collector owns the `cursor.json` key entirely via merge-patch
    // (and enrich() the `ingested.json` key, independently — merge-patch is per-key so
    // the two never race); a missing key just means "nothing written yet". A GET failure (bad
    // RBAC, apiserver hiccup, object genuinely missing) is logged and treated the same
    // as a lost cursor, not a crash — collect() surfaces it via the heartbeat Lease
    // (status=error) rather than throwing the whole run.

    async function loadCursor() {
      let cm;
      try {
        cm = await k8sGet(CURSOR_PATH);
      } catch (e) {
        console.error(`WARN: cursor ConfigMap GET failed, treating as lost: ${e.message}`);
        return { lastCollect: null, initialized: true };
      }
      let parsed = {};
      try { parsed = JSON.parse(cm.data?.[CURSOR_KEY] ?? '{}'); } catch { parsed = {}; }
      return { lastCollect: parsed.lastCollect || null, initialized: !!parsed.initialized };
    }

    async function saveCursor(lastCollect) {
      await k8sPatch(CURSOR_PATH, { data: { [CURSOR_KEY]: JSON.stringify({ lastCollect, initialized: true }) } });
    }

    // ---------- Noise / signature detection (deterministic) ----------

    const NOISE_SENDERS = [
      'noreply', 'no-reply', 'notifications@', 'calendar-notification',
      'mailer-daemon', 'postmaster', 'donotreply',
    ];
    const SIG_PATTERNS = [
      /docusign/i, /dropbox sign/i, /hellosign/i, /pandadoc/i,
      /please sign/i, /signature needed/i, /ready for your signature/i,
      /everyone has signed/i, /you just signed/i,
    ];

    const isNoise = from => NOISE_SENDERS.some(p => (from ?? '').toLowerCase().includes(p));
    const isSig   = (from, subj) => SIG_PATTERNS.some(r => r.test(`${from ?? ''} ${subj ?? ''}`));

    // Gmail deep-link with authuser=email (correct account even if not the default)
    const gmailLink = (id, email) =>
      `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(email)}#inbox/${id}`;

    // ---------- Gmail API ----------

    async function gmailList(token, query, max = 100) {
      const msgs = [];
      let pageToken = null;
      do {
        const p = new URLSearchParams({ q: query, maxResults: String(Math.min(max - msgs.length, 100)) });
        if (pageToken) p.set('pageToken', pageToken);
        const r = await fetch(
          `https://gmail.googleapis.com/gmail/v1/users/me/messages?${p}`,
          { headers: { Authorization: `Bearer ${token}` } },
        );
        if (!r.ok) throw new Error(`gmail.list ${r.status}: ${await r.text()}`);
        const d = await r.json();
        msgs.push(...(d.messages ?? []));
        pageToken = d.nextPageToken ?? null;
      } while (pageToken && msgs.length < max);
      return msgs;
    }

    async function gmailGet(token, id) {
      const r = await fetch(
        `https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}` +
        `?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`,
        { headers: { Authorization: `Bearer ${token}` } },
      );
      if (!r.ok) throw new Error(`gmail.get ${id} ${r.status}: ${await r.text()}`);
      return r.json();
    }

    const hdr = (msg, name) =>
      msg.payload?.headers?.find(h => h.name.toLowerCase() === name.toLowerCase())?.value ?? '';

    // ---------- collect ----------

    async function collect() {
      const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
      const privKey = keyB64
        ? Buffer.from(keyB64, 'base64').toString('utf8')
        : process.env.GOOGLE_PRIVATE_KEY;
      const kid = process.env.GOOGLE_PRIVATE_KEY_ID ?? '';

      if (!privKey) {
        console.error('FATAL: GOOGLE_PRIVATE_KEY_B64 (or GOOGLE_PRIVATE_KEY) must be set');
        process.exit(1);
      }
      if (!WORK_EMAIL) {
        console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)');
        process.exit(1);
      }
      if (!CLIENT_EMAIL) {
        console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)');
        process.exit(1);
      }

      const token = await getToken(privKey, kid, WORK_EMAIL);
      const cursor = await loadCursor();

      // Query window: since last collect + 1h buffer. A missing cursor is only a safe
      // 25h fallback on a genuinely first-ever run (cursor ConfigMap freshly seeded,
      // never written by a real collect — initialized stays "false" until the first
      // successful saveCursor()). If the ConfigMap was already initialized and
      // lastCollect is missing anyway, the cursor was lost (wiped/corrupted): silently
      // falling back to 25h here would silently drop any unprocessed mail older than
      // that window. So this case fails LOUD instead — logged now, and folded into the
      // heartbeat Lease by enrich() below (via CURSOR_LOST_FLAG) so the readiness probe
      // goes NotReady and a human runs a manual backfill rather than trusting the gap
      // was harmless.
      const cursorLost = cursor.initialized && !cursor.lastCollect;
      if (cursorLost) {
        const msg = 'cursor lost: email-collector-cursor ConfigMap is initialized but ' +
          'lastCollect is empty; falling back to a 25h window but reporting UNHEALTHY ' +
          'so this gets fixed with a manual backfill instead of silently trusted';
        console.error(`ALERT: ${msg}`);
        try { writeFileSync(CURSOR_LOST_FLAG, msg); } catch { /* best-effort advisory only */ }
      }
      const sinceH = cursor.lastCollect
        ? Math.ceil((Date.now() - new Date(cursor.lastCollect).getTime()) / 3_600_000) + 1
        : 25;
      const q = `newer_than:${sinceH}h`;

      const [inbox, sent] = await Promise.all([
        gmailList(token, `in:inbox ${q}`),
        gmailList(token, `in:sent ${q}`),
      ]);

      // Sent thread IDs → mark replied-to inbox threads. knownIds is process-local only
      // (see loadCursor's comment above) — reset fresh every run, never persisted.
      const knownIds = {};
      const sentThreads = new Set(sent.map(m => m.threadId));
      for (const m of sent) knownIds[m.id] = { sent: true };

      const today = new Date().toISOString().slice(0, 10);
      mkdirSync(MESSAGES, { recursive: true });
      mkdirSync(DIGESTS,  { recursive: true });

      const dayFile = join(MESSAGES, `${today}.json`);
      const existing = existsSync(dayFile) ? JSON.parse(readFileSync(dayFile, 'utf8')) : [];
      const seenIds  = new Set(existing.map(m => m.id));

      let added = 0;
      for (const ref of inbox) {
        if (knownIds[ref.id]) continue;
        const msg = await gmailGet(token, ref.id);
        const from = hdr(msg, 'From'), subj = hdr(msg, 'Subject'), date = hdr(msg, 'Date');
        const rec = {
          id: ref.id, threadId: ref.threadId,
          from, subject: subj, date,
          snippet: (msg.snippet ?? '').slice(0, 200),
          is_noise: isNoise(from),
          is_signature: isSig(from, subj),
          is_replied: sentThreads.has(ref.threadId),
          gmail_link: gmailLink(ref.id, WORK_EMAIL),
          account: WORK_EMAIL,
        };
        knownIds[ref.id] = { collected: today };
        if (!seenIds.has(ref.id)) { existing.push(rec); seenIds.add(ref.id); added++; }
        // Small delay to stay well within Gmail API quota (250 units/user/sec)
        await new Promise(r => setTimeout(r, 50));
      }

      const tmp = `${dayFile}.tmp`;
      writeFileSync(tmp, JSON.stringify(existing, null, 2));
      renameSync(tmp, dayFile);

      try {
        await saveCursor(new Date().toISOString());
      } catch (e) {
        // Self-healing: don't fail the run over a cursor write hiccup — next run's
        // window arithmetic (based on the OLD, still-intact cursor) naturally re-covers
        // whatever gap this causes. Only a wiped/missing lastCollect (cursorLost, above)
        // needs a loud alert; a transient PATCH failure does not.
        console.error(`WARN: cursor ConfigMap patch failed, will retry next run: ${e.message}`);
      }
      console.log(`collect [${WORK_EMAIL}]: +${added} new (${inbox.length} inbox, ${sent.length} sent checked)${cursorLost ? ' [CURSOR LOST]' : ''}`);
    }

    // ---------- backfill ----------
    // One-shot historical re-pull for a closed date window. `collect` only ever walks
    // forward from the cursor, so a gap in the day-files is structurally unrecoverable
    // by the normal cadence — nothing ever looks backwards. backfill re-pulls the window
    // straight from Gmail (the authoritative source) and files each message under the
    // day-file for its own internalDate, which is where enrich already looks. Records
    // are byte-identical in shape to collect's, so digest/enrich need no knowledge that
    // a backfill happened.
    //
    // IMPORTANT (post-PVC): day-files now live on a pod-scoped emptyDir, not a shared
    // PVC. backfill runs as its own one-off Pod/Job, separate from the every-minute
    // CronJob, so anything it writes to /data would vanish with that pod before any
    // later scheduled run could ever see it — there is no "next enrich run" to pick it
    // up anymore. So backfill calls enrich() itself at the end, in-process, in the same
    // pod, closing that gap without inventing new durable infrastructure (no new PVC, no
    // database, no keeping the old PVC around as a fallback).
    //
    // Deliberately never touches the cursor ConfigMap — collect() owns lastCollect and
    // the two never contend for the same message: collect's window is `newer_than:~2h`
    // and backfill's is strictly historical. Worst case on overlap is a redundant Gmail
    // fetch — the day-file and ingested.json both dedup by id.
    //
    // Window is given as UTC dates, both ends inclusive, and converted to epoch seconds
    // for the Gmail query. Gmail's `after:`/`before:` accept Unix timestamps and
    // interpret bare YYYY/MM/DD dates in the account's timezone; epoch keeps the window
    // absolute and aligned with the UTC basis the day-file names already use.

    function dayOf(msg, fallbackDate) {
      const ms = Number(msg.internalDate);
      if (Number.isFinite(ms) && ms > 0) return new Date(ms).toISOString().slice(0, 10);
      const parsed = Date.parse(fallbackDate ?? '');
      if (Number.isFinite(parsed)) return new Date(parsed).toISOString().slice(0, 10);
      return null;
    }

    async function backfill() {
      const from = process.env.BACKFILL_FROM ?? process.argv[3] ?? '';
      const to   = process.env.BACKFILL_TO   ?? process.argv[4] ?? '';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(from) || !/^\d{4}-\d{2}-\d{2}$/.test(to)) {
        console.error('FATAL: BACKFILL_FROM and BACKFILL_TO must be YYYY-MM-DD (inclusive window)');
        process.exit(1);
      }

      const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
      const privKey = keyB64
        ? Buffer.from(keyB64, 'base64').toString('utf8')
        : process.env.GOOGLE_PRIVATE_KEY;
      const kid = process.env.GOOGLE_PRIVATE_KEY_ID ?? '';

      if (!privKey)     { console.error('FATAL: GOOGLE_PRIVATE_KEY_B64 (or GOOGLE_PRIVATE_KEY) must be set'); process.exit(1); }
      if (!WORK_EMAIL)  { console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)'); process.exit(1); }
      if (!CLIENT_EMAIL){ console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)'); process.exit(1); }

      const afterSec  = Math.floor(Date.parse(`${from}T00:00:00Z`) / 1000);
      const beforeSec = Math.floor(Date.parse(`${to}T00:00:00Z`) / 1000) + 86_400;
      if (!Number.isFinite(afterSec) || !Number.isFinite(beforeSec) || beforeSec <= afterSec) {
        console.error(`FATAL: invalid window ${from}..${to}`);
        process.exit(1);
      }

      const token = await getToken(privKey, kid, WORK_EMAIL);
      const q = `after:${afterSec} before:${beforeSec}`;
      console.log(`backfill [${WORK_EMAIL}]: window ${from}..${to} inclusive (${q})`);

      // MAX is a ceiling, not an expectation: gmailList's default of 100 would silently
      // truncate a multi-week window into the first page of results.
      const MAX = Number(process.env.BACKFILL_MAX ?? 5000);
      const [inbox, sent] = await Promise.all([
        gmailList(token, `in:inbox ${q}`, MAX),
        gmailList(token, `in:sent ${q}`, MAX),
      ]);
      if (inbox.length >= MAX) {
        console.error(`WARN: inbox hit the ${MAX}-message ceiling — window may be truncated, raise BACKFILL_MAX`);
      }
      const sentThreads = new Set(sent.map(m => m.threadId));
      console.log(`backfill: ${inbox.length} inbox, ${sent.length} sent in window`);

      mkdirSync(MESSAGES, { recursive: true });
      const byDay = new Map();
      let undated = 0;

      for (const ref of inbox) {
        const msg = await gmailGet(token, ref.id);
        const from_ = hdr(msg, 'From'), subj = hdr(msg, 'Subject'), date = hdr(msg, 'Date');
        const day = dayOf(msg, date);
        if (!day) { undated++; continue; }
        const rec = {
          id: ref.id, threadId: ref.threadId,
          from: from_, subject: subj, date,
          snippet: (msg.snippet ?? '').slice(0, 200),
          is_noise: isNoise(from_),
          is_signature: isSig(from_, subj),
          is_replied: sentThreads.has(ref.threadId),
          gmail_link: gmailLink(ref.id, WORK_EMAIL),
          account: WORK_EMAIL,
        };
        if (!byDay.has(day)) byDay.set(day, []);
        byDay.get(day).push(rec);
        // Same Gmail quota courtesy as collect (250 units/user/sec).
        await new Promise(r => setTimeout(r, 50));
      }

      let added = 0;
      for (const day of [...byDay.keys()].sort()) {
        const dayFile = join(MESSAGES, `${day}.json`);
        const existing = existsSync(dayFile) ? JSON.parse(readFileSync(dayFile, 'utf8')) : [];
        const seenIds = new Set(existing.map(m => m.id));
        let dayAdded = 0;
        for (const rec of byDay.get(day)) {
          if (seenIds.has(rec.id)) continue;
          existing.push(rec); seenIds.add(rec.id); dayAdded++; added++;
        }
        const tmp = `${dayFile}.tmp`;
        writeFileSync(tmp, JSON.stringify(existing, null, 2));
        renameSync(tmp, dayFile);
        console.log(`backfill: ${day} +${dayAdded} new (${existing.length} total in day-file)`);
      }

      if (undated) console.error(`WARN: ${undated} message(s) had no usable date and were skipped`);
      console.log(`backfill: +${added} new across ${byDay.size} day-file(s); running enrich now (same pod) to push into gbrain`);
      await enrich();
    }

    // ---------- digest ----------

    async function digest() {
      // NOTE (post-PVC): day-files live on a pod-scoped emptyDir now, so this can only
      // ever see day-files written earlier in THIS pod's lifetime — today's file from
      // this run's own collect() step, and (if backfill ran in this same invocation)
      // whatever backfill just wrote. The "yesterday" half of the window is effectively
      // always empty on the normal scheduled-CronJob path now; kept for the rare case a
      // run straddles UTC midnight within one pod. This is a behavioural narrowing from
      // the old PVC-backed rolling view, not a breakage: nothing else in this repo
      // consumes the digest markdown output (verified by grep across manifests/).
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86_400_000).toISOString().slice(0, 10);
      mkdirSync(DIGESTS, { recursive: true });

      const all = [];
      for (const d of [today, yesterday]) {
        const f = join(MESSAGES, `${d}.json`);
        if (existsSync(f)) all.push(...JSON.parse(readFileSync(f, 'utf8')));
      }

      // Dedup by message ID across the two-day window
      const msgs = [...new Map(all.map(m => [m.id, m])).values()];

      const signatures = msgs.filter(m =>  m.is_signature && !m.is_noise);
      const triage     = msgs.filter(m => !m.is_noise && !m.is_signature);
      const noise      = msgs.filter(m =>  m.is_noise);

      const fmt = m => [
        `- **${m.from}** — ${m.subject || '(no subject)'}${m.is_replied ? ' ✓replied' : ''}`,
        `  *${m.date || ''}*`,
        `  ${m.snippet ? m.snippet.slice(0, 140) + (m.snippet.length > 140 ? '…' : '') : ''}`,
        `  [Open in Gmail](${m.gmail_link})`,
      ].join('\n');

      const lines = [
        `# Email Digest: ${today}`,
        ``,
        `> Account: ${WORK_EMAIL} (work) | Personal: disabled (see email-collector.yaml)`,
        `> Generated: ${new Date().toISOString()}`,
        ``,
        `## Signatures Pending (${signatures.length})`,
        signatures.length ? signatures.map(fmt).join('\n\n') : '_None_',
        ``,
        `## Messages to Triage (${triage.length})`,
        triage.length ? triage.map(fmt).join('\n\n') : '_None_',
        ``,
        `## Noise (${noise.length})`,
        noise.length ? noise.map(m => `- ${m.from} — ${m.subject}`).join('\n') : '_None_',
      ];

      const out = join(DIGESTS, `${today}.md`);
      const tmp = `${out}.tmp`;
      writeFileSync(tmp, lines.join('\n') + '\n');
      renameSync(tmp, out);
      console.log(`digest: ${triage.length} triage, ${signatures.length} sig, ${noise.length} noise → ${out}`);
    }

    // ---------- enrich: deterministic ingestion into gbrain ----------
    // Reads every collected message (all day-files, dedup by id), skips noise, and
    // pushes each not-yet-ingested message into gbrain via the MCP put_page tool.
    // gbrain self-wires entities/links/timeline server-side. Idempotent: ingested IDs
    // are tracked in ingested.json so re-runs only push new mail (and the first run
    // backfills whatever the collector already accumulated). A run NEVER exits non-zero
    // on a gbrain outage — that would fail the Job and re-pull Gmail. Instead the outage
    // is recorded in the heartbeat Lease and surfaced by the readiness probe (NotReady).
    //
    // Post-PVC the cache lives in the email-collector-cursor ConfigMap, under its own
    // `ingested.json` key alongside `cursor.json`. Both are written with JSON merge-patch,
    // which merges into `data` per-key, so the two never clobber each other; one object
    // means the collector's existing configmaps get/update/patch grant already covers it.
    // On emptyDir it would start empty every run, and with a 1-minute schedule the whole
    // of collect's ~2h overlap window would be re-pushed every single run — ~1400
    // redundant put_page calls/day against gbrain's 60/min token budget, and ~20s of every
    // 60s spent on upserts gbrain would just discard.
    //
    // Pruned by age, not by which IDs happen to be on this pod's emptyDir: backfill runs
    // in its own pod whose day-files are entirely different, and pruning to that pod's ID
    // set would wipe the scheduled collector's cache. 48h comfortably covers collect's ~2h
    // window and keeps the object at a few tens of KB, far under the 1MB ConfigMap limit.

    const INGESTED_KEY    = 'ingested.json';
    const INGESTED_TTL_MS = 48 * 3_600_000;

    async function loadIngested() {
      let cm;
      try {
        cm = await k8sGet(CURSOR_PATH);
      } catch (e) {
        console.error(`WARN: ingested cache GET failed, treating as empty: ${e.message}`);
        return {};
      }
      try { return JSON.parse(cm.data?.[INGESTED_KEY] ?? '{}'); } catch { return {}; }
    }

    async function saveIngested(obj) {
      const cutoff = Date.now() - INGESTED_TTL_MS;
      const pruned = {};
      for (const [id, v] of Object.entries(obj)) {
        const at = Date.parse(v?.at ?? '');
        if (Number.isFinite(at) && at >= cutoff) pruned[id] = v;
      }
      await k8sPatch(CURSOR_PATH, { data: { [INGESTED_KEY]: JSON.stringify(pruned) } });
      return pruned;
    }

    // Heartbeat: PATCH the Lease declared earlier in this file (merge-patch+json, so
    // fields not mentioned here — e.g. acquireTime/leaseTransitions — are left alone).
    // spec carries liveness (holderIdentity/renewTime/leaseDurationSeconds); the
    // ingestion.simplesalt.company/ annotations carry the payload, matching
    // calendar-collector.yaml's identical contract. Best-effort: a Lease write failure
    // must not crash the caller (enrich always exits 0 — ingestion health lives in the
    // probe, not Job status). If the Lease itself is unreachable, the readiness probe's
    // own k8sGet will separately go stale and NotReady.
    async function writeHeartbeat(status, { error, ingestedTotal, pushedThisRun } = {}) {
      const now = new Date().toISOString();
      const body = {
        spec: {
          holderIdentity: POD_NAME,
          leaseDurationSeconds: HEARTBEAT_MAX_AGE_SEC,
          renewTime: now,
        },
        metadata: {
          annotations: {
            [`${ANN}/status`]: status,
            [`${ANN}/error`]: error ? String(error).slice(0, 800) : '',
            [`${ANN}/ingested-total`]: String(ingestedTotal ?? ''),
            [`${ANN}/pushed-this-run`]: String(pushedThisRun ?? ''),
          },
        },
      };
      try {
        await k8sPatch(LEASE_PATH, body);
      } catch (e) {
        console.error(`WARN: heartbeat Lease patch failed: ${e.message}`);
      }
    }

    // gbrain serves the MCP Streamable-HTTP transport in STATELESS mode
    // (serve-http.ts: sessionIdGenerator undefined) — each POST is independent, no
    // initialize/session handshake needed — BUT it requires the dual Accept header and
    // replies as an SSE frame ("event: message\ndata: {json}"), not plain JSON. Parse
    // the frame out; fall back to plain JSON for enableJsonResponse-style servers.
    function parseMcpResponse(text) {
      let msg = null;
      for (const block of text.split('\n\n')) {
        const data = block.split('\n')
          .filter(l => l.startsWith('data:'))
          .map(l => l.slice(5).trim())
          .join('\n');
        if (!data) continue;
        try { const o = JSON.parse(data); if (o.result || o.error) msg = o; } catch { /* keep scanning */ }
      }
      if (msg) return msg;
      try { return JSON.parse(text); } catch { return null; }
    }

    async function gbrainPutPage(slug, content) {
      const r = await fetch(GBRAIN_MCP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json, text/event-stream',
          'Authorization': `Bearer ${GBRAIN_TOKEN}`,
        },
        body: JSON.stringify({
          jsonrpc: '2.0', id: 1, method: 'tools/call',
          params: { name: 'put_page', arguments: { slug, content } },
        }),
      });
      const text = await r.text();
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0, 160)}`);
      const msg = parseMcpResponse(text);
      if (!msg) throw new Error(`unparseable MCP response: ${text.slice(0, 160)}`);
      if (msg.error) throw new Error(`rpc: ${JSON.stringify(msg.error).slice(0, 160)}`);
      if (msg.result?.isError) {
        const t = (msg.result.content ?? []).map(c => c.text ?? '').join(' ');
        throw new Error(`tool: ${t.slice(0, 160)}`);
      }
      return msg.result;
    }

    // Provenance/source attribution baked in code (the recipe stresses: links + metadata
    // are always code-generated, never LLM-generated). Remote put_page server-stamps its
    // own source_kind, so we carry ours in the frontmatter for the audit trail.
    function emailToMarkdown(m) {
      const subj = m.subject || '(no subject)';
      const q = s => String(s ?? '').replace(/"/g, "'");
      return [
        '---',
        `title: "${q(subj).slice(0, 120)}"`,
        'type: email',
        'source: gmail',
        `account: "${q(m.account)}"`,
        `from: "${q(m.from)}"`,
        `date: "${q(m.date)}"`,
        `message_id: "${m.id}"`,
        `thread_id: "${m.threadId ?? ''}"`,
        `url: "${m.gmail_link}"`,
        `is_signature: ${!!m.is_signature}`,
        `replied: ${!!m.is_replied}`,
        'tags: [email, inbox]',
        '---',
        '',
        `# ${subj}`,
        '',
        `**From:** ${m.from}`,
        `**Date:** ${m.date}`,
        `**Account:** ${m.account}`,
        '',
        m.snippet || '',
        '',
        `[Open in Gmail](${m.gmail_link})`,
        '',
      ].join('\n');
    }

    async function enrich() {
      try {
        if (!GBRAIN_TOKEN) {
          await writeHeartbeat('error', { error: 'GBRAIN_REMOTE_TOKEN not set', pushedThisRun: 0 });
          console.error('enrich: GBRAIN_REMOTE_TOKEN not set — recorded in heartbeat, health will report NotReady');
          return;
        }
        mkdirSync(MESSAGES, { recursive: true });
        const files = existsSync(MESSAGES) ? readdirSync(MESSAGES).filter(f => f.endsWith('.json')) : [];
        const all = [];
        for (const f of files) {
          try { all.push(...JSON.parse(readFileSync(join(MESSAGES, f), 'utf8'))); } catch { /* skip bad file */ }
        }
        const byId = new Map(all.filter(m => m && m.id).map(m => [m.id, m]));
        const ingested = await loadIngested();
        const pending = [...byId.values()].filter(m => !m.is_noise && !ingested[m.id]);

        let pushed = 0; const errors = [];
        for (const m of pending) {
          try {
            await gbrainPutPage(`email/${m.id}`, emailToMarkdown(m));
            ingested[m.id] = { at: new Date().toISOString() };
            pushed++;
          } catch (e) {
            errors.push(`${m.id}: ${e.message}`);
            // If the very first calls all fail, gbrain is likely down/misconfigured —
            // stop early rather than grinding through the whole backlog against a dead endpoint.
            if (pushed === 0 && errors.length >= 3) break;
          }
          await new Promise(r => setTimeout(r, 1100)); // < 55/min, under gbrain's 60/min token limit
        }

        // One write per run, not one per push: a crash mid-loop just means the next run
        // re-pushes what it already did, which put_page's upsert-by-slug absorbs, and a
        // PATCH per message would be ~20 API writes a minute for nothing.
        let total = Object.keys(ingested).length;
        try {
          total = Object.keys(await saveIngested(ingested)).length;
        } catch (e) {
          console.error(`enrich: saveIngested failed: ${e.message}`);
          errors.push(`saveIngested: ${e.message}`);
        }

        const cursorLostNote = existsSync(CURSOR_LOST_FLAG) ? readFileSync(CURSOR_LOST_FLAG, 'utf8').trim() : '';
        const errParts = errors.slice(0, 5);
        if (cursorLostNote) errParts.unshift(cursorLostNote);
        const status = errParts.length ? 'error' : 'ok';
        await writeHeartbeat(status, {
          pushedThisRun: pushed,
          ingestedTotal: total,
          error: errParts.join(' | '),
        });
        console.log(`enrich: pushed ${pushed}/${pending.length} new → gbrain (total ${total})${errors.length ? `, ${errors.length} error(s)` : ''}${cursorLostNote ? ', CURSOR LOST' : ''}`);
      } catch (e) {
        await writeHeartbeat('error', { error: e.message, pushedThisRun: 0 });
        console.error(`enrich: unexpected failure recorded in heartbeat: ${e.message}`);
      }
      // Always exit 0: ingestion health lives in the heartbeat/probe, not the Job status.
    }

    // ---------- healthcheck: k8s readiness probe target ----------
    // Exit 0 = ingestion healthy (fresh Lease renewTime + last run status=ok). Exit 1 =
    // NotReady. Reads the same Lease writeHeartbeat() patches, via the
    // email-ingestion-health ServiceAccount's get-only Role (scoped to just this Lease).
    async function healthcheck() {
      let lease;
      try {
        lease = await k8sGet(LEASE_PATH);
      } catch (e) {
        console.error(`UNHEALTHY: cannot read heartbeat Lease: ${e.message}`);
        process.exit(1);
      }
      const renewTime = lease.spec?.renewTime;
      const leaseDurationSeconds = lease.spec?.leaseDurationSeconds ?? HEARTBEAT_MAX_AGE_SEC;
      if (!renewTime) {
        console.error('UNHEALTHY: no heartbeat yet (pipeline has not completed a run)');
        process.exit(1);
      }
      const ageSec = (Date.now() - new Date(renewTime).getTime()) / 1000;
      if (!Number.isFinite(ageSec) || ageSec > leaseDurationSeconds) {
        console.error(`UNHEALTHY: heartbeat stale (${Math.round(ageSec)}s > ${leaseDurationSeconds}s max)`);
        process.exit(1);
      }
      const ann = lease.metadata?.annotations ?? {};
      const status = ann[`${ANN}/status`];
      if (status !== 'ok') {
        console.error(`UNHEALTHY: last run status=${status || '(none)'} — ${ann[`${ANN}/error`] || 'see Lease annotations'}`);
        process.exit(1);
      }
      console.log(`OK: status=ok ingested_total=${ann[`${ANN}/ingested-total`] ?? '?'} age=${Math.round(ageSec)}s`);
    }

    // ---------- diagnose ----------
    // Tests SA-only auth first (no sub/DWD), then DWD impersonation.
    // Differentiates: bad credentials vs DWD not enabled in GCP Console.

    async function diagnose() {
      const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
      const privKey = keyB64
        ? Buffer.from(keyB64, 'base64').toString('utf8')
        : process.env.GOOGLE_PRIVATE_KEY;
      const kid = process.env.GOOGLE_PRIVATE_KEY_ID ?? '';

      if (!privKey) {
        console.error('FATAL: GOOGLE_PRIVATE_KEY_B64 not set'); process.exit(1);
      }
      if (!CLIENT_EMAIL) {
        console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)'); process.exit(1);
      }
      if (!WORK_EMAIL) {
        console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)'); process.exit(1);
      }
      console.log(`SA client email: ${CLIENT_EMAIL}`);
      console.log(`Private key ID:  ${kid}`);
      console.log(`Impersonate:     ${WORK_EMAIL}`);
      console.log('');

      // Test 1: SA-only token (no sub, no DWD) — use cloud-platform scope which a SA can
      // self-request. Validates that the private key and client_email are correct.
      console.log('Test 1: SA-only token (no DWD impersonation, scope=cloud-platform)...');
      try {
        const now = Math.floor(Date.now() / 1000);
        const hdr = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid }));
        const pay = b64url(JSON.stringify({
          iss: CLIENT_EMAIL,
          scope: 'https://www.googleapis.com/auth/cloud-platform',
          aud: 'https://oauth2.googleapis.com/token',
          iat: now, exp: now + 3600,
        }));
        const unsigned = `${hdr}.${pay}`;
        const sig = createSign('RSA-SHA256').update(unsigned).sign(privKey, 'base64url');
        const jwt = `${unsigned}.${sig}`;
        const r = await fetch('https://oauth2.googleapis.com/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }),
        });
        const body = await r.json();
        if (r.ok) console.log('  PASS: SA credentials valid, got access token');
        else      console.log(`  FAIL ${r.status}: ${JSON.stringify(body)}`);
      } catch(e) { console.log(`  ERROR: ${e.message}`); }

      // Test 2: DWD token (with sub = work email, gmail.modify scope)
      console.log('Test 2: DWD token (sub=work email, scope=gmail.modify)...');
      try {
        const token = await getToken(privKey, kid, WORK_EMAIL);
        console.log('  PASS: DWD token exchange succeeded');
      } catch(e) { console.log(`  FAIL: ${e.message}`); }
    }

    // ---------- main ----------

    const cmd = process.argv[2];
    if      (cmd === 'collect')     await collect();
    else if (cmd === 'backfill')    await backfill();
    else if (cmd === 'digest')      await digest();
    else if (cmd === 'enrich')      await enrich();
    else if (cmd === 'healthcheck') await healthcheck();
    else if (cmd === 'diagnose')    await diagnose();
    else { console.error('Usage: email-collector.mjs collect|backfill <from> <to>|digest|enrich|healthcheck|diagnose'); process.exit(1); }
---
# CronJob runs the deterministic collector every minute (schedule below).
# concurrencyPolicy: Forbid ensures no overlapping runs (safe for the cursor ConfigMap
# patch and the atomic digest/day-file writes within the pod's own emptyDir).
# The pod uses the same SA credentials already in hermes-secrets (GOOGLE_PRIVATE_KEY_B64 +
# GOOGLE_PRIVATE_KEY_ID), so no new Secrets are required.
#
# If hermes-secrets does not yet have GOOGLE_PRIVATE_KEY_B64 populated (i.e. the Google
# service account hasn't been configured), the Job will fail with a clear error message
# and back off. It will not crashloop the Hermes pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: email-collector
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  # Every minute for near-realtime ingestion; concurrencyPolicy: Forbid keeps
  # runs from overlapping if one exceeds a minute.
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: email-collector
        spec:
          serviceAccountName: email-collector
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: oven/bun:1-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  bun /scripts/email-collector.mjs collect \
                    && bun /scripts/email-collector.mjs digest \
                    && bun /scripts/email-collector.mjs enrich
              env:
                - name: DATA_DIR
                  value: /data
                # Lease holderIdentity — who is currently writing the heartbeat.
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                # Impersonated work-account identity, from the google-dwd-key Secret
                # (declared above in this file). optional: true → pod still schedules
                # when unset; script exits 1 with a clear FATAL message.
                - name: WORK_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: google-dwd-key
                      key: impersonate_email
                      optional: true
                # gbrain MCP endpoint + bearer for the enrich step. The token is an inline
                # literal (matches the gbrain + hermes Deployments); the only security
                # boundary is the in-cluster network, and the sent bearer and the
                # DB-hashed value both derive from this same literal.
                - name: GBRAIN_MCP_URL
                  value: http://gbrain:3131/mcp
                - name: GBRAIN_REMOTE_TOKEN
                  value: "gbrain-mcp"
                # Service-account identity, from the google-dwd-key Secret.
                - name: GOOGLE_CLIENT_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: google-dwd-key
                      key: client_email
                      optional: true
                # Private key from hermes-secrets (same keys the seed-google-token init uses).
                # optional: true → pod still schedules when keys are absent; script exits 1 with
                # a clear FATAL message so the Job history shows why it failed.
                - name: GOOGLE_PRIVATE_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: GOOGLE_PRIVATE_KEY_ID
                      optional: true
                - name: GOOGLE_PRIVATE_KEY_B64
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: GOOGLE_PRIVATE_KEY_B64
                      optional: true
              volumeMounts:
                - name: email-data
                  mountPath: /data
                - name: collector-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            # Pod-scoped scratch space only (per-day message JSON, digests). Nothing here
            # needs to survive past this pod — durable cross-pod state is the Lease +
            # ConfigMap declared above.
            - name: email-data
              emptyDir: {}
            - name: collector-script
              configMap:
                name: email-collector-script
---
# K8s-native ingestion healthcheck. A minimal always-on pod that runs the collector
# script's `healthcheck` mode as a readinessProbe, reading the email-collector-heartbeat
# Lease via its own email-ingestion-health ServiceAccount/Role (get-only, scoped to that
# one Lease by resourceNames). The probe passes only when the Lease's renewTime is fresh
# (within leaseDurationSeconds — 900s = 15min = ~15 missed cycles at the 1-run/min
# cadence) AND the last enrich run's status annotation is "ok". Result: `kubectl get
# pods` shows this pod 1/1 Ready when Gmail→gbrain ingestion is healthy and 0/1 NotReady
# when it stalls — the same probe-based signal every other Deployment in the cluster
# uses. No liveness probe: restarting this pod can't fix a stalled pipeline, so
# ingestion failure must not churn it; readiness carries the signal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-ingestion-health
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  # RollingUpdate (the default): safe now that there's no RWO PVC forcing single-node
  # co-mounting across rollouts. Was `Recreate` only because of the old
  # email-collector-data PVC, now removed.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: email-ingestion-health
  template:
    metadata:
      labels:
        app: email-ingestion-health
    spec:
      serviceAccountName: email-ingestion-health
      containers:
        - name: health
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            - name: HEARTBEAT_MAX_AGE_SEC
              value: "900"
          readinessProbe:
            exec:
              command: ["bun", "/scripts/email-collector.mjs", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 15
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: collector-script
          configMap:
            name: email-collector-script
