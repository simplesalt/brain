apiVersion: batch/v1
kind: CronJob
metadata:
  name: gbrain-mark-review
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  schedule: "0 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: gbrain-mark-review
            entity: ssint
            env: main
            capability: ai
            scheduling.simplesalt.company/class: work
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: review
              image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
              imagePullPolicy: IfNotPresent
              command: ["bun", "/scripts/gbrain-mark-review.mjs"]
              env:
                - name: APPLY
                  value: "false"
                - name: DELETE_AFTER_HOURS
                  value: "4320"
                - name: REPLACE_AFTER_HOURS
                  value: "168"
                - name: GBRAIN_MCP_URL
                  value: http://gbrain:3131/mcp
                - name: GBRAIN_REMOTE_TOKEN
                  value: gbrain-mcp
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: gbrain-pg-app
                      key: uri
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: dumps
                  mountPath: /dumps
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: gbrain-mark-review-script
            - name: dumps
              persistentVolumeClaim:
                claimName: gbrain-pg-backup-a
                readOnly: true
