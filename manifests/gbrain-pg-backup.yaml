apiVersion: batch/v1
kind: CronJob
metadata:
  name: gbrain-pg-backup-verify
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  schedule: "30 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: gbrain-pg-backup-verify
            entity: ssint
            env: main
            capability: ai
            scheduling.simplesalt.company/class: work
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/verify.sh"]
              env:
                - name: PGHOST
                  value: gbrain-pg-rehearsal-rw
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: gbrain-pg-rehearsal-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: gbrain-pg-rehearsal-app
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: gbrain-pg-backup-a
                readOnly: true
            - name: scripts
              configMap:
                name: gbrain-pg-backup-scripts
