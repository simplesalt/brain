# Dedicated single-value Secret for gbrain's embedding provider (OpenAI).
# The start of breaking hermes-secrets out into per-key secrets. The value is
# populated out-of-band (same as the rest of the secret population) — kept out
# of git. The ssa: merge annotation lets Flux own the resource without clobbering
# the out-of-band value. Referenced by the gbrain + autopilot containers in
# ai.yaml via secretKeyRef (key: OPENAI_API_KEY, optional: true).
apiVersion: v1
kind: Secret
metadata:
  name: gbrain-embedding-secret
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
