---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-rc-skel-permtest
  namespace: ssint-main-coding
  labels:
    entity: ssint
    env: main
    capability: coding
data:
  claude.json.tmpl: |
    {
      "mcpServers": {
        "flux": {
          "type": "http",
          "url": "http://mcp-flux.flux-system:9090/mcp"
        },
        "cloudflare": {
          "type": "http",
          "url": "https://mcp.cloudflare.com/mcp",
          "headers": {
            "Authorization": "Bearer ${CLOUDFLARE_API_TOKEN}"
          }
        }
      },
      "projects": {
        "/home/coder/repo/.claude/worktrees": {
          "hasTrustDialogAccepted": true
        }
      },
      "remoteControlMachineId": "126ad15e-90ea-46ac-a419-197a112317ac"
    }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: build-brain-permtest
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.46.2"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: ssint-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
    disableWait: true
  values:
    instanceId: permtest
    repo:
      slug: brain
      ref: main
    oauthSecret:
      create: true
    resources:
      builder:
        requests:
          memory: 512Mi
    hindsight:
      bankId: ssint-build-brain
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: true
      create: false
      existingConfigMap: claude-rc-skel-permtest
    podAnnotations:
      simplesalt.company/restart-epoch: "13"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ssint-build-brain-permtest
            patch: |
              - op: add
                path: /spec/template/spec/hostname
                value: ssint-build-brain-permtest
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: claude-projects
                  persistentVolumeClaim:
                    claimName: ssint-build-brain-permtest-projects
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: claude-projects
                  mountPath: /home/coder/.claude/projects
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: permtest-serve-rc
                  configMap:
                    name: ssint-build-brain-permtest-serve-rc
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: permtest-serve-rc
                  mountPath: /etc/permtest
                  readOnly: true
              - op: replace
                path: /spec/template/spec/containers/0/args
                value: ["sh", "/etc/permtest/serve-rc"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssint-build-brain-permtest-projects
  namespace: ssint-main-coding
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssint-build-brain-permtest-serve-rc
  namespace: ssint-main-coding
  labels:
    entity: ssint
    env: main
    capability: coding
data:
  serve-rc: "set -eu\n\n: \"${REPO_URL:?REPO_URL must be set (the git repo to serve)}\"\nWORKDIR=\"${WORKDIR:-$HOME/repo}\"\n\nCREDS=\"${CLAUDE_SECURESTORAGE_CONFIG_DIR:-$HOME/.claude}/.credentials.json\"\nRC_POLL_SECONDS=\"${RC_POLL_SECONDS:-10}\"\nCRED_REFRESH_MARGIN_SECONDS=\"${CRED_REFRESH_MARGIN_SECONDS:-120}\"\nCRED_REFRESH_TIMEOUT_SECONDS=\"${CRED_REFRESH_TIMEOUT_SECONDS:-90}\"\n\nbg_pid=\"\"\nrenew_out=\"\"\non_signal() {\n  echo \"Received $2 -- shutting down.\" >&2\n  [ -z \"$bg_pid\" ] || kill \"$bg_pid\" 2>/dev/null || :\n  [ -z \"$renew_out\" ] || rm -f \"$renew_out\"\n  exit \"$1\"\n}\ninstall_signal_traps() {\n  trap 'on_signal 143 SIGTERM' TERM\n  trap 'on_signal 130 SIGINT' INT\n}\ninstall_signal_traps\n\nisleep() {\n  sleep \"$1\" &\n  bg_pid=$!\n  wait \"$bg_pid\" || :\n  bg_pid=\"\"\n}\n\nlogin_usable() {\n  [ -s \"$CREDS\" ] && [ -n \"$(jq -r '.claudeAiOauth.refreshToken // empty' \"$CREDS\" 2>/dev/null)\" ]\n}\n\ncreds_hash() {\n  sha256sum \"$CREDS\" 2>/dev/null | cut -d' ' -f1\n}\n\naccess_token_expired() {\n  exp_ms=\"$(jq -r '.claudeAiOauth.expiresAt // empty' \"$CREDS\" 2>/dev/null)\" || exp_ms=\"\"\n  case \"$exp_ms\" in\n    ''|*[!0-9]*) return 1 ;;\n  esac\n  [ $((exp_ms / 1000)) -le \"$(date +%s)\" ]\n}\n\nlogin_banner() {\n  echo \"==============================================================================\" >&2\n  if [ \"$1\" = \"missing\" ]; then\n    echo \"No Remote Control credential yet for this pod. From another terminal, run:\" >&2\n    echo \"  kubectl -n ${NAMESPACE:-<namespace>} exec -it $(hostname) -c claude-rc -- claude\" >&2\n    echo \"and complete the OAuth login shown (paste the code back if prompted), then exit.\" >&2\n    echo \"This pod picks up the credential automatically — no restart needed.\" >&2\n  else\n    echo \"The Remote Control login for this pod was rejected by Anthropic or removed,\" >&2\n    echo \"human login required. From another terminal, run:\" >&2\n    echo \"  kubectl -n ${NAMESPACE:-<namespace>} exec -it $(hostname) -c claude-rc -- claude auth login\" >&2\n    echo \"and complete the OAuth login shown (paste the code back if prompted), then exit.\" >&2\n    echo \"This pod picks up the credential automatically -- no restart needed.\" >&2\n  fi\n  echo \"==============================================================================\" >&2\n}\n\npark_for_login() {\n  login_banner \"$1\"\n  parked_hash=\"$(creds_hash)\"\n  while true; do\n    isleep \"$RC_POLL_SECONDS\"\n    if login_usable && [ \"$(creds_hash)\" != \"$parked_hash\" ]; then\n      break\n    fi\n  done\n}\n\nrenew_reason() {\n  reason=\"$(jq -rs 'map(objects | .result? // empty | strings) | first // empty' \"$1\" 2>/dev/null)\" || reason=\"\"\n  if [ -z \"$reason\" ]; then\n    reason=\"$(jq -rR 'fromjson? | objects | .result? // empty | strings' \"$1\" 2>/dev/null | head -n 1)\" || reason=\"\"\n  fi\n  if [ -z \"$reason\" ]; then\n    reason=\"$(grep -m 1 '[^[:space:]]' \"$1\" 2>/dev/null)\" || reason=\"\"\n  fi\n  printf '%s' \"$reason\" | jq -Rrs '\n    gsub(\"[\\u0001-\\u001f\\u007f-\\u009f]+\"; \" \")\n    | gsub(\"sk-ant-[A-Za-z0-9_-]+\"; \"[redacted]\")\n    | sub(\"^ +\"; \"\") | sub(\" +$\"; \"\")\n    | .[0:300]' 2>/dev/null || true\n}\n\nrenew_login() {\n  renew_out=\"$(mktemp)\"\n  CLAUDE_CODE_MAX_RETRIES=0 timeout \"$CRED_REFRESH_TIMEOUT_SECONDS\" \\\n    claude -p \"reply with exactly: OK\" --output-format json </dev/null >\"$renew_out\" 2>&1 &\n  bg_pid=$!\n  set +e\n  wait \"$bg_pid\"\n  renew_status=$?\n  set -e\n  bg_pid=\"\"\n  if [ \"$renew_status\" -eq 0 ]; then\n    RENEW_RESULT=\"ok\"\n    echo \"Credential refresh call succeeded.\" >&2\n  else\n    if grep -q 'could not be refreshed' \"$renew_out\" 2>/dev/null || ! login_usable; then\n      RENEW_RESULT=\"rejected\"\n      renew_msg=\"Credential refresh call REJECTED by Anthropic (exit $renew_status) -- the login cannot be renewed\"\n    else\n      RENEW_RESULT=\"failed\"\n      renew_msg=\"Credential refresh call failed (exit $renew_status)\"\n    fi\n    reason=\"$(renew_reason \"$renew_out\")\"\n    echo \"$renew_msg: ${reason:-no output}\" >&2\n  fi\n  rm -f \"$renew_out\"\n  renew_out=\"\"\n}\n\nif ! login_usable; then\n  if [ -s \"$CREDS\" ]; then\n    park_for_login rejected\n  else\n    park_for_login missing\n  fi\n  echo \"Credential detected — continuing startup.\" >&2\nfi\n\nexpires_ms=\"$(jq -r '.claudeAiOauth.expiresAt // empty' \"$CREDS\" 2>/dev/null)\" || expires_ms=\"\"\ncase \"$expires_ms\" in\n  ''|*[!0-9]*)\n    ;;\n  *)\n    expires_s=$((expires_ms / 1000))\n    now_s=\"$(date +%s)\"\n    if [ $((expires_s - now_s)) -le \"$CRED_REFRESH_MARGIN_SECONDS\" ]; then\n      echo \"Access token expires at ${expires_s} (now ${now_s}) -- refreshing before starting Remote Control.\" >&2\n      renew_login\n      if [ \"$RENEW_RESULT\" = \"rejected\" ]; then\n        park_for_login rejected\n        echo \"Credential detected — continuing startup.\" >&2\n      elif [ \"$RENEW_RESULT\" = \"failed\" ]; then\n        echo \"Continuing startup anyway.\" >&2\n      fi\n    fi\n    ;;\nesac\n\nif [ ! -d \"$WORKDIR/.git\" ]; then\n  if ! REFS=$(git ls-remote \"$REPO_URL\" 2>/dev/null); then\n    echo \"==============================================================================\" >&2\n    echo \"Cannot reach or access repo: $REPO_URL\" >&2\n    echo \"This means REPO_URL is wrong, the repo doesn't exist yet, or the credential\" >&2\n    echo \"lacks access. Fix REPO_URL and/or grant access, no pod restart needed --\" >&2\n    echo \"this pod will pick it up automatically. Retrying every ${RC_POLL_SECONDS}s...\" >&2\n    echo \"==============================================================================\" >&2\n    while ! REFS=$(git ls-remote \"$REPO_URL\" 2>/dev/null); do\n      isleep \"$RC_POLL_SECONDS\"\n    done\n    echo \"Repository now reachable -- continuing startup.\" >&2\n  fi\n\n  if [ -z \"$REFS\" ]; then\n    BRANCH=\"${REPO_REF:-main}\"\n    echo \"Repo $REPO_URL is empty -- bootstrapping branch '$BRANCH' with an initial commit.\" >&2\n    git init \"$WORKDIR\"\n    (\n      cd \"$WORKDIR\"\n      git remote add origin \"$REPO_URL\"\n      git checkout -b \"$BRANCH\"\n      git -c user.name=\"${GIT_DISPLAY_NAME:-Claude Code}\" \\\n          -c user.email=\"${CLAUDE_EMAIL:-claude@simplesalt.company}\" \\\n          commit --allow-empty -m \"Initial commit (bootstrapped by claude-rc)\"\n      git push -u origin \"$BRANCH\"\n    )\n  else\n    git clone ${REPO_REF:+--branch \"$REPO_REF\"} \"$REPO_URL\" \"$WORKDIR\"\n  fi\nfi\ncd \"$WORKDIR\"\n\nCFG=\"$HOME/.claude.json\"\n[ -f \"$CFG\" ] || echo '{}' > \"$CFG\"\ntmp=\"$(mktemp)\"\njq --arg d \"$WORKDIR\" '.projects[$d].hasTrustDialogAccepted = true' \"$CFG\" > \"$tmp\" && mv \"$tmp\" \"$CFG\"\n\nset -- --spawn worktree --debug-file \"$HOME/.claude/projects/rc-debug-$(date +%Y%m%dT%H%M%S).log\"\n[ -n \"${RC_CAPACITY:-}\" ] && set -- \"$@\" --capacity \"$RC_CAPACITY\"\n[ -n \"${RC_NAME:-}\" ] && set -- \"$@\" --name \"$RC_NAME\"\n\nrun_remote_control() {\n  claude remote-control \"$@\" &\n  rc_pid=$!\n  trap 'kill -TERM \"$rc_pid\" 2>/dev/null; wait \"$rc_pid\"; exit $?' TERM INT\n  set +e\n  wait \"$rc_pid\"\n  rc_status=$?\n  set -e\n  install_signal_traps\n  return \"$rc_status\"\n}\n\ndiagnose_rc_failure() {\n  token=\"$(jq -r '.claudeAiOauth.accessToken // empty' \"$CREDS\" 2>/dev/null)\" || token=\"\"\n  if [ -z \"$token\" ]; then\n    RC_DIAGNOSIS=\"unknown\"\n    RC_DIAGNOSIS_MSG=\"diagnosis inconclusive -- no access token found in $CREDS\"\n    return\n  fi\n  http_code=\"$(curl -sS -o /dev/null -m 10 -w '%{http_code}' \\\n    -H \"Authorization: Bearer $token\" \\\n    -H \"anthropic-beta: oauth-2025-04-20\" \\\n    -H \"anthropic-version: 2023-06-01\" \\\n    \"https://api.anthropic.com/v1/models\" 2>/dev/null)\" || http_code=\"000\"\n  case \"$http_code\" in\n    2??)\n      RC_DIAGNOSIS=\"unknown\"\n      RC_DIAGNOSIS_MSG=\"credential is valid (api.anthropic.com returned HTTP $http_code) -- RC eligibility is failing for some other reason, not auth or network\"\n      ;;\n    401|403)\n      RC_DIAGNOSIS=\"auth\"\n      RC_DIAGNOSIS_MSG=\"AUTH FAILURE -- Anthropic rejected the stored credential (HTTP $http_code from api.anthropic.com); this is NOT a network problem\"\n      ;;\n    000)\n      RC_DIAGNOSIS=\"network\"\n      RC_DIAGNOSIS_MSG=\"NETWORK FAILURE -- could not reach api.anthropic.com at all; this is NOT a credential problem\"\n      ;;\n    *)\n      RC_DIAGNOSIS=\"unknown\"\n      RC_DIAGNOSIS_MSG=\"diagnosis inconclusive -- api.anthropic.com returned HTTP $http_code\"\n      ;;\n  esac\n}\n\nRC_START_ATTEMPTS=\"${RC_START_ATTEMPTS:-10}\"\nRC_START_BACKOFF_SECONDS=\"${RC_START_BACKOFF_SECONDS:-5}\"\nRC_START_BACKOFF_MAX_SECONDS=\"${RC_START_BACKOFF_MAX_SECONDS:-20}\"\nattempt=1\nbackoff=\"$RC_START_BACKOFF_SECONDS\"\nwhile true; do\n  if run_remote_control \"$@\"; then\n    exit 0\n  fi\n\n  if ! login_usable; then\n    echo \"claude remote-control exited (attempt $attempt/$RC_START_ATTEMPTS) -- the stored login was rejected or removed\" >&2\n    park_for_login rejected\n    echo \"Retrying claude remote-control startup.\" >&2\n    attempt=1\n    backoff=\"$RC_START_BACKOFF_SECONDS\"\n    continue\n  fi\n\n  diagnose_rc_failure\n  echo \"claude remote-control exited (attempt $attempt/$RC_START_ATTEMPTS) -- $RC_DIAGNOSIS_MSG\" >&2\n\n  if [ \"$RC_DIAGNOSIS\" = \"auth\" ] || access_token_expired; then\n    renew_login\n    case \"$RENEW_RESULT\" in\n      rejected)\n        park_for_login rejected\n        echo \"Retrying claude remote-control startup.\" >&2\n        attempt=1\n        backoff=\"$RC_START_BACKOFF_SECONDS\"\n        continue\n        ;;\n      ok)\n        if [ \"$attempt\" -lt \"$RC_START_ATTEMPTS\" ]; then\n          attempt=$((attempt + 1))\n          continue\n        fi\n        ;;\n    esac\n  fi\n\n  if [ \"$attempt\" -lt \"$RC_START_ATTEMPTS\" ]; then\n    attempt=$((attempt + 1))\n    isleep \"$backoff\"\n    backoff=$((backoff * 2))\n    if [ \"$backoff\" -gt \"$RC_START_BACKOFF_MAX_SECONDS\" ]; then\n      backoff=\"$RC_START_BACKOFF_MAX_SECONDS\"\n    fi\n    continue\n  fi\n\n  echo \"==============================================================================\" >&2\n  if [ \"$RC_DIAGNOSIS\" = \"auth\" ]; then\n    echo \"Credential appears dead, human login required. From another terminal, run:\" >&2\n    echo \"  kubectl -n ${NAMESPACE:-<namespace>} exec -it $(hostname) -c claude-rc -- claude auth login\" >&2\n    echo \"and complete the OAuth login shown (paste the code back if prompted), then exit.\" >&2\n    echo \"This pod picks up the credential automatically -- no restart needed.\" >&2\n  elif [ \"$RC_DIAGNOSIS\" = \"network\" ]; then\n    echo \"Network to api.anthropic.com appears down. No action needed here -- this pod\" >&2\n    echo \"will keep retrying and pick back up automatically once connectivity returns.\" >&2\n  else\n    echo \"claude remote-control keeps failing to start and the diagnosis is inconclusive.\" >&2\n    echo \"From another terminal, inspect further with:\" >&2\n    echo \"  kubectl -n ${NAMESPACE:-<namespace>} exec -it $(hostname) -c claude-rc -- claude doctor\" >&2\n  fi\n  echo \"==============================================================================\" >&2\n\n  cred_hash=\"$(creds_hash)\"\n  while true; do\n    isleep \"$RC_POLL_SECONDS\"\n    new_hash=\"$(creds_hash)\"\n    if [ \"$new_hash\" != \"$cred_hash\" ]; then\n      break\n    fi\n    if [ \"$RC_DIAGNOSIS\" = \"network\" ]; then\n      break\n    fi\n  done\n  echo \"Retrying claude remote-control startup.\" >&2\n  attempt=1\n  backoff=\"$RC_START_BACKOFF_SECONDS\"\ndone\n\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ssint-build-brain-permtest-rc-log-diff
  namespace: ssint-main-coding
  labels:
    entity: ssint
    env: main
    capability: coding
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: coding
    spec:
      restartPolicy: Never
      nodeName: k-0ad0ff18
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: diff
          image: ghcr.io/simplesalt/oci/builder-sb@sha256:7b1d878a27d90b2af5f5744f7aaf923afc24924d4bc1455d6256318975634ad4
          command: ["python3", "-c"]
          args:
            - |
              import glob, re, os
              pat = re.compile(r'\[bridge:(api|init|poll|pointer|shutdown|device)\]|deviceRegistry|reuse|revived|re-registered')
              red = [(re.compile(r'("[A-Za-z_]*(?:secret|token|Token|Secret)[A-Za-z_]*"\s*:\s*)"[^"]*"'), r'\1"<redacted>"'), (re.compile(r'sk-ant-[A-Za-z0-9_-]+'), '<redacted>'), (re.compile(r'(secret|token)=\S+'), r'\1=<redacted>')]
              for f in sorted(glob.glob('/p/rc-debug-*.log')):
                  print('=== FILE', os.path.basename(f), os.path.getsize(f))
                  for line in open(f, errors='replace'):
                      if pat.search(line):
                          for r, s in red:
                              line = r.sub(s, line)
                          print(line.rstrip()[:3000])
              print('=== POINTER')
              for line in open('/p/-home-coder-repo/bridge-pointer.json', errors='replace'):
                  print(line.rstrip())
          volumeMounts:
            - name: p
              mountPath: /p
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: p
          persistentVolumeClaim:
            claimName: ssint-build-brain-permtest-projects
            readOnly: true
