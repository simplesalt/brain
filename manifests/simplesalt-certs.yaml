apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: simplesalt
  namespace: cert-manager
  labels:
    entity: ssint
    env: main
    capability: access
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@simplesalt.company
    privateKeySecretRef:
      name: simplesalt
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: ss-acme-cf-token
              key: api-token
        selector:
          dnsZones:
            - "simplesalt.company"

---
apiVersion: v1
kind: Secret
metadata:
  name: ss-acme-cf-token
  namespace: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
