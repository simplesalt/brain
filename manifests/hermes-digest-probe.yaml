apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-digest-probe
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: ai
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: probe
          image: docker.io/nousresearch/hermes-agent:latest@sha256:192c6d84eccfbc14959df4084a14dd5d3c5fda7be57579282689c9ecd2b00f4d
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HOME=/tmp
              echo "=== /var/email/digests ==="
              ls -la /var/email/digests 2>&1 | head -25
              echo
              echo "--- newest digest, first 15 lines ---"
              d=$(ls -1t /var/email/digests/*.md 2>/dev/null | head -1)
              if [ -n "$d" ]; then echo "FILE: $d"; head -15 "$d"; else echo "NO DIGEST FILES"; fi
              echo
              echo "=== EMAIL* env names appearing in image python ==="
              grep -rIoh "EMAIL[A-Z_]*" /opt/hermes --include=*.py 2>/dev/null | sort -u | head -30
              echo "(end EMAIL* catalogue)"
              echo
              echo "=== files referencing /var/email ==="
              grep -rIl "/var/email" /opt/hermes 2>/dev/null | head -20
              echo "(end /var/email hits)"
              echo
              echo "=== files referencing EMAIL_DIGEST_DIR ==="
              grep -rIl "EMAIL_DIGEST_DIR" /opt/hermes 2>/dev/null | head -20
              echo "(end EMAIL_DIGEST_DIR hits)"
              exit 0
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: email-data
              mountPath: /var/email
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: email-data
          persistentVolumeClaim:
            claimName: email-collector-data
            readOnly: true
        - name: tmp
          emptyDir: {}
