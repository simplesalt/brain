# One-off dry run of the nightly deletion-review trigger script against live Notion
# and gbrain: prints the batch Hermes would judge, writes nothing anywhere.
apiVersion: batch/v1
kind: Job
metadata:
  name: notion-deletion-review-dryrun
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: notion-deletion-review-dryrun
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dryrun
          image: python:3.12-alpine
          command: ["python3", "/script/cron-deletion-review.py"]
          env:
            - name: DRYRUN_RUN
              value: "first-2026-10-28"
            - name: DELETION_REVIEW_DRY_RUN
              value: "1"
            - name: HERMES_HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NOTION_DELETION_REVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: NOTION_DELETION_REVIEW_TOKEN
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /script
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: hermes-config
            items:
              - key: cron-deletion-review.py
                path: cron-deletion-review.py
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
