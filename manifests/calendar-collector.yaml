# Calendar-to-brain: deterministic Google Calendar collector for ssint-main-ai.
# Sibling of email-collector.yaml — same design (deterministic code for data, gbrain for
# self-wiring) and the SAME service-account DWD credential (hermes-secrets:
# GOOGLE_PRIVATE_KEY_B64 + GOOGLE_PRIVATE_KEY_ID, impersonating WORK_EMAIL). The Gmail
# collector's token request already includes calendar.events + calendar.calendars scopes
# and succeeds, so those scopes are proven DWD-authorized — no new Google Admin step.
#
# Pipeline (CronJob, every 15m — see spec.schedule): `sync` pulls a rolling window of
# events (default 90 days back, 180 forward) for the primary calendar, writes structured
# per-day JSON + daily markdown files to an emptyDir (no PVC — see "Storage" below), then
# `enrich` pushes each event into gbrain via the MCP put_page tool (SSE Streamable-HTTP
# transport). gbrain stores/searches the pages; entity self-wiring is server-side-local-only
# (remote put_page reports auto_links: skipped), so this populates searchable pages but not
# the graph — same tradeoff as email ingestion.
#
# Storage: no PVC. `sync` re-fetches the ENTIRE rolling window every run (one API call
# range, not incremental) and `enrich` runs in the SAME pod right after, so it always sees
# a complete, freshly-written EVENTS/ tree — nothing depends on a day-file written by an
# earlier invocation. state.json is pure write-only telemetry (last-run window/counts) —
# sync() computes its window from wall-clock time + CAL_DAYS_BACK/CAL_DAYS_FWD and never
# reads state.json back, so it's fully disposable. Both → emptyDir, mounted in the CronJob
# pod only.
#
# Two things DO need to cross pods/invocations, so neither lives on the emptyDir:
#
# - The ingestion heartbeat: both the CronJob (writer) and the calendar-ingestion-health
#   Deployment (reader, a separate pod/node) need to see it. That's a coordination.k8s.io/v1
#   Lease (calendar-collector-heartbeat, pre-created below) instead of a shared PVC-backed
#   file — the shared file is what previously forced both pods onto the same node.
#   holderIdentity/renewTime carry freshness; the ingestion payload
#   (status/error/ingested-total/pushed-this-run) rides in annotations under the
#   ingestion.simplesalt.company/ prefix, the same contract email-collector uses.
#
# - The put_page idempotency cache (ingested.json): dropping it to pod-scoped storage would
#   mean every 15-minute run re-pushes the ENTIRE 270-day window to gbrain — idempotent, but
#   past roughly 800 events in the window one run exceeds 15 minutes, and
#   concurrencyPolicy: Forbid then silently skips every run after that forever. So it's a
#   ConfigMap (calendar-collector-ingested, pre-created below) instead: loaded once at the
#   start of enrich(), patched once at the end (never inside the push loop), and pruned to
#   the current run's event ids on every write so it self-bounds against the rolling window
#   instead of growing into the 1MiB ConfigMap limit.
#
# Pre-creating both objects in git means the writer's RBAC needs only get/update/patch,
# never create. The health Deployment mounts no /data volume and has no RBAC on the
# ingested-cache ConfigMap — it only reads the heartbeat Lease.
#
# NOT implemented (documented simplifications vs the upstream calendar-to-brain v0.7.0
# recipe): multi-year historical backfill (bounded to the rolling window — widen via
# CAL_DAYS_BACK), multiple calendar accounts (primary only), and manual-note merge in
# daily files (files are generated-only and overwritten each run).
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: calendar-collector-heartbeat
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  leaseDurationSeconds: 3600 # 1h (>4 missed 15-minute runs); matches HEARTBEAT_MAX_AGE_SEC
---
# Pre-created idempotency cache for `enrich`'s gbrain put_page calls — see the "Storage"
# note in the file header for why this is a ConfigMap (cross-pod, self-pruned) rather than
# a PVC or the CronJob pod's own emptyDir. enrich() PATCHes it, never creates.
#
# The `data` key is deliberately NOT declared here. The brain Kustomization reconciles
# every 5m while the CronJob runs every 15m, so any value committed to git would be
# re-applied over the live cache before it was ever read — resetting it to empty roughly
# twice per collector run and defeating the point of persisting it at all. Leaving data
# undeclared keeps Flux from owning the field; loadIngested() already treats an absent
# key as an empty map. ssa: merge stops Flux pruning what the collector writes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-collector-ingested
  namespace: ssint-main-ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
  labels:
    entity: ssint
    env: main
    capability: ai
---
# Dedicated identity for the CronJob pod — least privilege: may only get/update/patch the
# one named heartbeat Lease below, never create or delete it, never touch anything else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: calendar-collector
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
---
# Dedicated identity for the health Deployment — read-only: may only get the heartbeat
# Lease to evaluate its own readinessProbe.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: calendar-ingestion-health
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: calendar-collector-heartbeat-writer
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["calendar-collector-heartbeat"]
  # Same least-privilege shape for the ingested-cache ConfigMap: get/update/patch the one
  # named object, never create — it's pre-created above.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["calendar-collector-ingested"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: calendar-collector-heartbeat-writer
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: calendar-collector-heartbeat-writer
subjects:
  - kind: ServiceAccount
    name: calendar-collector
    namespace: ssint-main-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: calendar-collector-heartbeat-reader
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
    resourceNames: ["calendar-collector-heartbeat"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: calendar-collector-heartbeat-reader
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: calendar-collector-heartbeat-reader
subjects:
  - kind: ServiceAccount
    name: calendar-ingestion-health
    namespace: ssint-main-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-collector-script
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  calendar-collector.mjs: |
    #!/usr/bin/env bun
    // Deterministic Google Calendar collector — gbrain calendar-to-brain (recipe v0.7.0),
    // ingest variant v0.1.0. Code handles: auth, pagination, attendee filtering, daily
    // files, state, atomic writes, AND deterministic ingestion into gbrain (put_page over
    // MCP). gbrain does server-side self-wiring. Mirrors email-collector.mjs.
    // Usage: bun calendar-collector.mjs sync | enrich | healthcheck | diagnose

    import { createSign, createHash } from 'crypto';
    import { mkdirSync, readFileSync, writeFileSync, renameSync, existsSync, readdirSync } from 'fs';
    import { join } from 'path';

    const DATA_DIR     = process.env.DATA_DIR ?? '/data';
    const EVENTS       = join(DATA_DIR, 'events');   // structured per-day JSON (for enrich)
    const DAILY        = join(DATA_DIR, 'daily');     // human/agent-readable markdown
    const RAW          = join(DATA_DIR, '.raw');
    const STATE_FILE   = join(DATA_DIR, 'state.json');
    const WORK_EMAIL   = process.env.WORK_EMAIL ?? '';
    const CLIENT_EMAIL = process.env.GOOGLE_CLIENT_EMAIL ?? '';
    const CALENDAR_ID  = process.env.CALENDAR_ID ?? 'primary';
    const DAYS_BACK    = Number(process.env.CAL_DAYS_BACK ?? 90);
    const DAYS_FWD     = Number(process.env.CAL_DAYS_FWD ?? 180);

    // Proven-authorized DWD scopes (identical calendar scopes the Gmail collector already
    // exchanges successfully). events.list is satisfied by calendar.events.
    const CAL_SCOPES = [
      'https://www.googleapis.com/auth/calendar.events',
      'https://www.googleapis.com/auth/calendar.calendars',
    ];

    // ---------- gbrain ingestion config ----------
    // ingested.json now lives in a cross-pod ConfigMap (see the "ingested cache" section
    // below), not a local file: losing a read/write costs redundant-but-idempotent
    // put_page calls, never data (gbrain's put_page is server-side idempotent).
    const GBRAIN_MCP_URL = process.env.GBRAIN_MCP_URL ?? 'http://gbrain:3131/mcp';
    const GBRAIN_TOKEN   = process.env.GBRAIN_REMOTE_TOKEN ?? '';
    const SOURCE_VERSION = 'cal-0.1.0';
    // Fallback only when the Lease itself has no leaseDurationSeconds yet; the
    // authoritative freshness window is the Lease's own spec field (see healthcheck()).
    const HEARTBEAT_MAX_AGE_SEC = Number(process.env.HEARTBEAT_MAX_AGE_SEC ?? 3600); // 1h (>4 missed 15-minute runs)

    // ---------- heartbeat: coordination.k8s.io/v1 Lease (cross-pod, no shared volume) ----------
    // The Lease is pre-created in the manifest so this SA needs no `create` verb — only
    // get/update/patch, scoped to this one resourceName. holderIdentity/renewTime are the
    // freshness signal; the ingestion payload (status/error/ingested-total/pushed-this-run)
    // rides in annotations under the ingestion.simplesalt.company/ prefix — same contract
    // email-collector uses.
    const K8S_API         = 'https://kubernetes.default.svc';
    const SA_DIR           = '/var/run/secrets/kubernetes.io/serviceaccount';
    const LEASE_NAMESPACE  = process.env.LEASE_NAMESPACE ?? 'ssint-main-ai';
    const LEASE_NAME       = 'calendar-collector-heartbeat';
    const LEASE_PATH       = `/apis/coordination.k8s.io/v1/namespaces/${LEASE_NAMESPACE}/leases/${LEASE_NAME}`;
    const POD_NAME         = process.env.POD_NAME ?? 'unknown';

    function k8sToken() { return readFileSync(join(SA_DIR, 'token'), 'utf8').trim(); }
    function k8sCa()    { return readFileSync(join(SA_DIR, 'ca.crt'), 'utf8'); }

    function k8sFetch(path, opts = {}) {
      return fetch(`${K8S_API}${path}`, {
        ...opts,
        tls: { ca: k8sCa() },
        headers: { Authorization: `Bearer ${k8sToken()}`, ...(opts.headers ?? {}) },
      });
    }

    // ---------- ingested cache: ConfigMap (cross-pod idempotency, no shared volume) ----------
    // Pre-created in the manifest (same reasoning as the Lease: get/update/patch RBAC only,
    // never create). Loaded once at the start of enrich(), patched once at the end — never
    // per-push — and pruned to the current run's event ids on every write so the object
    // self-bounds against the rolling window instead of growing forever.
    const INGESTED_CM_NAME = 'calendar-collector-ingested';
    const INGESTED_CM_KEY  = 'ingested.json';
    const INGESTED_CM_PATH = `/api/v1/namespaces/${LEASE_NAMESPACE}/configmaps/${INGESTED_CM_NAME}`;

    // Read failure degrades to an empty map (redundant-but-idempotent re-pushes), never a
    // fatal error.
    async function loadIngested() {
      try {
        const r = await k8sFetch(INGESTED_CM_PATH);
        if (!r.ok) {
          console.error(`loadIngested: ConfigMap GET ${r.status}: ${(await r.text()).slice(0, 200)} — falling back to empty`);
          return {};
        }
        const cm = await r.json();
        return JSON.parse(cm.data?.[INGESTED_CM_KEY] ?? '{}');
      } catch (e) {
        console.error(`loadIngested: ConfigMap GET failed: ${e.message} — falling back to empty`);
        return {};
      }
    }

    // Prunes to `currentIds` (this run's event ids) before writing, so the cache can never
    // grow past the rolling window. Throws on failure — caller is responsible for surfacing
    // it (write failures must not be silent).
    async function saveIngested(ingested, currentIds) {
      const pruned = {};
      for (const id of currentIds) if (ingested[id]) pruned[id] = ingested[id];
      const r = await k8sFetch(INGESTED_CM_PATH, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/merge-patch+json' },
        body: JSON.stringify({ data: { [INGESTED_CM_KEY]: JSON.stringify(pruned) } }),
      });
      if (!r.ok) throw new Error(`ConfigMap PATCH ${r.status}: ${(await r.text()).slice(0, 200)}`);
      return pruned;
    }

    // ---------- Google service-account JWT (DWD) ----------

    function b64url(s) { return Buffer.from(s).toString('base64url'); }

    function makeJWT(privKey, kid, subject) {
      const now = Math.floor(Date.now() / 1000);
      const hdr = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid }));
      const pay = b64url(JSON.stringify({
        iss: CLIENT_EMAIL, sub: subject,
        scope: CAL_SCOPES.join(' '),
        aud: 'https://oauth2.googleapis.com/token',
        iat: now, exp: now + 3600,
      }));
      const unsigned = `${hdr}.${pay}`;
      const sig = createSign('RSA-SHA256').update(unsigned).sign(privKey, 'base64url');
      return `${unsigned}.${sig}`;
    }

    async function getToken(privKey, kid, subject) {
      const jwt = makeJWT(privKey, kid, subject);
      const r = await fetch('https://oauth2.googleapis.com/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
          assertion: jwt,
        }),
      });
      if (!r.ok) throw new Error(`Token exchange failed ${r.status}: ${await r.text()}`);
      return (await r.json()).access_token;
    }

    function loadPrivKey() {
      const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
      const privKey = keyB64
        ? Buffer.from(keyB64, 'base64').toString('utf8')
        : process.env.GOOGLE_PRIVATE_KEY;
      if (!privKey) {
        console.error('FATAL: GOOGLE_PRIVATE_KEY_B64 (or GOOGLE_PRIVATE_KEY) must be set');
        process.exit(1);
      }
      return { privKey, kid: process.env.GOOGLE_PRIVATE_KEY_ID ?? '' };
    }

    // ---------- State (atomic writes) ----------

    function loadState() {
      if (!existsSync(STATE_FILE)) return { lastSync: null };
      try { return JSON.parse(readFileSync(STATE_FILE, 'utf8')); }
      catch { return { lastSync: null }; }
    }
    function saveJson(path, obj) {
      const tmp = `${path}.tmp`;
      writeFileSync(tmp, JSON.stringify(obj, null, 2));
      renameSync(tmp, path);
    }

    // ---------- Calendar API ----------

    async function calList(token, calId, timeMin, timeMax) {
      const events = [];
      let pageToken = null;
      do {
        const p = new URLSearchParams({
          timeMin, timeMax, singleEvents: 'true', orderBy: 'startTime',
          maxResults: '250', showDeleted: 'false',
        });
        if (pageToken) p.set('pageToken', pageToken);
        const r = await fetch(
          `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?${p}`,
          { headers: { Authorization: `Bearer ${token}` } },
        );
        if (!r.ok) throw new Error(`calendar.list ${r.status}: ${await r.text()}`);
        const d = await r.json();
        events.push(...(d.items ?? []));
        pageToken = d.nextPageToken ?? null;
      } while (pageToken);
      return events;
    }

    // Real attendees only (drop conference rooms + mailing lists), names not emails.
    function attendeeNames(ev) {
      return (ev.attendees ?? [])
        .filter(a => !a.resource
          && a.email
          && !a.email.includes('@resource.calendar.google.com')
          && !a.email.includes('@group.calendar.google.com'))
        .map(a => a.displayName || a.email.split('@')[0])
        .filter(Boolean);
    }

    const isAllDay = ev => !ev.start?.dateTime && !!ev.start?.date;
    const eventDate = ev => (ev.start?.dateTime || ev.start?.date || '').slice(0, 10);
    const eventTime = ev => (ev.start?.dateTime ? ev.start.dateTime.slice(11, 16) : 'all-day');
    const endTime   = ev => (ev.end?.dateTime ? ev.end.dateTime.slice(11, 16) : '');
    const WEEKDAYS  = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const stripHtml = s => String(s ?? '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();

    function toRecord(ev) {
      return {
        id: ev.id,
        status: ev.status,
        summary: ev.summary || '(no title)',
        start: ev.start?.dateTime || ev.start?.date || '',
        end: ev.end?.dateTime || ev.end?.date || '',
        all_day: isAllDay(ev),
        location: ev.location || '',
        description: stripHtml(ev.description).slice(0, 600),
        attendees: attendeeNames(ev),
        organizer: ev.organizer?.displayName || ev.organizer?.email || '',
        calendar: WORK_EMAIL,
        html_link: ev.htmlLink || '',
        updated: ev.updated || '',
        date: eventDate(ev),
      };
    }

    // ---------- sync ----------

    async function sync() {
      const { privKey, kid } = loadPrivKey();
      if (!WORK_EMAIL) {
        console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)');
        process.exit(1);
      }
      if (!CLIENT_EMAIL) {
        console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)');
        process.exit(1);
      }
      const token = await getToken(privKey, kid, WORK_EMAIL);

      const now = Date.now();
      const timeMin = new Date(now - DAYS_BACK * 86_400_000).toISOString();
      const timeMax = new Date(now + DAYS_FWD * 86_400_000).toISOString();

      const raw = await calList(token, CALENDAR_ID, timeMin, timeMax);
      const events = raw
        .filter(ev => ev.status !== 'cancelled' && (ev.start?.dateTime || ev.start?.date))
        .map(toRecord);

      mkdirSync(EVENTS, { recursive: true });
      mkdirSync(DAILY, { recursive: true });
      mkdirSync(RAW, { recursive: true });

      // Raw snapshot for provenance.
      saveJson(join(RAW, 'events-latest.json'), raw);

      // Group by day → structured per-day JSON (enrich source) + daily markdown.
      const byDay = new Map();
      for (const e of events) {
        if (!e.date) continue;
        if (!byDay.has(e.date)) byDay.set(e.date, []);
        byDay.get(e.date).push(e);
      }

      for (const [date, evs] of byDay) {
        // All-day first, then timed sorted by start time.
        evs.sort((a, b) => (a.all_day === b.all_day ? String(a.start).localeCompare(String(b.start)) : (a.all_day ? -1 : 1)));
        saveJson(join(EVENTS, `${date}.json`), evs);

        const year = date.slice(0, 4);
        mkdirSync(join(DAILY, year), { recursive: true });
        const dow = WEEKDAYS[new Date(`${date}T00:00:00Z`).getUTCDay()];
        const lines = [`# ${date} (${dow})`, ''];
        for (const e of evs) {
          const when = e.all_day ? 'all-day' : `${eventTimeFromRec(e)}${e.end ? '-' + endTimeFromRec(e) : ''}`;
          const loc = e.location ? ` 📍 ${e.location}` : '';
          const who = e.attendees.length ? ` — with ${e.attendees.join(', ')}` : '';
          lines.push(`- ${when} **${e.summary}**${loc}${who}`);
        }
        lines.push('');
        const out = join(DAILY, year, `${date}.md`);
        const tmp = `${out}.tmp`;
        writeFileSync(tmp, lines.join('\n'));
        renameSync(tmp, out);
      }

      saveJson(STATE_FILE, { lastSync: new Date().toISOString(), window: { timeMin, timeMax }, events: events.length, days: byDay.size });
      console.log(`sync [${CALENDAR_ID}]: ${events.length} events across ${byDay.size} days (${timeMin.slice(0,10)}..${timeMax.slice(0,10)})`);
    }

    // Time helpers operating on stored records (start/end are ISO or date strings).
    const eventTimeFromRec = e => (e.all_day ? 'all-day' : String(e.start).slice(11, 16));
    const endTimeFromRec   = e => (String(e.end).includes('T') ? String(e.end).slice(11, 16) : '');

    // ---------- gbrain ingestion (shared with email-collector pattern) ----------

    async function writeHeartbeat(status, extra = {}) {
      const ann = {
        'ingestion.simplesalt.company/status': status,
        'ingestion.simplesalt.company/error': extra.error ?? (extra.errors ?? []).join('; '),
        'ingestion.simplesalt.company/ingested-total': String(extra.ingested_total ?? ''),
        'ingestion.simplesalt.company/pushed-this-run': String(extra.pushed_this_run ?? ''),
      };
      const body = {
        metadata: { annotations: ann },
        spec: { holderIdentity: POD_NAME, renewTime: new Date().toISOString() },
      };
      try {
        const r = await k8sFetch(LEASE_PATH, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/merge-patch+json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) console.error(`writeHeartbeat: Lease PATCH ${r.status}: ${(await r.text()).slice(0, 200)}`);
      } catch (e) {
        console.error(`writeHeartbeat: Lease PATCH failed: ${e.message}`);
      }
    }

    // gbrain MCP Streamable-HTTP transport (stateless): dual Accept header required,
    // reply is an SSE frame (event: message\ndata: {json}); plain-JSON fallback kept.
    function parseMcpResponse(text) {
      let msg = null;
      for (const block of text.split('\n\n')) {
        const data = block.split('\n')
          .filter(l => l.startsWith('data:'))
          .map(l => l.slice(5).trim())
          .join('\n');
        if (!data) continue;
        try { const o = JSON.parse(data); if (o.result || o.error) msg = o; } catch { /* keep scanning */ }
      }
      if (msg) return msg;
      try { return JSON.parse(text); } catch { return null; }
    }

    async function gbrainPutPage(slug, content) {
      const r = await fetch(GBRAIN_MCP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json, text/event-stream',
          'Authorization': `Bearer ${GBRAIN_TOKEN}`,
        },
        body: JSON.stringify({
          jsonrpc: '2.0', id: 1, method: 'tools/call',
          params: { name: 'put_page', arguments: { slug, content } },
        }),
      });
      const text = await r.text();
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0, 160)}`);
      const msg = parseMcpResponse(text);
      if (!msg) throw new Error(`unparseable MCP response: ${text.slice(0, 160)}`);
      if (msg.error) throw new Error(`rpc: ${JSON.stringify(msg.error).slice(0, 160)}`);
      if (msg.result?.isError) {
        const t = (msg.result.content ?? []).map(c => c.text ?? '').join(' ');
        throw new Error(`tool: ${t.slice(0, 160)}`);
      }
      return msg.result;
    }

    function eventToMarkdown(e) {
      const q = s => String(s ?? '').replace(/"/g, "'");
      const when = e.all_day ? `${e.date} (all-day)` : `${e.date} ${eventTimeFromRec(e)}${e.end ? '–' + endTimeFromRec(e) : ''}`;
      return [
        '---',
        `title: "${q(e.summary).slice(0, 120)}"`,
        'type: calendar_event',
        'source: google_calendar',
        `calendar: "${q(e.calendar)}"`,
        `event_id: "${e.id}"`,
        `start: "${q(e.start)}"`,
        `end: "${q(e.end)}"`,
        `all_day: ${!!e.all_day}`,
        `location: "${q(e.location)}"`,
        `organizer: "${q(e.organizer)}"`,
        `attendees: [${e.attendees.map(a => `"${q(a)}"`).join(', ')}]`,
        `url: "${e.html_link}"`,
        'tags: [calendar, meeting]',
        '---',
        '',
        `# ${e.summary}`,
        '',
        `**When:** ${when}`,
        e.location ? `**Location:** ${e.location}` : '',
        `**Calendar:** ${e.calendar}`,
        e.attendees.length ? `**Attendees:** ${e.attendees.join(', ')}` : '',
        '',
        e.description || '',
        '',
        e.html_link ? `[Open in Google Calendar](${e.html_link})` : '',
        '',
      ].filter(l => l !== '').join('\n');
    }

    const contentHash = s => createHash('sha256').update(s).digest('hex').slice(0, 16);

    // gbrain lowercases the stored page slug but its tag-reconciliation step looks the
    // page up with the ORIGINAL-case slug → "addTag failed: page not found" for any slug
    // with uppercase. Calendar recurring-instance IDs carry an uppercase `_YYYYMMDDTHHMMSSZ`
    // suffix (from singleEvents expansion), so pre-normalize to lowercase + safe charset.
    const eventSlug = id => `calendar/${String(id).toLowerCase().replace(/[^a-z0-9_.-]/g, '-')}`;

    async function enrich() {
      try {
        if (!GBRAIN_TOKEN) {
          await writeHeartbeat('error', { error: 'GBRAIN_REMOTE_TOKEN not set', pushed_this_run: 0 });
          console.error('enrich: GBRAIN_REMOTE_TOKEN not set — recorded in heartbeat, health will report NotReady');
          return;
        }
        mkdirSync(EVENTS, { recursive: true });
        const files = existsSync(EVENTS) ? readdirSync(EVENTS).filter(f => f.endsWith('.json')) : [];
        const all = [];
        for (const f of files) {
          try { all.push(...JSON.parse(readFileSync(join(EVENTS, f), 'utf8'))); } catch { /* skip bad file */ }
        }
        const byId = new Map(all.filter(e => e && e.id).map(e => [e.id, e]));
        const ingested = await loadIngested();

        // Push new OR changed events (hash of the rendered page detects edits/reschedules).
        const work = [];
        for (const e of byId.values()) {
          const md = eventToMarkdown(e);
          const h = contentHash(md);
          if (ingested[e.id]?.hash !== h) work.push({ e, md, h });
        }

        let pushed = 0; const errors = [];
        for (const { e, md, h } of work) {
          try {
            await gbrainPutPage(eventSlug(e.id), md);
            ingested[e.id] = { hash: h, at: new Date().toISOString() };
            pushed++;
          } catch (err) {
            errors.push(`${e.id}: ${err.message}`);
            if (pushed === 0 && errors.length >= 3) break; // gbrain likely down — stop early
          }
          await new Promise(r => setTimeout(r, 1100)); // < 55/min, under gbrain's 60/min token limit
        }

        // One write for the whole run (never per-push), pruned to this run's event ids so
        // the ConfigMap self-bounds against the rolling window. A write failure must not be
        // silent: log it and force status=error via `errors` below.
        let total = Object.keys(ingested).length;
        try {
          const pruned = await saveIngested(ingested, byId.keys());
          total = Object.keys(pruned).length;
        } catch (err) {
          console.error(`enrich: saveIngested failed: ${err.message}`);
          errors.push(`saveIngested: ${err.message}`);
        }

        const status = errors.length ? 'error' : 'ok';
        await writeHeartbeat(status, {
          pushed_this_run: pushed,
          changed_pending: work.length,
          ingested_total: total,
          errors: errors.slice(0, 5),
        });
        console.log(`enrich: pushed ${pushed}/${work.length} new-or-changed → gbrain (total ${total})${errors.length ? `, ${errors.length} error(s)` : ''}`);
      } catch (e) {
        await writeHeartbeat('error', { error: e.message, pushed_this_run: 0 });
        console.error(`enrich: unexpected failure recorded in heartbeat: ${e.message}`);
      }
      // Always exit 0: ingestion health lives in the heartbeat/probe, not the Job status.
    }

    // ---------- healthcheck: k8s readiness probe target ----------
    async function healthcheck() {
      let lease;
      try {
        const r = await k8sFetch(LEASE_PATH);
        if (!r.ok) {
          console.error(`UNHEALTHY: Lease GET ${r.status}: ${(await r.text()).slice(0, 200)}`);
          process.exit(1);
        }
        lease = await r.json();
      } catch (e) {
        console.error(`UNHEALTHY: Lease GET failed: ${e.message}`);
        process.exit(1);
      }
      const renewTime = lease.spec?.renewTime;
      if (!renewTime) {
        console.error('UNHEALTHY: no heartbeat yet (Lease has no renewTime — pipeline has not completed a run)');
        process.exit(1);
      }
      const maxAgeSec = lease.spec?.leaseDurationSeconds ?? HEARTBEAT_MAX_AGE_SEC;
      const ageSec = (Date.now() - new Date(renewTime).getTime()) / 1000;
      if (!Number.isFinite(ageSec) || ageSec > maxAgeSec) {
        console.error(`UNHEALTHY: heartbeat stale (${Math.round(ageSec)}s > ${maxAgeSec}s max)`);
        process.exit(1);
      }
      const ann = lease.metadata?.annotations ?? {};
      const status = ann['ingestion.simplesalt.company/status'];
      if (status !== 'ok') {
        console.error(`UNHEALTHY: last run status=${status ?? 'unknown'} — ${ann['ingestion.simplesalt.company/error'] || 'see Lease annotations'}`);
        process.exit(1);
      }
      console.log(`OK: status=ok ingested_total=${ann['ingestion.simplesalt.company/ingested-total'] ?? '?'} age=${Math.round(ageSec)}s`);
    }

    // ---------- diagnose ----------

    async function diagnose() {
      const { privKey, kid } = loadPrivKey();
      if (!CLIENT_EMAIL) {
        console.error('FATAL: GOOGLE_CLIENT_EMAIL must be set (google-dwd-key: client_email)'); process.exit(1);
      }
      if (!WORK_EMAIL) {
        console.error('FATAL: WORK_EMAIL must be set (google-dwd-key: impersonate_email)'); process.exit(1);
      }
      console.log(`SA client email: ${CLIENT_EMAIL}`);
      console.log(`Impersonate:     ${WORK_EMAIL}`);
      console.log(`Calendar:        ${CALENDAR_ID}`);
      try {
        const token = await getToken(privKey, kid, WORK_EMAIL);
        console.log('PASS: DWD token exchange (calendar scopes) succeeded');
        const now = Date.now();
        const evs = await calList(token, CALENDAR_ID,
          new Date(now - 7 * 86_400_000).toISOString(), new Date(now + 7 * 86_400_000).toISOString());
        console.log(`PASS: events.list returned ${evs.length} events in ±7d window`);
      } catch (e) { console.log(`FAIL: ${e.message}`); }
    }

    // ---------- main ----------

    const cmd = process.argv[2];
    if      (cmd === 'sync')        await sync();
    else if (cmd === 'enrich')      await enrich();
    else if (cmd === 'healthcheck') await healthcheck();
    else if (cmd === 'diagnose')    await diagnose();
    else { console.error('Usage: calendar-collector.mjs sync|enrich|healthcheck|diagnose'); process.exit(1); }
---
# CronJob: sync + enrich every 15 minutes (spec.schedule below). Forbid overlap (safe for
# state + atomic writes).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calendar-collector
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  # Every 15 min: calendar changes slowly, so this avoids hammering the Google
  # Calendar API for little gain. (Email + other channels stay every-minute for
  # near-realtime digestion.) concurrencyPolicy: Forbid prevents overlap.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: calendar-collector
        spec:
          restartPolicy: OnFailure
          # Dedicated SA (calendar-collector RBAC block above): get/update/patch on the one
          # named heartbeat Lease only, never `create` (the Lease is pre-created in git).
          serviceAccountName: calendar-collector
          containers:
            - name: collector
              image: oven/bun:1-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  bun /scripts/calendar-collector.mjs sync \
                    && bun /scripts/calendar-collector.mjs enrich
              env:
                - name: DATA_DIR
                  value: /data
                # Lease spec.holderIdentity — which pod last wrote the heartbeat.
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                # Impersonated work-account identity + service-account identity, from the
                # google-dwd-key Secret (declared in email-collector.yaml, same namespace).
                # optional: true → pod still schedules when unset; script exits 1 with a
                # clear FATAL message.
                - name: WORK_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: google-dwd-key
                      key: impersonate_email
                      optional: true
                - name: CALENDAR_ID
                  value: primary
                - name: CAL_DAYS_BACK
                  value: "90"
                - name: CAL_DAYS_FWD
                  value: "180"
                - name: GOOGLE_CLIENT_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: google-dwd-key
                      key: client_email
                      optional: true
                # gbrain MCP endpoint + inline bearer (matches gbrain + hermes Deployments).
                - name: GBRAIN_MCP_URL
                  value: http://gbrain:3131/mcp
                - name: GBRAIN_REMOTE_TOKEN
                  value: "gbrain-mcp"
                # Same service-account key the Gmail collector uses (optional so the pod
                # still schedules if absent; script exits with a clear FATAL otherwise).
                - name: GOOGLE_PRIVATE_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: GOOGLE_PRIVATE_KEY_ID
                      optional: true
                - name: GOOGLE_PRIVATE_KEY_B64
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: GOOGLE_PRIVATE_KEY_B64
                      optional: true
              volumeMounts:
                - name: calendar-data
                  mountPath: /data
                - name: collector-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            # Pod-scoped scratch (state.json/events/daily/raw) — see the "Storage" note in
            # the file header for why none of this needs to survive a pod restart.
            # ingested.json is NOT here — it's the calendar-collector-ingested ConfigMap.
            - name: calendar-data
              emptyDir: {}
            - name: collector-script
              configMap:
                name: calendar-collector-script
---
# K8s-native ingestion healthcheck (see email-collector.yaml for the rationale). Readiness
# passes only when the heartbeat is fresh (< HEARTBEAT_MAX_AGE_SEC — 1h ≈ 4 missed
# 15-minute cycles) AND the last enrich reported status=ok. Reads the heartbeat via the
# calendar-collector-heartbeat Lease (get-only RBAC, no access to the ingested-cache
# ConfigMap — it has no business reading that) instead of a shared volume — this Deployment
# mounts no /data at all. No liveness probe (restart can't fix a stalled pipeline).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-ingestion-health
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar-ingestion-health
  template:
    metadata:
      labels:
        app: calendar-ingestion-health
    spec:
      # Dedicated SA (calendar-ingestion-health RBAC block above): get-only on the one
      # named heartbeat Lease, nothing else.
      serviceAccountName: calendar-ingestion-health
      containers:
        - name: health
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            - name: HEARTBEAT_MAX_AGE_SEC
              value: "3600"
          readinessProbe:
            exec:
              command: ["bun", "/scripts/calendar-collector.mjs", "healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 15
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: collector-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: collector-script
          configMap:
            name: calendar-collector-script
