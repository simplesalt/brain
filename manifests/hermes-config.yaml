
model:
  provider: openrouter
  default: minimax/minimax-m2.7

fallback_providers:
  - provider: openrouter
    model: openai/gpt-oss-120b

agent:
  environment_hint: |-
    When calling Cloudflare MCP tools that accept an account_id parameter, use
    account_id "${CLOUDFLARE_ACCOUNT_ID}".

    At the start of every session, call hindsight_recall before giving your
    first response. Use it to retrieve context about ongoing work, recent
    decisions, and open tasks. Use hindsight_recall (not gbrain) for personal
    memory — gbrain is for project knowledge, hindsight is for your own
    episodic memory across sessions.

  disabled_toolsets:
    - skills
    - search
    - x_search
    - video
    - image_gen
    - video_gen
    - computer_use
    - browser
    - file
    - tts
    - todo
    - context_engine
    - session_search
    - project
    - homeassistant
    - kanban
    - discord
    - discord_admin
    - yuanbao
    - feishu_doc
    - feishu_drive
    - spotify

platform_toolsets:
  cli:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - memory
    - messaging
    - terminal
    - vision
    - web

terminal:
  backend: local
  env_passthrough:
    - GITHUB_TOKEN
    - CLAUDE_CODE_OAUTH_TOKEN
    - GBRAIN_REMOTE_TOKEN

memory:
  provider: hindsight
  memory_enabled: false
  user_profile_enabled: false

web:
  backend: firecrawl

auxiliary:
  vision:
    provider: openrouter
    model: google/gemini-3.8-flash
    fallback_chain:
      - provider: openrouter
        model: qwen/qwen3-vl-235b-a22b-instruct
  web_extract:
    provider: main
  compression:
    provider: main
  session_search:
    provider: main

platforms:
  webhook:
    enabled: true
    extra:
      port: 8644

mcp_servers:
  flux:
    enabled: true
    url: http://mcp-flux.flux-system:9090/mcp
    timeout: 180
    tools:
      exclude:
        - apply_kubernetes_resource
        - apply_kubernetes_manifest


  gbrain:
    enabled: true
    url: http://gbrain:3131/mcp
    headers:
      Authorization: "Bearer ${GBRAIN_REMOTE_TOKEN}"
    timeout: 60

  hermes-msg:
    enabled: true
    url: http://hermes-msg.ssint-main-msg:8080/mcp
    timeout: 60

  cloudflare:
    enabled: true
    url: https://mcp.cloudflare.com/mcp
    headers:
      Authorization: "Bearer ${CLOUDFLARE_API_TOKEN}"
    timeout: 180
