_config_version: 39
model:
  provider: openrouter
  # Expanded from the llm-models ConfigMap (env on the hermes-agent pod). No fallback model on purpose.
  default: ${LIVE_REASONING_MODEL}
  # Must match the live-reasoning OpenRouter preset's model: Hermes cannot look up a preset's
  # context window. MiniMax M3.1 Flash is 1M.
  context_length: 1048576
# Provider routing and reasoning effort are not set here: the OpenRouter preset carries them,
# and anything Hermes sent would override the preset.
agent:
  # Loop control (projects#857). Band-aids: they cap runaway turns, not why Hermes over-thinks.
  # Re-prompt a reply that ends on an announced step ("Let me…") with no tool call, at most twice.
  stall_guards: true
  intent_ack_continuation: true
  # API calls per turn; execute_code calls are not counted. Clean single-turn runs, 10-29..11-02: p95 65.
  max_turns: 100
  budget_warning_ratio: 0.8
  environment_hint: |-
    At the start of every session, call hindsight_recall before giving your
    first response. Use it to retrieve context about ongoing work, recent
    decisions, and open tasks. Use hindsight_recall (not gbrain) for personal
    memory — gbrain is for project knowledge, hindsight is for your own
    episodic memory across sessions.
  disabled_toolsets:
    - search
    - x_search
    - video
    - image_gen
    - video_gen
    - computer_use
    - browser
    - file
    - tts
    - todo
    - context_engine
    - session_search
    - project
    - homeassistant
    - kanban
    - discord
    - discord_admin
    - yuanbao
    - feishu_doc
    - feishu_drive
    - spotify
    - connections
# Hard-stop repeated failing calls in chats too: Hermes counts api_server as attended, so by
# default only cron stops (projects#857).
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 5
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - memory
    - skills
    - terminal
    - vision
    - web
  api_server:
    - memory
    - skills
    - vision
    - web
  webhook:
    - memory
    - skills
    - vision
    - web
  # Scheduled jobs get skills and the MCP servers their prompts use, nothing else: no terminal,
  # code_execution, delegation or web, so a run cannot patch or redo a job's work (projects#856).
  cron:
    - skills
    - gbrain
    - gbrain-mail
    - hermes-msg
    - notion
terminal:
  backend: local
  env_passthrough:
    - GBRAIN_REMOTE_TOKEN
    - GBRAIN_URL
memory:
  provider: hindsight
  memory_enabled: false
  user_profile_enabled: false
approvals:
  mode: "off"
skills:
  write_approval: true
  creation_nudge_interval: 0
web:
  backend: firecrawl
auxiliary:
  vision:
    provider: openrouter
    model: ${VISION_MODEL}
  approval:
    provider: openrouter
    model: ${LIVE_DUMB_MODEL}
  compression:
    provider: main
  session_search:
    provider: main
platforms:
  webhook:
    enabled: true
    extra:
      port: 8644
mcp_servers:
  efforts:
    enabled: true
    url: http://efforts.ssint-main-efforts:8080/mcp/coordinator
    timeout: 120
    tools:
      include:
        - effort_find
        - effort_get
        - effort_create
  flux:
    enabled: false
    url: http://mcp-flux.flux-system:9090/mcp
    timeout: 180
    tools:
      exclude:
        - apply_kubernetes_resource
        - apply_kubernetes_manifest
  gbrain:
    enabled: true
    url: http://gbrain:3141/mcp
    headers:
      Authorization: "Bearer ${GBRAIN_REMOTE_TOKEN}"
    timeout: 60
    tools:
      include:
        - search
        - query
        - get_page
        - put_page
        - edit_page
        - append_page
        - list_pages
        - get_timeline
        - chronicle_day
        - add_timeline_entry
        - get_raw_data
        - sources_list
        - add_tag
        - remove_tag
        - get_tags
        - add_link
        - get_backlinks
        - open_loops
        - find_experts
        - resolve_slugs
        - capture
        - mark_page_for_deletion
        - propose_page_replacement
        - withdraw_page_mark
        - get_versions
        - revert_version
  gbrain-mail:
    enabled: true
    url: http://gbrain:3141/mcp
    headers:
      Authorization: "Bearer ${GBRAIN_MAIL_TOKEN}"
    timeout: 60
    tools:
      include:
        - loops_close
  hermes-msg:
    enabled: true
    url: http://hermes-msg.ssint-main-msg:8080/mcp
    timeout: 60
  notion:
    enabled: true
    url: http://mcp-proxy:3001/mcp
    timeout: 60
    tools:
      include:
        - API-post-search
        - API-get-block-children
        - API-get-users
        - API-patch-page
        - API-post-page
        - API-query-data-source
        - API-retrieve-a-data-source
        - API-retrieve-a-page
        - API-retrieve-page-markdown
        - API-update-page-markdown
        # Full write (decision 10-15): database schemas, comments, blocks, moves.
        - API-update-a-data-source
        - API-create-a-data-source
        - API-create-a-comment
        - API-update-a-block
        - API-delete-a-block
        - API-patch-block-children
        - API-move-page
  hubspot:
    enabled: true
    url: http://mcp-proxy:3002/mcp
    timeout: 60
    tools:
      include:
        - hubspot-search-objects
        - hubspot-list-associations
        - hubspot-batch-read-objects
  github:
    enabled: false
    url: http://mcp-proxy:3003/mcp
    timeout: 60
tools:
  connectors:
    enabled: false
  tool_search:
    enabled: off
