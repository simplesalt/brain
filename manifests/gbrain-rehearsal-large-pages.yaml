apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-rehearsal-large-pages-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-rehearsal-large-pages
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: count
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000'
              case "$DATABASE_URL" in
                *@gbrain-pg-rehearsal-rw[.:/]*) ;;
                *) echo "FATAL: DATABASE_URL does not target gbrain-pg-rehearsal-rw"; exit 1 ;;
              esac
              q() { echo "+ $1"; psql -X -v ON_ERROR_STOP=1 -c "$1" "$DATABASE_URL" || exit 1; }
              q "SELECT key, value FROM config WHERE key = 'version'"
              q "SELECT count(*) AS live_pages FROM pages WHERE deleted_at IS NULL"
              q "WITH s AS (SELECT slug, source_id, type, CASE WHEN body_storage = 'segmented' THEN body_bytes ELSE octet_length(compiled_truth) + COALESCE(octet_length(timeline), 0) END AS bytes FROM pages WHERE deleted_at IS NULL AND slug NOT IN ('sources/meetings/2026-11-12-rehearsal-908-large-transcript-test-rehearsa-transcript', 'meetings/2026-11-12-rehearsal-908-large-transcript-test-rehearsa')) SELECT count(*) FILTER (WHERE bytes > 262144) AS over_256k, count(*) FILTER (WHERE bytes > 131072) AS over_128k, count(*) FILTER (WHERE bytes > 65536) AS over_64k, max(bytes) AS largest_bytes FROM s"
              q "SELECT slug, source_id, type, CASE WHEN body_storage = 'segmented' THEN body_bytes ELSE octet_length(compiled_truth) + COALESCE(octet_length(timeline), 0) END AS bytes FROM pages WHERE deleted_at IS NULL AND slug NOT IN ('sources/meetings/2026-11-12-rehearsal-908-large-transcript-test-rehearsa-transcript', 'meetings/2026-11-12-rehearsal-908-large-transcript-test-rehearsa') ORDER BY 4 DESC NULLS LAST LIMIT 15"
              echo "RESULT: done"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
