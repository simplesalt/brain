apiVersion: v1
kind: ConfigMap
metadata:
  name: fireflies-ingest-rehearsal-test
  namespace: ssint-main-msg
  labels:
    entity: ssint
    env: main
    capability: msg
data:
  driver.mjs: |
    import { SQL } from 'bun';
    import { createHmac } from 'crypto';

    const REHEARSAL = 'http://gbrain-rehearsal.ssint-main-ai:3131';
    const SECRET = 'rehearsal-908-secret';
    const MEETING_ID = 'rehearsal908large01';
    const FAKE_PORT = 9099;
    const INGEST_PORT = 8080;
    const DAY = '2026-11-12';
    const TITLE = 'Rehearsal 908 large transcript test';
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const log = (...a) => console.log('[driver]', ...a);

    let version = 1;
    function sentences(v) {
      const out = [];
      for (let i = 0; i < 3000; i++) {
        out.push({
          speaker_name: i % 2 ? 'Speaker B' : 'Speaker A',
          start_time: i * 4,
          text: `Sentence ${i} of the synthetic rehearsal transcript, version ${v}, padded so the page is well over the large page limit.`,
        });
      }
      if (v > 1) out.push({ speaker_name: 'Speaker A', start_time: 99999, text: `Reprocessed ending for version ${v}.` });
      return out;
    }

    Bun.serve({
      port: FAKE_PORT,
      hostname: '127.0.0.1',
      async fetch(req) {
        const body = await req.json();
        if (/transcripts\(/.test(body.query)) return Response.json({ data: { transcripts: [] } });
        return Response.json({ data: { transcript: {
          id: MEETING_ID, title: TITLE, date: Date.parse(`${DAY}T15:00:00Z`), duration: 200,
          organizer_email: 'organizer@example.invalid', cal_id: null, transcript_url: 'https://example.invalid/t',
          meeting_attendees: [{ displayName: 'Test Attendee', email: 'attendee@example.invalid', name: 'Test Attendee' }],
          speakers: [{ id: 1, name: 'Speaker A' }, { id: 2, name: 'Speaker B' }],
          sentences: sentences(version),
        } } });
      },
    });

    async function mcp(name, args) {
      const r = await fetch(`${REHEARSAL}/mcp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', Authorization: 'Bearer gbrain-mcp' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call', params: { name, arguments: args } }),
      });
      const text = await r.text();
      let msg = null;
      for (const block of text.split('\n\n')) {
        const d = block.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('\n');
        if (!d) continue;
        try { const o = JSON.parse(d); if (o.result || o.error) msg = o; } catch {}
      }
      if (!msg) { try { msg = JSON.parse(text); } catch { return { raw: text.slice(0, 300) }; } }
      if (msg.error) return { rpc_error: msg.error };
      const t = (msg.result?.content ?? []).map((c) => c.text ?? '').join('\n');
      try { return JSON.parse(t); } catch { return { isError: msg.result?.isError, text: t.slice(0, 500) }; }
    }

    function summarize(p) {
      if (!p || typeof p !== 'object') return p;
      const o = {};
      for (const [k, v] of Object.entries(p)) {
        o[k] = typeof v === 'string' && v.length > 200 ? `<string ${Buffer.byteLength(v)} bytes>` : v;
      }
      return JSON.stringify(o).slice(0, 1500);
    }

    for (let i = 0; ; i++) {
      try {
        const h = await (await fetch(`${REHEARSAL}/health`)).text();
        log('rehearsal /health', h.slice(0, 300));
        if (/0\.60\.467\.0/.test(h)) break;
      } catch (e) { log('health', e.message); }
      if (i > 120) { log('FAIL: rehearsal not on v0.60.467.0'); process.exit(1); }
      await sleep(10000);
    }

    const db = new SQL(process.env.DATABASE_URL);
    for (let i = 0; ; i++) {
      try { await db`SELECT 1`; break; } catch (e) { if (i > 60) throw e; await sleep(2000); }
    }

    const child = Bun.spawn(['bun', '/scripts/fireflies-ingest.mjs'], {
      env: {
        ...process.env,
        PORT: String(INGEST_PORT),
        FIREFLIES_API_KEY: 'rehearsal-fake-key',
        FIREFLIES_WEBHOOK_SECRET: SECRET,
        FIREFLIES_URL: `http://127.0.0.1:${FAKE_PORT}/graphql`,
        GBRAIN_MCP_URL: `${REHEARSAL}/mcp`,
        GBRAIN_REMOTE_TOKEN: 'gbrain-mcp',
        RECONCILE_START_DELAY_MS: '86400000',
        POD_NAME: 'fireflies-ingest-rehearsal-test',
      },
      stdout: 'inherit',
      stderr: 'inherit',
    });

    for (let i = 0; ; i++) {
      try { if ((await fetch(`http://127.0.0.1:${INGEST_PORT}/healthz`)).ok) break; } catch {}
      if (i > 90) { log('FAIL: ingest did not start'); process.exit(1); }
      await sleep(2000);
    }

    let pass = true;
    const tSlug = `sources/meetings/${DAY}-rehearsal-908-large-transcript-test-${MEETING_ID.slice(0, 8)}-transcript`;

    async function send(label, reprocessedAt) {
      const raw = JSON.stringify({ event: 'meeting.transcribed', meeting_id: MEETING_ID, reprocessed_at: reprocessedAt });
      const sig = createHmac('sha256', SECRET).update(raw).digest('hex');
      const r = await fetch(`http://127.0.0.1:${INGEST_PORT}/c8d3f02053a7ef0c/fireflies`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Hub-Signature': `sha256=${sig}` }, body: raw,
      });
      const { id } = await r.json();
      log(`${label}: webhook stored as event ${id} (HTTP ${r.status})`);
      for (let i = 0; i < 90; i++) {
        const [row] = await db`SELECT id, processed_at, attempts, last_error FROM events WHERE id = ${id}`;
        if (row.processed_at || row.attempts > 0) { log(`${label}: event row`, JSON.stringify(row)); return row; }
        await sleep(2000);
      }
      log(`${label}: event not processed within 180s`);
      return null;
    }

    async function pageState(label) {
      const p = await mcp('get_page', { slug: tSlug, include_content: true });
      log(`${label}: get_page ${tSlug}`, summarize(p));
      return p;
    }

    const local1 = sentences(1).map((x) => x.text).join('\n').length;
    log(`first write: synthetic transcript text ${local1} chars`);
    const ev1 = await send('first write', null);
    if (!ev1 || !ev1.processed_at || ev1.attempts) pass = false;
    const p1 = await pageState('after first write');

    version = 2;
    const ev2 = await send('rewrite', '2026-11-12T17:00:00Z');
    if (!ev2 || !ev2.processed_at || ev2.attempts) pass = false;
    const p2 = await pageState('after rewrite');
    if (p1?.revision && p2?.revision && p1.revision === p2.revision) log('NOTE: revision unchanged after rewrite');

    const [dl] = await db`SELECT count(*)::int AS n FROM events WHERE processed_at IS NULL AND attempts >= 12`;
    const [pend] = await db`SELECT count(*)::int AS n FROM events WHERE processed_at IS NULL`;
    const all = await db`SELECT id, event, processed_at, attempts, last_error FROM events ORDER BY id`;
    log('events table', JSON.stringify(all));
    log(`dead-lettered: ${dl.n}, unprocessed: ${pend.n}`);
    if (dl.n || pend.n) pass = false;

    child.kill();
    await db.end();
    log(`RESULT: ${pass ? 'PASS' : 'FAIL'}`);
    process.exit(pass ? 0 : 1);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fireflies-ingest-rehearsal-test-1
  namespace: ssint-main-msg
  labels:
    entity: ssint
    env: main
    capability: msg
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: fireflies-ingest-rehearsal-test
        entity: ssint
        env: main
        capability: msg
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 26
      initContainers:
        - name: postgres
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PATH="$(ls -d /usr/lib/postgresql/*/bin | head -1):$PATH"
              initdb -D /pg/data -U fireflies --auth=trust >/dev/null
              exec postgres -D /pg/data -k /pg -c listen_addresses=127.0.0.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: pg
              mountPath: /pg
      containers:
        - name: driver
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["bun", "/driver/driver.mjs"]
          env:
            - name: DATABASE_URL
              value: postgres://fireflies@127.0.0.1:5432/postgres
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: driver
              mountPath: /driver
              readOnly: true
      volumes:
        - name: pg
          emptyDir: {}
        - name: script
          configMap:
            name: fireflies-ingest-script
        - name: driver
          configMap:
            name: fireflies-ingest-rehearsal-test
