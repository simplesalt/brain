# One-off (simplesalt/projects#799): the queue was cleared and the profile visits
# re-queued 2026-10-29 17:09Z (Job duxsoup-queue-reset-20261029). This sends the
# extensionReload signal so the extension restarts and picks the queue up again.
# Remove this file once the Job has run.
apiVersion: batch/v1
kind: Job
metadata:
  name: duxsoup-extension-reload-20261029
  namespace: ssint-main-msg
  labels:
    entity: ssint
    env: main
    capability: msg
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: msg
    spec:
      restartPolicy: Never
      containers:
        - name: reload
          image: oven/bun:1-alpine
          command: ["bun", "-e"]
          args:
            - |
              import { createHmac } from 'crypto';
              const BASE = 'https://app.dux-soup.com';
              const USER = process.env.DUXSOUP_USER_ID;
              const KEY = process.env.DUXSOUP_API_KEY;
              async function post(suffix, extra) {
                const targeturl = `${BASE}/xapi/remote/control/${USER}${suffix}`;
                const body = JSON.stringify({ targeturl, timestamp: Date.now(), userid: USER, ...extra });
                const sig = createHmac('sha1', KEY).update(body).digest('base64');
                const r = await fetch(targeturl, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Dux-Signature': sig }, body });
                const text = await r.text();
                if (!r.ok) throw new Error(`${suffix} ${r.status}: ${text.slice(0, 300)}`);
                return text.slice(0, 200);
              }
              async function get(suffix) {
                const url = `${BASE}/xapi/remote/control/${USER}${suffix}`;
                const sig = createHmac('sha1', KEY).update(url).digest('base64');
                const r = await fetch(url, { headers: { 'Content-Type': 'application/json', 'X-Dux-Signature': sig } });
                return (await r.text()).slice(0, 200);
              }
              console.log('queue size:', await get('/queue/size'));
              console.log('extensionReload:', await post('/signal', { signal: 'extensionReload', params: {} }));
          env:
            - name: DUXSOUP_USER_ID
              valueFrom:
                secretKeyRef:
                  name: duxsoup-user-id
                  key: user_id
            - name: DUXSOUP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: duxsoup-api-key
                  key: api_key
