apiVersion: v1
kind: Namespace
metadata:
  name: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: team-roster
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-pg
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    size: 5Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gbrain-pg
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
  bootstrap:
    initdb:
      database: gbrain
      owner: gbrain
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  managed:
    roles:
      - name: gbrain
        ensure: present
        login: true
        superuser: true
        bypassrls: true
        passwordSecret:
          name: gbrain-pg-app
  storage:
    size: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gbrain-google-token
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  google-token.mjs: |
    import { createSign } from 'node:crypto';
    const keyB64 = process.env.GOOGLE_PRIVATE_KEY_B64;
    const privKey = keyB64 ? Buffer.from(keyB64, 'base64').toString('utf8') : process.env.GOOGLE_PRIVATE_KEY;
    const iss = process.env.GOOGLE_CLIENT_EMAIL, sub = process.env.WORK_EMAIL;
    if (!privKey || !iss || !sub) { console.error('google-token: GOOGLE_PRIVATE_KEY_B64, GOOGLE_CLIENT_EMAIL and WORK_EMAIL must be set'); process.exit(1); }
    const b64url = s => Buffer.from(s).toString('base64url');
    const now = Math.floor(Date.now() / 1000);
    const unsigned = `${b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid: process.env.GOOGLE_PRIVATE_KEY_ID ?? '' }))}.${b64url(JSON.stringify({
      iss, sub, scope: process.argv[2] === 'contacts' ? 'https://www.googleapis.com/auth/contacts.readonly'
        : 'https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/calendar.events',
      aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600,
    }))}`;
    const jwt = `${unsigned}.${createSign('RSA-SHA256').update(unsigned).sign(privKey, 'base64url')}`;
    const r = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }),
    });
    if (!r.ok) { console.error(`google-token: exchange failed ${r.status}: ${(await r.text()).slice(0, 300)}`); process.exit(1); }
    const { access_token, expires_in } = await r.json();
    console.log(JSON.stringify({ access_token, expires_in }));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gbrain
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gbrain
  template:
    metadata:
      annotations:
        simplesalt.company/restart-epoch: "1"
      labels:
        app: gbrain
        entity: ssint
        env: main
        capability: ai
    spec:
      initContainers:
        - name: install-gbrain
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -x /install/bin/gbrain ]; then
                BUN_INSTALL=/install bun install -g github:garrytan/gbrain#23fdb464a944cb95ec9e55ddaec68f7abdd8b3dc \
                  || { echo "FATAL: gbrain install failed"; exit 1; }
              fi
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
      containers:
        - name: gbrain
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PATH="/install/bin:$PATH"
              if [ -x /install/bin/gbrain ] && /install/bin/gbrain --version >/dev/null 2>&1; then
                GBRAIN="/install/bin/gbrain"
              else
                CLI="$(find /install -maxdepth 8 -path '*/gbrain/src/cli.ts' 2>/dev/null | head -1)"
                if [ -z "$CLI" ]; then
                  echo "FATAL: gbrain CLI not found. /install layout:"
                  ls -la /install /install/bin 2>&1
                  find /install -maxdepth 8 -name cli.ts 2>/dev/null | head
                  sleep 120; exit 1
                fi
                GBRAIN="bun $CLI"
              fi
              echo "Using gbrain command: $GBRAIN"
              $GBRAIN init --non-interactive \
                || $GBRAIN init --migrate-only \
                || echo "WARN: gbrain init failed; serve may not work correctly"
              $GBRAIN config set mcp.publish_advisor true \
                || echo "WARN: config set mcp.publish_advisor failed (non-fatal)"
              $GBRAIN config set memory.auto_writeback salient \
                || echo "WARN: config set memory.auto_writeback failed (non-fatal)"
              $GBRAIN config set search.reranker.model voyage:rerank-2.5 \
                || echo "WARN: config set search.reranker.model failed (non-fatal)"
              $GBRAIN config set facts.extraction_model openrouter:openai/gpt-oss-120b \
                || echo "WARN: config set facts.extraction_model failed (non-fatal)"
              $GBRAIN config set cycle.conversation_facts_backfill.enabled true \
                || echo "WARN: config set cycle.conversation_facts_backfill.enabled failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.enabled true \
                || echo "WARN: config set cycle.enrich_thin.enabled failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.max_cost_usd 1000000 \
                || echo "WARN: config set cycle.enrich_thin.max_cost_usd failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.max_total_cost_usd 1000000 \
                || echo "WARN: config set cycle.enrich_thin.max_total_cost_usd failed (non-fatal)"
              $GBRAIN config set cycle.enrich_thin.max_pages_per_tick 25 \
                || echo "WARN: config set cycle.enrich_thin.max_pages_per_tick failed (non-fatal)"
              $GBRAIN config set autopilot.incremental_extract_include_frontmatter true \
                || echo "WARN: config set autopilot.incremental_extract_include_frontmatter failed (non-fatal)"
              GOOGLE_SOURCES=""
              if [ -n "$WORK_EMAIL" ] && [ -n "$GOOGLE_CLIENT_EMAIL" ] && [ -n "$GOOGLE_PRIVATE_KEY_B64" ]; then
                EXISTING="$($GBRAIN sources list 2>/dev/null)"
                for svc in gcontacts:contacts gmail:gmail gcal:calendar; do
                  id="${svc%%:*}"; service="${svc#*:}"
                  token_cmd="bun /google/google-token.mjs"
                  if [ "$service" = contacts ]; then
                    token_cmd="bun /google/google-token.mjs contacts"
                    if ! $token_cmd >/dev/null 2>&1; then
                      echo "WARN: contacts.readonly not granted to the service account yet; skipping gcontacts"
                      continue
                    fi
                  fi
                  if echo "$EXISTING" | grep -qw "$id"; then
                    GOOGLE_SOURCES="$GOOGLE_SOURCES,$id"
                  elif $GBRAIN sources add "$id" --kind google --account "$WORK_EMAIL" --services "$service" \
                      --history-days 90 --dir "/install/google-$id" \
                      --access command --token-command "$token_cmd"; then
                    GOOGLE_SOURCES="$GOOGLE_SOURCES,$id"
                  else
                    echo "WARN: gbrain $id source add failed (non-fatal)"
                  fi
                done
              fi
              GOOGLE_SOURCES="${GOOGLE_SOURCES#,}" bun -e '
                import { SQL } from "bun";
                const t = process.env.GBRAIN_REMOTE_TOKEN;
                if (!t) { console.error("FATAL: GBRAIN_REMOTE_TOKEN unset"); process.exit(1); }
                const h = new Bun.CryptoHasher("sha256").update(t).digest("hex");
                const db = new SQL(process.env.DATABASE_URL);
                await db`INSERT INTO access_tokens (name, token_hash) VALUES (${"hermes-mcp"}, ${h}) ON CONFLICT (token_hash) DO NOTHING`;
                if (process.env.GOOGLE_SOURCES) {
                  const sources = "default," + process.env.GOOGLE_SOURCES;
                  await db`UPDATE access_tokens SET permissions = (CASE WHEN jsonb_typeof(permissions) = ${"object"} THEN permissions ELSE jsonb_build_object() END) || jsonb_build_object(${"source_id"}::text, to_jsonb(string_to_array(${sources}::text, ${","}::text))) WHERE name = ${"hermes-mcp"}`;
                  const [row] = await db`SELECT jsonb_typeof(permissions) AS t, permissions->${"source_id"} AS s FROM access_tokens WHERE name = ${"hermes-mcp"}`;
                  console.log("gbrain: hermes-mcp permissions " + row?.t + " source_id=" + JSON.stringify(row?.s));
                  console.log("gbrain: hermes-mcp granted read on " + process.env.GOOGLE_SOURCES);
                }
                const mt = process.env.GBRAIN_MAIL_TOKEN;
                if (mt && (process.env.GOOGLE_SOURCES || "").split(",").includes("gmail")) {
                  const mh = new Bun.CryptoHasher("sha256").update(mt).digest("hex");
                  await db`INSERT INTO access_tokens (name, token_hash) VALUES (${"hermes-mail"}, ${mh}) ON CONFLICT (token_hash) DO NOTHING`;
                  await db`UPDATE access_tokens SET permissions = (CASE WHEN jsonb_typeof(permissions) = ${"object"} THEN permissions ELSE jsonb_build_object() END) || jsonb_build_object(${"source_id"}::text, ${"gmail"}::text) WHERE name = ${"hermes-mail"}`;
                  console.log("gbrain: hermes-mail bearer asserted, scoped to gmail");
                }
                await db.end();
                console.log("gbrain: hermes-mcp bearer asserted");
              ' || echo "WARN: token seed failed; hermes /mcp calls will 401"
              exec $GBRAIN serve --http --bind 0.0.0.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-app
                  key: uri
            - name: GBRAIN_CHAT_MODEL
              value: openrouter:minimax/minimax-m2.7
            - name: GBRAIN_CHAT_FALLBACK_CHAIN
              value: openrouter:openai/gpt-oss-120b
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: GBRAIN_EMBEDDING_MODEL
              value: openai:text-embedding-3-small
            - name: GBRAIN_EMBEDDING_DIMENSIONS
              value: "1536"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-embedding-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: VOYAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-reranker-secret
                  key: VOYAGE_API_KEY
                  optional: true
            # A fixed, non-secret owner credential: gbrain does no access control of
            # its own here; the cluster governs who reaches it, and admin-gate below
            # opens the owner dashboard with it.
            - name: GBRAIN_ADMIN_BOOTSTRAP_TOKEN
              value: "gbrain-owner-no-secret-cluster-governs-access"
            - name: GBRAIN_REMOTE_TOKEN
              value: "gbrain-mcp"
            - name: GBRAIN_MAIL_TOKEN
              value: "gbrain-mail-mcp"
            - name: GBRAIN_HTTP_CORS_ORIGIN
              value: "http://localhost:3131"
            - name: WORK_EMAIL
              valueFrom:
                secretKeyRef:
                  name: google-dwd-key
                  key: impersonate_email
                  optional: true
            - name: GOOGLE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: google-dwd-key
                  key: client_email
                  optional: true
            - name: GOOGLE_PRIVATE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GOOGLE_PRIVATE_KEY_ID
                  optional: true
            - name: GOOGLE_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GOOGLE_PRIVATE_KEY_B64
                  optional: true
          ports:
            - name: mcp
              containerPort: 3131
          startupProbe:
            periodSeconds: 10
            failureThreshold: 200
            httpGet:
              path: /health
              port: 3131
          livenessProbe:
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
            httpGet:
              path: /health
              port: 3131
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
            httpGet:
              path: /health
              port: 3131
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
            - name: google-token
              mountPath: /google
              readOnly: true
        - name: autopilot
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PATH="/install/bin:$PATH"
              for i in $(seq 1 60); do
                if [ -x /install/bin/gbrain ] && /install/bin/gbrain --version >/dev/null 2>&1; then
                  GBRAIN="/install/bin/gbrain"; break
                fi
                CLI="$(find /install -maxdepth 8 -path '*/gbrain/src/cli.ts' 2>/dev/null | head -1)"
                if [ -n "$CLI" ]; then GBRAIN="bun $CLI"; break; fi
                echo "autopilot: waiting for gbrain install ($i)"; sleep 5
              done
              if [ -z "$GBRAIN" ]; then echo "FATAL: gbrain CLI not found for autopilot"; sleep 120; exit 1; fi
              echo "autopilot using: $GBRAIN"
              CLI="$(find /install -maxdepth 8 -path '*/gbrain/src/cli.ts' 2>/dev/null | head -1)"
              if [ -n "$CLI" ]; then
                printf '#!/bin/sh\nexec bun %s "$@"\n' "$CLI" > /usr/local/bin/gbrain
                chmod +x /usr/local/bin/gbrain
                GBRAIN=/usr/local/bin/gbrain
              fi
              (
                sleep 300
                while true; do
                  echo "enrich_thin: start"
                  $GBRAIN dream --phase enrich_thin 2>&1 | tail -n 20 || echo "WARN: enrich_thin run failed"
                  sleep 3600
                done
              ) &
              (
                sleep 600
                while true; do
                  echo "embed-stale: start"
                  $GBRAIN embed --stale --yes --max-usd 1 2>&1 | tail -n 20 || echo "WARN: embed --stale failed"
                  sleep 3600
                done
              ) &
              exec $GBRAIN autopilot --repo /tmp --interval 60
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-app
                  key: uri
            - name: GBRAIN_CHAT_MODEL
              value: openrouter:minimax/minimax-m2.7
            - name: GBRAIN_CHAT_FALLBACK_CHAIN
              value: openrouter:openai/gpt-oss-120b
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: GBRAIN_EMBEDDING_MODEL
              value: openai:text-embedding-3-small
            - name: GBRAIN_EMBEDDING_DIMENSIONS
              value: "1536"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gbrain-embedding-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: WORK_EMAIL
              valueFrom:
                secretKeyRef:
                  name: google-dwd-key
                  key: impersonate_email
                  optional: true
            - name: GOOGLE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: google-dwd-key
                  key: client_email
                  optional: true
            - name: GOOGLE_PRIVATE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GOOGLE_PRIVATE_KEY_ID
                  optional: true
            - name: GOOGLE_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GOOGLE_PRIVATE_KEY_B64
                  optional: true
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: gbrain-install
              mountPath: /install
            - name: google-token
              mountPath: /google
              readOnly: true
        - name: admin-gate
          image: python:3.12-alpine
          command: ["python", "/scripts/admin_gate.py"]
          env:
            - name: GBRAIN_ADMIN_BOOTSTRAP_TOKEN
              value: "gbrain-owner-no-secret-cluster-governs-access"
          ports:
            - name: admin
              containerPort: 3132
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: admin-gate-script
              mountPath: /scripts
              readOnly: true
            - name: gbrain-install
              mountPath: /install
              readOnly: true
      volumes:
        - name: gbrain-install
          emptyDir: {}
        - name: google-token
          configMap:
            name: gbrain-google-token
        - name: admin-gate-script
          configMap:
            name: gbrain-admin-gate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gbrain-admin-gate
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  admin_gate.py: |
    #!/usr/bin/env python3
    # gbrain's owner dashboard, already signed in. gbrain only knows its own owner
    # login; this gate logs in with the pod's owner credential and serves the
    # dashboard to whoever reaches it, so access is the cluster's to govern (Big
    # AGI's gate publishes it, behind Cloudflare Access, at info.../brain).
    # The dashboard hard-codes /admin, so it is served under PREFIX and its pages
    # and scripts are rewritten to match.
    import glob, http.client, http.server, json, mimetypes, os, threading

    UPSTREAM = ('127.0.0.1', 3131)
    PORT = int(os.environ.get('PORT', '3132'))
    PREFIX = os.environ.get('PREFIX', '/brain')
    TOKEN = os.environ['GBRAIN_ADMIN_BOOTSTRAP_TOKEN']
    _SKIP_REQ = {'transfer-encoding', 'connection', 'content-length', 'cookie', 'accept-encoding', 'host'}
    _SKIP_RESP = {'transfer-encoding', 'connection', 'content-length', 'set-cookie'}
    _TEXT = ('text/html', 'javascript', 'text/css')

    _lock = threading.Lock()
    _session = None

    # The globally installed gbrain answers its own /admin/assets/* with the
    # dashboard page instead of the files (its embedded asset map is empty), so
    # the files are served here from the installed package's admin/dist.
    _assets = None
    def asset_dir():
        global _assets
        if _assets is None:
            hits = glob.glob('/install/**/gbrain/admin/dist/assets', recursive=True)
            if not hits:
                print('admin-gate: no gbrain admin/dist/assets under /install', flush=True)
                return None
            _assets = hits[0]
        return _assets

    def login():
        global _session
        conn = http.client.HTTPConnection(*UPSTREAM, timeout=30)
        try:
            conn.request('POST', '/admin/login', body=json.dumps({'token': TOKEN}),
                         headers={'Content-Type': 'application/json'})
            r = conn.getresponse()
            r.read()
            for k, v in r.getheaders():
                if k.lower() == 'set-cookie' and v.startswith('gbrain_admin='):
                    _session = v.split(';', 1)[0].split('=', 1)[1]
                    return _session
            print(f'admin-gate: login failed: HTTP {r.status}', flush=True)
        finally:
            conn.close()
        return None

    def session(fresh=False):
        with _lock:
            return login() if fresh or not _session else _session

    class Gate(http.server.BaseHTTPRequestHandler):
        timeout = 600
        def do_GET(self): self._route()
        def do_HEAD(self): self._route()
        def do_POST(self): self._route()
        def do_PUT(self): self._route()
        def do_PATCH(self): self._route()
        def do_DELETE(self): self._route()
        def log_message(self, *a): pass

        def _route(self):
            if self.path == '/healthz':
                return self._send(200, b'ok', 'text/plain')
            if not (self.path == PREFIX or self.path.startswith(PREFIX + '/')):
                return self._send(404, b'not found', 'text/plain')
            if self.path.startswith(PREFIX + '/assets/') and self.command in ('GET', 'HEAD'):
                return self._asset(self.path.split('?', 1)[0][len(PREFIX + '/assets/'):])
            n = int(self.headers.get('Content-Length', 0) or 0)
            body = self.rfile.read(n) if n else b''
            path = '/admin' + self.path[len(PREFIX):]
            for attempt in (0, 1):
                sid = session(fresh=attempt == 1)
                if self._forward(path, body, sid, last=attempt == 1 or sid is None):
                    return

        # Returns False only on a 401 worth one fresh login and a retry.
        def _forward(self, path, body, sid, last):
            fwd = {k: v for k, v in self.headers.items() if k.lower() not in _SKIP_REQ}
            if sid:
                fwd['Cookie'] = f'gbrain_admin={sid}'
            if body or self.command in ('POST', 'PUT', 'PATCH'):
                fwd['Content-Length'] = str(len(body))
            conn = http.client.HTTPConnection(*UPSTREAM, timeout=600)
            try:
                conn.request(self.command, path, body=body or None, headers=fwd)
                r = conn.getresponse()
                if r.status == 401 and not last:
                    r.read()
                    return False
                ctype = r.getheader('Content-Type') or ''
                headers = [(k, v) for k, v in r.getheaders() if k.lower() not in _SKIP_RESP]
                headers = [(k, PREFIX + v[len('/admin'):] if k.lower() == 'location' and v.startswith('/admin') else v)
                           for k, v in headers]
                if any(t in ctype for t in _TEXT):
                    out = r.read().replace(b'/admin/', PREFIX.encode() + b'/').replace(b'"/admin"', f'"{PREFIX}"'.encode())
                    self.send_response_only(r.status, r.reason)
                    for k, v in headers:
                        self.send_header(k, v)
                    self.send_header('Content-Length', str(len(out)))
                    self.end_headers()
                    if self.command != 'HEAD':
                        self.wfile.write(out)
                    return True
                self.send_response_only(r.status, r.reason)
                for k, v in headers:
                    self.send_header(k, v)
                self.end_headers()
                if self.command != 'HEAD':
                    while True:
                        chunk = r.read1(65536)
                        if not chunk:
                            break
                        self.wfile.write(chunk)
                        self.wfile.flush()
                return True
            except Exception as e:
                print(f'admin-gate: gbrain unreachable: {e}', flush=True)
                try: self._send(502, b'gbrain unreachable', 'text/plain')
                except Exception: pass
                return True
            finally:
                conn.close()

        def _asset(self, name):
            base = asset_dir()
            if not base or '/' in name or name.startswith('.'):
                return self._send(404, b'not found', 'text/plain')
            try:
                with open(os.path.join(base, name), 'rb') as f:
                    out = f.read()
            except OSError:
                return self._send(404, b'not found', 'text/plain')
            ctype = mimetypes.guess_type(name)[0] or 'application/octet-stream'
            if ctype in ('text/javascript', 'application/javascript', 'text/css'):
                out = out.replace(b'/admin/', PREFIX.encode() + b'/')
            self._send(200, out, ctype, cache='public, max-age=31536000, immutable')

        def _send(self, status, out, ctype, cache='no-store'):
            self.send_response(status)
            self.send_header('Content-Type', ctype)
            self.send_header('Cache-Control', cache)
            self.send_header('Content-Length', str(len(out)))
            self.end_headers()
            if self.command != 'HEAD':
                self.wfile.write(out)

    if __name__ == '__main__':
        srv = http.server.ThreadingHTTPServer(('0.0.0.0', PORT), Gate)
        print(f'admin-gate :{PORT}{PREFIX} → gbrain owner dashboard', flush=True)
        srv.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: gbrain
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: gbrain
  ports:
    - name: mcp
      port: 3131
      targetPort: 3131
    - name: admin
      port: 3132
      targetPort: 3132
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
        entity: ssint
        env: main
        capability: ai
      annotations:
        simplesalt.company/restart-epoch: "14"
    spec:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Hermes tries its MCP servers only three times at startup and then gives up for the pod's life;
        # after a node restart it came up before gbrain and ran without gbrain tools. Wait up to five
        # minutes for gbrain to listen, then start anyway so chat still works if gbrain is down.
        - name: wait-for-gbrain
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - -e
            - |
              const net = require("net");
              const until = Date.now() + 300000;
              (function attempt() {
                const s = net.connect(3131, "gbrain", () => { console.log("gbrain is listening"); process.exit(0); });
                s.on("error", () => {
                  s.destroy();
                  if (Date.now() > until) { console.log("WARN: gbrain not listening after 5 minutes; starting without waiting"); process.exit(0); }
                  setTimeout(attempt, 2000);
                });
              })();
        - name: install-cli-tools
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              GBRAIN_SHA=23fdb464a944cb95ec9e55ddaec68f7abdd8b3dc
              STORED_VER=$(cat /opt/data/skills/.gbrain-version 2>/dev/null || echo "")
              if [ "$GBRAIN_SHA" != "$STORED_VER" ]; then
                if (
                  rm -rf /opt/data/skills.stage /opt/data/skills.old /tmp/gbrain.tar.gz \
                  && mkdir -p /opt/data/skills.stage \
                  && curl -fsSL -o /tmp/gbrain.tar.gz "https://github.com/garrytan/gbrain/archive/${GBRAIN_SHA}.tar.gz" \
                  && gzip -t /tmp/gbrain.tar.gz \
                  && tar -xzf /tmp/gbrain.tar.gz -C /opt/data/skills.stage "gbrain-${GBRAIN_SHA}/skills" \
                  && test -n "$(ls -A /opt/data/skills.stage/gbrain-${GBRAIN_SHA}/skills 2>/dev/null)" \
                  && echo "$GBRAIN_SHA" > /opt/data/skills.stage/gbrain-${GBRAIN_SHA}/skills/.gbrain-version \
                  && chown -R 10000:10000 /opt/data/skills.stage \
                  && { [ ! -d /opt/data/skills ] || mv /opt/data/skills /opt/data/skills.old; } \
                  && mv /opt/data/skills.stage/gbrain-${GBRAIN_SHA}/skills /opt/data/skills
                ); then
                  rm -rf /opt/data/skills.stage /opt/data/skills.old /tmp/gbrain.tar.gz
                  echo "gbrain skills synced to $GBRAIN_SHA"
                else
                  if [ ! -d /opt/data/skills ] && [ -d /opt/data/skills.old ]; then
                    mv /opt/data/skills.old /opt/data/skills
                  fi
                  rm -rf /opt/data/skills.stage /opt/data/skills.old /tmp/gbrain.tar.gz
                  echo "ERROR: gbrain skills sync failed; kept skills at ${STORED_VER:-unknown}"
                fi
              fi

              SS_SKILLS_SHA=c88c82c28a7b23380b38c3fcb13c26f550baa50d
              rm -rf /tmp/ss-skills && mkdir -p /tmp/ss-skills \
                && curl -fsSL "https://github.com/simplesalt/skills/archive/${SS_SKILLS_SHA}.tar.gz" \
                  | tar -xz -C /tmp/ss-skills --strip-components=1 "skills-${SS_SKILLS_SHA}/skills" \
                && echo "simplesalt skills fetched at $SS_SKILLS_SHA" \
                || echo "ERROR: simplesalt skills fetch failed"

              python3 -c '
              import os, re, shutil, yaml

              seed_path = "/seed/skills.yaml"
              ss_root = "/tmp/ss-skills/skills"
              bundled_root = "/opt/hermes/skills"
              skills_root = "/opt/data/skills"
              marker_path = "/opt/data/.no-bundled-skills"
              owner = 10000

              def skill_name(skill_dir):
                  fallback = os.path.basename(skill_dir)
                  try:
                      with open(os.path.join(skill_dir, "SKILL.md"), encoding="utf-8") as f:
                          text = f.read()
                      match = re.search(r"\n---\s*\n", text[3:]) if text.startswith("---") else None
                      if match:
                          name = yaml.safe_load(text[3:match.start() + 3]).get("name")
                          if name:
                              return str(name).strip()
                  except Exception:
                      pass
                  return fallback

              def skill_dirs(root):
                  found = [d for d, _, files in os.walk(root) if "SKILL.md" in files]
                  return sorted(found, key=lambda d: d.count(os.sep))

              def chown_tree(root):
                  os.lchown(root, owner, owner)
                  for dirpath, dirnames, filenames in os.walk(root):
                      for name in dirnames + filenames:
                          os.lchown(os.path.join(dirpath, name), owner, owner)

              try:
                  with open(seed_path) as f:
                      allow = yaml.safe_load(f)
                  gbrain = allow["gbrain"]
                  bundled = allow["bundled"]
                  local = allow.get("local") or []
                  simplesalt = allow.get("simplesalt") or []
                  for names in (gbrain, bundled, local, simplesalt):
                      if not isinstance(names, list) or not all(isinstance(n, str) for n in names):
                          raise ValueError("gbrain, bundled, local and simplesalt must be lists of skill names")
              except Exception as e:
                  print("ERROR: cannot read allow-list %s (%s); removing all skills" % (seed_path, e))
                  gbrain, bundled, local, simplesalt = [], [], [], []
              allowed = set(gbrain) | set(bundled) | set(local) | set(simplesalt)

              os.makedirs(skills_root, exist_ok=True)
              for name in local:
                  src = os.path.join("/seed", "skill-%s.md" % name)
                  dest = os.path.join(skills_root, "simplesalt", name)
                  if os.path.isfile(src):
                      shutil.rmtree(dest, ignore_errors=True)
                      os.makedirs(dest)
                      shutil.copyfile(src, os.path.join(dest, "SKILL.md"))
                      prefix = "skill-%s--" % name
                      for extra in sorted(os.listdir("/seed")):
                          if extra.startswith(prefix):
                              os.makedirs(os.path.join(dest, "scripts"), exist_ok=True)
                              target = os.path.join(dest, "scripts", extra[len(prefix):])
                              shutil.copyfile(os.path.join("/seed", extra), target)
                              os.chmod(target, 0o755)
              for name in simplesalt:
                  src = os.path.join(ss_root, name)
                  if os.path.isfile(os.path.join(src, "SKILL.md")):
                      dest = os.path.join(skills_root, "simplesalt-skills", name)
                      shutil.rmtree(dest, ignore_errors=True)
                      shutil.copytree(src, dest)
              for src in skill_dirs(bundled_root):
                  if src != bundled_root and skill_name(src) in bundled:
                      dest = os.path.join(skills_root, os.path.relpath(src, bundled_root))
                      shutil.rmtree(dest, ignore_errors=True)
                      shutil.copytree(src, dest)

              removed = 0
              for d in skill_dirs(skills_root):
                  if os.path.isdir(d) and skill_name(d) not in allowed:
                      if d == skills_root:
                          os.remove(os.path.join(d, "SKILL.md"))
                      else:
                          shutil.rmtree(d)
                      removed += 1

              open(marker_path, "w").close()

              kept = {"gbrain": set(), "bundled": set(), "local": set(), "simplesalt": set()}
              for d in skill_dirs(skills_root):
                  name = skill_name(d)
                  kept["gbrain" if name in gbrain else "local" if name in local else "simplesalt" if name in simplesalt else "bundled"].add(name)
              missing = 0
              for kind, names in (("gbrain", gbrain), ("bundled", bundled), ("local", local), ("simplesalt", simplesalt)):
                  for name in names:
                      if name in kept[kind]:
                          print("kept %s skill: %s" % (kind, name))
                      else:
                          missing += 1
                          print("ERROR: allow-listed %s skill missing: %s" % (kind, name))
              print("skills: kept %d gbrain, %d bundled, %d local, %d simplesalt; removed %d; missing %d" % (len(kept["gbrain"]), len(kept["bundled"]), len(kept["local"]), len(kept["simplesalt"]), removed, missing))

              chown_tree(skills_root)
              os.lchown(marker_path, owner, owner)
              ' || { echo "ERROR: skills step failed; removing all skills"; rm -rf /opt/data/skills; touch /opt/data/.no-bundled-skills; }

              exit 0
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: config-seed
              mountPath: /seed
              readOnly: true
        - name: seed-hermes-config
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 -c '
              import os, sys, yaml

              live_path = "/opt/data/config.yaml"
              seed_path = "/seed/config.yaml"

              def deep_merge(base, overlay):
                  """Recursively merge overlay into base. overlay values win on conflict."""
                  merged = dict(base)
                  for key, val in overlay.items():
                      if key in merged and isinstance(merged[key], dict) and isinstance(val, dict):
                          merged[key] = deep_merge(merged[key], val)
                      else:
                          merged[key] = val
                  return merged

              with open(seed_path) as f:
                  seed = yaml.safe_load(f) or {}

              if os.path.exists(live_path):
                  with open(live_path) as f:
                      live = yaml.safe_load(f) or {}
              else:
                  live = {}

              merged = deep_merge(live, seed)
              # Git owns the MCP server list: a server dropped from the seed leaves the live config too.
              merged["mcp_servers"] = seed.get("mcp_servers", {})

              with open(live_path, "w") as f:
                  yaml.dump(merged, f, default_flow_style=False, indent=2, allow_unicode=True)
              print("merged: seed config overlaid onto live config.yaml")
              ' || { echo "FATAL: python merge failed, falling back to cp"; cp /seed/config.yaml /opt/data/config.yaml; }
              chown 10000:10000 /opt/data/config.yaml
              chmod 600 /opt/data/config.yaml

              mkdir -p /opt/data/hindsight
              printf '{"mode":"local_external","apiKey":"%s","api_url":"%s","banks":{"%s":{"bankId":"%s","budget":"mid","enabled":true}},"recall_budget":"low","recall_prefetch_method":"recall","recall_max_tokens":250,"recall_max_input_chars":300,"recall_types":"world","recall_sync":true,"recall_prompt_preamble":"# Hindsight Memory (possibly related notes from past chats)\\nThese were found by similarity to this message. Some may be about a different person, topic or time. Use the ones that clearly apply; check gbrain before acting on any of them."}\n' \
                "$HINDSIGHT_API_KEY" "$HINDSIGHT_API_URL" "$HINDSIGHT_BANK_ID" "$HINDSIGHT_BANK_ID" \
                > /opt/data/hindsight/config.json
              chown -R 10000:10000 /opt/data/hindsight
              chmod 700 /opt/data/hindsight
              chmod 600 /opt/data/hindsight/config.json

              python3 -c '
              import json, os, urllib.request
              retain = ("Extract durable knowledge: technical and architectural decisions, design/content/brand direction, "
                        "user preferences, project context, and what people and companies do and how Dylan knows them. "
                        "Ignore chat mechanics: what the assistant asked, offered, planned or explained, which tools it "
                        "called and whether they worked, requests to name or title a chat, that a message had an image, "
                        "turn or session counts, and restatements of what the user just asked. Ignore routine greetings, "
                        "transient operational details, ephemeral system-state snapshots, one-off command output, and "
                        "initialization status. Retain only what will still be true and useful next week.")
              observe = ("Consolidate durable facts about people, companies, decisions and preferences. Never form an "
                         "observation that describes the conversation itself: who asked what, what the assistant did or "
                         "offered, chat titles, images sent, or that a conversation happened.")
              body = json.dumps({"updates": {"retain_mission": retain, "observations_mission": observe}}).encode()
              url = os.environ["HINDSIGHT_API_URL"] + "/v1/default/banks/" + os.environ["HINDSIGHT_BANK_ID"] + "/config"
              req = urllib.request.Request(url, data=body, method="PATCH", headers={
                  "Content-Type": "application/json", "Authorization": "Bearer " + os.environ["HINDSIGHT_API_KEY"]})
              urllib.request.urlopen(req, timeout=30).read()
              print("hindsight: bank retain and observation missions set")
              ' || echo "WARN: hindsight bank missions not set (non-fatal)"

              mkdir -p /opt/data/scripts
              cp /seed/cron-people-scan.py /opt/data/scripts/cron-people-scan.py
              cp /seed/cron-daily-brief.py /opt/data/scripts/cron-daily-brief.py
              HERMES_BIN=/opt/hermes/.venv/bin/hermes
              schedule_job() {
                name="$1"; when="$2"; shift 2
                if "$HERMES_BIN" cron list 2>/dev/null | grep -q "$name"; then
                  echo "cron: $name already scheduled"
                elif "$HERMES_BIN" cron create "$when" "$(cat "/seed/cron-$name.md")" --name "$name" \
                    --script "cron-$name.py" --deliver local "$@"; then
                  echo "cron: $name scheduled ($when)"
                else
                  echo "WARN: cron $name not scheduled (non-fatal)"
                fi
              }
              schedule_job people-scan "every 1m"
              cp /seed/cron-deletion-review.py /opt/data/scripts/cron-deletion-review.py
              schedule_job deletion-review "0 3 * * *"
              cp /seed/cron-linkedin-lookup.py /opt/data/scripts/cron-linkedin-lookup.py
              if "$HERMES_BIN" cron list 2>/dev/null | grep -q linkedin-lookup; then
                echo "cron: linkedin-lookup already scheduled"
              elif "$HERMES_BIN" cron create "every 2h" --no-agent --script cron-linkedin-lookup.py \
                  --name linkedin-lookup --deliver local; then
                echo "cron: linkedin-lookup scheduled (every 2h)"
              else
                echo "WARN: cron linkedin-lookup not scheduled (non-fatal)"
              fi
              chown -R -h 10000:10000 /opt/data 2>/dev/null || true

              cp /seed/SOUL.md /opt/data/SOUL.md

              python3 -c '
              import json, sys

              agents_path = "/seed/AGENTS.md"
              roster_path = "/secrets/team-roster/roster.json"
              out_path = "/opt/data/AGENTS.md"
              marker = "<!-- TEAM_ROSTER -->"
              fallback = "(team roster unavailable — see team-roster Secret in ssint-main-ai)"

              with open(agents_path) as f:
                  content = f.read()

              lines = []
              try:
                  with open(roster_path) as f:
                      roster = json.load(f)
                  if not isinstance(roster, list):
                      raise ValueError("roster.json is not a JSON array")
                  for entry in roster:
                      if not isinstance(entry, dict):
                          continue
                      desc = entry.get("description")
                      if not desc:
                          continue
                      display_name = entry.get("display_name") or ""
                      role = entry.get("role") or ""
                      desc = desc if desc.rstrip().endswith(".") else desc.rstrip() + "."
                      lines.append("- %s — %s: %s" % (display_name, role, desc))
              except FileNotFoundError:
                  print("WARN: team-roster Secret not mounted/populated (roster.json missing); using placeholder", file=sys.stderr)
              except (json.JSONDecodeError, ValueError) as e:
                  print("WARN: team-roster roster.json invalid (%s); using placeholder" % e, file=sys.stderr)

              rendered = "\n".join(lines) if lines else fallback
              content = content.replace(marker, rendered)

              with open(out_path, "w") as f:
                  f.write(content)
              print("rendered: team roster substituted into AGENTS.md")
              ' || { echo "FATAL: AGENTS.md roster render failed, falling back to raw seed copy" >&2; cp /seed/AGENTS.md /opt/data/AGENTS.md; }
              chown 10000:10000 /opt/data/SOUL.md /opt/data/AGENTS.md
              chmod 644 /opt/data/SOUL.md /opt/data/AGENTS.md

              mkdir -p /run/secret-env
              printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > /run/secret-env/.env
              chown 10000:10000 /run/secret-env/.env
              chmod 600 /run/secret-env/.env
              ln -sf /run/secret-env/.env /opt/data/.env
              chown -h 10000:10000 /opt/data/.env
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: HINDSIGHT_API_URL
              value: http://hindsight:8888
            - name: HINDSIGHT_API_KEY
              value: local
            - name: HINDSIGHT_BANK_ID
              value: hermes
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: config-seed
              mountPath: /seed
              readOnly: true
            - name: secret-env
              mountPath: /run/secret-env
            - name: team-roster
              mountPath: /secrets/team-roster
              readOnly: true
        - name: patch-tool-bridge
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          command: ["python3", "-c"]
          args:
            - |
              import pathlib, re, shutil
              src = pathlib.Path('/opt/hermes/tools/tool_search.py')
              dst = pathlib.Path('/patched/tool_search.py')
              text = src.read_text()
              pat = re.compile(r'"arguments":\s*\{\s*"type":\s*"object",\s*"description":\s*"[^"]*",?\s*\}')
              new = ('"arguments": {"type": "string", "description": '
                     '"The tool\'s arguments as a JSON object encoded in a string, matching its schema, '
                     'e.g. \\"{\\\\\\"query\\\\\\": \\\\\\"x\\\\\\"}\\"."}')
              hits = len(pat.findall(text))
              if hits == 1:
                  text = pat.sub(lambda m: new, text)
                  print('patch-tool-bridge: tool_call arguments declared as a JSON string')
              else:
                  print(f'patch-tool-bridge: WARNING expected 1 bridge arguments schema, found {hits}; left unchanged')
              calls = re.compile(r'("calls":\s*\{\s*)"type":\s*"array",')
              hits = len(calls.findall(text))
              if hits == 1:
                  text = calls.sub(lambda m: m.group(1) + '"type": ["array", "string"],', text)
                  print('patch-tool-bridge: tool_call calls may also arrive as a JSON string')
              else:
                  print(f'patch-tool-bridge: WARNING expected 1 bridge calls schema, found {hits}; left unchanged')
              dst.write_text(text)
              compile(dst.read_text(), str(dst), 'exec')
              src = pathlib.Path('/opt/hermes/agent/conversation_loop.py')
              dst = pathlib.Path('/patched/conversation_loop.py')
              text = src.read_text()
              old = 'The previous response was cut off by a network error mid-stream.'
              if text.count(old) == 1:
                  text = text.replace(old, 'The previous response was cut off mid-stream.')
                  print('patch-tool-bridge: a cut-off response is no longer called a network error')
              else:
                  print('patch-tool-bridge: WARNING cut-off wording not found; left unchanged')
              dst.write_text(text)
              compile(dst.read_text(), str(dst), 'exec')
              # The image file only exists while it is being described, so the qr-code skill
              # decodes it right there and its note rides along with the description.
              src = pathlib.Path('/opt/hermes/agent/vision_message_prep.py')
              dst = pathlib.Path('/patched/vision_message_prep.py')
              text = src.read_text()
              old = '            description = (result.get("analysis") or "").strip()\n'
              hook = ('            try:\n'
                      '                import sys as _qr_sys\n'
                      '                if "/opt/data/qr-lib" not in _qr_sys.path:\n'
                      '                    _qr_sys.path.append("/opt/data/qr-lib")\n'
                      '                from qr_decode import note_for\n'
                      '                description += note_for(vision_source, description)\n'
                      '            except Exception as qr_error:\n'
                      '                logger.warning("qr-code skill skipped: %s", qr_error)\n')
              if text.count(old) == 1:
                  text = text.replace(old, old + hook)
                  print('patch-tool-bridge: image descriptions that mention a QR code get it decoded')
              else:
                  print('patch-tool-bridge: WARNING image description line not found; QR decoding left off')
              dst.write_text(text)
              compile(dst.read_text(), str(dst), 'exec')
          volumeMounts:
            - name: patched-code
              mountPath: /patched
        # The qr-code skill's decoder (ZXing) and its script, which the patched image
        # description step imports. A failed install only leaves QR decoding off.
        - name: install-qr-decoder
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              LIB=/opt/data/qr-lib
              rm -rf "$LIB" && mkdir -p "$LIB"
              cat > /tmp/qr-requirements.txt <<'EOF'
              zxing-cpp==3.1.1 \
                --hash=sha256:9cf67341949946307d086b302cefd453fb47bc6d6ddc7d088839e9481982757b \
                --hash=sha256:f4dae01111f323f46736fc21f05c14dcaaac06cea5fdc8fd994ba19f6f918c6e
              pillow==12.3.0 \
                --hash=sha256:0847a763afefb695bc912d7c131e7e0632d4edc1d8698f58ddabec8e46b8b6d3 \
                --hash=sha256:f7401aebd7f581d7f83a439d87d474999317ee099218e5ad25d125290990ba65
              EOF
              cd /tmp && if uv pip install --quiet --no-config --no-cache --no-deps --require-hashes --only-binary :all: \
                  --python /opt/hermes/.venv/bin/python --target "$LIB" -r /tmp/qr-requirements.txt; then
                echo "qr-code: ZXing decoder installed"
              else
                echo "ERROR: qr-code decoder install failed; QR codes will not be decoded"
              fi
              cp /seed/skill-qr-code--qr_decode.py "$LIB/qr_decode.py"
              chown -R 10000:10000 "$LIB"
              cd /tmp && /opt/hermes/.venv/bin/python -c '
              import sys
              sys.path.append("/opt/data/qr-lib")
              from qr_decode import note_for
              cases = {
                  "/seed/qr-code-selftest-skewed.jpg": "https://events.example.com/register?id=4471",
                  "/seed/qr-code-selftest-small.jpg": "WIFI:T:WPA;S:Guest;P:not-a-real-pass;;",
              }
              ok = 0
              for path, want in cases.items():
                  note = note_for(path, "A poster with a QR code in the corner.")
                  if want in note:
                      ok += 1
                  else:
                      print("qr-code self-test: FAILED on %s: %s" % (path, note.strip()))
              print("qr-code self-test: %d of %d test images decoded" % (ok, len(cases)))
              ' || echo "ERROR: qr-code self-test could not run"
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: hermes-agent
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          env:
            - name: HERMES_ORIG_CWD
              value: /opt/data
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: HINDSIGHT_MODE
              value: local_external
            - name: HINDSIGHT_API_URL
              value: http://hindsight:8888
            - name: HINDSIGHT_API_KEY
              value: local
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: FIRECRAWL_API_KEY
            - name: HERMES_DASHBOARD
              value: "1"
            # Loopback only, so Hermes runs it without a login. The
            # dashboard-proxy container publishes it on 9119; the tunnel only
            # forwards requests that passed Cloudflare Access.
            - name: HERMES_DASHBOARD_HOST
              value: 127.0.0.1
            - name: HERMES_DASHBOARD_PORT
              value: "9118"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_BEARER_TOKEN
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: GBRAIN_REMOTE_TOKEN
              value: "gbrain-mcp"
            - name: GBRAIN_MAIL_TOKEN
              value: "gbrain-mail-mcp"
            - name: NOTION_DELETION_REVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: NOTION_DELETION_REVIEW_TOKEN
                  optional: true
          ports:
            - name: api
              containerPort: 8642
            - name: webhook
              containerPort: 8644
          livenessProbe:
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
            tcpSocket:
              port: 8642
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
            tcpSocket:
              port: 8642
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: secret-env
              mountPath: /run/secret-env
            - name: patched-code
              mountPath: /opt/hermes/tools/tool_search.py
              subPath: tool_search.py
              readOnly: true
            - name: patched-code
              mountPath: /opt/hermes/agent/conversation_loop.py
              subPath: conversation_loop.py
              readOnly: true
            - name: patched-code
              mountPath: /opt/hermes/agent/vision_message_prep.py
              subPath: vision_message_prep.py
              readOnly: true
        # Publishes the loopback-only dashboard on 9119. Requests are rewritten
        # to look local (Host, Origin), which is what lets Hermes skip its login;
        # Cloudflare Access in front of the tunnel is the sign-in.
        - name: dashboard-proxy
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: webui
              containerPort: 9119
          readinessProbe:
            tcpSocket:
              port: 9119
            periodSeconds: 10
          volumeMounts:
            - name: dashboard-proxy-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
        # Copies full chat transcripts out of state.db into hermes-chats-pg so a restart loses nothing.
        - name: chat-capture
          image: oven/bun:1-alpine
          imagePullPolicy: IfNotPresent
          command: ["bun", "/scripts/chat-capture.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-chats-pg-app
                  key: uri
                  optional: true
            - name: DATA_DIR
              value: /opt/data
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: chat-capture-script
              mountPath: /scripts
              readOnly: true
            - name: chat-capture-tmp
              mountPath: /tmp
      volumes:
        - name: chat-capture-script
          configMap:
            name: hermes-chat-capture-script
        - name: chat-capture-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 5Gi
        - name: config-seed
          configMap:
            name: hermes-config
        - name: secret-env
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: team-roster
          secret:
            secretName: team-roster
            optional: true
        - name: patched-code
          emptyDir: {}
        - name: dashboard-proxy-conf
          configMap:
            name: hermes-dashboard-proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-dashboard-proxy
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }
    # Read-only: the console's API only takes reads. /api/auth/me is a POST read.
    map $request_method $hermes_write {
      default 1;
      GET 0;
      HEAD 0;
      OPTIONS 0;
    }
    server {
      listen 9119;
      absolute_redirect off;
      client_max_body_size 100m;
      # Sessions (the console's own landing page) is hidden, so land on Cron.
      location = / {
        return 302 $http_x_forwarded_prefix/cron;
      }
      location = /api/auth/me {
        include /etc/nginx/conf.d/proxy.inc;
      }
      location /api/ {
        if ($hermes_write) {
          return 403 '{"detail":"This console is read-only."}';
        }
        include /etc/nginx/conf.d/proxy.inc;
      }
      # Pages get a style that hides the menu entries we don't use, with and
      # without Big AGI's /_hermes prefix (sub_filter can't take a CSS $=).
      location / {
        include /etc/nginx/conf.d/proxy.inc;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<style>a[href="/chat"],a[href="/_hermes/chat"],a[href="/sessions"],a[href="/_hermes/sessions"],a[href="/files"],a[href="/_hermes/files"],a[href="/models"],a[href="/_hermes/models"],a[href="/logs"],a[href="/_hermes/logs"],a[href="/pairing"],a[href="/_hermes/pairing"],a[href="/profiles"],a[href="/_hermes/profiles"],a[href="/config"],a[href="/_hermes/config"],a[href="/env"],a[href="/_hermes/env"],a[href="/kanban"],a[href="/_hermes/kanban"],a[href="/achievements"],a[href="/_hermes/achievements"],a[href="/plugins"],a[href="/_hermes/plugins"],a[href="/mcp"],a[href="/_hermes/mcp"],a[href="/system"],a[href="/_hermes/system"]{display:none!important}</style></head>';
      }
    }
  proxy.inc: |
    proxy_pass http://127.0.0.1:9118;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9118;
    proxy_set_header Origin http://127.0.0.1:9118;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect http://127.0.0.1:9118/ /;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent-web
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  selector:
    app: hermes-agent
  ports:
    - name: http
      port: 80
      targetPort: 9119
    - name: api
      port: 8642
      targetPort: 8642
    - name: webhook
      port: 8644
      targetPort: 8644
