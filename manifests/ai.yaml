apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: team-roster
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
