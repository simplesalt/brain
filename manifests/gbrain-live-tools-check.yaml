apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-live-tools-check-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-live-tools-check
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["bun", "-e"]
          args:
            - |
              const named = ["add_link", "add_tag", "add_timeline_entry", "append_page", "capture", "chronicle_day", "delete_page", "edit_page", "find_experts", "get_backlinks", "get_page", "get_raw_data", "get_tags", "get_timeline", "list_pages", "loops_close", "open_loops", "put_page", "put_raw_data", "query", "remove_tag", "resolve_slugs", "search", "sources_list"];
              const res = await fetch("http://gbrain:3131/mcp", { method: "POST",
                headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", Authorization: "Bearer gbrain-mcp" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }) });
              const text = await res.text();
              let msg = null;
              for (const b of text.split("\n\n")) { const d = b.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("\n"); if (!d) continue; try { const o = JSON.parse(d); if (o.result) msg = o; } catch {} }
              if (!msg) msg = JSON.parse(text);
              const tools = msg.result.tools;
              const names = tools.map(t => t.name).sort();
              console.log(`live gbrain (prod, read-only tools/list as hermes-mcp): ${names.length} tools`);
              console.log(names.join("\n"));
              console.log("== tools named in AGENTS.md, Hermes skills, cron prompts and cron scripts, and the hermes-config include lists");
              for (const n of named) {
                const t = tools.find(x => x.name === n);
                console.log(`${n}: ${t ? "present" : "ABSENT"}${t ? " required=" + JSON.stringify(t.inputSchema?.required ?? []) : ""}`);
              }
              console.log("RESULT: done");
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
