---
apiVersion: v1
kind: Namespace
metadata:
  name: fe-main-coding
  labels:
    name: fe-main-coding
    entity: fe
    env: main
    capability: coding
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: gh-auth
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: cf-secret
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: cf-id
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: claude-identity
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-rc-skel-override
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
data:
  claude.json.tmpl: |
    {
      "mcpServers": {
        "flux": {
          "type": "http",
          "url": "http://mcp-flux.flux-system:9090/mcp"
        },
        "cloudflare": {
          "type": "http",
          "url": "https://mcp.cloudflare.com/mcp",
          "headers": {
            "Authorization": "Bearer ${CLOUDFLARE_API_TOKEN}"
          }
        }
      }
    }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fe-build-apps
  namespace: flux-system
  labels:
    entity: fe
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.4.78"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: fe-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    commonLabels:
      entity: fe
      env: main
      capability: coding
    repo:
      slug: apps
      url: https://github.com/dylannevans/apps.git
      ref: main
    oauthSecret:
      create: true
    resources:
      builder:
        requests:
          memory: 512Mi
    hindsight:
      bankId: fe-build-apps
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: true
      create: false
      existingConfigMap: claude-rc-skel-override
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fe-build-cloud-basis
  namespace: flux-system
  labels:
    entity: fe
    env: main
    capability: coding
spec:
  interval: 5m
  chart:
    spec:
      chart: builder
      version: "0.4.78"
      sourceRef:
        kind: HelmRepository
        name: simplesalt-charts
        namespace: flux-system
  targetNamespace: fe-main-coding
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    commonLabels:
      entity: fe
      env: main
      capability: coding
    repo:
      slug: cloud-basis
      url: https://github.com/dylannevans/cloud-basis.git
      ref: main
    oauthSecret:
      create: true
    resources:
      builder:
        requests:
          memory: 512Mi
    hindsight:
      bankId: fe-build-cloud-basis
    extraEnv:
      - name: HINDSIGHT_AUTO_RETAIN
        value: "false"
    skelOverride:
      enabled: true
      create: false
      existingConfigMap: claude-rc-skel-override
