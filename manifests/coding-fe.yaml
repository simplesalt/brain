---
apiVersion: v1
kind: Namespace
metadata:
  name: fe-main-coding
  labels:
    name: fe-main-coding
    entity: fe
    env: main
    capability: coding
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: gh-auth
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: cf-secret
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: cf-id
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: claude-identity
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-rc-skel-override
  namespace: fe-main-coding
  labels:
    entity: fe
    env: main
    capability: coding
data:
  claude.json.tmpl: |
    {
      "mcpServers": {
        "flux": {
          "type": "http",
          "url": "http://mcp-flux.flux-system:9090/mcp"
        },
        "cloudflare": {
          "type": "http",
          "url": "https://mcp.cloudflare.com/mcp",
          "headers": {
            "Authorization": "Bearer ${CLOUDFLARE_API_TOKEN}"
          }
        }
      }
    }
