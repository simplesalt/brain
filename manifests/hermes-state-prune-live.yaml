apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-state-prune-live-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prune-live
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: GBRAIN_URL
              value: http://gbrain:3131/mcp
            - name: GBRAIN_REMOTE_TOKEN
              value: gbrain-mcp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HERMES_HOME
              value: /tmp/hermes
          command: ["python3", "-u", "-c"]
          args:
            - |
              import contextlib, datetime, difflib, importlib, io, json, subprocess, sys
              sys.path.insert(0, "/seed")
              scan = importlib.import_module("cron-people-scan")
              ts = importlib.import_module("cron-timeline-sweep")
              dr = importlib.import_module("cron-deletion-review")
              now = datetime.datetime.now(datetime.timezone.utc)
              print("gbrain:", json.dumps(scan.call("get_brain_identity", {}))[:120])
              def size(slug):
                  p = scan.call("get_page", {"slug": slug})
                  d = json.loads(scan.re.search(r"```json\n(.*?)\n```", p["compiled_truth"], scan.re.S).group(1))
                  return f"revision {p['revision'][:8]}, {len(p['compiled_truth'].encode())} bytes, {len(d)} top-level entries"
              def run(label, fn):
                  err = io.StringIO()
                  ok = True
                  try:
                      with contextlib.redirect_stderr(err):
                          fn()
                  except Exception as e:
                      ok = False
                      print(f"  {label}: ERROR {type(e).__name__}: {e}")
                  for line in err.getvalue().splitlines()[:20]:
                      print("  log:", line)
                  return ok
              ok = True
              print("people-scan: before", size(scan.STATE))
              ok &= run("people-scan save", lambda: scan.save_state(scan.load_state()))
              print("people-scan: after ", size(scan.STATE))
              print("timeline-sweep: before", size(ts.STATE))
              p = subprocess.run([sys.executable, "/seed/cron-timeline-sweep.py"], capture_output=True, text=True)
              print(f"  cron-timeline-sweep.py exit {p.returncode}; stdout {p.stdout.strip()[:300]!r}; stderr {p.stderr.strip()[:300]!r}")
              ok &= p.returncode == 0
              keep = (now - datetime.timedelta(days=ts.KEEP_DAYS)).date().isoformat()
              ok &= run("timeline-sweep save", lambda: ts.save_state(ts.load_state(), keep))
              print("timeline-sweep: after ", size(ts.STATE))
              print("deletion-review: before", size(dr.STATE))
              def dr_save():
                  st = dr.load_state()
                  print(f"  loaded: seen {len(st['seen'])}, applied {len(st['applied'])}, pending {len(st['pending'])}, log {len(st['log'])}")
                  dr.prune(st, now, set(st["seen"]))
                  print(f"  pruned: seen {len(st['seen'])}, applied {len(st['applied'])}, pending {len(st['pending'])}, log {len(st['log'])}")
                  dr.save_state(st)
              ok &= run("deletion-review save", dr_save)
              print("deletion-review: after ", size(dr.STATE))
              slug = "people/zz-state-guard-test-931"
              email = "second.address@example.invalid"
              try:
                  scan.call("put_page", {"slug": slug, "content": "---\ntype: person\ntitle: \"ZZ State Guard Test 931\"\nemails:\n  - \"first.address@example.invalid\"\naliases:\n  - \"first.address@example.invalid\"\n---\n\n# ZZ State Guard Test 931\n\n## About\n\nTest contact for projects#931; deleted by the same Job.\n"})
                  ok &= run("add_email", lambda: scan.add_email(slug, email))
                  vers = scan.call("get_versions", {"slug": slug, "limit": 5, "include_body": True})
                  vers = vers.get("versions") if isinstance(vers, dict) else vers
                  print(f"  get_versions: {len(vers or [])} snapshots; keys {sorted((vers or [{}])[0].keys())}")
                  cur = scan.call("get_page", {"slug": slug, "include_content": True})
                  first = "---\ntype: person\ntitle: \"ZZ State Guard Test 931\"\nemails:\n  - \"first.address@example.invalid\"\naliases:\n  - \"first.address@example.invalid\"\n---\n\n# ZZ State Guard Test 931\n\n## About\n\nTest contact for projects#931; deleted by the same Job.\n"
                  for v in (vers or [])[:3]:
                      print("  version:", json.dumps({k: v[k] for k in v if k not in ("compiled_truth", "content", "body", "timeline")})[:300])
                  print("  diff, created page -> page after add_email (get_page content):")
                  for line in difflib.unified_diff(first.splitlines(), cur["content"].splitlines(), lineterm="", n=0):
                      print("   ", line)
                  ok &= email in cur["content"] and "Test contact for projects#931" in cur["content"]
              finally:
                  try:
                      cur = scan.call("get_page", {"slug": slug, "body": "none"})
                      print("  delete_page:", json.dumps(scan.call("delete_page", {"slug": slug, "expected_revision": cur["revision"]}))[:200])
                  except Exception as e:
                      print("  cleanup: ERROR", e)
                      ok = False
              print("RESULT:", "PASS" if ok else "FAIL")
              sys.exit(0 if ok else 1)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: hermes-config
