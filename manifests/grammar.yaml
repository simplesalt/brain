---
# Grammar fix service: one POST method, text in, corrected text out, at
# https://api.simplesalt.company/45e6451afc312886/grammar (its authoritative address). Signed-in
# callers only (Cloudflare Access, in the same app as Big AGI); Big AGI's Aa
# button calls it directly with that one sign-in.
# It signs in to OpenRouter by federation: its Kubernetes service account token is
# exchanged for a short-lived access token under the policy id in the shared model
# config (GRAMMAR_FEDERATION_POLICY_ID in manifests/llm-models.env). Only while that
# id is empty does it use the stored key below, filled by a person out of band, key
# OPENROUTER_API_KEY: a dedicated OpenRouter key with a low spending limit. Flux
# merges so reconciliation never wipes it.
apiVersion: v1
kind: Secret
metadata:
  name: grammar-openrouter-api-key
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grammar
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grammar-script
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
data:
  grammar.py: |
    #!/usr/bin/env python3
    # Grammar fix for dictated text. One method: POST BASE_PATH with the text as the body
    # (text/plain in, text/plain out), or JSON {"text": ..., "context": ...} in and
    # {"text": ...} out, where context is recent chat that names people and terms.
    # It fixes punctuation, sentence breaks and grammar (pauses get transcribed as
    # full stops) with a small, fast model on OpenRouter, keeping the speaker's words.
    # Its authoritative address is https://api.simplesalt.company<BASE_PATH>, behind
    # Cloudflare Access; the Access JWT is verified here too. Browser pages on
    # ALLOWED_ORIGINS (Big AGI's grammar button) call it directly with the Access
    # cookie; GET BASE_PATH is a sign-in page they open once if that cookie is missing,
    # and GET BASE_PATH?return=<url on ALLOWED_ORIGINS> sends the browser back there.
    # OpenRouter auth: with a federation policy id set (GRAMMAR_FEDERATION_POLICY_ID, from
    # the shared model config) it exchanges its service account token (re-read on each
    # exchange, kubelet rotates it) for a short-lived access token, cached and renewed
    # shortly before it expires. With no policy id it uses its stored key, re-read on each
    # use. /healthz is unready until one of the two works.
    import base64, hashlib, hmac, json, os, threading, time, http.server, urllib.error, urllib.parse, urllib.request

    PORT = int(os.environ.get('PORT', '8000'))
    JWT_HEADER = 'Cf-Access-Jwt-Assertion'
    ACCESS_TEAM = os.environ.get('ACCESS_TEAM_DOMAIN', '').rstrip('/')
    ACCESS_AUDS = {a.strip() for a in os.environ.get('ACCESS_AUDS', '').split(',') if a.strip()}
    BASE_PATH = os.environ.get('BASE_PATH', '/grammar')
    ALLOWED_ORIGINS = {o.strip() for o in os.environ.get('ALLOWED_ORIGINS', '').split(',') if o.strip()}
    SIGNED_IN_PAGE = (b'<!doctype html><meta charset="utf-8"><title>Grammar fix</title>'
                      b'<p>Signed in to the grammar fix. You can close this window.</p>'
                      b'<script>try{opener&&opener.postMessage("grammar-signed-in","*")}catch(e){}setTimeout(()=>close(),800)</script>')
    KEY_PATH = os.environ.get('KEY_PATH', '/secrets/OPENROUTER_API_KEY')
    OIDC_TOKEN_PATH = os.environ.get('OIDC_TOKEN_PATH', '/var/run/secrets/openrouter/token')
    FEDERATION_POLICY_ID = os.environ.get('GRAMMAR_FEDERATION_POLICY_ID', '').strip()
    TOKEN_URL = os.environ.get('TOKEN_URL', 'https://openrouter.ai/api/v1/oauth/token')
    LLM_URL = os.environ.get('LLM_URL', 'https://openrouter.ai/api/v1/chat/completions')
    MODEL = os.environ['MODEL']  # from the llm-models ConfigMap
    # OpenRouter switches to these, in order, when the main model is down or errors (none set: the preset carries the backup).
    FALLBACK_MODELS = [m.strip() for m in os.environ.get('FALLBACK_MODELS', '').split(',') if m.strip()]
    MAX_BYTES = 64 * 1024
    SYSTEM = (
        'You fix dictated text. The user message may give recent chat context, then a speech-to-text '
        'transcript the speaker dictated. The speaker pauses to think, and pauses were often transcribed '
        'as full stops. Fix punctuation, capitalization, sentence boundaries and grammar so it reads as the '
        'speaker meant it. Keep the speaker\'s words, wording and meaning: do not add, drop, rephrase, answer '
        'or summarize anything. Change a word only when it is clearly a mis-hearing of a name or term from '
        'the context. Reply with the corrected transcript only.'
    )

    def openrouter_key():
        """The key, read from the mounted Secret on each use so a fill or rotation applies without a restart."""
        try:
            with open(KEY_PATH) as f:
                return f.read().strip()
        except OSError:
            return ''

    _tok = {'value': '', 'expires': 0.0, 'retry': 0.0}
    _tok_lock = threading.Lock()

    def _exchange():
        """Swap the service account token for an OpenRouter access token; return (token, seconds valid) or ('', 0)."""
        try:
            with open(OIDC_TOKEN_PATH) as f:
                subject = f.read().strip()
            form = urllib.parse.urlencode({
                'grant_type': 'urn:ietf:params:oauth:grant-type:token-exchange',
                'subject_token_type': 'urn:ietf:params:oauth:token-type:jwt',
                'subject_token': subject, 'federation_policy_id': FEDERATION_POLICY_ID}).encode()
            r = urllib.request.Request(TOKEN_URL, data=form, method='POST', headers={
                'Content-Type': 'application/x-www-form-urlencoded'})
            with urllib.request.urlopen(r, timeout=10) as resp:
                doc = json.load(resp)
            return doc['access_token'], float(doc.get('expires_in') or 0)
        except urllib.error.HTTPError as e:
            detail = e.read()[:500].decode('utf-8', 'replace')
            print(f'grammar: token exchange HTTP {e.code}: {detail}', flush=True)
        except Exception as e:
            print(f'grammar: token exchange failed: {type(e).__name__}', flush=True)
        return '', 0.0

    def bearer():
        """The token to send to OpenRouter: the exchanged access token when a policy id is set, else the stored key."""
        if not FEDERATION_POLICY_ID:
            return openrouter_key()
        with _tok_lock:
            now = time.time()
            if _tok['value'] and _tok['expires'] - now >= 120:
                return _tok['value']
            if now < _tok['retry']:
                return ''
            value, ttl = _exchange()
            if value:
                _tok.update(value=value, expires=now + ttl, retry=0.0)
            else:
                _tok.update(value='', expires=0.0, retry=now + 10)
            return value

    def drop_token():
        """Forget the cached access token so the next call exchanges again."""
        with _tok_lock:
            _tok.update(value='', expires=0.0)

    def fix(text, context=''):
        """Return text with punctuation and grammar fixed, or raise."""
        user = (f'Context:\n{context[-6000:]}\n\n' if context else '') + f'Transcript:\n{text}'
        body = {'model': MODEL, 'temperature': 0, 'max_tokens': 4000,
                'messages': [{'role': 'system', 'content': SYSTEM}, {'role': 'user', 'content': user}]}
        if FALLBACK_MODELS:
            body['models'] = [MODEL] + FALLBACK_MODELS
        r = urllib.request.Request(LLM_URL, data=json.dumps(body).encode(), method='POST', headers={
            'Authorization': 'Bearer ' + bearer(), 'Content-Type': 'application/json',
            'X-Title': 'grammar fix'})
        try:
            with urllib.request.urlopen(r, timeout=30) as resp:
                doc = json.load(resp)
        except urllib.error.HTTPError as e:
            if e.code == 401 and FEDERATION_POLICY_ID:
                drop_token()
            raise
        # A preset is served by whatever model it names, so only a plain model id can be compared.
        if doc.get('model') and doc['model'] != MODEL and not MODEL.startswith('@preset/'):
            print(f'grammar: served by fallback {doc["model"]}', flush=True)
        out = ((doc.get('choices') or [{}])[0].get('message') or {}).get('content')
        if not isinstance(out, str) or not out.strip():
            raise RuntimeError('no text in model response')
        return out.strip()

    _SHA256_PREFIX = bytes.fromhex('3031300d060960864801650304020105000420')
    _keys, _keys_at, _keys_lock = {}, 0.0, threading.Lock()

    def _b64(s):
        return base64.urlsafe_b64decode(s + '=' * (-len(s) % 4))

    def _jwks(force=False):
        global _keys, _keys_at
        with _keys_lock:
            age = time.time() - _keys_at
            if age < 60 or (_keys and age < 3600 and not force):
                return _keys
            try:
                with urllib.request.urlopen(ACCESS_TEAM + '/cdn-cgi/access/certs', timeout=10) as r:
                    doc = json.load(r)
                _keys = {k['kid']: (int.from_bytes(_b64(k['n']), 'big'), int.from_bytes(_b64(k['e']), 'big'))
                         for k in doc.get('keys', []) if k.get('kty') == 'RSA'}
                _keys_at = time.time()
            except Exception as e:
                _keys_at = time.time()
                print(f'grammar: Access certs fetch failed: {e}', flush=True)
            return _keys

    def _rs256_ok(key, signed, sig):
        n, e = key
        k = (n.bit_length() + 7) // 8
        if len(sig) != k:
            return False
        em = pow(int.from_bytes(sig, 'big'), e, n).to_bytes(k, 'big')
        t = _SHA256_PREFIX + hashlib.sha256(signed).digest()
        want = b'\x00\x01' + b'\xff' * (k - len(t) - 3) + b'\x00' + t
        return hmac.compare_digest(em, want)

    def verify_access_jwt(token):
        """Return the claims of a verified Cloudflare Access JWT that names an email, else None."""
        if not (token and ACCESS_TEAM and ACCESS_AUDS) or token.count('.') != 2:
            return None
        try:
            h64, p64, s64 = token.split('.')
            head, claims = json.loads(_b64(h64)), json.loads(_b64(p64))
            if head.get('alg') != 'RS256':
                return None
            key = _jwks().get(head.get('kid')) or _jwks(force=True).get(head.get('kid'))
            if not key or not _rs256_ok(key, (h64 + '.' + p64).encode(), _b64(s64)):
                return None
            now = time.time()
            aud = claims.get('aud')
            aud = aud if isinstance(aud, list) else [aud]
            if claims.get('iss') != ACCESS_TEAM or not ACCESS_AUDS.intersection(aud):
                return None
            if claims.get('exp', 0) < now - 30 or claims.get('nbf', 0) > now + 30:
                return None
            email = claims.get('email')
            return claims if isinstance(email, str) and '@' in email else None
        except Exception:
            return None

    class Handler(http.server.BaseHTTPRequestHandler):
        timeout = 60
        def log_message(self, *a): pass

        def _cors(self):
            origin = self.headers.get('Origin', '')
            if origin in ALLOWED_ORIGINS:
                self.send_header('Access-Control-Allow-Origin', origin)
                self.send_header('Access-Control-Allow-Credentials', 'true')
                self.send_header('Vary', 'Origin')

        def _send(self, status, body, ctype):
            self.send_response(status)
            self._cors()
            self.send_header('Content-Type', ctype)
            self.send_header('Cache-Control', 'no-store')
            self.send_header('Content-Length', str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _reply(self, status, doc):
            self._send(status, json.dumps(doc).encode(), 'application/json')

        def do_OPTIONS(self):
            self.send_response(204)
            self._cors()
            self.send_header('Access-Control-Allow-Methods', 'POST, GET, OPTIONS')
            self.send_header('Access-Control-Allow-Headers', 'Content-Type')
            self.send_header('Access-Control-Max-Age', '600')
            self.send_header('Content-Length', '0')
            self.end_headers()

        def _return_to(self):
            """The ?return= URL when it is on an allowed origin, else None."""
            q = urllib.parse.urlsplit(self.path).query
            url = (urllib.parse.parse_qs(q).get('return') or [''])[0]
            if any(ord(c) < 0x21 or ord(c) == 0x7f for c in url):
                return None
            u = urllib.parse.urlsplit(url)
            return url if u.scheme == 'https' and f'https://{u.netloc}' in ALLOWED_ORIGINS else None

        def do_GET(self):
            if self.path.split('?', 1)[0] == BASE_PATH:
                if verify_access_jwt(self.headers.get(JWT_HEADER, '')):
                    back = self._return_to()
                    if back:
                        self.send_response(302)
                        self.send_header('Location', back)
                        self.send_header('Cache-Control', 'no-store')
                        self.send_header('Content-Length', '0')
                        self.end_headers()
                        return
                    self._send(200, SIGNED_IN_PAGE, 'text/html; charset=utf-8')
                else:
                    self._reply(401, {'error': 'not signed in'})
            elif self.path != '/healthz':
                self._reply(404, {'error': 'not found'})
            elif not bearer():
                self._reply(503, {'ok': False, 'error': 'OpenRouter token exchange failing' if FEDERATION_POLICY_ID
                                  else 'OpenRouter key not filled'})
            else:
                self._reply(200, {'ok': True, 'model': MODEL, 'auth': 'federated' if FEDERATION_POLICY_ID else 'key'})

        def do_POST(self):
            if self.path.split('?', 1)[0] != BASE_PATH:
                self._reply(404, {'error': 'not found'})
                return
            n = int(self.headers.get('Content-Length', 0) or 0)
            if n > MAX_BYTES:
                self._reply(413, {'error': 'text too long'})
                return
            raw = self.rfile.read(n) if n else b''
            if not verify_access_jwt(self.headers.get(JWT_HEADER, '')):
                self._reply(401, {'error': 'not signed in'})
                return
            if not bearer():
                self._reply(503, {'error': 'grammar token exchange failing' if FEDERATION_POLICY_ID
                                  else 'grammar key not filled'})
                return
            as_json = self.headers.get('Content-Type', '').split(';', 1)[0].strip().lower() == 'application/json'
            try:
                if as_json:
                    doc = json.loads(raw or b'{}')
                    text, context = str(doc.get('text') or '').strip(), str(doc.get('context') or '')
                else:
                    text, context = raw.decode('utf-8').strip(), ''
            except Exception:
                self._reply(400, {'error': 'bad request'})
                return
            if not text:
                self._reply(400, {'error': 'no text'})
                return
            try:
                out = fix(text, context)
            except urllib.error.HTTPError as e:
                detail = e.read()[:500].decode('utf-8', 'replace')
                print(f'grammar: OpenRouter HTTP {e.code}: {detail}', flush=True)
                self._reply(502, {'error': f'grammar model answered {e.code}'})
                return
            except Exception as e:
                print(f'grammar: fix failed: {e}', flush=True)
                self._reply(502, {'error': 'grammar fix failed'})
                return
            if as_json:
                self._reply(200, {'text': out})
            else:
                self._send(200, out.encode(), 'text/plain; charset=utf-8')

    if __name__ == '__main__':
        srv = http.server.ThreadingHTTPServer(('0.0.0.0', PORT), Handler)
        if FEDERATION_POLICY_ID:
            print(f'grammar :{PORT} model {MODEL} auth federated (policy {FEDERATION_POLICY_ID})'
                  + ('' if bearer() else ' (unready: token exchange failing)'), flush=True)
        else:
            print(f'grammar :{PORT} model {MODEL} auth key' + ('' if openrouter_key() else
                  ' (unready: secret grammar-openrouter-api-key is not filled)'), flush=True)
        srv.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grammar
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grammar
  template:
    metadata:
      labels:
        app: grammar
        entity: ssint
        env: main
        capability: voice
      # The script is read only at start; its hash here restarts the pod when it changes.
      annotations:
        grammar-script-sha: f9e8adfc43e24cc7
    spec:
      serviceAccountName: grammar
      # The app never calls the Kubernetes API; only the projected OpenRouter token below is mounted.
      automountServiceAccountToken: false
      containers:
        - name: grammar
          image: python:3.12-alpine
          command: ["python", "/scripts/grammar.py"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            # Models come from the llm-models ConfigMap (manifests/llm-models.env).
            - name: MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-models
                  key: LIVE_DUMB_MODEL
            # The OpenRouter federation policy id (llm-models ConfigMap); empty or unset means the stored key is used.
            - name: GRAMMAR_FEDERATION_POLICY_ID
              valueFrom:
                configMapKeyRef:
                  name: llm-models
                  key: GRAMMAR_FEDERATION_POLICY_ID
                  optional: true
            - name: OIDC_TOKEN_PATH
              value: "/var/run/secrets/openrouter/openrouter-token"
            - name: ACCESS_TEAM_DOMAIN
              value: "https://fqurzlaaagt.cloudflareaccess.com"
            - name: BASE_PATH
              value: "/45e6451afc312886/grammar"
            # The info Access app, which covers this path alongside Big AGI.
            - name: ACCESS_AUDS
              value: "afcfa282e581c698462ed0073e0d497979eb6e5d737548dcea72e2e2a643102c"
            - name: ALLOWED_ORIGINS
              value: "https://info.simplesalt.company"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: key
              mountPath: /secrets
              readOnly: true
            - name: openrouter-token
              mountPath: /var/run/secrets/openrouter
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: grammar-script
        - name: key
          secret:
            secretName: grammar-openrouter-api-key
            optional: true
        # Service account token for the OpenRouter exchange; kubelet rotates it.
        - name: openrouter-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://openrouter.ai
                  expirationSeconds: 3600
                  path: openrouter-token
---
apiVersion: v1
kind: Service
metadata:
  name: grammar
  namespace: ssint-main-voice
  labels:
    entity: ssint
    env: main
    capability: voice
spec:
  selector:
    app: grammar
  ports:
    - name: http
      port: 8000
      targetPort: 8000
