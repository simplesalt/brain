---
# One-off check that the gbrain owner dashboard at /brain is read-only.
apiVersion: batch/v1
kind: Job
metadata:
  name: brain-admin-check-4
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: ai
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait
          image: python:3.12-alpine
          command: ["python", "-c", "import time, urllib.request\nfor _ in range(90):\n    try:\n        urllib.request.urlopen('http://gbrain:3132/healthz', timeout=5); break\n    except Exception: time.sleep(10)\ntime.sleep(60)"]
      containers:
        - name: check
          image: python:3.12-alpine
          command: ["python", "-c"]
          args:
            - |
              import urllib.request, urllib.error
              def call(method, url, body=None):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, data=body, method=method, headers={'Content-Type': 'application/json'}), timeout=30)
                      return r.status, r.read()[:120]
                  except urllib.error.HTTPError as e:
                      return e.code, e.read()[:120]
              for base in ('http://gbrain:3132', 'http://big-agi:3000'):
                  print(base, 'GET stats', *call('GET', base + '/brain/api/stats'))
                  print(base, 'POST revoke', *call('POST', base + '/brain/api/revoke-client', b'{}'))
