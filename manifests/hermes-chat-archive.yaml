# Hermes keeps chat history on an emptyDir that every restart wipes. This
# CronJob copies each chat (messages, reasoning, tool calls) every 15 minutes
# into a 7-slot ring of ConfigMaps, one per UTC day, so the daily Hermes miss
# review (.claude/skills/hermes-miss-review) can read a whole day of chats
# from the brain builder. Slot = days since epoch % 7; a slot holding an older
# date is cleared before reuse.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-chat-archive
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
---
