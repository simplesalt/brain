# Mints the gbrain bearer token for the SimpleSalt MCP server, once, into two
# Secrets that are deliberately NOT declared in git (so Flux never owns, resets
# or prunes them, and the value never lands in the repo):
#   ssint-main-ai/gbrain-mcp-server-token  key token             (seeded by gbrain)
#   flux-system/gbrain-mcp-server-token    key gbrain_mcp_token  (cloud-basis substituteFrom)
# Each run reuses whichever Secret already holds a value and fills the other
# from it; it generates a new value only when neither does. Rotate by deleting
# both Secrets (and the stale access_tokens row in gbrain).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gbrain-mcp-server-token-generator
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gbrain-mcp-server-token-generator
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["gbrain-mcp-server-token"]
  # create cannot be scoped by resourceNames: the object does not exist yet.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gbrain-mcp-server-token-generator
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gbrain-mcp-server-token-generator
subjects:
  - kind: ServiceAccount
    name: gbrain-mcp-server-token-generator
    namespace: ssint-main-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gbrain-mcp-server-token-generator
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: ai
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["gbrain-mcp-server-token"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gbrain-mcp-server-token-generator
  namespace: flux-system
  labels:
    entity: ssint
    env: main
    capability: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gbrain-mcp-server-token-generator
subjects:
  - kind: ServiceAccount
    name: gbrain-mcp-server-token-generator
    namespace: ssint-main-ai
---
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-gbrain-mcp-server-token
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: generate-gbrain-mcp-server-token
        entity: ssint
        env: main
        capability: ai
    spec:
      serviceAccountName: gbrain-mcp-server-token-generator
      restartPolicy: OnFailure
      containers:
        - name: generate
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              NAME=gbrain-mcp-server-token
              # Output is "<name>|<base64 value>" when the Secret exists, empty when it
              # does not; any other API error aborts the Job instead of looking like "missing".
              AI_OUT=$(kubectl get secret "$NAME" -n ssint-main-ai --ignore-not-found -o 'jsonpath={.metadata.name}|{.data.token}')
              FX_OUT=$(kubectl get secret "$NAME" -n flux-system --ignore-not-found -o 'jsonpath={.metadata.name}|{.data.gbrain_mcp_token}')
              AI_VAL=${AI_OUT#*|}
              FX_VAL=${FX_OUT#*|}

              if [ -n "$AI_VAL" ] && [ -n "$FX_VAL" ]; then
                if [ "$AI_VAL" != "$FX_VAL" ]; then
                  echo "ERROR: the two Secrets hold different values; leaving both untouched" >&2
                  exit 1
                fi
                echo "both Secrets already hold the token; nothing to do"
                exit 0
              fi

              if [ -n "$AI_VAL" ]; then
                TOKEN_B64=$AI_VAL
              elif [ -n "$FX_VAL" ]; then
                TOKEN_B64=$FX_VAL
              else
                TOKEN=$(LC_ALL=C tr -dc 'a-f0-9' < /dev/urandom | head -c 64)
                [ "${#TOKEN}" -eq 64 ] || { echo "ERROR: token generation failed" >&2; exit 1; }
                TOKEN_B64=$(printf '%s' "$TOKEN" | base64 | tr -d '\n')
              fi

              # Never echoes the value; kubectl prints only created/patched.
              put() {
                if [ -z "$3" ]; then
                  printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"%s","labels":{"entity":"ssint","env":"main","capability":"ai"}},"type":"Opaque","data":{"%s":"%s"}}' \
                    "$NAME" "$1" "$2" "$TOKEN_B64" | kubectl create -f -
                else
                  kubectl patch secret "$NAME" -n "$1" --type=merge -p "{\"data\":{\"$2\":\"$TOKEN_B64\"}}"
                fi
              }
              [ -n "$AI_VAL" ] || put ssint-main-ai token "$AI_OUT"
              [ -n "$FX_VAL" ] || put flux-system gbrain_mcp_token "$FX_OUT"
              echo "gbrain-mcp-server-token present in ssint-main-ai and flux-system"
