# One-off (simplesalt/projects#799): Dylan approved clearing the stuck Dux-Soup
# queue on 2026-10-29 17:07Z. Clears every queued item, then re-queues only the
# profile visits; the invites and messages are redone by hand. Remove this file
# once the Job has run.
apiVersion: batch/v1
kind: Job
metadata:
  name: duxsoup-queue-reset-20261029
  namespace: ssint-main-msg
  labels:
    entity: ssint
    env: main
    capability: msg
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        entity: ssint
        env: main
        capability: msg
    spec:
      restartPolicy: Never
      containers:
        - name: reset
          image: oven/bun:1-alpine
          command: ["bun", "-e"]
          args:
            - |
              import { createHmac } from 'crypto';
              const BASE = 'https://app.dux-soup.com';
              const USER = process.env.DUXSOUP_USER_ID;
              const KEY = process.env.DUXSOUP_API_KEY;
              const VISITS = [
                'https://www.linkedin.com/in/jeremy-wong-0051aa9b',
                'https://www.linkedin.com/in/brian-douglass-1942308a',
                'https://www.linkedin.com/in/ponangara',
                'https://www.linkedin.com/in/fseddar',
                'https://www.linkedin.com/in/geoffroy-morgan-de-rivery-0323458',
                'https://www.linkedin.com/in/judijohnstone',
                'https://www.linkedin.com/in/james-smith-b5355314',
                'https://www.linkedin.com/in/johnbmccaffrey',
                'https://www.linkedin.com/in/greg-hildenbrand-64330b17/',
                'https://www.linkedin.com/in/benjamin-opazo-618464234/',
                'https://www.linkedin.com/in/ben-lawson-bb1267a',
              ];
              async function post(suffix, extra) {
                const targeturl = `${BASE}/xapi/remote/control/${USER}${suffix}`;
                const body = JSON.stringify({ targeturl, timestamp: Date.now(), userid: USER, ...extra });
                const sig = createHmac('sha1', KEY).update(body).digest('base64');
                const r = await fetch(targeturl, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Dux-Signature': sig }, body });
                const text = await r.text();
                if (!r.ok) throw new Error(`${suffix} ${r.status}: ${text.slice(0, 300)}`);
                return text.slice(0, 200);
              }
              async function get(suffix) {
                const url = `${BASE}/xapi/remote/control/${USER}${suffix}`;
                const sig = createHmac('sha1', KEY).update(url).digest('base64');
                const r = await fetch(url, { headers: { 'Content-Type': 'application/json', 'X-Dux-Signature': sig } });
                return (await r.text()).slice(0, 200);
              }
              console.log('size before:', await get('/queue/size'));
              console.log('reset:', await post('/reset', {}));
              console.log('size after reset:', await get('/queue/size'));
              for (const profile of VISITS) {
                console.log('visit', profile, await post('/queue', { command: 'visit', params: { profile } }));
              }
              console.log('size after re-queue:', await get('/queue/size'));
          env:
            - name: DUXSOUP_USER_ID
              valueFrom:
                secretKeyRef:
                  name: duxsoup-user-id
                  key: user_id
            - name: DUXSOUP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: duxsoup-api-key
                  key: api_key
