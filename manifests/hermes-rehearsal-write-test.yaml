apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-rehearsal-write-test-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 2400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: hermes-rehearsal-write-test
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: before
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000'
              case "$DATABASE_URL" in
                *@gbrain-pg-rehearsal-rw[.:/]*) ;;
                *) echo "FATAL: DATABASE_URL does not target gbrain-pg-rehearsal-rw"; exit 1 ;;
              esac
              q() { echo "+ $1"; psql -X -v ON_ERROR_STOP=1 -c "$1" "$DATABASE_URL" || exit 1; }
              v() { psql -X -At -v ON_ERROR_STOP=1 -c "$1" "$DATABASE_URL"; }
              SIZE="CASE WHEN body_storage = 'segmented' THEN body_bytes ELSE octet_length(compiled_truth) + COALESCE(octet_length(timeline), 0) END"
              echo "== config"
              q "SELECT key, value FROM config WHERE key = 'version' OR key LIKE 'mcp.%' ORDER BY key"
              echo "== page counts"
              q "SELECT count(*) AS all_rows, count(*) FILTER (WHERE deleted_at IS NULL) AS live, count(*) FILTER (WHERE deleted_at IS NOT NULL) AS soft_deleted FROM pages"
              q "SELECT source_id, count(*) FILTER (WHERE deleted_at IS NULL) AS live, count(*) FILTER (WHERE deleted_at IS NOT NULL) AS soft_deleted FROM pages GROUP BY 1 ORDER BY 1"
              q "SELECT slug, source_id, type, deleted_at IS NOT NULL AS deleted, $SIZE AS bytes, created_at FROM pages WHERE slug LIKE '%rehearsal%' ORDER BY created_at"
              echo "== before"
              v "SELECT slug FROM pages WHERE deleted_at IS NULL AND slug IN ('sources/meetings/2026-11-12-rehearsal-908-large-transcript-test-rehearsa-transcript', 'meetings/2026-11-12-rehearsal-908-large-transcript-test-rehearsa') ORDER BY $SIZE DESC NULLS LAST LIMIT 1" > /work/slug
              SLUG="$(cat /work/slug)"
              [ -n "$SLUG" ] || { echo "FATAL: no #908 large page found"; exit 1; }
              q "SELECT slug, source_id, body_storage, $SIZE AS bytes, octet_length(compiled_truth) AS compiled_truth_bytes, octet_length(timeline) AS timeline_bytes, updated_at FROM pages WHERE slug = '$SLUG' AND deleted_at IS NULL"
              v "SELECT now()" > /work/start
              echo "target slug: $SLUG"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: uri
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: work
              mountPath: /work
        - name: seed
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              /opt/hermes/.venv/bin/python -c '
              from ruamel.yaml import YAML
              yaml = YAML(typ="safe", pure=True)
              yaml.version = (1, 1)
              out = YAML(typ="safe", pure=True)
              out.default_flow_style = False
              with open("/seed/config.yaml") as f:
                  c = yaml.load(f)
              g = c["mcp_servers"]["gbrain"]
              g["url"] = "http://gbrain-rehearsal:3131/mcp"
              c["mcp_servers"] = {"gbrain": g}
              c["platforms"] = {}
              c["platform_toolsets"] = {"cli": ["gbrain"]}
              if isinstance(c.get("memory"), dict):
                  c["memory"].pop("provider", None)
              with open("/opt/data/config.yaml", "w") as f:
                  out.dump(c, f)
              print("mcp_servers:", list(c["mcp_servers"]), c["mcp_servers"]["gbrain"]["url"])
              print("platform_toolsets:", c["platform_toolsets"])
              '
              cp /seed/AGENTS.md /opt/data/AGENTS.md
              cp /seed/SOUL.md /opt/data/SOUL.md
              grep -c "Never rewrite a page from an outline or a window" /opt/data/AGENTS.md
              grep -c "one hyphen between words" /opt/data/AGENTS.md
              chown -R 10000:10000 /opt/data
              chmod 600 /opt/data/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:latest@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          imagePullPolicy: IfNotPresent
          workingDir: /opt/data
          command: ["/bin/sh", "-c"]
          args:
            - |
              H=/opt/hermes/.venv/bin/hermes
              trap 'touch /work/done' EXIT
              SLUG="$(cat /work/slug)"
              echo "== hermes version and one-shot flags"
              $H --version 2>&1 | head -5
              $H chat --help 2>&1 | grep -E -- '-q|--query|-Q|--quiet|--oneshot' | head -10
              run() {
                echo
                echo "== prompt: $1"
                echo "$2"
                echo "== reply"
                timeout 900 $H chat -Q -q "$2" 2>&1
                echo "[exit $?]"
              }
              run edit "On the gbrain page $SLUG, add this one line at the very end of the page body: \"Reviewed in the projects#909 rehearsal.\" Change nothing else on the page. Then list every gbrain tool call you made, in order, with the arguments that matter and any error code each one returned."
              run slug "Save a new company in gbrain: Rehearsal Nine Zero Nine Widgets Ltd., a test company that makes widgets. Then tell me the slug you used and list every gbrain tool call you made, in order, with any error code each one returned."
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
            - name: HERMES_ORIG_CWD
              value: /opt/data
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GENERAL_API_LLM_API_KEY
            - name: LIVE_REASONING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-models
                  key: LIVE_REASONING_MODEL
            - name: LIVE_DUMB_MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-models
                  key: LIVE_DUMB_MODEL
            - name: VISION_MODEL
              valueFrom:
                configMapKeyRef:
                  name: llm-models
                  key: VISION_MODEL
            - name: GBRAIN_REMOTE_TOKEN
              value: "gbrain-mcp"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: work
              mountPath: /work
        - name: after
          image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000'
              i=0
              until [ -f /work/done ]; do
                i=$((i + 1))
                if [ "$i" -ge 1100 ]; then echo "WARN: hermes did not finish; measuring anyway"; break; fi
                sleep 2
              done
              q() { echo "+ $1"; psql -X -v ON_ERROR_STOP=1 -c "$1" "$DATABASE_URL"; }
              SIZE="CASE WHEN body_storage = 'segmented' THEN body_bytes ELSE octet_length(compiled_truth) + COALESCE(octet_length(timeline), 0) END"
              SLUG="$(cat /work/slug)"
              START="$(cat /work/start)"
              echo "== after (start $START)"
              q "SELECT slug, source_id, body_storage, $SIZE AS bytes, octet_length(compiled_truth) AS compiled_truth_bytes, octet_length(timeline) AS timeline_bytes, updated_at, position('projects#909 rehearsal' in compiled_truth) > 0 AS has_line_in_compiled_truth FROM pages WHERE slug = '$SLUG' AND deleted_at IS NULL"
              q "SELECT slug, type, title, slug ~ '--' AS hyphen_run, slug ~ '-(/|$)' AS trailing_hyphen, created_at FROM pages WHERE created_at >= '$START' OR slug ILIKE '%nine-zero-nine%' OR title ILIKE '%nine zero nine%' ORDER BY created_at"
              q "SELECT slug, updated_at FROM pages WHERE updated_at >= '$START' ORDER BY updated_at"
              echo "RESULT: done"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gbrain-pg-rehearsal-app
                  key: uri
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 1Gi
        - name: work
          emptyDir:
            sizeLimit: 16Mi
        - name: config-seed
          configMap:
            name: hermes-config
