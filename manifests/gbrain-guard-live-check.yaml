apiVersion: batch/v1
kind: Job
metadata:
  name: gbrain-guard-tools-list-1
  namespace: ssint-main-ai
  labels:
    entity: ssint
    env: main
    capability: ai
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: gbrain-guard-live-check
        gbrain-access: guard-only
        entity: ssint
        env: main
        capability: ai
        scheduling.simplesalt.company/class: work
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          imagePullPolicy: IfNotPresent
          command: ["bun", "-e"]
          args:
            - |
              const r = await fetch("http://gbrain:3141/mcp", { method: "POST",
                headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream", Authorization: "Bearer gbrain-mcp" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list", params: {} }) });
              const names = (await r.json()).result.tools.map(t => t.name).sort();
              console.log(`tools/list through gbrain:3141 (read-only): ${names.length} tools`);
              for (const n of ["add_tag", "remove_tag", "get_versions", "revert_version", "mark_page_for_deletion", "propose_page_replacement", "withdraw_page_mark", "delete_page", "put_pages"]) console.log(`  ${n}: ${names.includes(n) ? "listed" : "not listed"}`);
              console.log("all: " + names.join(", "));
              console.log("RESULT: done");
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
