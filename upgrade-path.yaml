          - "hindsight plugin installed at first agent init (hindsight-client >= 0.10.1 present); hindsight_recall returns bank hermes data."
          - "8642 /health, /health/detailed, /v1/models and /v1/toolsets respond directly and via hermes-proxy; a streaming chat completion succeeds."
          - "All four MCP servers connect, one read-only call each; no config, toolset or 'Disabled suspicious MCP' warnings."
          - "Firecrawl search works; GITHUB_TOKEN visible to terminal."
