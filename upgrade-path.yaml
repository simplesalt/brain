  hindsight:
    upstream: https://github.com/vectorize-io/hindsight
    pin_kind: image-digest
    pinned_in:
      - {file: manifests/hindsight-chart.yaml, where: "HelmRelease hindsight-main, values.image.digest (chart hindsight@0.2.0 renders repository:tag@digest, so this one value moves the pod; no chart cut needed)"}
    current:
      version: "0.8.2"
      pin: sha256:7c069db2d7aeeae82d3d3917292b87b14d6547f979c8b1335a42c94d09d57213
      date: 2026-06-12
      alembic_head: c3e5a7b9d1f4
    target: {version: "0.10.2", pin: sha256:d1840062a5b79940ab7a9f4809ceb90fc776d4ad737cd9329e9b5836cc64ab70, date: 2026-09-29}
    notes:
      - "Alembic migrations run inside the API process at startup under session advisory lock 123456789, before the port opens; there is no separate migrator Job."
      - "34 alembic revisions across 0.8.2 -> 0.10.2 (13 + 12 + 9); v0.10.0 is the only breaking release in the range."
      - "Own CNPG cluster hindsight-pg (database hindsight, non-superuser, direct hindsight-pg-rw, no Pooler); not shared with gbrain-pg."
      - "0.10.2 carries the migrator advisory-lock leak fix (vectorize-io/hindsight#4611, fix #4623); exposure on earlier hops is negligible here: a failing migration surfaces as InFailedSqlTransaction, read postgres logs, cleared by container restart."
      - "Open upstream regression #4939 (temporal recall boosts) does not apply: this repo sets no RECALL_STRATEGY_BOOSTS."
      - "0.10.0 breaking changes reach us only via 503 admission control on overload for recall/reflect/retain: scripts/hindsight-ingest.sh does a synchronous retain with no retry (flagged in simplesalt/projects#525)."
    before_first_stop:
      - "DONE: startupProbe (tcp 8888, 90 x 10s = 15 min) and HelmRelease upgrade timeout 20m are in place (simplesalt/brain 7fcd5c7); in-process migrations are no longer bounded by the ~130s liveness window."
      - "hindsight-pg has no Backup, ScheduledBackup, object store or VolumeSnapshotClass (backups tracked in simplesalt/projects#657): take a manual pg_dump or hindsight-admin backup before stops 1 and 2."
      - "Deployment strategy is still RollingUpdate: scale to 0 or patch Recreate via postRenderers where a stop says so."
      - "Record a pre-hop recall baseline before each hop, to compare after."
    skip:
      - {from: "0.10.0", to: "0.10.0", reason: "Only breaking release in the range (profile/background endpoints 410 Gone, curl dropped from image, mental-models list defaults to metadata, count_chunks hook removed) and #4581 wedged operations."}
      - {from: "0.10.1", to: "0.10.1", reason: "Lacks the #4611 lock-leak fix and #4618 fix; both land in 0.10.2."}
    stops:
      - version: "0.8.6"
        pin: sha256:ffa391a77284e49f6b55e32c86f33529ac4257831407b14038a72b6a0a232039
        date: 2026-07-29
        alembic: {revisions: 13, long_running: ["3 CONCURRENTLY index builds"], lossy: ["2 cold-archive column drops"]}
        why: "Smallest hop: prove the mechanics (in-process migrations inside the startupProbe window, non-superuser role, CONCURRENTLY builds, config-apply hook) before the larger, destructive 0.9.x hop."
        before:
          - "Take a DB dump of hindsight-pg (2 lossy cold-archive column drops cannot be undone without it)."
          - "Change only values.image.digest."
          - "Do not hop near the 03:30 UTC hygiene CronJob."
